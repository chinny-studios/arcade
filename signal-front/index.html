}

// ---------------- pixel digits for HP ----------------
const DIG = ['111101101101111', '010110010010111', '111001111100111', '111001111001111', '101101111001001',
  '111100111001111', '111100111101111', '111001010010010', '111101111101111', '111101111001111'];
function drawDigit(c, n, x, y, col) {
  const g = DIG[n];
  c.fillStyle = '#000';
  c.fillRect(x - 1, y - 1, 5, 7);
  c.fillStyle = col;
  for (let i = 0; i < 15; i++) if (g[i] === '1') c.fillRect(x + (i % 3), y + ((i / 3) | 0), 1, 1);
}

function unitVisual(u) {
  const a = u.anim;
  return a ? { x: a.x, y: a.y } : { x: u.x, y: u.y };
}

function render(dt) {
  R.t += dt;
  R.frame = Math.floor(R.t * 3.2) % 2;
  R.seaFrame = Math.floor(R.t * 1.6) % 4;
  const c = R.ctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.imageSmoothingEnabled = false;
  c.fillStyle = '#10141c'; c.fillRect(0, 0, R.W, R.H);
  if (!S) return;
  if (R.camTo) {
    const k = 1 - Math.pow(0.0005, dt);
    R.cam.x = lerp(R.cam.x, R.camTo.x, k); R.cam.y = lerp(R.cam.y, R.camTo.y, k);
    if (Math.abs(R.cam.x - R.camTo.x) < 0.3 && Math.abs(R.cam.y - R.camTo.y) < 0.3) { R.cam.x = R.camTo.x; R.cam.y = R.camTo.y; R.camTo = null; }
  }
  let sx = 0, sy = 0;
  if (R.shake > 0) { R.shake = Math.max(0, R.shake - dt * 30); sx = (Math.random() - 0.5) * R.shake; sy = (Math.random() - 0.5) * R.shake; }
  const z = R.zoom;
  const ox = viewOX() + Math.round((-R.cam.x + sx) * z), oy = viewOY() + Math.round((-R.cam.y + sy) * z);
  c.setTransform(z, 0, 0, z, ox, oy);
  const x0 = Math.max(0, Math.floor(R.cam.x / T) - 1), y0 = Math.max(0, Math.floor(R.cam.y / T) - 1);
  const x1 = Math.min(S.w - 1, Math.ceil((R.cam.x + viewW() / z) / T) + 1), y1 = Math.min(S.h - 1, Math.ceil((R.cam.y + viewH() / z) / T) + 2);
  // map border
  c.fillStyle = '#0a0d12'; c.fillRect(-3, -3, S.w * T + 6, S.h * T + 6);
  const viewer = viewSide();
  const vis = visMap(S, viewer);
  // base terrain
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    c.drawImage(tileImage(S, x, y), x * T, y * T);
    const k = tileAt(S, x, y).k;
    if (k === 'port') { // port sits on a quay: draw water edge
      c.fillStyle = TC.water; c.fillRect(x * T, y * T + 12, T, 4);
      c.fillStyle = TC.foam; c.fillRect(x * T, y * T + 12, T, 1);
    }
  }
  // tall layer: forests, mountains, properties, row by row
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const t = tileAt(S, x, y);
    if (t.k === 'forest' || t.k === 'mount') c.drawImage(tallTile(t.k, x, y), x * T, y * T - 4);
    else if (TER[t.k].prop) c.drawImage(propSprite(t.k, t.o), x * T, y * T - 4);
  }
  // fog
  if (S.fog) {
    c.fillStyle = 'rgba(8,10,24,0.42)';
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (!vis[y * S.w + x]) c.fillRect(x * T, y * T, T, T);
  }
  // overlays
  drawOverlay(c, R.over2, x0, y0, x1, y1);
  drawOverlay(c, R.over, x0, y0, x1, y1);
  if (R.path) drawPath(c, R.path);
  // capture progress markers
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const t = tileAt(S, x, y);
    if (TER[t.k].prop && t.cp < 20) {
      c.fillStyle = '#000'; c.fillRect(x * T + 1, y * T - 5, 14, 3);
      c.fillStyle = '#ffd23a'; c.fillRect(x * T + 2, y * T - 4, Math.round(12 * (20 - t.cp) / 20), 1);
    }
  }
  // units sorted by row
  const list = S.units.filter((u) => u.id !== R.hideUnit && canSee(S, viewer, u))
    .sort((a, b) => unitVisual(a).y - unitVisual(b).y);
  for (const u of list) drawUnit(c, u);
  // cursor & targets
  if (R.targets) for (const t of R.targets) drawBrackets(c, t.x, t.y, '#ff5a4a', 1 + Math.round(Math.sin(R.t * 8)));
  if (R.cursor && !isTouch) drawBrackets(c, R.cursor.x, R.cursor.y, '#fff6c8', Math.round(Math.sin(R.t * 6) + 1));
  if (R.cursor && isTouch && R.showCursor) drawBrackets(c, R.cursor.x, R.cursor.y, '#fff6c8', 1);
  // effects
  drawFX(c, dt);
}

function drawOverlay(c, o, x0, y0, x1, y1) {
  if (!o) return;
  const col = o.kind === 'move' ? 'rgba(90,170,255,0.42)' : o.kind === 'threat' ? 'rgba(255,150,40,0.36)' : 'rgba(255,70,60,0.42)';
  const edge = o.kind === 'move' ? 'rgba(200,236,255,0.7)' : o.kind === 'threat' ? 'rgba(255,220,140,0.6)' : 'rgba(255,190,180,0.7)';
  const pulse = 0.85 + Math.sin(R.t * 4) * 0.15;
  c.globalAlpha = pulse;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    if (!o.tiles[y * S.w + x]) continue;
    c.fillStyle = col; c.fillRect(x * T, y * T, T, T);
    c.fillStyle = edge;
    const on = (dx, dy) => inb(S, x + dx, y + dy) && o.tiles[(y + dy) * S.w + x + dx];
    if (!on(0, -1)) c.fillRect(x * T, y * T, T, 1);
    if (!on(0, 1)) c.fillRect(x * T, y * T + T - 1, T, 1);
    if (!on(-1, 0)) c.fillRect(x * T, y * T, 1, T);
    if (!on(1, 0)) c.fillRect(x * T + T - 1, y * T, 1, T);
  }
  c.globalAlpha = 1;
}

function drawPath(c, p) {
  if (p.length < 2) return;
  c.fillStyle = '#ffffff';
  const sh = '#1b4a8a';
  for (let pass = 0; pass < 2; pass++) {
    c.fillStyle = pass ? '#fff4c0' : sh;
    const w = pass ? 4 : 6, o = (T - w) / 2;
    for (let i = 0; i < p.length - 1; i++) {
      const a = p[i], b = p[i + 1];
      const xA = Math.min(a.x, b.x) * T + o, yA = Math.min(a.y, b.y) * T + o;
      const ww = a.x !== b.x ? T + w : w, hh = a.y !== b.y ? T + w : w;
      c.fillRect(xA, yA, ww, hh);
    }
  }
  // arrow head
  const L = p[p.length - 1], P = p[p.length - 2];
  const dx = L.x - P.x, dy = L.y - P.y, cx = L.x * T + 8, cy = L.y * T + 8;
  c.fillStyle = '#fff4c0';
  for (let i = 0; i < 4; i++) {
    if (dx) c.fillRect(cx + dx * (2 - i) - (dx < 0 ? 1 : 0), cy - i - 1, 1, i * 2 + 2);
    else c.fillRect(cx - i - 1, cy + dy * (2 - i) - (dy < 0 ? 1 : 0), i * 2 + 2, 1);
  }
}

function drawBrackets(c, x, y, col, o) {
  const X0 = x * T - o, Y0 = y * T - o, X1 = x * T + T - 1 + o, Y1 = y * T + T - 1 + o, L = 4;
  const corner = (cx, cy, sx, sy) => {
    const hx = sx > 0 ? cx : cx - L + 1, vy = sy > 0 ? cy : cy - L + 1;
    c.fillStyle = '#000'; c.fillRect(hx - 1, cy - 1, L + 2, 3); c.fillRect(cx - 1, vy - 1, 3, L + 2);
    c.fillStyle = col; c.fillRect(hx, cy, L, 1); c.fillRect(cx, vy, 1, L);
  };
  corner(X0, Y0, 1, 1); corner(X1, Y0, -1, 1); corner(X0, Y1, 1, -1); corner(X1, Y1, -1, -1);
}

function drawUnit(c, u) {
  const v = unitVisual(u);
  const airU = isAir(u.t), naval = isNaval(u.t);
  const bob = airU ? (Math.sin(R.t * 3 + u.id) > 0 ? 1 : 0) : 0;
  const X = Math.round(v.x * T), Y = Math.round(v.y * T);
  if (airU) { c.fillStyle = 'rgba(0,0,0,0.28)'; c.fillRect(X + 4, Y + 13, 8, 2); c.fillRect(X + 5, Y + 12, 6, 1); }
  const grey = u.done && u.s === S.turn && !u.anim;
  const frame = (R.frame + (u.id % 2)) % 2;
  const spr = unitSprite(u.t, u.s, frame, grey);
  const flash = u.flash && u.flash > R.t;
  c.drawImage(spr, X, Y - (airU ? 4 : 0) - bob + (naval ? 1 : 0));
  if (flash) { c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.7; c.drawImage(spr, X, Y - (airU ? 4 : 0) - bob); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; }
  if (naval) { c.fillStyle = TC.foam; c.fillRect(X + 1 + R.frame, Y + 12, 13, 1); }
  const hp = disp(u.vhp != null ? u.vhp : u.hp);
  if (hp < 10 && hp > 0) drawDigit(c, hp, X + 12, Y + 10, '#ffffff');
  // status pips (bottom-left): capture, low supply, cargo
  let px0 = X + 1;
  const pip = (col, ch) => {
    c.fillStyle = '#000'; c.fillRect(px0 - 1, Y + 9, 6, 7);
    c.fillStyle = col; c.fillRect(px0, Y + 10, 4, 5);
    if (ch === 'c') { c.fillStyle = '#000'; c.fillRect(px0 + 1, Y + 11, 1, 3); c.fillRect(px0 + 2, Y + 11, 1, 1); }
    px0 += 6;
  };
  if (u.cap) pip('#ffd23a', 'c');
  const U = UNITS[u.t];
  if ((u.fuel <= U.fuel * 0.25 || (U.w1 && u.ammo === 0 && !U.w2)) && R.frame) pip('#ff5040');
  if (u.cargo && u.cargo.length) pip('#6ff3ff');
}

// ---------------- effects ----------------
function fxAdd(e) { if (TIME.fast) return e; e.t0 = R.t; FX.push(e); return e; }
function drawFX(c, dt) {
  void dt;
  for (let i = FX.length - 1; i >= 0; i--) {
    const e = FX[i], k = (R.t - e.t0) / e.dur;
    if (k >= 1) { FX.splice(i, 1); continue; }
    FXDRAW[e.type](c, e, k);
  }
}
const FXDRAW = {
  boom(c, e, k) {
    const r = 2 + k * (e.big ? 10 : 7);
    const cols = ['#fff7d0', '#ffd23a', '#ff8a30', '#d04020', '#5a5a5a'];
    const col = cols[Math.min(4, Math.floor(k * 5))];
    c.fillStyle = col;
    pixelCircle(c, e.x, e.y, r * (k < 0.6 ? 1 : 1 - (k - 0.6)), true);
    if (k > 0.3) { c.fillStyle = 'rgba(70,70,70,' + (1 - k) + ')'; pixelCircle(c, e.x + 3, e.y - k * 8, r * 0.5, true); }
  },
  flash(c, e, k) { c.fillStyle = k < 0.5 ? '#fff7c0' : '#ffb040'; const s = Math.round(4 - k * 3); c.fillRect(Math.round(e.x - s / 2), Math.round(e.y - s / 2), s, s); },
  shot(c, e, k) {
    const x = lerp(e.x0, e.x1, k), y = lerp(e.y0, e.y1, k) - Math.sin(k * Math.PI) * (e.arc || 0);
    c.fillStyle = e.col || '#fff4b0'; c.fillRect(Math.round(x) - 1, Math.round(y) - 1, 2, 2);
    if (e.trail) { c.fillStyle = 'rgba(220,220,220,0.6)'; const x2 = lerp(e.x0, e.x1, Math.max(0, k - 0.08)), y2 = lerp(e.y0, e.y1, Math.max(0, k - 0.08)) - Math.sin(Math.max(0, k - 0.08) * Math.PI) * (e.arc || 0); c.fillRect(Math.round(x2) - 1, Math.round(y2) - 1, 2, 2); }
  },
  text(c, e, k) {
    c.save();
    c.font = '8px "Press Start 2P", monospace'; c.textAlign = 'center';
    const y = e.y - k * 10;
    c.globalAlpha = k > 0.75 ? (1 - k) * 4 : 1;
    c.fillStyle = '#000'; c.fillText(e.s, e.x + 1, y + 1);
    c.fillStyle = e.col || '#fff'; c.fillText(e.s, e.x, y);
    c.restore();
  },
  ring(c, e, k) {
    c.strokeStyle = e.col || '#6ff3ff'; c.globalAlpha = 1 - k; c.lineWidth = 1;
    const r = Math.round(2 + k * (e.r || 14));
    pixelCircle(c, e.x, e.y, r, false);
    c.globalAlpha = 1;
  },
  spark(c, e, k) {
    c.fillStyle = e.col || '#7dffb0';
    for (let i = 0; i < 5; i++) { const a = i * 1.26 + e.x; c.fillRect(Math.round(e.x + Math.cos(a) * 6), Math.round(e.y + Math.sin(a) * 4 - k * 10), 1, 2); }
  },
  beam(c, e, k) {
    c.fillStyle = 'rgba(255,240,170,' + (1 - k) + ')';
    c.fillRect(e.x - 3 + k * 2, -200, 6 - k * 4, e.y + 200);
  },
};
function pixelCircle(c, cx, cy, r, fill) {
  r = Math.max(1, Math.round(r));
  for (let y = -r; y <= r; y++) {
    const w = Math.round(Math.sqrt(r * r - y * y));
    if (fill) c.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1);
    else { c.fillRect(Math.round(cx - w), Math.round(cy + y), 1, 1); c.fillRect(Math.round(cx + w), Math.round(cy + y), 1, 1); }
  }
}
const tileCenter = (x, y) => ({ x: x * T + 8, y: y * T + 8 });

// Signal Front — turn flow, animated actions and map input (mouse + touch)

const G = {
  mode: 'off',    // off | idle | select | menu | target | drop | busy
  sel: null,      // selected unit
  reach: null,
  dest: null,     // {x,y} chosen destination while the action menu is open
  path: null,
  targets: null,
  tgt: null,      // target previewed (touch: first tap previews, second confirms)
  inspect: null,  // enemy unit whose range is shown
};

const humanSide = () => (S && !S.sides[0].ai ? 0 : S && !S.sides[1].ai ? 1 : 0);
const viewSide = () => (DEBUG && R.reveal ? S.turn : humanSide());
const isHumanTurn = () => S && !S.over && !S.sides[S.turn].ai;

// ---------------- animated actions ----------------
async function animMove(u, path) {
  if (path.length < 2) return;
  const hidden = !canSee(S, viewSide(), u);
  if (!hidden) { sfx('move', u.t); if (!isHumanTurn()) ensureVisible(path[path.length - 1].x, path[path.length - 1].y, 1); }
  if (TIME.fast || hidden) return;
  const per = isAir(u.t) ? 55 : 75;
  for (let i = 1; i < path.length; i++) {
    const a = path[i - 1], b = path[i];
    const t0 = performance.now(), dur = per / TIME.speed;
    await new Promise((res) => {
      const step = () => {
        const k = Math.min(1, (performance.now() - t0) / dur);
        u.anim = { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k) };
        if (k < 1) requestAnimationFrame(step); else res();
      };
      step();
    });
  }
  u.anim = { x: path[path.length - 1].x, y: path[path.length - 1].y };
}

function weaponSound(a, w) {
  const t = a.t;
  if (UNITS[t].kamikaze) return 'boom';
  if (w === 2) return 'mg';
  if (['spark', 'moray', 'mlrs', 'mallet', 'streak', 'razorwing', 'strider', 'atgm', 'gunship', 'deepfin', 'fpv'].includes(t)) return 'missile';
  return 'cannon';
}

async function fireFx(a, d, res) {
  const A = tileCenter(a.x, a.y), D = tileCenter(d.x, d.y);
  const visA = canSee(S, viewSide(), a), visD = canSee(S, viewSide(), d);
  const sound = weaponSound(a, res.w);
  const indirectShot = mdist(a.x, a.y, d.x, d.y) > 1;
  if (visA && !UNITS[a.t].kamikaze) { fxAdd({ type: 'flash', x: A.x + (a.s === 0 ? 5 : -5), y: A.y - 2, dur: 0.18 }); a.flash = R.t + 0.12; }
  sfx(sound);
  if (indirectShot || sound === 'missile') {
    fxAdd({ type: 'shot', x0: A.x, y0: A.y - 4, x1: D.x, y1: D.y, arc: indirectShot ? 18 + mdist(a.x, a.y, d.x, d.y) * 4 : 3, dur: indirectShot ? 0.55 : 0.28, trail: true });
    await wait(indirectShot ? 550 : 280);
  } else if (sound === 'mg') {
    for (let i = 0; i < 4; i++) fxAdd({ type: 'shot', x0: A.x, y0: A.y - 2, x1: D.x + frand(-3, 3), y1: D.y + frand(-3, 3), dur: 0.12 + i * 0.04, col: '#ffe890' });
    await wait(260);
  } else await wait(160);
  if (visD) {
    fxAdd({ type: 'boom', x: D.x + frand(-2, 2), y: D.y + frand(-2, 2), dur: 0.5, big: res.killed });
    if (res.shown > 0) fxAdd({ type: 'text', s: '-' + res.shown, x: D.x, y: D.y - 6, dur: 1.0, col: '#ffd0c0' });
    d.flash = R.t + 0.15;
    R.shake = Math.max(R.shake, res.killed ? 5 : 2);
  }
  sfx(res.killed ? 'boom' : 'cannon');
  await wait(res.killed ? 520 : 360);
}

async function animAttack(a, d) {
  if (!TIME.fast && (canSee(S, viewSide(), a) || canSee(S, viewSide(), d))) ensureVisible(d.x, d.y, 1);
  const dist = mdist(a.x, a.y, d.x, d.y);
  if (UNITS[a.t].kamikaze && !TIME.fast && canSee(S, viewSide(), a)) {
    // the one-way drone dives onto its target
    const t0 = performance.now(), dur = 260 / TIME.speed;
    await new Promise((res) => { const step = () => { const k = Math.min(1, (performance.now() - t0) / dur); a.anim = { x: lerp(a.x, d.x, k * k), y: lerp(a.y, d.y, k * k) }; if (k < 1) requestAnimationFrame(step); else res(); }; step(); });
    R.hideUnit = a.id;
  }
  const r1 = strike(S, a, d);
  if (!TIME.fast) await fireFx(a, d, r1);
  if (d.hp > 0 && a.hp > 0 && canCounter(S, a, d, dist)) {
    const r2 = strike(S, d, a);
    if (!TIME.fast) await fireFx(d, a, r2);
  }
  if (R.hideUnit === a.id) R.hideUnit = null;
  a.anim = null;
  const dead = removeDead(S);
  if (dead.some((u) => u.s === humanSide())) log('lost', dead.filter((u) => u.s === humanSide()));
  hudRefresh();
}

async function perform(a) {
  if (a.kind === 'power') return doPower(S.turn, a.level);
  if (a.kind === 'build') {
    const u = doBuild(S, S.turn, a.t, a.x, a.y);
    if (u && canSee(S, viewSide(), u)) {
      if (!isHumanTurn()) ensureVisible(a.x, a.y, 1);
      const c = tileCenter(a.x, a.y);
      fxAdd({ type: 'ring', x: c.x, y: c.y, dur: 0.5, col: FACTIONS[u.s].ramp[0] });
      sfx('build');
      await wait(isHumanTurn() ? 0 : 320);
    }
    hudRefresh();
    return;
  }
  if (a.kind !== 'unit') return;
  const u = S.units.find((w) => w.id === a.id);
  if (!u) return;
  const tc = trapCheck(S, u, a.path || [{ x: u.x, y: u.y }]);
  await animMove(u, tc.path);
  const from = { x: u.x, y: u.y };
  commitMove(S, u, tc.path);
  u.anim = null;
  if (tc.trapped) {
    u.done = true;
    const c = tileCenter(u.x, u.y);
    if (canSee(S, viewSide(), u)) { fxAdd({ type: 'text', s: 'AMBUSH!', x: c.x, y: c.y - 8, dur: 1.2, col: '#ffd23a' }); sfx('trap'); await wait(700); }
    hudRefresh();
    return;
  }
  const visible = canSee(S, viewSide(), u);
  switch (a.act) {
    case 'attack': {
      const d = S.units.find((w) => w.id === a.target);
      u.done = true;
      if (d) await animAttack(u, d);
      break;
    }
    case 'capture': {
      const r = doCapture(S, u);
      const c = tileCenter(u.x, u.y);
      if (visible || tileAt(S, u.x, u.y).o === humanSide()) {
        if (r.done) { fxAdd({ type: 'text', s: 'CAPTURED', x: c.x, y: c.y - 8, dur: 1.3, col: '#ffd23a' }); sfx('captured'); }
        else { fxAdd({ type: 'text', s: String(r.left), x: c.x, y: c.y - 8, dur: 1.0, col: '#ffe9a0' }); sfx('capture'); }
        await wait(r.done ? 650 : 380);
      }
      break;
    }
    case 'load': { const o = unitAt(S, u.x, u.y) === u ? S.units.find((w) => w !== u && w.x === u.x && w.y === u.y) : unitAt(S, u.x, u.y); if (o) doLoad(S, u, o); else u.done = true; sfx('menu'); break; }
    case 'join': { const o = S.units.find((w) => w !== u && w.x === u.x && w.y === u.y); if (o) { doJoin(S, u, o); sfx('repair'); } else u.done = true; break; }
    case 'drop': {
      u.done = true;
      if (a.drop && u.cargo.length) { const c = doDrop(S, u, a.drop.x, a.drop.y); void c; sfx('menu'); await wait(150); }
      break;
    }
    case 'supply': {
      u.done = true;
      const got = supplyAround(S, u);
      for (const g of got) { const c = tileCenter(g.x, g.y); fxAdd({ type: 'spark', x: c.x, y: c.y, dur: 0.7, col: '#6ff3ff' }); }
      if (got.length) { sfx('repair'); await wait(350); }
      break;
    }
    default: u.done = true;
  }
  void from;
  bump(S);
  hudRefresh();
}

async function doPower(side, level) {
  const co = coOf(S, side);
  const res = activatePower(S, side, level);
  await powerBanner(side, level);
  if (res && res.units) {
    for (const u of res.units) {
      if (!canSee(S, viewSide(), u)) continue;
      const c = tileCenter(u.x, u.y);
      if (res.kind === 'heal') fxAdd({ type: 'spark', x: c.x, y: c.y, dur: 0.9 });
      else fxAdd({ type: 'boom', x: c.x, y: c.y, dur: 0.6 });
    }
    if (res.kind === 'strike') {
      ensureVisible(res.x, res.y, 2);
      const c = tileCenter(res.x, res.y);
      fxAdd({ type: 'beam', x: c.x, y: c.y, dur: 0.6 });
      for (let i = 0; i < 9; i++) setTimeout(() => fxAdd({ type: 'boom', x: c.x + frand(-28, 28), y: c.y + frand(-28, 28), dur: 0.6, big: true }), i * 70);
      R.shake = 8; sfx('boom');
    } else if (res.kind === 'hurt') { R.shake = 4; sfx('zap'); }
    else if (res.kind === 'heal') sfx('repair');
    await wait(800);
  }
  void co;
  hudRefresh();
}

// ---------------- turn flow ----------------
async function beginTurn(events) {
  const game = S;
  clearSel();
  G.mode = 'busy';
  hudRefresh();
  const side = S.turn;
  playSong(FACTIONS[side].id);
  await turnBanner(side, events);
  if (S !== game) return; // left the match while the banner played
  showStartEvents(events);
  if (S.over) return finishGame();
  if (S.sides[side].ai) await runAI();
  else {
    G.mode = 'idle';
    // return to where the player left the camera (their HQ on the first turn)
    if (R.humanCam) { R.camTo = { x: R.humanCam.x, y: R.humanCam.y }; }
    hudRefresh();
  }
}
function showStartEvents(events) {
  for (const e of events) {
    if (e.kind === 'repair' && canSee(S, viewSide(), e.unit)) { const c = tileCenter(e.unit.x, e.unit.y); fxAdd({ type: 'spark', x: c.x, y: c.y, dur: 0.8 }); }
    if (e.kind === 'jam' && canSee(S, viewSide(), e.unit)) { const c = tileCenter(e.unit.x, e.unit.y); fxAdd({ type: 'ring', x: c.x, y: c.y, dur: 0.6, col: '#ffd23a' }); }
    if (e.kind === 'crash' && e.unit.s === humanSide()) toast(UNITS[e.unit.t].name + ' ran out of fuel and was lost.');
  }
}
async function runAI() {
  const game = S;
  G.mode = 'busy';
  hudRefresh();
  let guard = 0;
  while (S === game && !S.over && guard++ < 400) {
    const a = aiNext(S, S.turn);
    if (a.kind === 'end') break;
    await perform(a);
    if (S !== game) return;
    checkVictory(S);
    if (!TIME.fast) await wait(60);
  }
  if (S !== game) return;
  if (S.over) return finishGame();
  await nextTurn();
}
async function nextTurn() {
  const ev = endTurn(S);
  checkVictory(S);
  saveGame();
  await beginTurn(ev);
}
async function humanEndTurn() {
  if (!isHumanTurn() || G.mode === 'busy') return;
  // ask once if units are still waiting for orders
  if (!G.confirmEnd && S.units.some((u) => u.s === S.turn && !u.done)) {
    G.confirmEnd = true;
    $('#endBtn').textContent = 'End turn?';
    sfx('menu');
    setTimeout(() => { G.confirmEnd = false; $('#endBtn').textContent = 'End Turn'; }, 2500);
    return;
  }
  G.confirmEnd = false; $('#endBtn').textContent = 'End Turn';
  R.humanCam = { x: R.cam.x, y: R.cam.y };
  clearSel();
  G.mode = 'busy';
  await nextTurn();
}
async function afterHumanAction() {
  clearSel();
  checkVictory(S);
  if (S.over) return finishGame();
  G.mode = 'idle';
  hudRefresh();
  if (S.sides[S.turn].ai) await runAI(); // never happens, but keeps the loop safe
}

// ---------------- selection helpers ----------------
function clearSel() {
  if (G.sel) G.sel.anim = null;
  G.sel = null; G.reach = null; G.dest = null; G.path = null; G.targets = null; G.tgt = null; G.inspect = null;
  R.over = null; R.over2 = null; R.path = null; R.targets = null;
  closeActionMenu(); hideForecast();
}
function reachOverlay(r) {
  const o = new Uint8Array(S.w * S.h);
  for (let i = 0; i < r.dist.length; i++) if (r.dist[i] >= 0) o[i] = 1;
  return o;
}
function attackFringe(u, r) {
  const o = new Uint8Array(S.w * S.h);
  const [r0, r1] = attackRange(S, u);
  const mark = (cx, cy) => {
    for (let dy = -r1; dy <= r1; dy++) for (let dx = -r1; dx <= r1; dx++) {
      const d = Math.abs(dx) + Math.abs(dy), x = cx + dx, y = cy + dy;
      if (d >= r0 && d <= r1 && inb(S, x, y)) o[y * S.w + x] = 1;
    }
  };
  if (!UNITS[u.t].w1 && !UNITS[u.t].w2) return o;
  if (isIndirect(u.t)) mark(u.x, u.y);
  else for (let i = 0; i < r.dist.length; i++) if (r.dist[i] >= 0) { const x = i % S.w, y = (i / S.w) | 0; const k = stopKind(S, u, x, y); if (k === 'move' || k === 'stay') mark(x, y); }
  return o;
}
function selectUnit(u) {
  clearSel();
  G.sel = u; G.mode = 'select';
  G.reach = reach(S, u);
  R.over = { kind: 'move', tiles: reachOverlay(G.reach) };
  if (UNITS[u.t].w1 || UNITS[u.t].w2) {
    const f = attackFringe(u, G.reach);
    for (let i = 0; i < f.length; i++) if (R.over.tiles[i]) f[i] = 0;
    R.over2 = { kind: 'attack', tiles: f };
  }
  sfx('select');
  hudRefresh();
}
function inspectUnit(u) {
  clearSel();
  G.inspect = u; G.mode = 'idle';
  const r = reach(S, u, { mp: moveRange(S, u) });
  const f = attackFringe(u, r);
  if (isIndirect(u.t)) R.over = { kind: 'threat', tiles: f };
  else { const m = reachOverlay(r); for (let i = 0; i < f.length; i++) if (m[i]) f[i] = 1; R.over = { kind: 'threat', tiles: f }; }
  sfx('menu');
  hudRefresh();
}

// The path follows the pointer the way it does in the classic games: extend it while it stays affordable,
// otherwise fall back to the cheapest path.
function updatePath(x, y) {
  const u = G.sel, r = G.reach;
  if (!u || !inb(S, x, y) || r.dist[y * S.w + x] < 0) { R.path = null; G.path = null; return; }
  let p = G.path && G.path.length ? G.path.slice() : [{ x: u.x, y: u.y }];
  const k = p.findIndex((q) => q.x === x && q.y === y);
  if (k >= 0) p = p.slice(0, k + 1);
  else {
    const last = p[p.length - 1];
    if (mdist(last.x, last.y, x, y) === 1) {
      p.push({ x, y });
      if (pathCost(S, u, p) > r.mp || !pathOK(u, p)) p = pathTo(S, r, x, y);
    } else p = pathTo(S, r, x, y);
  }
  G.path = p; R.path = p;
}
function pathOK(u, p) {
  for (let i = 1; i < p.length; i++) {
    const t = tileAt(S, p[i].x, p[i].y);
    if (!moveCost(u.t, t.k)) return false;
    const o = unitAt(S, p[i].x, p[i].y);
    if (o && o.s !== u.s && canSee(S, u.s, o)) return false;
  }
  return true;
}

// what the selected unit can do if it stops at (x,y)
function actionsAt(u, x, y) {
  const kind = stopKind(S, u, x, y);
  const out = [];
  if (kind === 'load') return [{ id: 'load', label: 'Load' }];
  if (kind === 'join') return [{ id: 'join', label: 'Join' }];
  const moved = x !== u.x || y !== u.y;
  const tg = targetsFrom(S, u, x, y, moved);
  if (tg.length) out.push({ id: 'attack', label: UNITS[u.t].kamikaze ? 'Strike' : 'Fire' });
  const t = tileAt(S, x, y);
  if (UNITS[u.t].cap && TER[t.k].prop && t.o !== u.s) out.push({ id: 'capture', label: UNITS[u.t].side === 0 ? 'Network' : 'Capture' });
  if (UNITS[u.t].supply) {
    const any = S.units.some((w) => w.s === u.s && w !== u && mdist(w.x, w.y, x, y) === 1 && (w.fuel < UNITS[w.t].fuel || (UNITS[w.t].w1 && w.ammo < UNITS[w.t].w1.ammo)));
    if (any) out.push({ id: 'supply', label: 'Supply' });
  }
  if (u.cargo.length && dropTilesAt(u, x, y).length) out.push({ id: 'drop', label: 'Drop' });
  out.push({ id: 'wait', label: 'Wait' });
  return out;
}
function dropTilesAt(u, x, y) {
  const ox = u.x, oy = u.y;
  u.x = x; u.y = y;
  const r = dropTiles(S, u).filter((p) => !(p.x === ox && p.y === oy) || true);
  u.x = ox; u.y = oy;
  // the transport's own start tile is free once it has moved away
  return r.filter((p) => !(unitAt(S, p.x, p.y) && unitAt(S, p.x, p.y) !== u));
}

async function chooseDest(x, y) {
  const u = G.sel;
  let p = G.path && G.path.length && G.path[G.path.length - 1].x === x && G.path[G.path.length - 1].y === y ? G.path : pathTo(S, G.reach, x, y);
  if (!p) return;
  const kind = stopKind(S, u, x, y);
  if (!kind) { sfx('error'); return; }
  const tc = trapCheck(S, u, p);
  G.mode = 'busy';
  R.over = null; R.over2 = null; R.path = null;
  if (tc.trapped) {
    await perform({ kind: 'unit', id: u.id, path: p, act: 'wait' });
    return afterHumanAction();
  }
  await animMove(u, p);
  u.anim = { x, y };
  G.dest = { x, y }; G.path = p;
  G.mode = 'menu';
  openActionMenu(actionsAt(u, x, y));
}
function cancelMenu() {
  const u = G.sel;
  closeActionMenu(); hideForecast();
  if (!u) { G.mode = 'idle'; return; }
  u.anim = null;
  sfx('cancel');
  selectUnit(u);
  if (G.dest) R.cursor = { x: u.x, y: u.y };
}
async function menuPick(id) {
  const u = G.sel, d = G.dest;
  closeActionMenu();
  sfx('menu');
  if (id === 'attack') {
    G.targets = targetsFrom(S, u, d.x, d.y, d.x !== u.x || d.y !== u.y);
    R.targets = G.targets.map((t) => ({ x: t.x, y: t.y }));
    G.mode = 'target'; G.tgt = null;
    if (G.targets.length === 1 || !isTouch) previewTarget(G.targets[0]);
    hudRefresh();
    return;
  }
  if (id === 'drop') {
    const tiles = dropTilesAt(u, d.x, d.y);
    const o = new Uint8Array(S.w * S.h); for (const p of tiles) o[p.y * S.w + p.x] = 1;
    R.over = { kind: 'move', tiles: o };
    G.mode = 'drop';
    toast('Choose where to drop the ' + UNITS[u.cargo[0].t].name + '.');
    return;
  }
  G.mode = 'busy';
  await perform({ kind: 'unit', id: u.id, path: G.path, act: id });
  afterHumanAction();
}
function previewTarget(t) {
  G.tgt = t;
  const u = G.sel, d = G.dest;
  const f = forecast(S, u, d.x, d.y, t);
  showForecast(u, t, f);
}
async function confirmTarget(t) {
  const u = G.sel;
  G.mode = 'busy'; R.targets = null; hideForecast();
  await perform({ kind: 'unit', id: u.id, path: G.path, act: 'attack', target: t.id });
  afterHumanAction();
}

// ---------------- input ----------------
const PTR = { down: new Map(), drag: false, start: null, cam0: null, pinch: null, lastTap: 0 };
function inputInit() {
  const cv = R.cv;
  cv.addEventListener('pointerdown', (e) => {
    audioInit();
    cv.setPointerCapture(e.pointerId);
    PTR.down.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (PTR.down.size === 1) { PTR.drag = false; PTR.start = { x: e.clientX, y: e.clientY, type: e.pointerType, button: e.button }; PTR.cam0 = { ...R.cam }; }
    else if (PTR.down.size === 2) {
      const [a, b] = [...PTR.down.values()];
      PTR.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: R.zoom }; PTR.drag = true;
    }
  });
  cv.addEventListener('pointermove', (e) => {
    const p = PTR.down.get(e.pointerId);
    if (p) { p.x = e.clientX; p.y = e.clientY; }
    if (PTR.down.size === 2 && PTR.pinch) {
      const [a, b] = [...PTR.down.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const steps = Math.round(Math.log2(d / PTR.pinch.d) * 3);
      const want = clamp(PTR.pinch.z + steps, 1, 40);
      if (want !== R.zoom) setZoom(want - R.zoom, (a.x + b.x) / 2 * R.dpr, (a.y + b.y) / 2 * R.dpr);
      return;
    }
    if (PTR.down.size === 1 && PTR.start) {
      const dx = e.clientX - PTR.start.x, dy = e.clientY - PTR.start.y;
      if (!PTR.drag && Math.hypot(dx, dy) > (e.pointerType === 'mouse' ? 6 : 12)) PTR.drag = true;
      if (PTR.drag) {
        R.camTo = null;
        R.cam.x = PTR.cam0.x - dx * R.dpr / R.zoom; R.cam.y = PTR.cam0.y - dy * R.dpr / R.zoom;
        clampCam();
        return;
      }
    }
    if (e.pointerType === 'mouse') hover(e.clientX, e.clientY);
  });
  const up = (e) => {
    const was = PTR.down.get(e.pointerId);
    PTR.down.delete(e.pointerId);
    if (PTR.down.size < 2) PTR.pinch = null;
    if (!was || PTR.down.size > 0) return;
    if (!PTR.drag && PTR.start) {
      if (PTR.start.button === 2) rightClick();
      else tap(e.clientX, e.clientY, e.pointerType);
    }
    PTR.start = null; PTR.drag = false;
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', (e) => { PTR.down.delete(e.pointerId); PTR.start = null; PTR.pinch = null; });
  cv.addEventListener('contextmenu', (e) => e.preventDefault());
  cv.addEventListener('wheel', (e) => { e.preventDefault(); setZoom(e.deltaY < 0 ? 1 : -1, e.clientX * R.dpr, e.clientY * R.dpr); }, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (document.body.dataset.state !== 'play') return;
    if (e.key === 'Escape') { if (anyModalOpen()) closeModals(); else rightClick(); }
  });
}

function hover(cx, cy) {
  if (!S) return;
  const t = screenToTile(cx, cy);
  if (!inb(S, t.x, t.y)) { R.cursor = null; return; }
  if (!R.cursor || R.cursor.x !== t.x || R.cursor.y !== t.y) {
    R.cursor = t;
    if (G.mode === 'select') updatePath(t.x, t.y);
    if (G.mode === 'target') { const tg = G.targets.find((q) => q.x === t.x && q.y === t.y); if (tg && tg !== G.tgt) { previewTarget(tg); sfx('cursor'); } }
    if (G.mode === 'idle' || G.mode === 'select') infoAt(t.x, t.y);
  }
}

function rightClick() {
  if (G.mode === 'target') { R.targets = null; hideForecast(); G.mode = 'menu'; openActionMenu(actionsAt(G.sel, G.dest.x, G.dest.y)); sfx('cancel'); return; }
  if (G.mode === 'drop') { R.over = null; G.mode = 'menu'; openActionMenu(actionsAt(G.sel, G.dest.x, G.dest.y)); sfx('cancel'); return; }
  if (G.mode === 'menu') return cancelMenu();
  if (G.mode === 'select' || G.inspect) { clearSel(); G.mode = isHumanTurn() ? 'idle' : G.mode; sfx('cancel'); hudRefresh(); }
}

function tap(cx, cy, ptype) {
  if (!S || anyModalOpen()) return;
  const t = screenToTile(cx, cy);
  const on = inb(S, t.x, t.y);
  if (on) { R.cursor = t; infoAt(t.x, t.y); }
  if (!isHumanTurn() || G.mode === 'busy') {
    // allow looking at units during the enemy turn
    return;
  }
  const side = S.turn;
  switch (G.mode) {
    case 'idle': {
      if (!on) { clearSel(); return; }
      const u = unitAt(S, t.x, t.y);
      if (u && canSee(S, side, u)) {
        if (u.s === side && !u.done) return selectUnit(u);
        if (G.inspect === u) { clearSel(); hudRefresh(); return; }
        return inspectUnit(u);
      }
      const tl = tileAt(S, t.x, t.y);
      if (!u && tl.o === side && TER[tl.k].build) { clearSel(); return openBuild(t.x, t.y, TER[tl.k].build); }
      clearSel(); hudRefresh();
      return;
    }
    case 'select': {
      const u = G.sel;
      if (!on) return rightClick();
      if (t.x === u.x && t.y === u.y) { G.path = [{ x: u.x, y: u.y }]; return chooseDest(u.x, u.y); }
      if (G.reach.dist[t.y * S.w + t.x] >= 0 && stopKind(S, u, t.x, t.y)) {
        if (ptype !== 'mouse') updatePath(t.x, t.y);
        return chooseDest(t.x, t.y);
      }
      // tapping another of our ready units switches selection
      const o = unitAt(S, t.x, t.y);
      if (o && o.s === side && !o.done) return selectUnit(o);
      return rightClick();
    }
    case 'menu': return cancelMenu();
    case 'target': {
      const tg = on && G.targets.find((q) => q.x === t.x && q.y === t.y);
      if (!tg) return rightClick();
      if (ptype === 'mouse' || G.tgt === tg) return confirmTarget(tg);
      previewTarget(tg); sfx('cursor');
      return;
    }
    case 'drop': {
      if (on && R.over && R.over.tiles[t.y * S.w + t.x]) {
        const u = G.sel;
        G.mode = 'busy'; R.over = null;
        perform({ kind: 'unit', id: u.id, path: G.path, act: 'drop', drop: { x: t.x, y: t.y } }).then(afterHumanAction);
        return;
      }
      return rightClick();
    }
  }
}

// Signal Front — HUD, menus, banners and the title / setup / result screens

function blit(cv, img, bg) {
  const x = cv.getContext('2d');
  x.imageSmoothingEnabled = false;
  x.clearRect(0, 0, cv.width, cv.height);
  if (bg) { x.fillStyle = bg; x.fillRect(0, 0, cv.width, cv.height); }
  x.drawImage(img, 0, 0, cv.width, cv.height);
}
function spriteCanvas(t, side, size = 16, bg) {
  const c = mkCanvas(size, size); c.className = 'pix';
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  if (bg) { x.fillStyle = bg; x.fillRect(0, 0, size, size); }
  x.drawImage(unitSprite(t, side, 0), 0, 0, size, size);
  return c;
}

// ---------------- top bar ----------------
function hudRefresh() {
  if (!S) return;
  for (let p = 0; p < 2; p++) {
    const card = $('#side' + p), sd = S.sides[p], co = COS[sd.co];
    card.classList.toggle('active', S.turn === p);
    blit(card.querySelector('canvas'), portrait(sd.co, sd.pw ? 1 : 0));
    card.querySelector('.nm').textContent = co.name;
    card.querySelector('.funds').textContent = 'G ' + fmt(sd.funds);
    const m = card.querySelector('.meter');
    const pc = powerCost(S, p, 1), sc = powerCost(S, p, 2), stars = co.super.stars, per = sc / stars;
    let html = '';
    for (let i = 0; i < stars; i++) {
      const f = clamp((sd.meter - i * per) / per, 0, 1);
      html += '<i class="' + (i >= co.power.stars ? 'big' : '') + '"><b style="width:' + Math.round(f * 100) + '%"></b></i>';
    }
    m.innerHTML = html;
    m.classList.toggle('ready', !sd.pw && sd.meter >= pc);
    let tag = card.querySelector('.pwtag');
    if (sd.pw) { if (!tag) { tag = el('span', 'pwtag'); card.appendChild(tag); } tag.textContent = sd.pw === 2 ? 'SUPER' : 'POWER'; }
    else if (tag) tag.remove();
  }
  $('#dayTxt').textContent = 'DAY ' + S.day;
  $('#turnTxt').textContent = FACTIONS[S.turn].name;
  const human = isHumanTurn();
  $('#endBtn').disabled = !human || G.mode === 'busy';
  const hs = humanSide();
  $('#powerBtn').hidden = !(human && (canPower(S, hs, 1) || canPower(S, hs, 2)));
  $('#powerBtn').textContent = canPower(S, hs, 2) ? 'Super!' : 'Power!';
  if (R.cursor) infoAt(R.cursor.x, R.cursor.y);
}

function infoAt(x, y) {
  if (!S || !inb(S, x, y)) return;
  const t = tileAt(S, x, y), T0 = TER[t.k];
  $('#terrCard').hidden = false;
  const tc = $('#terrCard canvas'), tx = tc.getContext('2d');
  tx.imageSmoothingEnabled = false; tx.clearRect(0, 0, 16, 20);
  tx.drawImage(tileImage(S, x, y), 0, 4);
  if (t.k === 'forest' || t.k === 'mount') tx.drawImage(tallTile(t.k, x, y), 0, 0);
  else if (T0.prop) tx.drawImage(propSprite(t.k, t.o), 0, 0);
  $('#terrName').textContent = T0.name.toUpperCase();
  let line = '<span class="stars">' + '★'.repeat(T0.def) + '</span>' + (T0.def ? '' : '<span style="color:var(--dim)">no cover</span>');
  if (T0.prop) line += ' · ' + (t.o < 0 ? 'Neutral' : FACTIONS[t.o].name) + (t.cp < 20 ? ' · <b>' + t.cp + '</b>/20' : '');
  $('#terrLine').innerHTML = line;
  const u = unitAt(S, x, y);
  const card = $('#unitCard');
  if (u && canSee(S, viewSide(), u)) {
    card.hidden = false; card.dataset.unit = u.id;
    blit(card.querySelector('canvas'), unitSprite(u.t, u.s, 0));
    const U = UNITS[u.t];
    $('#unitName').textContent = U.name.toUpperCase();
    let l = 'HP <b>' + disp(u.hp) + '</b> · Fuel <b>' + u.fuel + '</b>';
    if (U.w1 && U.w1.ammo) l += ' · Ammo <b>' + u.ammo + '</b>';
    if (u.cargo.length) l += ' · Carrying ' + UNITS[u.cargo[0].t].name;
    $('#unitLine').innerHTML = l;
  } else card.hidden = true;
}

// ---------------- action menu / forecast ----------------
function openActionMenu(items) {
  const m = $('#actionMenu');
  m.innerHTML = '';
  for (const it of items) {
    const b = el('button', null, it.label);
    b.onclick = (e) => { e.stopPropagation(); menuPick(it.id); };
    m.appendChild(b);
  }
  m.hidden = false;
  const p = tileToScreen(G.dest.x, G.dest.y);
  const w = m.offsetWidth, h = m.offsetHeight;
  let left = p.x + p.s + 8, top = p.y - 4;
  if (left + w > innerWidth - 8) left = p.x - w - 8;
  if (left < 8) left = 8;
  top = clamp(top, 64, innerHeight - h - 8);
  m.style.left = left + 'px'; m.style.top = top + 'px';
  if (!isTouch) m.querySelector('button').focus({ preventScroll: true });
}
function closeActionMenu() { $('#actionMenu').hidden = true; }

function showForecast(u, t, f) {
  const box = $('#forecast');
  const pct = (a, b) => (a === b ? a + '%' : a + '–' + b + '%');
  let html = '<div class="row"><span class="k">DAMAGE</span><span class="v hit">' + pct(f.lo, f.hi) + '</span></div>';
  if (UNITS[u.t].kamikaze) html += '<div class="hint">The Kite is destroyed by its own strike.</div>';
  else if (f.counter) html += '<div class="row"><span class="k">COUNTER</span><span class="v ctr">' + pct(f.clo, f.chi) + '</span></div>';
  else html += '<div class="row"><span class="k">COUNTER</span><span class="v" style="color:var(--dim)">none</span></div>';
  if (f.lo >= t.hp) html += '<div class="hint" style="color:var(--good)">Destroys the target.</div>';
  if (isTouch) html += '<div class="hint">Tap the target again to fire.</div>';
  box.innerHTML = html;
  box.hidden = false;
  const p = tileToScreen(t.x, t.y);
  const w = box.offsetWidth, h = box.offsetHeight;
  let left = p.x + p.s + 10, top = p.y - h / 2 + p.s / 2;
  if (left + w > innerWidth - 8) left = p.x - w - 10;
  box.style.left = clamp(left, 8, innerWidth - w - 8) + 'px';
  box.style.top = clamp(top, 64, innerHeight - h - 8) + 'px';
}

function vsChips(t) {
  const out = [];
  const U = UNITS[t];
  for (const cls of ['inf', 'veh', 'tank', 'heavy', 'drone', 'heli', 'jet', 'ship', 'sub']) {
    const v = Math.max(U.w1 ? U.w1.dmg[cls] || 0 : 0, U.w2 ? U.w2.dmg[cls] || 0 : 0);
    if (!v) continue;
    out.push('<span class="' + (v >= 75 ? 'hi' : v >= 35 ? 'mid' : 'lo') + '">' + CLS_NAME[cls] + ' ' + v + '%</span>');
  }
  return out.length ? '<div class="vs">' + out.join('') + '</div>' : '<div class="desc" style="color:var(--dim)">Unarmed.</div>';
}
function unitStats(t, side) {
  const U = UNITS[t];
  const rng = U.w1 && U.w1.range ? U.w1.range.join('–') : U.w1 || U.w2 ? '1' : '—';
  return '<div class="stat"><span>Cost</span><span>' + fmt(S ? unitCost(S, side, t) : U.cost) + ' G</span><span>Move</span><span>' + U.move + ' (' + MT_NAME[U.mt] + ')</span>' +
    '<span>Vision</span><span>' + U.vis + '</span><span>Range</span><span>' + rng + '</span><span>Fuel</span><span>' + U.fuel + (U.burn ? ' (−' + U.burn + '/day)' : '') + '</span>' +
    '<span>Class</span><span>' + CLS_NAME[U.cls] + '</span>' +
    (U.w1 ? '<span>Weapon</span><span>' + U.w1.name + (U.w1.ammo ? ' ×' + U.w1.ammo : '') + '</span>' : '') +
    (U.w2 ? '<span>' + (U.w1 ? 'Backup' : 'Weapon') + '</span><span>' + U.w2.name + '</span>' : '') + '</div>';
}

function miniMap(def) {
  const m = buildMap(def);

  const c = mkCanvas(m.w * sc, m.h * sc); c.className = 'mini pix';

  const col = { plain: '#7cc858', forest: '#2f7a3a', mount: '#a89070', road: '#b9b2a2', bridge: '#a87c4c', river: '#4a90e8', sea: '#3a7ce0', shoal: '#ecd898', reef: '#2a5cb8' };
  m.tiles.forEach((t, i) => {
    const X = (i % m.w) * sc, Y = ((i / m.w) | 0) * sc;

// Signal Front — boot, title attract map, save/load, main loop and the #debug test hook

function saveGame() {
  if (!S || S.over || S.demo) return;
  const skip = new Set(['firstEvents', 'anim', 'flash', 'vhp', '_tw', '_twv']);
  try { storeSet('save', JSON.parse(JSON.stringify(S, (k, v) => (skip.has(k) ? undefined : v)))); } catch (e) { /* ignore */ }
}
function loadGame() {
  const d = storeGet('save', null);
  if (!d) return;
  S = d; S.ver = 1;
  enterPlay();
  if (isHumanTurn()) { G.mode = 'idle'; playSong(FACTIONS[S.turn].id); hudRefresh(); }
  else runAI();
}
function enterPlay() {
  clearSel();
  FX.length = 0;
  R.insets.top = innerWidth <= 640 ? 52 : 56;
  R.insets.bottom = innerWidth <= 640 ? 64 : 52;
  R.userZoom = false;
  setState('play');
  fitZoom(true);
  const hq = S.tiles.findIndex((t) => t.k === 'hq' && t.o === humanSide());
  centerOn(hq % S.w, (hq / S.w) | 0, true);
  R.humanCam = { x: R.cam.x, y: R.cam.y };
  hudRefresh();
}
function startGame(opts) {
  storeDel('save');
  newGame(opts);
  enterPlay();
  beginTurn(S.firstEvents);
}

function toTitle() {
  G.mode = 'off';

  const place = [['crawler', 0, 3, 4], ['strider', 0, 5, 6], ['spark', 0, 2, 7], ['wraith', 0, 6, 3], ['mallet', 0, 4, 9], ['razorwing', 0, 7, 8], ['watchpost', 0, 3, 10],
    ['rifle', 1, 13, 7], ['tank', 1, 14, 5], ['fpv', 1, 12, 4], ['howitzer', 1, 16, 8], ['gunship', 1, 11, 9], ['heavy', 1, 15, 3], ['kite', 1, 10, 2]];
  for (const [t, s, x, y] of place) demo.units.push(mkUnit(demo, t, s, x, y));
  bump(demo);
  R.insets.top = 0; R.insets.bottom = 0;
  R.userZoom = false;
  fitZoom(true);
  R.cam.x = 0; R.cam.y = 0; R.camTo = null;
  clampCam();
  R.titleDrift = 0;
  setState('title');
  refreshTitle();
  playSong('title');
}

let lastT = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
  lastT = t;
  if (S && S.demo && document.body.dataset.state !== 'play') {
    R.titleDrift += dt;
    const vw = viewW() / R.zoom, mw = S.w * T;
    if (mw > vw) R.cam.x = (Math.sin(R.titleDrift * 0.08) * 0.5 + 0.5) * (mw - vw);
  }
  render(dt);
  requestAnimationFrame(loop);
}

function boot() {
  renderInit();
  inputInit();
  uiInit();
  TIME.speed = storeGet('speed', 1);
  toTitle();
  requestAnimationFrame(loop);
  // first gesture unlocks audio
  window.addEventListener('pointerdown', () => audioInit(), { once: true });
  if (DEBUG) {
    window.SF = {
      get S() { return S; },
      rules: { newGame, mkUnit, reach, pathTo, trapCheck, commitMove, strike, removeDead, doCapture, doJoin, doLoad, doDrop, dropTiles, doBuild, startTurn, endTurn, checkVictory, canSee, visMap, calcDmg, forecast, activatePower, canPower, powerCost, unitAt, stopKind, targetsFrom, supplyAround, bump },
      api: { TIME, G, R, tileToScreen, aiNext, aiContext, evalUnit, targetsFrom, forecast, reach, posScore, goalField, threatAt, UNITS, canSee, endTurn, perform },
      start(o = {}) { startGame({ map: 'crossfire', coP: 'kade', coE: 'volsk', ...o }); },
      reveal() { R.reveal = !R.reveal; },
      place(t, s, x, y, hp = 100) { const u = mkUnit(S, t, s, x, y); u.hp = hp; S.units.push(u); S.sides[s].ever = true; bump(S); hudRefresh(); return u; },
      meter(side, v) { S.sides[side].meter = v; hudRefresh(); },
      // AI vs AI, no animation: returns { winner, day, how }
      async sim(o = {}, maxDays = 40) {
        TIME.fast = true;
        newGame({ map: 'crossfire', coP: 'kade', coE: 'volsk', allAI: true, ...o });
        enterPlay();
        let guard = 0;
        while (maxDays > 0 && !S.over && S.day <= maxDays && guard++ < 10000) {
          let n = 0;
          while (!S.over && n++ < 400) { const a = aiNext(S, S.turn); if (a.kind === 'end') break; await perform(a); checkVictory(S); }
          if (S.over) break;
          endTurn(S); checkVictory(S);
        }
        TIME.fast = false;
        return { winner: S.winner, day: S.day, how: S.how, units: [0, 1].map((p) => S.units.filter((u) => u.s === p).length),
          props: [0, 1].map((p) => propCount(S, p)), stats: S.sides.map((s) => s.stats) };
      },
      gallery() {
        const c = mkCanvas(16 * 14 * 4, 16 * 4 * 4 + 40), x = c.getContext('2d');
        x.imageSmoothingEnabled = false; x.fillStyle = '#7cc858'; x.fillRect(0, 0, c.width, c.height);
        let i = 0;
        for (const side of [0, 1]) for (const t of FACTIONS[side].roster) {
          x.drawImage(unitSprite(t, side, 0), (i % 14) * 64, Math.floor(i / 14) * 64, 64, 64); i++;
        }
        i = 28;
        for (const k of ['city', 'base', 'airport', 'port', 'hq', 'tower']) for (const o of [-1, 0, 1]) { x.drawImage(propSprite(k, o), (i % 14) * 64, Math.floor(i / 14) * 64, 64, 80); i++; }
        document.body.appendChild(c);
        c.style.cssText = 'position:fixed;left:0;top:0;z-index:99;image-rendering:pixelated';
        return c;
      },
    };
  }
}
boot();

})();
</script>
</body>
