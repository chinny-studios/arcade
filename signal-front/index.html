<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Signal Front</title>
<meta name="description" content="A turn-based tactics game in the classic handheld style: command an all-autonomous force against a drone-and-armor army.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --ink: #eef3ff; --dim: #93a0bd; --bg: #0e1220; --panel: #18203a; --panel2: #222c4c; --line: #3b4a78; --edge: #0a0d18;
    --blue: #4a9be8; --blue2: #2860b0; --red: #e0503c; --red2: #a42c28; --gold: #ffd23a; --cyan: #6ff3ff; --good: #7dde6a; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--ink);
    font-family: 'VT323', ui-monospace, monospace; font-size: 20px; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: none; }
  [hidden] { display: none !important; }
  .px { font-family: 'Press Start 2P', ui-monospace, monospace; font-weight: 400; letter-spacing: 0; }
  #app { position: fixed; inset: 0; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  canvas.pix { image-rendering: pixelated; image-rendering: crisp-edges; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn { font-family: 'Press Start 2P', monospace; font-size: 11px; line-height: 1; padding: 11px 14px; background: var(--panel2); color: var(--ink);
    border: 2px solid var(--edge); box-shadow: inset 0 0 0 2px var(--line), 0 3px 0 var(--edge); border-radius: 2px; text-transform: uppercase; }
  .btn:hover:not(:disabled) { background: #2c3962; }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 0 0 2px var(--line), 0 1px 0 var(--edge); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: #2f6fd0; box-shadow: inset 0 0 0 2px #7cc0ff, 0 3px 0 var(--edge); }
  .btn.primary:hover:not(:disabled) { background: #3a80e6; }
  .btn.warn { background: #8a2a24; box-shadow: inset 0 0 0 2px #e0705c, 0 3px 0 var(--edge); }
  .box { background: var(--panel); border: 2px solid var(--edge); box-shadow: inset 0 0 0 2px var(--line); border-radius: 3px; }

  /* ---------------- HUD ---------------- */
  #hud { position: absolute; inset: 0; pointer-events: none; display: none; }
  body[data-state="play"] #hud { display: block; }
  #hud > * { pointer-events: auto; }
  #topbar { position: absolute; left: 0; right: 0; top: 0; height: 56px; display: flex; align-items: stretch; gap: 8px; padding: 4px 8px; box-sizing: border-box;
    background: linear-gradient(#0b0f1c, #121a30); border-bottom: 2px solid var(--edge); box-shadow: 0 2px 0 var(--line); }
  .sidecard { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 0; border-radius: 3px; position: relative; cursor: pointer;
    background: rgba(255,255,255,.03); border: 2px solid transparent; }
  .sidecard.s1 { flex-direction: row-reverse; padding: 0 0 0 8px; text-align: right; }
  .sidecard.active.s0 { border-color: var(--blue); background: rgba(74,155,232,.14); }
  .sidecard.active.s1 { border-color: var(--red); background: rgba(224,80,60,.14); }
  .sidecard canvas { width: 40px; height: 40px; flex: none; border: 2px solid var(--edge); }
  .sidecard .meta { min-width: 0; flex: 1; }
  .sidecard .nm { font-family: 'Press Start 2P', monospace; font-size: 9px; line-height: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidecard .funds { font-size: 20px; line-height: 1; color: var(--gold); margin-top: 3px; }
  .meter { display: flex; gap: 2px; margin-top: 2px; height: 6px; }
  .sidecard.s1 .meter { justify-content: flex-end; }
  .meter i { display: block; width: 12px; height: 6px; background: #0a0d18; border: 1px solid #2a3558; box-sizing: border-box; position: relative; overflow: hidden; }
  .meter i.big { width: 16px; }
  .meter i b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold); }
  .meter.ready i b { animation: glow .6s steps(2) infinite; }
  @keyframes glow { 50% { background: #fff6c0; } }
  .pwtag { position: absolute; top: -2px; font-family: 'Press Start 2P', monospace; font-size: 7px; color: #10131f; background: var(--gold); padding: 2px 3px; border-radius: 2px; }
  .sidecard.s0 .pwtag { right: 4px; } .sidecard.s1 .pwtag { left: 4px; }
  #daybox { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 64px; }
  #daybox .d { font-family: 'Press Start 2P', monospace; font-size: 11px; }
  #daybox .w { font-size: 17px; color: var(--dim); margin-top: 3px; }
  #menuBtn { flex: none; width: 44px; padding: 0; font-size: 14px; }

  #info { position: absolute; left: 8px; bottom: 8px; display: flex; gap: 6px; align-items: flex-end; max-width: calc(100vw - 170px); }
  .card { padding: 6px 8px; display: flex; gap: 8px; align-items: center; min-height: 44px; box-sizing: border-box; }
  .card canvas { width: 32px; height: 32px; flex: none; }
  .card .t { font-family: 'Press Start 2P', monospace; font-size: 9px; white-space: nowrap; }
  .card .l { font-size: 18px; line-height: 1.05; color: var(--dim); white-space: nowrap; }
  .card .l b { color: var(--ink); font-weight: 400; }
  .stars { color: var(--gold); letter-spacing: -2px; }
  #unitCard { cursor: pointer; }
  #unitCard .q { font-family: 'Press Start 2P', monospace; font-size: 8px; color: var(--dim); border: 1px solid var(--line); padding: 2px 4px; border-radius: 2px; align-self: flex-start; }

  #rbtns { position: absolute; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  #zoomBtns { display: flex; gap: 6px; }
  #zoomBtns .btn { width: 40px; padding: 9px 0; font-size: 14px; }
  #powerBtn { background: #6a5410; box-shadow: inset 0 0 0 2px var(--gold), 0 3px 0 var(--edge); color: #fff6d0; animation: pulse 1s steps(2) infinite; }
  @keyframes pulse { 50% { background: #8c7016; } }
  #endBtn { min-width: 128px; }

  #actionMenu { position: absolute; display: flex; flex-direction: column; padding: 4px; gap: 3px; z-index: 5; min-width: 120px; }
  #actionMenu button { text-align: left; font-family: 'Press Start 2P', monospace; font-size: 11px; padding: 11px 12px; background: transparent; border: 0; color: var(--ink); border-radius: 2px; }
  #actionMenu button:hover, #actionMenu button:focus-visible { background: #34437a; outline: none; }
  #actionMenu button::before { content: '▸ '; color: transparent; }
  #actionMenu button:hover::before { color: var(--gold); }

  #forecast { position: absolute; padding: 8px 10px; z-index: 6; min-width: 150px; pointer-events: none; }
  #forecast .row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  #forecast .k { font-family: 'Press Start 2P', monospace; font-size: 8px; color: var(--dim); }
  #forecast .v { font-size: 26px; line-height: 1; }
  #forecast .v.hit { color: #ffcf6a; } #forecast .v.ctr { color: #ff8c7a; }
  #forecast .hint { font-size: 15px; color: var(--dim); margin-top: 4px; }

  #banner { position: absolute; left: 0; right: 0; top: 38%; height: 0; pointer-events: none; z-index: 8; }
  #banner .strip { position: absolute; left: 0; right: 0; top: -44px; height: 88px; display: flex; align-items: center; justify-content: center; gap: 16px;
    transform: translateX(-110%); transition: transform .35s cubic-bezier(.2,.8,.2,1); border-top: 3px solid var(--edge); border-bottom: 3px solid var(--edge); }
  #banner.on .strip { transform: none; }
  #banner.out .strip { transform: translateX(110%); }
  #banner canvas { width: 64px; height: 64px; border: 3px solid var(--edge); }
  #banner .big { font-family: 'Press Start 2P', monospace; font-size: clamp(16px, 4vw, 28px); text-shadow: 3px 3px 0 #000; }
  #banner .sub { font-size: 22px; color: #e8ecff; text-shadow: 2px 2px 0 #000; }
  #banner.power .strip { height: 120px; top: -60px; }
  #banner.power .big { color: var(--gold); }

  #toast { position: absolute; left: 50%; top: 66px; transform: translateX(-50%); padding: 6px 12px; z-index: 9; pointer-events: none; font-size: 20px; max-width: 86vw; text-align: center;
    transition: opacity .3s; }
  #toast.off { opacity: 0; }

  /* ---------------- modals ---------------- */
  .modal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(5,7,14,.62); z-index: 20; padding: 12px; box-sizing: border-box; }
  .modal > .box { max-width: min(760px, 100%); max-height: 100%; overflow: auto; padding: 14px; box-sizing: border-box; }
  .modal h2 { font-family: 'Press Start 2P', monospace; font-size: 13px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .x { font-family: 'Press Start 2P', monospace; background: none; border: 0; font-size: 14px; color: var(--dim); padding: 4px 6px; }
  #buildBox { width: 720px; }
  #buildGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #buildList { display: flex; flex-direction: column; gap: 3px; }
  .bu { display: flex; align-items: center; gap: 8px; padding: 4px 8px; background: rgba(255,255,255,.03); border: 2px solid transparent; border-radius: 2px; text-align: left; }
  .bu canvas { width: 32px; height: 32px; }
  .bu .n { flex: 1; font-size: 21px; }
  .bu .c { font-size: 21px; color: var(--gold); }
  .bu.sel { border-color: var(--gold); background: rgba(255,210,58,.08); }
  .bu.no { opacity: .4; }
  .bu:hover { background: rgba(255,255,255,.07); }
  #buildDetail { display: flex; flex-direction: column; gap: 8px; }
  #buildDetail .hero { display: flex; gap: 10px; align-items: center; }
  #buildDetail .hero canvas { width: 64px; height: 64px; background: #2c5a2a; border: 2px solid var(--edge); }
  .stat { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; font-size: 19px; line-height: 1.1; }
  .stat span:nth-child(odd) { color: var(--dim); }
  .desc { font-size: 19px; line-height: 1.15; color: #d6ddf2; }
  .vs { display: flex; flex-wrap: wrap; gap: 4px; }
  .vs span { font-size: 16px; padding: 1px 5px; border-radius: 2px; background: #10162a; border: 1px solid #2a3558; }
  .vs span.hi { color: var(--good); } .vs span.mid { color: var(--gold); } .vs span.lo { color: #c98a80; }
  #funds2 { color: var(--gold); font-size: 22px; }

  #coBox { width: 560px; }
  .cohead { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  .cohead canvas { width: 96px; height: 96px; border: 3px solid var(--edge); flex: none; }
  .cohead .t { font-family: 'Press Start 2P', monospace; font-size: 12px; }
  .cohead .s { color: var(--dim); font-size: 19px; }
  .pw { border: 2px solid var(--line); border-radius: 3px; padding: 8px; margin-top: 8px; display: flex; gap: 10px; align-items: center; }
  .pw .tx { flex: 1; }
  .pw .tx b { font-family: 'Press Start 2P', monospace; font-size: 10px; font-weight: 400; color: var(--gold); display: block; margin-bottom: 4px; }

  .menuList { display: flex; flex-direction: column; gap: 8px; min-width: 260px; }

  /* ---------------- screens ---------------- */
  .screen { position: absolute; inset: 0; display: none; overflow: auto; z-index: 30; }
  body[data-state="title"] #title, body[data-state="setup"] #setup, body[data-state="howto"] #howto, body[data-state="result"] #result { display: flex; }
  #title { flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: radial-gradient(ellipse at center, rgba(8,12,24,.55), rgba(8,12,24,.9)); padding: 16px; box-sizing: border-box; }
  .logo { font-family: 'Press Start 2P', monospace; font-size: clamp(28px, 7vw, 64px); line-height: 1.25; text-align: center; color: #fff;
    text-shadow: 4px 4px 0 var(--blue2), 8px 8px 0 #000; letter-spacing: 2px; }
  .logo small { display: block; font-size: clamp(9px, 1.6vw, 13px); color: var(--cyan); text-shadow: 2px 2px 0 #000; margin-top: 18px; letter-spacing: 3px; }
  .titleBtns { display: flex; flex-direction: column; gap: 12px; min-width: 260px; }
  .titleBtns .btn { padding: 15px; font-size: 13px; }
  .foot { font-size: 20px; color: #c6cfe6; text-align: center; max-width: 560px; background: rgba(8,12,24,.8); padding: 6px 12px; border-radius: 3px; }
  .foot a { color: var(--cyan); }

  #setup, #howto, #result { background: rgba(10,13,26,.94); justify-content: center; align-items: flex-start; padding: 16px; box-sizing: border-box; }
  .wrap { width: min(980px, 100%); display: flex; flex-direction: column; gap: 14px; padding-bottom: 30px; }
  .wrap h1 { font-family: 'Press Start 2P', monospace; font-size: 18px; margin: 4px 0; }
  .wrap h3 { font-family: 'Press Start 2P', monospace; font-size: 11px; margin: 6px 0 0; color: var(--dim); font-weight: 400; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .pick { padding: 10px; display: flex; flex-direction: column; gap: 6px; text-align: left; background: var(--panel); border: 2px solid var(--edge); box-shadow: inset 0 0 0 2px var(--line); border-radius: 3px; }
  .pick:hover { background: #1e2848; }
  .pick.sel { box-shadow: inset 0 0 0 2px var(--gold); background: #262f52; }
  .pick .n { font-family: 'Press Start 2P', monospace; font-size: 10px; }
  .pick .b { font-size: 18px; color: var(--dim); line-height: 1.1; }
  .pick canvas.mini { width: 100%; height: auto; background: #000; border: 2px solid var(--edge); }
  .pick .row { display: flex; gap: 10px; align-items: center; }
  .pick .row canvas { width: 56px; height: 56px; border: 2px solid var(--edge); flex: none; }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .opt { padding: 10px; }
  .opt .k { font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--dim); margin-bottom: 8px; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg button { font-size: 19px; padding: 4px 10px; background: #10162a; border: 2px solid #2a3558; border-radius: 2px; }
  .seg button.on { border-color: var(--gold); color: var(--gold); }
  .bar { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; position: sticky; bottom: 0; padding: 10px 0; background: linear-gradient(transparent, rgba(10,13,26,.96) 30%); }
  .howto p, .howto li { font-size: 21px; line-height: 1.2; color: #d6ddf2; }
  .howto b { color: var(--gold); font-weight: 400; }
  .howto table { border-collapse: collapse; font-size: 19px; }
  .howto td { padding: 2px 10px 2px 0; vertical-align: top; }
  .roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 6px; }
  .roster .r { display: flex; gap: 8px; align-items: flex-start; padding: 6px; }
  .roster canvas { width: 40px; height: 40px; flex: none; background: #2c5a2a; border: 2px solid var(--edge); }
  .roster .r .n { font-family: 'Press Start 2P', monospace; font-size: 9px; }
  .roster .r .d { font-size: 17px; color: var(--dim); line-height: 1.05; margin-top: 3px; }
  #result .wrap { align-items: center; text-align: center; margin-top: 6vh; }
  .verdict { font-family: 'Press Start 2P', monospace; font-size: clamp(26px, 6vw, 48px); text-shadow: 4px 4px 0 #000; }
  .verdict.win { color: var(--gold); } .verdict.lose { color: #ff7a6a; }
  .stats { display: grid; grid-template-columns: auto auto auto; gap: 6px 24px; font-size: 22px; margin: 10px auto; align-items: center; }
  .stats .h { font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--dim); }

  @media (max-width: 640px) {
    #topbar { height: 52px; gap: 4px; padding: 4px; }
    .sidecard canvas { width: 34px; height: 34px; }
    .sidecard .nm { font-size: 7px; }
    .sidecard .funds { font-size: 19px; }
    .meter i { width: 8px; } .meter i.big { width: 10px; }
    #daybox { min-width: 46px; } #daybox .d { font-size: 9px; }
    #menuBtn { width: 36px; }
    #info { max-width: calc(100vw - 130px); flex-direction: column; align-items: flex-start; gap: 4px; }
    .card { min-height: 38px; padding: 4px 6px; }
    .card canvas { width: 26px; height: 26px; }
    .card .t { font-size: 8px; } .card .l { font-size: 16px; }
    #endBtn { min-width: 0; padding: 12px 10px; font-size: 10px; }
    #buildGrid { grid-template-columns: 1fr; }
    #buildDetail { order: -1; }
    .bu .n, .bu .c { font-size: 19px; }
  }
</style>
</head>
<body data-state="title">
<div id="app">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="topbar">
      <div class="sidecard s0" id="side0"><canvas class="pix" width="32" height="32"></canvas><div class="meta"><div class="nm"></div><div class="funds"></div><div class="meter"></div></div></div>
      <div id="daybox"><div class="d" id="dayTxt">DAY 1</div><div class="w" id="turnTxt"></div></div>
      <div class="sidecard s1" id="side1"><canvas class="pix" width="32" height="32"></canvas><div class="meta"><div class="nm"></div><div class="funds"></div><div class="meter"></div></div></div>
      <button class="btn" id="menuBtn" aria-label="Menu">≡</button>
    </div>
    <div id="info">
      <div class="card box" id="terrCard" hidden><canvas class="pix" width="16" height="20"></canvas><div><div class="t" id="terrName"></div><div class="l" id="terrLine"></div></div></div>
      <div class="card box" id="unitCard" hidden><canvas class="pix" width="16" height="16"></canvas><div><div class="t" id="unitName"></div><div class="l" id="unitLine"></div></div><span class="q">?</span></div>
    </div>
    <div id="rbtns">
      <div id="zoomBtns"><button class="btn" id="zoomOut" aria-label="Zoom out">−</button><button class="btn" id="zoomIn" aria-label="Zoom in">+</button></div>
      <button class="btn" id="powerBtn" hidden>Power!</button>
      <button class="btn primary" id="endBtn">End Turn</button>
    </div>
    <div id="actionMenu" class="box" hidden></div>
    <div id="forecast" class="box" hidden></div>
    <div id="banner"><div class="strip"></div></div>
    <div id="toast" class="box off"></div>
  </div>

  <div class="modal" id="buildModal" hidden>
    <div class="box" id="buildBox">
      <h2><span id="buildTitle">Factory</span><span id="funds2"></span><button class="x" data-close>✕</button></h2>
      <div id="buildGrid"><div id="buildList"></div><div id="buildDetail"></div></div>
    </div>
  </div>
  <div class="modal" id="coModal" hidden><div class="box" id="coBox"></div></div>
  <div class="modal" id="intelModal" hidden><div class="box" id="intelBox" style="width:520px"></div></div>
  <div class="modal" id="menuModal" hidden>
    <div class="box">
      <h2>Menu <button class="x" data-close>✕</button></h2>
      <div class="menuList">
        <button class="btn" data-close>Resume</button>
        <button class="btn" id="mMusic">Music: On</button>
        <button class="btn" id="mSfx">Sound FX: On</button>
        <button class="btn" id="mSpeed">Enemy speed: Normal</button>
        <button class="btn" id="mHelp">How to play</button>
        <button class="btn" id="mQuit">Save &amp; quit</button>
        <button class="btn warn" id="mYield">Concede</button>
      </div>
    </div>
  </div>

  <div class="screen" id="title">
    <div class="logo">SIGNAL FRONT<small>AUTONOMOUS TACTICS</small></div>
    <div class="titleBtns">
      <button class="btn primary" id="tContinue" hidden>Continue</button>
      <button class="btn primary" id="tNew">New Skirmish</button>
      <button class="btn" id="tHelp">How to play</button>
      <button class="btn" id="tSound">Sound: On</button>
    </div>
    <div class="foot">Command Meridian's all-autonomous fleet against the Drovic Federation's drones and armor.<br><a href="../">← Back to the arcade</a></div>
  </div>

  <div class="screen" id="setup">
    <div class="wrap">
      <h1>New Skirmish</h1>
      <h3>Battlefield</h3>
      <div class="cards" id="mapCards"></div>
      <h3>Your commander — Meridian Autonomy Command</h3>
      <div class="cards" id="coCards0"></div>
      <h3>Enemy commander — Drovic Federation</h3>
      <div class="cards" id="coCards1"></div>
      <h3>Rules</h3>
      <div class="opts" id="optBox"></div>
      <div class="bar"><button class="btn" id="setupBack">Back</button><button class="btn primary" id="setupGo">Deploy</button></div>
    </div>
  </div>

  <div class="screen" id="howto">
    <div class="wrap howto" id="howtoBody"></div>
  </div>

  <div class="screen" id="result">
    <div class="wrap" id="resultBody"></div>
  </div>
</div>

<script>
(function(){'use strict';
// Signal Front — shared helpers: math, noise, DOM, timing

const DEBUG = location.hash === '#debug';
const T = 16; // art tile size in pixels; everything is drawn on this grid and scaled up
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => t * t * (3 - 2 * t);
const frand = (a, b) => a + (b - a) * Math.random();
const irand = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const mdist = (ax, ay, bx, by) => Math.abs(ax - bx) + Math.abs(ay - by);
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const fmt = (n) => Math.round(n).toLocaleString('en-US');
const isTouch = matchMedia('(pointer: coarse)').matches;

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

// deterministic per-tile noise for terrain dressing
function hash2(x, y, s = 0) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// Animation timing. In fast mode (headless tests, "instant" AI speed) waits resolve immediately.
const TIME = { fast: false, speed: 1 };
function wait(ms) {
  if (TIME.fast || ms <= 0) return Promise.resolve();
  return new Promise((r) => setTimeout(r, ms / TIME.speed));
}

function storeGet(k, d) {
  try { const v = localStorage.getItem('signalfront.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; }
}
function storeSet(k, v) {
  try { localStorage.setItem('signalfront.' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ }
}
function storeDel(k) {
  try { localStorage.removeItem('signalfront.' + k); } catch (e) { /* storage unavailable */ }
}

const MAP_CHARS = { '.': 'plain', '%': 'forest', '^': 'mount', '=': 'road', '#': 'bridge', '-': 'river',
  '~': 'sea', ':': 'shoal', '*': 'reef', c: 'city', k: 'base', a: 'airport', p: 'port', t: 'tower', h: 'hq' };

function buildMap(def) {
  const H = def.half.length, hw = def.half[0].length, W = hw * 2;
  const tiles = new Array(W * H);
  for (let y = 0; y < H; y++) {
    if (def.half[y].length !== hw) console.warn('map row width', def.id, y);
    for (let x = 0; x < hw; x++) {
      const ch = def.half[y][x];
      const k = MAP_CHARS[ch.toLowerCase()] || 'plain';
      const owned = ch !== ch.toLowerCase();
      tiles[y * W + x] = { k, o: owned ? 0 : -1, cp: 20 };
      tiles[(H - 1 - y) * W + (W - 1 - x)] = { k, o: owned ? 1 : -1, cp: 20 };
    }
  }
  return { id: def.id, name: def.name, w: W, h: H, tiles };
}

function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mixHex(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')';
}

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// Rasterise a char grid with a team ramp into a canvas (with automatic 1px outline).
function rasterize(grid, ramp, frame, opts = {}) {
  const H = grid.length, W = 16;
  const c = mkCanvas(W, H), x = c.getContext('2d');
  const img = x.createImageData(W, H);
  const solid = new Uint8Array(W * H);
  for (let j = 0; j < H; j++) {
    const row = grid[j];
    for (let i = 0; i < W; i++) {
      let ch = row[i] || '.';
      if (ch === '.') continue;
      if ((ch === 'R' || ch === 'P') && frame === 1) continue;
      if ((ch === 'Q' || ch === 'p') && frame === 0) continue;
      if (frame === 1 && ch === 'e') ch = 'E'; else if (frame === 1 && ch === 'E') ch = 'e';
      let col = 'abcd'.includes(ch) ? ramp['abcd'.indexOf(ch)] : PAL[ch];
      if (!col) continue;
      if (opts.grey) { const [r, g, b] = hexToRgb(col); const l = (r * 0.3 + g * 0.55 + b * 0.15) * 0.62; col = '#' + [l, l, l].map((v) => Math.round(v).toString(16).padStart(2, '0')).join(''); }
      const [r, g, b] = hexToRgb(col);
      const o = (j * W + i) * 4;
      img.data[o] = r; img.data[o + 1] = g; img.data[o + 2] = b; img.data[o + 3] = 255;
      solid[j * W + i] = (ch === 'R' || ch === 'Q') ? 2 : 1;
    }
  }
  if (!opts.noOutline) {
    const [r, g, b] = hexToRgb(OUTLINE);
    for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
      if (solid[j * W + i]) continue;
      let near = false;
      for (const [dx, dy] of DIRS) { const a = i + dx, bb = j + dy; if (a >= 0 && a < W && bb >= 0 && bb < H && solid[bb * W + a] === 1) near = true; }
      if (near) { const o = (j * W + i) * 4; img.data[o] = r; img.data[o + 1] = g; img.data[o + 2] = b; img.data[o + 3] = 255; }
    }
  }
  x.putImageData(img, 0, 0);
  return c;
}

function flipCanvas(src) {
  const c = mkCanvas(src.width, src.height), x = c.getContext('2d');
  x.translate(src.width, 0); x.scale(-1, 1); x.drawImage(src, 0, 0);
  return c;
}

const SPR = { unit: {}, prop: {}, tile: {}, portrait: {} };
// unit sprite: SPR.unit[type][side][frame] ; greyed variant at [frame + 2]
function unitSprite(t, side, frame, grey) {
  const key = t + side;
  if (!SPR.unit[key]) {
    const ramp = FACTIONS[side].ramp, arr = [];
    for (let f = 0; f < 2; f++) arr[f] = rasterize(UNIT_ART[t], ramp, f);
    for (let f = 0; f < 2; f++) arr[f + 2] = rasterize(UNIT_ART[t], ramp, f, { grey: true });
    if (side === 1) for (let i = 0; i < 4; i++) arr[i] = flipCanvas(arr[i]);
    SPR.unit[key] = arr;
  }
  return SPR.unit[key][frame + (grey ? 2 : 0)];
}
function propSprite(k, owner) {
  const key = k + owner;
  if (!SPR.prop[key]) SPR.prop[key] = rasterize(PROP_ART[k], owner < 0 ? NEUTRAL_RAMP : FACTIONS[owner].ramp, 0);
  return SPR.prop[key];
}

// ---------------- terrain tiles (procedural pixel art) ----------------
const TC = {
  grass: '#7cc858', grass2: '#68b048', grass3: '#94d86c', dirt: '#c8b078',
  tree: '#2f7a3a', tree2: '#235e2c', tree3: '#4a9a48', trunk: '#5a3e22',
  rock: '#a89070', rock2: '#7c6650', rock3: '#d6c4a2', snow: '#f2f2ec',
  road: '#b9b2a2', road2: '#9a9384', roadEdge: '#827b6c',
  water: '#3a7ce0', water2: '#5a9cf0', water3: '#2a5cb8', foam: '#d8ecff',
  sand: '#ecd898', sand2: '#d4bc78', river: '#4a90e8', bridge: '#a87c4c', bridge2: '#7a5630',
};

function tileCanvas() { const c = mkCanvas(T, T); return [c, c.getContext('2d')]; }
function px(x, X, Y, col, w = 1, h = 1) { x.fillStyle = col; x.fillRect(X, Y, w, h); }

function drawGrass(x, gx, gy) {
  px(x, 0, 0, TC.grass, T, T);
  for (let i = 0; i < 7; i++) {
    const a = hash2(gx, gy, i * 3), b = hash2(gx, gy, i * 3 + 1), c = hash2(gx, gy, i * 3 + 2);
    const X = Math.floor(a * 15), Y = Math.floor(b * 15);
    if (c < 0.5) { px(x, X, Y, TC.grass2); px(x, X + 1, Y - 1, TC.grass2); }
    else if (c < 0.8) px(x, X, Y, TC.grass3);
    else px(x, X, Y, TC.grass2, 2, 1);
  }
}

function drawWater(x, gx, gy, frame) {
  px(x, 0, 0, TC.water, T, T);
  for (let i = 0; i < 4; i++) {
    const a = hash2(gx, gy, 40 + i), b = hash2(gx, gy, 50 + i);
    const X = (Math.floor(a * 14) + frame * 2 + i) % 14, Y = Math.floor(b * 14);
    px(x, X, Y, TC.water2, 3, 1);
    px(x, X + 1, Y + 1, TC.water3, 2, 1);
  }
}

function drawShore(x, mask, frame) {
  // mask bits: 1 E, 2 W, 4 S, 8 N are land neighbours
  const f = frame % 2;
  if (mask & 8) { px(x, 0, 0, TC.sand, T, 2); px(x, 0, 2, TC.foam, T, 1); if (f) px(x, 3, 3, TC.foam, 4, 1); }
  if (mask & 4) { px(x, 0, 14, TC.sand, T, 2); px(x, 0, 13, TC.foam, T, 1); if (f) px(x, 9, 12, TC.foam, 4, 1); }
  if (mask & 2) { px(x, 0, 0, TC.sand, 2, T); px(x, 2, 0, TC.foam, 1, T); if (f) px(x, 3, 9, TC.foam, 1, 3); }
  if (mask & 1) { px(x, 14, 0, TC.sand, 2, T); px(x, 13, 0, TC.foam, 1, T); if (f) px(x, 12, 4, TC.foam, 1, 3); }
}

function drawTree(x, X, Y) {
  px(x, X + 2, Y + 6, TC.trunk, 1, 2);
  px(x, X + 1, Y + 1, TC.tree2, 4, 5);
  px(x, X, Y + 2, TC.tree2, 6, 3);
  px(x, X + 1, Y + 1, TC.tree, 3, 4);
  px(x, X + 2, Y, TC.tree, 2, 1);
  px(x, X + 1, Y + 2, TC.tree3, 2, 1);
  px(x, X + 2, Y + 1, TC.tree3, 1, 1);
}

function drawRoad(x, mask, kind) {
  // mask bits 1 E 2 W 4 S 8 N connect
  const c = kind === 'bridge' ? TC.bridge : TC.road, e = kind === 'bridge' ? TC.bridge2 : TC.roadEdge;
  const horiz = (mask & 3) || !(mask & 12);
  const vert = mask & 12;
  px(x, 4, 4, c, 8, 8);
  if ((mask & 1) || (horiz && !vert)) px(x, 8, 4, c, 8, 8);
  if ((mask & 2) || (horiz && !vert)) px(x, 0, 4, c, 8, 8);
  if (mask & 4) px(x, 4, 8, c, 8, 8);
  if (mask & 8) px(x, 4, 0, c, 8, 8);
  if (kind === 'bridge') {
    for (let i = 0; i < T; i += 3) {
      if (vert && !(mask & 3)) px(x, 4, i, e, 8, 1); else px(x, i, 4, e, 1, 8);
    }
    if (vert && !(mask & 3)) { px(x, 3, 0, e, 1, T); px(x, 12, 0, e, 1, T); }
    else { px(x, 0, 3, e, T, 1); px(x, 0, 12, e, T, 1); }
  } else {
    if (!(mask & 8)) px(x, 4, 4, e, 8, 1);
    if (!(mask & 4)) px(x, 4, 11, e, 8, 1);
    if (!(mask & 2) && !(horiz && !vert)) px(x, 4, 4, e, 1, 8);
    if (!(mask & 1) && !(horiz && !vert)) px(x, 11, 4, e, 1, 8);
    if ((mask & 1) || (horiz && !vert)) { px(x, 11, 4, e, 5, 1); px(x, 11, 11, e, 5, 1); }
    if ((mask & 2) || (horiz && !vert)) { px(x, 0, 4, e, 5, 1); px(x, 0, 11, e, 5, 1); }
    if (mask & 4) { px(x, 4, 11, e, 1, 5); px(x, 11, 11, e, 1, 5); }
    if (mask & 8) { px(x, 4, 0, e, 1, 5); px(x, 11, 0, e, 1, 5); }
    px(x, 7, 7, TC.road2, 2, 2);
  }
}

function drawRiver(x, mask, frame) {
  const c = TC.river;
  const horiz = (mask & 3) || !(mask & 12);
  const vert = mask & 12;
  px(x, 4, 4, c, 8, 8);
  if ((mask & 1) || (horiz && !vert)) px(x, 8, 4, c, 8, 8);
  if ((mask & 2) || (horiz && !vert)) px(x, 0, 4, c, 8, 8);
  if (mask & 4) px(x, 4, 8, c, 8, 8);
  if (mask & 8) px(x, 4, 0, c, 8, 8);
  const f = frame % 2;
  if (vert) { px(x, 6, (f * 6 + 2) % 16, TC.water2, 1, 3); px(x, 9, (f * 6 + 9) % 16, TC.water2, 1, 3); }
  else { px(x, (f * 6 + 2) % 16, 6, TC.water2, 3, 1); px(x, (f * 6 + 9) % 16, 9, TC.water2, 3, 1); }
}

// Tile cache: key -> canvas. Tall layers (mountain/forest/property) are separate sprites.
function terrainTile(k, gx, gy, mask, frame) {
  const key = k + ':' + mask + ':' + frame + ':' + ((k === 'plain' || k === 'forest' || k === 'sea') ? (gx * 7 + gy * 13) % 5 : 0);
  let c = SPR.tile[key];
  if (c) return c;
  const [cv, x] = tileCanvas();
  const vx = (gx * 7 + gy * 13) % 5, vy = 3;
  switch (k) {
    case 'sea': case 'reef':
      drawWater(x, vx, vy, frame); drawShore(x, mask, frame);
      if (k === 'reef') { px(x, 3, 5, TC.rock2, 3, 2); px(x, 4, 4, TC.rock, 2, 1); px(x, 9, 9, TC.rock2, 4, 2); px(x, 10, 8, TC.rock, 2, 1); px(x, 6, 12, TC.rock2, 2, 1); }
      break;
    case 'shoal':
      px(x, 0, 0, TC.sand, T, T);
      for (let i = 0; i < 6; i++) px(x, Math.floor(hash2(vx, i, 9) * 15), Math.floor(hash2(i, vx, 11) * 15), TC.sand2);
      if (mask & 1) { px(x, 13, 0, TC.foam, 1, T); px(x, 14, 0, TC.water, 2, T); }
      if (mask & 2) { px(x, 2, 0, TC.foam, 1, T); px(x, 0, 0, TC.water, 2, T); }
      if (mask & 4) { px(x, 0, 13, TC.foam, T, 1); px(x, 0, 14, TC.water, T, 2); }
      if (mask & 8) { px(x, 0, 2, TC.foam, T, 1); px(x, 0, 0, TC.water, T, 2); }
      break;
    case 'river': drawGrass(x, vx, vy); drawRiver(x, mask, frame); break;
    case 'road': drawGrass(x, vx, vy); drawRoad(x, mask, 'road'); break;
    case 'bridge': drawGrass(x, vx, vy); drawRiver(x, mask >> 4, frame); drawRoad(x, mask & 15, 'bridge'); break;
    default: drawGrass(x, vx, vy);
  }
  SPR.tile[key] = cv;
  return cv;
}

// Tall overlays 16 x 20 (forest, mountain)
function tallTile(k, gx, gy) {
  const v = (gx * 5 + gy * 11) % 4;
  const key = 'tall:' + k + v;
  if (SPR.tile[key]) return SPR.tile[key];
  const c = mkCanvas(T, 20), x = c.getContext('2d');
  if (k === 'forest') {
    const spots = [[1, 7], [8, 6], [4, 11], [10, 11], [0, 12], [6, 2]];
    for (let i = 0; i < spots.length; i++) if (i < 5 || v % 2) drawTree(x, spots[i][0] + (v === 3 ? 1 : 0), spots[i][1] + 2);
  } else if (k === 'mount') {
    // stepped peak
    const peak = v % 2 ? 6 : 8;
    for (let row = 0; row < 16; row++) {
      const half = Math.min(8, Math.floor(row * 0.62) + 1);
      const y = 2 + row;
      px(x, peak - half, y, TC.rock2, half * 2, 1);
      px(x, peak - half + 1, y, TC.rock, Math.max(1, half - 1), 1);
    }
    px(x, peak - 1, 2, TC.snow, 2, 2); px(x, peak - 2, 4, TC.snow, 3, 1); px(x, peak - 1, 5, TC.rock3, 1, 2);
    px(x, peak + 2, 8, TC.rock2, 1, 4); px(x, peak - 4, 11, TC.rock3, 2, 1);
    if (v > 1) { // small second peak
      const p2 = peak + 6;
      for (let row = 0; row < 8; row++) { const h = Math.floor(row * 0.6) + 1; px(x, p2 - h, 10 + row, TC.rock2, h * 2, 1); px(x, p2 - h + 1, 10 + row, TC.rock, Math.max(1, h - 1), 1); }
    }
  }
  SPR.tile[key] = c;
  return c;
}

// ---------------- commander portraits (procedural, 32 x 32) ----------------
function portrait(id, mood = 0) {

  else px(x, 14, 19, '#7a3a30', 4, 1);

    case 'beret': px(x, 9, 4, '#7a1e1e', 15, 4); px(x, 8, 6, '#5a1414', 3, 2); px(x, 21, 5, '#ffd23a', 2, 2); px(x, 9, 8, hair, 2, 4); px(x, 21, 8, hair, 2, 4); break;
  }
  switch (L.acc) {
    case 'headset': px(x, 8, 11, '#30343c', 2, 5); px(x, 8, 16, '#30343c', 1, 3); px(x, 9, 19, '#30343c', 4, 1); px(x, 12, 19, '#6ff3ff', 1, 1); break;

    case 'moustache': px(x, 12, 17, '#bdb7ad', 8, 2); px(x, 11, 18, '#bdb7ad', 1, 1); px(x, 20, 18, '#bdb7ad', 1, 1); break;
    case 'scar': px(x, 18, 10, '#c0705a', 1, 6); px(x, 17, 12, '#c0705a', 1, 1); px(x, 19, 14, '#c0705a', 1, 1); break;

  SPR.portrait[key] = c;
  return c;
}

// Signal Front — WebAudio sound: synthesized effects and a small chiptune sequencer

let AC = null, MASTER = null, SFXG = null, MUSG = null, NOISE = null;
const AUD = { sfx: storeGet('sfx', true), music: storeGet('music', true), song: null, step: 0, next: 0, timer: 0 };

function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  MASTER = AC.createGain(); MASTER.gain.value = 0.5; MASTER.connect(AC.destination);
  SFXG = AC.createGain(); SFXG.gain.value = AUD.sfx ? 1 : 0; SFXG.connect(MASTER);
  MUSG = AC.createGain(); MUSG.gain.value = AUD.music ? 0.32 : 0; MUSG.connect(MASTER);
  const len = AC.sampleRate;
  NOISE = AC.createBuffer(1, len, AC.sampleRate);
  const d = NOISE.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  AUD.timer = setInterval(musicTick, 50);
}
function setSfx(on) { AUD.sfx = on; storeSet('sfx', on); if (SFXG) SFXG.gain.value = on ? 1 : 0; }
function setMusic(on) { AUD.music = on; storeSet('music', on); if (MUSG) MUSG.gain.value = on ? 0.32 : 0; }

function tone(type, f0, f1, dur, vol, t = 0, out = SFXG) {
  if (!AC || TIME.fast) return;
  const t0 = AC.currentTime + t;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
  o.connect(g); g.connect(out); o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol, fFrom, fTo, t = 0, q = 0.8, out = SFXG) {
  if (!AC || TIME.fast) return;
  const t0 = AC.currentTime + t;
  const s = AC.createBufferSource(); s.buffer = NOISE;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = q;
  f.frequency.setValueAtTime(fFrom, t0); f.frequency.exponentialRampToValueAtTime(Math.max(40, fTo), t0 + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
  s.connect(f); f.connect(g); g.connect(out); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.02);
}

const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);

function playSong(name) {
  if (AUD.song === name) return;
  AUD.song = name; AUD.step = 0; AUD.next = AC ? AC.currentTime + 0.1 : 0;
}
function musicTick() {
  if (!AC || !AUD.song || TIME.fast) return;
  const s = SONGS[AUD.song], dt = 60 / s.bpm / 2;
  if (AUD.next < AC.currentTime - 0.5) AUD.next = AC.currentTime + 0.05;
  while (AUD.next < AC.currentTime + 0.2) {
    const i = AUD.step % s.lead.length, t = AUD.next - AC.currentTime;
    const n = s.lead[i];
    if (n > 0) {
      let len = 1; while (s.lead[(i + len) % s.lead.length] === -1 && len < 8) len++;
      note('square', midiHz(n), dt * len * 0.92, 0.09, t);
      note('square', midiHz(n) * 1.004, dt * len * 0.92, 0.035, t);
    }
    const b = s.bass[i % s.bass.length];
    if (b > 0) note('triangle', midiHz(b), dt * 0.9, 0.22, t);
    const d = s.drums[i % s.drums.length];
    if (d === 'k') { tone('sine', 150, 45, 0.12, 0.35, t, MUSG); }
    else if (d === 's') noise(0.1, 0.18, 6000, 1500, t, 0.7, MUSG);
    if (i % 2 === 1) noise(0.025, 0.04, 9000, 6000, t, 0.5, MUSG);
    AUD.next += dt; AUD.step++;
  }
}
function note(type, f, dur, vol, t) {
  const t0 = AC.currentTime + t;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.008);
  g.gain.setValueAtTime(vol * 0.8, t0 + dur * 0.6); g.gain.linearRampToValueAtTime(0, t0 + dur);
  o.connect(g); g.connect(MUSG); o.start(t0); o.stop(t0 + dur + 0.02);
}

// Signal Front — game rules: state, movement, fog of war, combat, capture, production, turns, CO powers

let S = null; // the current game

const coOf = (S, side) => COS[S.sides[side].co];

function unitAt(S, x, y) {

}

    if (!UNITS[e.t].w1 && !UNITS[e.t].w2) continue;
    covers.push({ e, cover: threatCover(S, e) });
  }
  const claims = new Set();
  for (const u of mine) if (u.cap) claims.add(u.y * S.w + u.x);
  // press harder when ahead, hang back when behind
  const mv = mine.reduce((a, u) => a + UNITS[u.t].cost * disp(u.hp) / 10, 0) + S.sides[side].funds * 0.5;
  const ev = enemies.reduce((a, u) => a + UNITS[u.t].cost * disp(u.hp) / 10, 0) + 1;
  const ratio = mv / ev;
  const caution = ratio > 2 ? 0.45 : ratio > 1.3 ? 0.7 : ratio < 0.7 ? 1.2 : 1;
  return { side, enemies, mine, covers, claims, caution, fields: {} };
}

function threatCover(S, e) {
  const W = S.w, cov = new Uint8Array(S.w * S.h);
  const [r0, r1] = attackRange(S, e);
  const mark = (cx, cy, a, b) => {
    for (let dy = -b; dy <= b; dy++) for (let dx = -b; dx <= b; dx++) {
      const d = Math.abs(dx) + Math.abs(dy), x = cx + dx, y = cy + dy;
      if (d >= a && d <= b && inb(S, x, y)) cov[y * W + x] = 1;
    }
  };
  if (isIndirect(e.t)) mark(e.x, e.y, r0, r1);
  else {
    const r = reach(S, e, { blockAll: true, mp: moveRange(S, e) });
    for (let i = 0; i < r.dist.length; i++) if (r.dist[i] >= 0) mark(i % W, (i / W) | 0, 1, UNITS[e.t].kamikaze ? 1 : r1);
  }
  return cov;
}

// Expected damage next turn: the worst single attacker counts fully, the rest partly
// (they rarely all get a clear shot at the same unit).
function threatAt(S, ctx, u, x, y) {
  let tot = 0, mx = 0;
  const i = y * S.w + x;
  for (const c of ctx.covers) {
    if (!c.cover[i] || c.e.hp <= 0) continue;
    const d = calcDmg(S, c.e, c.e.x, c.e.y, u, x, y, 4.5, c.e.hp, u.hp);
    if (d > 0) { tot += d; if (d > mx) mx = d; }
  }
  return Math.min(mx + 0.35 * (tot - mx), u.hp);
}

// Multi-source distance field (movement cost) toward goal tiles for a movement type.
function distField(S, mt, sources) {
  const N = S.w * S.h, W = S.w, d = new Int16Array(N).fill(-1);
  const costs = MOVE[mt];
  const q = [];
  for (const i of sources) { if (d[i] !== 0) { d[i] = 0; q.push(i); } }
  // small integer costs: simple label-correcting queue is plenty for these map sizes
  let h = 0;
  while (h < q.length) {
    const i = q[h++], x = i % W, y = (i / W) | 0;
    const ci = costs[S.tiles[i].k] || 1;
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (!inb(S, nx, ny)) continue;
      const j = ny * W + nx;
      if (!costs[S.tiles[j].k]) continue;
      const nd = d[i] + ci;
      if (d[j] === -1 || nd < d[j]) { d[j] = nd; q.push(j); }
    }
  }
  return d;
}

function bestBase(t, cls) {
  const U = UNITS[t];
  return Math.max(U.w1 ? U.w1.dmg[cls] || 0 : 0, U.w2 ? U.w2.dmg[cls] || 0 : 0);
}
const hasWeapon = (t) => !!(UNITS[t].w1 || UNITS[t].w2);

function goalSources(S, ctx, u) {
  const W = S.w, side = ctx.side, U = UNITS[u.t], src = [];
  const own = (k) => S.tiles.forEach((t, i) => { if (t.o === side && TER[t.k].repair === k) src.push(i); });
  // retreat for repairs or fuel
  if (disp(u.hp) <= 3 && !U.cap) { own(repairKind(u.t)); if (src.length) return { src, w: 350, why: 'repair' }; }
  if (isAir(u.t) && u.fuel <= (U.burn || 1) * 4 + 6) { own('air'); if (src.length) return { src, w: 600, why: 'fuel' }; }
  if (U.w1 && u.ammo === 0 && !U.w2) { own(repairKind(u.t)); if (src.length) return { src, w: 300, why: 'ammo' }; }
  if (U.cap) {
    S.tiles.forEach((t, i) => { if (TER[t.k].prop && t.o !== side && !ctx.claims.has(i)) src.push(i); });
    if (src.length) return { src, w: 260, why: 'capture' };
  }
  if (U.jam) {
    for (const e of ctx.enemies) if (isDrone(e.t)) src.push(e.y * W + e.x);
    if (src.length) return { src, w: 160, why: 'jam' };
  }
  if (!hasWeapon(u.t)) {
    for (const m of ctx.mine) if (m !== u && hasWeapon(m.t) && !isAir(m.t)) src.push(m.y * W + m.x);
    if (src.length) return { src, w: 140, why: 'escort' };
  }
  if (hasWeapon(u.t)) {
    for (const e of ctx.enemies) if (bestBase(u.t, UNITS[e.t].cls) >= 25) src.push(e.y * W + e.x);
    if (src.length) return { src, w: 200, why: 'hunt' };
  }
  S.tiles.forEach((t, i) => { if (t.k === 'hq' && t.o >= 0 && t.o !== side) src.push(i); });
  S.tiles.forEach((t, i) => { if (TER[t.k].prop && t.o >= 0 && t.o !== side) src.push(i); });
  return { src, w: 120, why: 'advance' };
}

function goalField(S, ctx, u) {
  const g = goalSources(S, ctx, u);
  const key = UNITS[u.t].mt + '|' + g.why + '|' + g.src.join(',');
  if (!ctx.fields[key]) ctx.fields[key] = distField(S, UNITS[u.t].mt, g.src);
  return { d: ctx.fields[key], w: g.w, why: g.why };
}

function riskOf(ctx, u) {
  const U = UNITS[u.t];
  let r = U.cap ? 0.4 : isIndirect(u.t) ? 1.1 : !hasWeapon(u.t) ? 1.3 : 0.6;
  return r * ctx.caution;
}

function posScore(S, ctx, u, x, y, goal) {
  const i = y * S.w + x, t = S.tiles[i], U = UNITS[u.t];
  let s = 0;
  const d = goal.d[i];
  s -= (d >= 0 ? d : 60) * goal.w;
  const thr = threatAt(S, ctx, u, x, y);
  s -= thr / 100 * U.cost * riskOf(ctx, u);
  if (!isAir(u.t)) s += TER[t.k].def * 45;
  if (t.o === ctx.side && TER[t.k].build) s -= 2500;
  if (t.o === ctx.side && TER[t.k].prop && TER[t.k].repair === repairKind(u.t) && u.hp < 70) s += (100 - u.hp) * 40;
  if (isIndirect(u.t)) {
    // like to sit where enemies will be in range next turn
    const [r0, r1] = attackRange(S, u);
    for (const e of ctx.enemies) { const dd = mdist(x, y, e.x, e.y); if (dd >= r0 && dd <= r1 && bestBase(u.t, UNITS[e.t].cls)) { s += 600; break; } }
  }
  if (UNITS[u.t].mesh || UNITS[u.t].jam) {
    let near = 0; for (const m of ctx.mine) if (m !== u && mdist(m.x, m.y, x, y) <= 2) near++;
    s += Math.min(near, 4) * 250;
  }

}

function propValue(S, side, t) {
  let v = PROP_VALUE[t.k] || 2000;
  if (t.k === 'hq' && t.o >= 0) v = 60000;
  if (t.o >= 0 && t.o !== side) v *= 1.4; // taking from the enemy is a double swing

}

function evalUnit(S, ctx, u) {
  const U = UNITS[u.t], W = S.w;
  const r = reach(S, u);
  const goal = goalField(S, ctx, u);
  const base = posScore(S, ctx, u, u.x, u.y, goal);
  let best = { score: 0, act: 'wait', x: u.x, y: u.y };
  const consider = (c) => { if (c.score > best.score) best = c; };
  for (let i = 0; i < r.dist.length; i++) {
    if (r.dist[i] < 0) continue;
    const x = i % W, y = (i / W) | 0;
    const kind = stopKind(S, u, x, y);
    if (kind !== 'stay' && kind !== 'move') continue;
    const moved = kind === 'move';
    const pos = posScore(S, ctx, u, x, y, goal);
    const dpos = pos - base;
    consider({ score: dpos, act: 'wait', x, y });
    if (hasWeapon(u.t)) {
      for (const e of targetsFrom(S, u, x, y, moved)) {
        const f = forecast(S, u, x, y, e);
        if (f.hi <= 0) continue;
        const ev = UNITS[e.t].cost;
        let val = Math.min(f.mid, e.hp) / 100 * ev;
        if (f.lo >= e.hp) val += ev * 0.35;
        if (e.cap) val += 3000 + (tileAt(S, e.x, e.y).k === 'hq' ? 30000 : 0);

        consider({ score: val - cost + dpos * 0.25 + 1, act: 'attack', x, y, target: e.id });

    if (U.cap) {
      const t = S.tiles[i];
      if (TER[t.k].prop && t.o !== ctx.side) {
        const prog = Math.min(1, disp(u.hp) / t.cp);
        let sc = propValue(S, ctx.side, t) * (0.35 + 0.65 * prog);
        if (prog >= 1) sc *= 1.5;
        if (u.cap && !moved) sc += 2500;
        consider({ score: sc + dpos * 0.3, act: 'capture', x, y });
      }
    }
    if (U.supply && !moved) {
      let need = 0; for (const m of ctx.mine) if (m !== u && mdist(m.x, m.y, x, y) === 1 && needsSupply(m)) need += 800;
      if (need) consider({ score: need + dpos, act: 'supply', x, y });

  }
  best.id = u.id;
  return best;
}

function aiPowerChoice(S, side, ctx) {
  const sd = S.sides[side];
  if (sd.pw || sd.usedThisTurn) return 0;
  const engaged = ctx.mine.filter((u) => ctx.enemies.some((e) => mdist(u.x, u.y, e.x, e.y) <= moveRange(S, u) + 2)).length;
  if (canPower(S, side, 2) && (engaged >= 2 || ctx.enemies.length >= 4)) return 2;
  if (canPower(S, side, 1) && sd.meter < powerCost(S, side, 2) * 0.7 && engaged >= 3) return 1;
  return 0;
}

function capturerCount(ctx) { return ctx.mine.filter((u) => UNITS[u.t].cap).length; }

function chooseBuild(S, ctx, kind, funds) {
  const side = ctx.side, co = coOf(S, side);
  const roster = buildList(S, side, kind).filter((t) => !UNITS[t].carry && !UNITS[t].supply && unitCost(S, side, t) <= funds);
  if (!roster.length) return null;
  let neutral = 0;
  for (const t of S.tiles) if (TER[t.k].prop && t.o < 0) neutral++;
  const caps = capturerCount(ctx);
  const enemyDrones = ctx.enemies.filter((e) => isDrone(e.t)).length;
  const myCombat = ctx.mine.filter((u) => hasWeapon(u.t) && !UNITS[u.t].cap).length;
  // Weight the enemy mix by value. Before scouting much, assume the opponent fields its usual staples.
  const foes = ctx.enemies.map((e) => ({ t: e.t, v: UNITS[e.t].cost * disp(e.hp) / 10 }));
  if (foes.length < 4) for (const t of EXPECTED[1 - side]) foes.push({ t, v: UNITS[t].cost * 0.6 });
  const tot = foes.reduce((a, f) => a + f.v, 0) || 1;
  const count = {};
  for (const u of ctx.mine) count[u.t] = (count[u.t] || 0) + 1;
  const wantCaps = Math.min(5, 2 + Math.ceil(neutral / 2));
  let best = null, bs = -1e9;
  for (const t of roster) {
    const U = UNITS[t], cost = unitCost(S, side, t);
    let eff = 0, vul = 0;
    for (const f of foes) {
      const w = f.v / tot;
      eff += w * bestBase(t, UNITS[f.t].cls) / 100;
      vul += w * bestBase(f.t, U.cls) / 100;
    }
    // combat quality (what it hits, how hard it is hit), scaled up for pricier units so money gets spent
    let sc = Math.min(eff, 1.1) * (1.25 - Math.min(vul, 1.2) * 0.6) * Math.pow(cost, 0.6);
    sc /= 1 + 0.18 * (count[t] || 0);
    if (U.cap) {
      if (caps < wantCaps) sc = Math.max(sc, 180 + (wantCaps - caps) * 35 - cost / 100);
      else if (myCombat < 3) sc *= 0.5;
    }
    if (U.mesh) sc = myCombat >= 4 && !count[t] ? 120 : -1;
    if (U.jam) sc = enemyDrones >= 2 && !count[t] ? 160 + enemyDrones * 10 : -1;
    if (U.kamikaze) sc *= 0.8;
    if (isNaval(t) && !ctx.enemies.some((e) => isNaval(e.t))) sc *= 0.3;
    if (co.cost && co.cost(t) < 1) sc *= 1.15;
    if (S.diff !== 'hard') sc *= frand(0.88, 1.12);
    if (sc > bs) { bs = sc; best = t; }

}

// Returns the next action, or {kind:'end'}.
function aiNext(S, side) {
  const ctx = aiContext(S, side);
  const lvl = aiPowerChoice(S, side, ctx);
  if (lvl) { S.sides[side].usedThisTurn = true; return { kind: 'power', level: lvl }; }
  let best = null;
  for (const u of ctx.mine) {
    if (u.done) continue;
    const c = evalUnit(S, ctx, u);
    // nudge: units standing on our own factories move first so production isn't blocked
    const t = tileAt(S, u.x, u.y);
    if (t.o === side && TER[t.k].build) c.score += 1;
    if (!best || c.score > best.score) best = c;
  }
  if (best) {
    const u = S.units.find((w) => w.id === best.id);
    const r = reach(S, u);
    return { kind: 'unit', id: u.id, path: pathTo(S, r, best.x, best.y), act: best.act, target: best.target };
  }
  // production
  const free = buildTilesFor(S, side);
  const hq = S.tiles.findIndex((t) => t.k === 'hq' && t.o === 1 - side);
  const hx = hq % S.w, hy = (hq / S.w) | 0;
  const rank = { ground: 0, air: 1, sea: 2 };
  free.sort((a, b) => rank[a.kind] - rank[b.kind] || mdist(a.x, a.y, hx, hy) - mdist(b.x, b.y, hx, hy));
  for (const f of free) {
    const t = chooseBuild(S, ctx, f.kind, S.sides[side].funds);
    if (t) return { kind: 'build', t, x: f.x, y: f.y };
  }
  return { kind: 'end' };
}

// Signal Front — map renderer: camera, terrain layers, units, range overlays, cursor and effects

const R = {
  cv: null, ctx: null, dpr: 1, W: 0, H: 0, zoom: 3, cam: { x: 0, y: 0 }, camTo: null,
  frame: 0, seaFrame: 0, t: 0, shake: 0,
  over: null,      // { tiles: Uint8Array, kind: 'move'|'attack'|'threat' }
  over2: null,     // secondary overlay (attack fringe while moving)
  path: null,      // [{x,y}]
  cursor: null,    // {x,y}
  targets: null,   // [{x,y}]
  hideUnit: null,  // unit id hidden while it animates
  insets: { top: 56, bottom: 52, left: 0, right: 0 },
};
const FX = [];

function renderInit() {
  R.cv = $('#c');
  R.ctx = R.cv.getContext('2d');
  window.addEventListener('resize', resize);
  resize();
}
function resize() {
  R.dpr = Math.min(window.devicePixelRatio || 1, 3);
  R.W = Math.round(innerWidth * R.dpr); R.H = Math.round(innerHeight * R.dpr);
  R.cv.width = R.W; R.cv.height = R.H;
  if (S) fitZoom(false);
}
// Choose a zoom so tiles are comfortably big; integer device pixels per art pixel keeps it crisp.
function fitZoom(reset) {

  // grow to fill the screen when the whole map fits, up to two steps past the comfortable size
  if (S) {
    const fw = viewW() / ((S.w + 0.4) * T), fh = viewH() / ((S.h + 0.35) * T);
    // phones in portrait: fill the height and pan sideways
    const fit = Math.floor(isTouch && viewH() > viewW() ? fh : Math.min(fw, fh));
    if (fit > z) z = Math.min(fit, z + 2);
  }
  if (reset || !R.userZoom) R.zoom = z;
  clampCam();
}
function setZoom(dz, cx, cy) {
  const old = R.zoom;

  if (nz === old) return;

  R.zoom = nz; R.userZoom = true;

}
const viewOX = () => R.insets.left * R.dpr;
const viewOY = () => R.insets.top * R.dpr;
const viewW = () => R.W - (R.insets.left + R.insets.right) * R.dpr;
const viewH = () => R.H - (R.insets.top + R.insets.bottom) * R.dpr;

function clampCam() {

  const pad = 8;
  if (mw <= vw) R.cam.x = (mw - vw) / 2; else R.cam.x = clamp(R.cam.x, -pad, mw - vw + pad);
  if (mh + 4 <= vh) R.cam.y = (mh - vh) / 2 - 2; else R.cam.y = clamp(R.cam.y, -pad - 4, mh - vh + pad);
}
function centerOn(x, y, instant) {
  const vw = viewW() / R.zoom, vh = viewH() / R.zoom;
  const tx = x * T + T / 2 - vw / 2, ty = y * T + T / 2 - vh / 2;
  const save = { x: R.cam.x, y: R.cam.y };
  R.cam.x = tx; R.cam.y = ty; clampCam();
  const dest = { x: R.cam.x, y: R.cam.y };
  if (!instant && !TIME.fast) { R.cam.x = save.x; R.cam.y = save.y; R.camTo = dest; }
  else R.camTo = null;
}
// Pan only if the tile is near or beyond the view edge.
function ensureVisible(x, y, margin = 2) {
  const vw = viewW() / R.zoom, vh = viewH() / R.zoom;
  const px0 = x * T, py0 = y * T, m = margin * T;
  const c = R.camTo || R.cam;
  if (px0 - m < c.x || px0 + T + m > c.x + vw || py0 - m < c.y || py0 + T + m > c.y + vh) centerOn(x, y);
}
function screenToTile(sx, sy) {
  const ax = (sx * R.dpr - viewOX() - Math.round(-R.cam.x * R.zoom)) / R.zoom;
  const ay = (sy * R.dpr - viewOY() - Math.round(-R.cam.y * R.zoom)) / R.zoom;

}
function tileToScreen(x, y) {
  return {
    x: (viewOX() + Math.round(-R.cam.x * R.zoom) + x * T * R.zoom) / R.dpr,
    y: (viewOY() + Math.round(-R.cam.y * R.zoom) + y * T * R.zoom) / R.dpr,
    s: T * R.zoom / R.dpr,
  };
}

function maskOf(S, x, y, test) {
  let m = 0;
  const t = (dx, dy) => { const nx = x + dx, ny = y + dy; return inb(S, nx, ny) ? test(tileAt(S, nx, ny).k) : null; };
  if (t(1, 0)) m |= 1; if (t(-1, 0)) m |= 2; if (t(0, 1)) m |= 4; if (t(0, -1)) m |= 8;

}
const isLandK = (k) => k !== 'sea' && k !== 'reef' && k !== 'shoal';
const roadish = (k) => k === 'road' || k === 'bridge' || k === 'hq' || k === 'base';

function tileImage(S, x, y) {
  const k = tileAt(S, x, y).k;
  let mask = 0;
  if (k === 'sea' || k === 'reef') mask = maskOf(S, x, y, (n) => isLandK(n) && n !== 'port');
  else if (k === 'shoal') mask = maskOf(S, x, y, (n) => n === 'sea' || n === 'reef');

  else if (k === 'bridge') mask = maskOf(S, x, y, roadish) | (maskOf(S, x, y, riverish) << 4);
