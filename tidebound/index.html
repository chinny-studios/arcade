// ---- 20_monsprites.js
// Tidebound: monster sprites. Renders MON_ART (18_monart1.js, 19_monart2.js) into cached canvases on first use.
// Missing art gets a placeholder silhouette with a '?'. Nothing here throws: a bad entry just draws the placeholder.

const Sprites = (() => {
  const cache = {};
  const hasKey = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const artOf = (sp) => (typeof MON_ART !== 'undefined' && MON_ART && hasKey(MON_ART, sp) ? MON_ART[sp] : null);
  const colorOf = (sp) => {
    try {
      if (typeof SPECIES !== 'undefined' && SPECIES && SPECIES[sp] && SPECIES[sp].color) return SPECIES[sp].color;
    } catch (_) {}
    return '#8890a0';
  };
  // rows for front/back, falling back to front when a back view is missing
  const rowsOf = (a, back) => {
    if (!a) return null;
    const r = back && Array.isArray(a.back) ? a.back : a.front;
    return Array.isArray(r) && r.length ? r : null;
  };

  // 32x32 native canvas of the art, one fillRect per pixel. black = silhouette mode.
  function nativeCanvas(sp, back, black) {
    const key = 'n' + (black ? 'k' : 'c') + (back ? 'b' : 'f') + sp;
    if (cache[key]) return cache[key];
    const a = artOf(sp);
    const rows = rowsOf(a, back);
    if (!rows) return null;
    const pal = a.pal || {};
    const c = makeCanvas(32, 32, (cv, g) => {
      rows.forEach((row, y) => {
        if (typeof row !== 'string') return;
        for (let x = 0; x < row.length && x < 32; x++) {
          const ch = row[x];
          if (ch === '.' || !hasKey(pal, ch) && !black) continue;
          g.fillStyle = black ? '#000' : pal[ch];
          g.fillRect(x, y, 1, 1);
        }
      });
    });
    cache[key] = c;
    return c;
  }

  // Placeholder silhouette: an egg-ish blob in the species colour with a '?' (or plain black silhouette).
  function placeholder(sp, size, black) {
    return makeCanvas(size, size, (cv, g) => {
      const k = size / 64;
      g.fillStyle = black ? '#000' : colorOf(sp);
      g.beginPath();
      g.ellipse(size / 2, size * 0.55, size * 0.4, size * 0.36, 0, 0, Math.PI * 2);
      g.fill();
      if (black) return;
      g.strokeStyle = '#202028';
      g.lineWidth = Math.max(1, Math.round(2 * k));
      g.stroke();
      g.fillStyle = '#ffffff';
      g.font = 'bold ' + Math.round(30 * k) + 'px monospace';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText('?', size / 2, size * 0.56);
    });
  }

  // Scale a 32x32 native canvas to 64x64 (nearest neighbour, smoothing off in makeCanvas).
  function scale64(src) {
    return makeCanvas(64, 64, (c, g) => { g.drawImage(src, 0, 0, 64, 64); });
  }

  // Block-majority downsample of the front art to 22x22 for the 24x24 icon.
  function iconCanvas(sp, frame) {
    const a = artOf(sp);
    const rows = rowsOf(a, false);
    const yOff = frame ? 1 : 2;   // frame 1 sits 1px higher: the bob
    if (!rows) return placeholder(sp, 24, false);
    const pal = a.pal || {};
    const S = 22;
    return makeCanvas(24, 24, (c, g) => {
      for (let j = 0; j < S; j++) {
        const sy0 = Math.floor(j * 32 / S), sy1 = Math.max(sy0 + 1, Math.floor((j + 1) * 32 / S));
        for (let i = 0; i < S; i++) {
          const sx0 = Math.floor(i * 32 / S), sx1 = Math.max(sx0 + 1, Math.floor((i + 1) * 32 / S));
          const counts = {};
          let n = 0, total = 0;
          for (let y = sy0; y < sy1; y++) for (let x = sx0; x < sx1; x++) {
            total++;
            const row = rows[y];
            const ch = typeof row === 'string' ? row[x] : '.';
            if (!ch || ch === '.' || !hasKey(pal, ch)) continue;
            n++;
            counts[ch] = (counts[ch] || 0) + 1;
          }
          if (!n || n < Math.ceil(total / 3)) continue;
          let best = null, bn = -1;
          for (const k in counts) if (counts[k] > bn) { bn = counts[k]; best = k; }
          g.fillStyle = pal[best];
          g.fillRect(i + 1, j + yOff, 1, 1);
        }
      }
    });
  }

  return {
    // 64x64 front (facing left) or back (facing up-right) sprite, with the art scaled x2.
    mon(sp, back = false) {
      const key = 'm' + (back ? 'b' : 'f') + sp;
      if (cache[key]) return cache[key];
      const src = nativeCanvas(sp, !!back, false);
      cache[key] = src ? scale64(src) : placeholder(sp, 64, false);
      return cache[key];
    },

    // 24x24 party/PC/dex icon. frame 0 and 1 bob by one pixel.
    monIcon(sp, frame = 0) {
      const f = frame ? 1 : 0;
      const key = 'i' + f + sp;
      if (cache[key]) return cache[key];
      cache[key] = iconCanvas(sp, f);
      return cache[key];
    },

    // 64x64 all-black version (seen-but-not-caught dex entries, evolution flash).
    silhouette(sp) {
      const key = 's' + sp;
      if (cache[key]) return cache[key];
      const src = nativeCanvas(sp, false, true);
      cache[key] = src ? scale64(src) : placeholder(sp, 64, true);
      return cache[key];
    },

    // List of problems in every MON_ART entry (empty when everything is well formed).
    validate() {
      const probs = [];
      const all = typeof MON_ART !== 'undefined' && MON_ART ? MON_ART : {};
      for (const sp of Object.keys(all)) {
        const a = all[sp];
        if (!a || typeof a !== 'object') { probs.push(sp + ': entry is not an object'); continue; }
        const pal = a.pal || {};
        for (const v of ['front', 'back']) {
          const rows = a[v];
          if (!Array.isArray(rows)) { probs.push(sp + ' ' + v + ': missing rows'); continue; }
          if (rows.length !== 32) probs.push(sp + ' ' + v + ': ' + rows.length + ' rows, want 32');
          rows.forEach((r, y) => {
            if (typeof r !== 'string') { probs.push(sp + ' ' + v + ' row ' + y + ': not a string'); return; }
            if (r.length !== 32) probs.push(sp + ' ' + v + ' row ' + y + ': ' + r.length + ' chars, want 32');
            const bad = new Set();
            for (const ch of r) if (ch !== '.' && !hasKey(pal, ch)) bad.add(ch);
            if (bad.size) probs.push(sp + ' ' + v + ' row ' + y + ': unknown palette key ' + [...bad].map((c) => "'" + c + "'").join(' '));
          });
        }
      }
      return probs;
    },
  };
})();

DBG.sprites = Sprites;

// ---- 21_tiles.js
// Tidebound: tiles. Every map tile (outdoor, buildings, cave, interior) is painted in code. A tile is rendered once per
// animation frame to an offscreen canvas on first use, and draw() blits it. Tiles.get(name) never throws: an unknown
// name gives a magenta/black checker that is not solid. Only the helpers inside the IIFE are private.

const Tiles = (() => {
  // ---------- palette ----------
  const K = {
    ol: '#1e3a24',                           // dark outline
    gr: '#5cb84c', gr1: '#4ea842', gr3: '#7ccc62', gs: '#3e9238', gd: '#2a6a2c',
    tg: '#2f8a2c', tg1: '#226e22', tgl: '#4aa43e', tgk: '#18401c', tgL: '#9ae486', tgM: '#5cc850',
    w1: '#2a68c8', w2: '#4a8ee6', w3: '#1a4ca0', w4: '#8ccaf8', wsp: '#f6fcff',
    sd: '#f6dc98', sd2: '#e6c47c', sdL: '#fff2c8', sdW: '#d2a862', foam: '#f6fcff', foam2: '#9ad6f6',
    wood: '#a8703c', woodL: '#c8904e', woodD: '#6a4220', woodH: '#e4ae70',
    cream: '#f4e6c4', creamD: '#d8c49a', red: '#d8443a', redD: '#8a2418', blue: '#3c6cd0', glass: '#8ad8f8',
  };

  // ---------- helpers ----------
  function hash(x, y, s) {
    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function px(g, x, y, c) { g.fillStyle = c; g.fillRect(x, y, 1, 1); }
  function rect(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
  // Shaded round blob in tile pixels (centre and radii in tile units). cols = { o, hi, mid, lo, sh }, light top-left.
  function ball(g, cx, cy, rx, ry, cols, speck) {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
      const d = dx * dx + dy * dy;
      if (d > 1) continue;
      if (d > 0.7) { px(g, x, y, cols.o); continue; }
      const s = (dx + dy) * 0.5;
      let c = s < -0.4 ? cols.hi : s < 0.05 ? cols.mid : s < 0.45 ? cols.lo : cols.sh;
      if (speck && c !== cols.hi && hash(x, y, 9) < speck[1]) c = speck[0];
      px(g, x, y, c);
    }
  }
  function shadow(g, cx, cy, rx, ry) {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
      if (dx * dx + dy * dy <= 1) px(g, x, y, K.gs);
    }
  }
  // Pixel arrow for the stairs tiles.
  function arrow(g, up) {
    const W = '#fff8e0';
    if (up) {
      px(g, 8, 4, W); rect(g, 7, 5, 3, 1, W); rect(g, 6, 6, 5, 1, W); rect(g, 7, 7, 2, 5, W);
    } else {
      rect(g, 7, 4, 2, 5, W); rect(g, 6, 9, 5, 1, W); rect(g, 7, 10, 3, 1, W); px(g, 8, 11, W);
    }
  }
  // 3x5 pixel letters for the MART plate.
  const FONT3 = {
    M: ['#.#', '###', '#.#', '#.#', '#.#'],
    A: ['.#.', '#.#', '###', '#.#', '#.#'],
    R: ['##.', '#.#', '##.', '#.#', '#.#'],
    T: ['###', '.#.', '.#.', '.#.', '.#.'],
  };

  // ---------- grass, sand, path ----------
  function grassBase(g) {
    rect(g, 0, 0, 16, 16, K.gr);
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const h = hash(x, y, 1);
      if (h < 0.09) px(g, x, y, K.gr1);
      else if (h > 0.96) px(g, x, y, K.gr3);
    }
  }
  const FLOWERS = [[3, 4, '#f07aa0'], [11, 3, '#ffffff'], [6, 9, '#ffd84a'], [13, 8, '#f07aa0'], [1, 11, '#ffffff'], [9, 12, '#ffd84a']];
  function flowerHead(g, x, y, petal, dx) {
    px(g, x, y + 2, K.gd); px(g, x, y + 3, K.gd); px(g, x - 1, y + 3, K.gs);
    const hx = x + dx;
    px(g, hx, y - 1, petal); px(g, hx - 1, y, petal); px(g, hx + 1, y, petal); px(g, hx, y + 1, petal);
    px(g, hx, y, '#fff3a0');
  }
  function flowersPaint(g, f) {
    grassBase(g);
    FLOWERS.forEach(([x, y, c], i) => {
      const sway = i % 2 === 0 ? (f ? 1 : 0) : (f ? -1 : 0);   // neighbours sway in opposite directions
      flowerHead(g, x, y, c, sway);
    });
  }
  // Tall grass: darker base with blade tufts. The tufts with y >= 6 are also drawn again as the front layer.
  const TUFT = ['..k..', '.kLk.', 'kLMLk', '.kkk.'];
  const TUFT_PAL = { k: K.tgk, L: K.tgL, M: K.tgM };
  const TUFTS = [];
  for (let j = 0; j < 4; j++) for (let i = 0; i < 3; i++) TUFTS.push([(j & 1 ? 2 : 0) + i * 5 + (j === 3 ? 1 : 0), j * 4]);
  function tuft(g, x0, y0) {
    for (let j = 0; j < 4; j++) for (let i = 0; i < 5; i++) {
      const c = TUFT_PAL[TUFT[j][i]];
      if (c) px(g, x0 + i, y0 + j, c);
    }
  }
  function tallBase(g) {
    rect(g, 0, 0, 16, 16, K.tg);
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const h = hash(x, y, 2);
      if (h < 0.12) px(g, x, y, K.tg1);
      else if (h > 0.93) px(g, x, y, K.tgl);
    }
    for (const [x, y] of TUFTS) tuft(g, x, y);
  }
  function sandBase(g) {
    rect(g, 0, 0, 16, 16, K.sd);
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const h = hash(x, y, 3);
      if (h < 0.1) px(g, x, y, K.sd2);
      else if (h > 0.95) px(g, x, y, K.sdL);
    }
  }
  function pathBase(g) {
    rect(g, 0, 0, 16, 16, '#d8b070');
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const h = hash(x, y, 4);
      if (h < 0.07) px(g, x, y, '#b68a50');
      else if (h > 0.93) px(g, x, y, '#ecc88c');
    }
    // packed-earth edges, a little worn in the middle
    for (let i = 0; i < 16; i++) { px(g, i, 0, '#c09458'); px(g, 0, i, '#c09458'); }
    for (const [x, y] of [[3, 4], [10, 3], [7, 9], [12, 11], [4, 13]]) { px(g, x, y, '#a87c44'); px(g, x + 1, y, '#a87c44'); }
  }

  // ---------- water and shores ----------
  const SPARK = [[[3, 4], [11, 10]], [[8, 2], [13, 6]], [[1, 11], [9, 13]], [[5, 7], [14, 14]]];
  function waterBase(g, f) {
    rect(g, 0, 0, 16, 16, K.w1);
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const xs = (x + f * 3 + ((y >> 2) & 1) * 4) & 7;
      if ((y & 3) === 1 && xs < 3) px(g, x, y, K.w2);
      else if ((y & 3) === 3 && xs >= 5) px(g, x, y, K.w3);
    }
    for (const [sx, sy] of SPARK[f & 3]) {
      px(g, sx, sy, K.wsp);
      px(g, sx - 1, sy, K.w4); px(g, sx + 1, sy, K.w4);
    }
  }
  // Sand band depth (pixels) with a little wobble along the coast, so the edge is not ruler-straight.
  const WOB = [0.5, -0.4, 0.2, 0.8, -0.2, 0.3, -0.6, 0.1, 0.6, -0.3, 0.2, -0.5, 0.4, 0.9, -0.1, 0.0];
  const SHORE_D = 5, SHORE_R = 2.5;
  function shorePaint(g, f, sides) {
    waterBase(g, f);
    const dist = (s, x, y) => {
      const d = s === 'n' ? y + 0.5 : s === 's' ? 15.5 - y : s === 'w' ? x + 0.5 : 15.5 - x;
      const w = (s === 'n' || s === 's') ? WOB[x] : WOB[y];
      return d - (SHORE_D + w);   // < 0 is sand, >= 0 is water
    };
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      let sand, edge;
      if (sides.length === 1) {
        edge = dist(sides[0], x, y);
        sand = edge < 0;
      } else {
        const a = dist(sides[0], x, y), b = dist(sides[1], x, y);
        sand = a < 0 || b < 0;
        edge = Math.min(a, b);
        // round off the water where two sand bands meet (a fillet, so the corner is not a sharp notch)
        if (!sand && a < 2 * SHORE_R && b < 2 * SHORE_R && Math.hypot(a - SHORE_R, b - SHORE_R) > SHORE_R) sand = true;
      }
      if (sand) {
        if (edge > -1.3) px(g, x, y, K.sdW);
        else {
          const h = hash(x, y, 5);
          px(g, x, y, h < 0.1 ? K.sd2 : h > 0.95 ? K.sdL : K.sd);
        }
      } else if (edge < 1.4) {
        px(g, x, y, ((x + y + f) & 1) ? K.foam2 : K.foam);
      }
    }
  }

  // ---------- ledges ----------
  function ledgeS(g) {
    grassBase(g);
    rect(g, 0, 9, 16, 1, '#a6e28a');
    rect(g, 0, 10, 16, 1, K.gd);
    rect(g, 0, 11, 16, 3, '#b08050');
    rect(g, 0, 11, 16, 1, '#c89c66');
    for (let y = 12; y < 14; y++) for (let x = 0; x < 16; x++) if (hash(x, y, 3) < 0.3) px(g, x, y, '#845e36');
    rect(g, 0, 14, 16, 1, '#5a3c22');
    rect(g, 0, 15, 16, 1, '#2e5e2a');
  }
  // The same ledge turned so the cliff faces west or east.
  function ledgeTurn(g, dir) {
    const src = makeCanvas(16, 16, (c, s) => ledgeS(s));
    g.save();
    if (dir === 'w') g.setTransform(0, 1, -1, 0, 16, 0);
    else g.setTransform(0, -1, 1, 0, 0, 16);
    g.drawImage(src, 0, 0);
    g.restore();
  }

  // ---------- trees, rocks, plants, objects ----------
  const TREE_C = { o: '#18361e', hi: '#8ce274', mid: '#40a83a', lo: '#2c7c30', sh: '#1d5a24' };
  const BUSH_C = { o: '#18361e', hi: '#9ae680', mid: '#4cae44', lo: '#2e8034', sh: '#1f5a26' };
  const ROCK_C = { o: '#34343e', hi: '#eeeef6', mid: '#b8b8c4', lo: '#8a8a96', sh: '#5c5c68' };
  const SMASH_C = { o: '#40321f', hi: '#f2d8b0', mid: '#c09a6c', lo: '#94704a', sh: '#5e4428' };
  const CHOP_C = { o: '#18361e', hi: '#c4f4a0', mid: '#58c04c', lo: '#34903a', sh: '#246a2a' };
  const CRACK = [[9, 5], [8, 6], [8, 7], [7, 8], [6, 8], [6, 9], [5, 10], [4, 10]];
  function treeTrunk(g, y0, h) {
    rect(g, 6, y0, 4, h, '#7c4e2a');
    rect(g, 6, y0, 1, h, '#a8703c');
    rect(g, 9, y0, 1, h, '#4a2c14');
  }
  function fence(g) {
    grassBase(g);
    for (const x0 of [1, 6, 11]) {
      rect(g, x0, 4, 3, 11, '#f8f4ea');
      rect(g, x0, 4, 1, 11, '#9a8a70');
      rect(g, x0 + 2, 4, 1, 11, '#9a8a70');
      px(g, x0 + 1, 3, '#f8f4ea'); px(g, x0 + 1, 2, '#9a8a70');
    }
    rect(g, 0, 6, 16, 2, '#c89660'); rect(g, 0, 6, 16, 1, '#e8c08a');
    rect(g, 0, 11, 16, 2, '#c89660'); rect(g, 0, 12, 16, 1, '#8a5a30');
  }
  function sign(g) {
    grassBase(g);
    rect(g, 7, 9, 2, 7, '#8a5a30');
    rect(g, 2, 2, 12, 8, '#2c1a0c');
    rect(g, 3, 3, 10, 6, '#d8a062');
    rect(g, 3, 3, 10, 1, '#f0c088');
    rect(g, 4, 5, 8, 1, '#6a3e18');
    rect(g, 4, 7, 6, 1, '#6a3e18');
  }
  function mailbox(g) {
    grassBase(g);
    shadow(g, 8, 14.5, 4, 1.2);
    rect(g, 7, 9, 2, 6, '#8a5a30');
    rect(g, 4, 4, 8, 6, '#2c1a0c');
    rect(g, 5, 5, 6, 4, '#e8483a');
    rect(g, 5, 5, 6, 1, '#f8806c');
    rect(g, 5, 7, 6, 1, '#ffffff');
    rect(g, 12, 2, 1, 4, '#2c1a0c');
    rect(g, 13, 2, 2, 2, '#f0c040');
  }
  function lamp(g) {
    grassBase(g);
    shadow(g, 8, 14.5, 4, 1.2);
    rect(g, 7, 5, 2, 10, '#50505a');
    rect(g, 5, 14, 6, 2, '#383840');
    rect(g, 5, 0, 6, 1, '#383840');
    rect(g, 5, 1, 6, 3, '#383840');
    rect(g, 6, 1, 4, 3, '#fff6b0');
    px(g, 7, 2, '#ffffff'); px(g, 8, 2, '#ffffff');
  }
  function dockPaint(g) {
    for (let y = 0; y < 16; y++) {
      const seam = (y >> 2) & 1 ? 11 : 4;
      for (let x = 0; x < 16; x++) {
        const r = y & 3;
        let c;
        if (r === 0) c = '#7a4f2c';
        else if (r === 1) c = '#d6a66c';
        else if (r === 3) c = '#9a6a3a';
        else c = x === seam ? '#7a4f2c' : hash(x, y, 6) < 0.05 ? '#a87444' : '#b98452';
        px(g, x, y, c);
      }
    }
  }
  function roofPaint(g, c, edgeL, edgeR) {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const r = y & 3, off = ((y >> 2) & 1) ? 2 : 0;
      let col;
      if (y === 0 || y === 15) col = c.ol;
      else if (r === 0) col = c.hi;
      else if (r === 3) col = c.sh;
      else col = ((x + off) & 3) === 0 ? c.sh : c.base;
      if (edgeL && x === 0) col = c.ol;
      if (edgeR && x === 15) col = c.ol;
      px(g, x, y, col);
    }
  }
  const BLUE_R = { base: '#3c6cd0', hi: '#78a4f0', sh: '#24489a', ol: '#14265c' };
  const RED_R = { base: '#d8443a', hi: '#f88a72', sh: '#982c1c', ol: '#4a1410' };
  const TEAL_R = { base: '#2aa0a0', hi: '#64d4cc', sh: '#17706c', ol: '#0c4444' };
  const WHITE_R = { base: '#eef3f8', hi: '#ffffff', sh: '#c2ceda', ol: '#6c7c8c' };
  function plate(g, cx, cy, r, ol) {
    ball(g, cx, cy, r, r, { o: ol, hi: '#ffffff', mid: '#ffffff', lo: '#eef2f6', sh: '#d4dce4' });
  }
  function sidingPaint(g, base, line) {
    rect(g, 0, 0, 16, 16, base);
    for (let y = 3; y < 16; y += 4) rect(g, 0, y, 16, 1, line);
  }
  function woodFloor(g) {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const r = y & 3, seamX = ((y >> 2) & 1) ? 11 : 5;
      let c = '#c48c52';
      if (r === 0) c = '#a86e3a';
      else if (r === 1) c = '#d8a46a';
      else if (x === seamX) c = '#a86e3a';
      else if (hash(x, y, 8) < 0.06) c = '#b87c44';
      px(g, x, y, c);
    }
  }
  function tileFloor(g) {
    rect(g, 0, 0, 16, 16, '#ece2cc');
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      if ((x & 7) === 7 || (y & 7) === 7) px(g, x, y, '#c8b89a');
    }
  }
  function rockWall(g) {
    rect(g, 0, 0, 16, 16, '#7a6a5a');
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const course = y >> 2;
      const joint = (x + (course & 1) * 4) & 7;
      if ((y & 3) === 3) px(g, x, y, '#4e4238');
      else if (joint === 7) px(g, x, y, '#4e4238');
      else if (hash(x, y, 6) < 0.08) px(g, x, y, '#8e7e6c');
    }
    rect(g, 15, 0, 1, 16, '#4a3e34');
    rect(g, 0, 15, 16, 1, '#4a3e34');
  }
  function caveFloor(g) {
    rect(g, 0, 0, 16, 16, '#5a5450');
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const h = hash(x, y, 7);
      if (h < 0.1) px(g, x, y, '#4a4540');
      else if (h > 0.95) px(g, x, y, '#6e6862');
    }
  }
  const ROCK2 = { o: '#2a2220', hi: '#b8a890', mid: '#8a7a68', lo: '#6a5c4c', sh: '#4a3e34' };
  const BOOKS = ['#d84848', '#3c6cd0', '#f0c040', '#48a848', '#c060c0', '#f08040', '#e8e8e8'];
  const ORB = [
    { o: '#5a1010', hi: '#ffd0c0', mid: '#f05050', lo: '#c02828', sh: '#8a1010' },
    { o: '#10204a', hi: '#c0e0ff', mid: '#4a8ae8', lo: '#2a5ac0', sh: '#183a80' },
    { o: '#5a4010', hi: '#fff8c0', mid: '#f8d848', lo: '#e0aa20', sh: '#a07010' },
  ];
  const STONE_C = { o: '#4a4a58', hi: '#f0f0f8', mid: '#c8c8d4', lo: '#a0a0b0', sh: '#7a7a88' };
  const PLANT_C = TREE_C;

  // ---------- registry ----------
  const defs = {};
  const rendered = {};
  const tiles = {};
  function def(name, flags, paint, extra) {
    const e = extra || {};
    defs[name] = { flags: flags || {}, paint, n: e.n || 1, fps: e.fps || 0, over: e.over || null };
  }
  function ready(name) {
    let r = rendered[name];
    if (r) return r;
    const d = defs[name];
    r = rendered[name] = { frames: [], overs: d.over ? [] : null };
    for (let f = 0; f < d.n; f++) {
      r.frames.push(makeCanvas(16, 16, (c, g) => d.paint(g, f)));
      if (d.over) r.overs.push(makeCanvas(16, 16, (c, g) => d.over(g, f)));
    }

    tiles[id] = {
      name: id,
      solid: !!f.solid, enc: f.enc || null, ledge: f.ledge || null, water: !!f.water, over: !!f.over,
      door: !!f.door, counter: !!f.counter, chop: !!f.chop, smash: !!f.smash,
      draw(g, x, y, time) { const r = ready(id); g.drawImage(r.frames[frameOf(d, time || 0)], x, y); },
      drawOver(g, x, y, time) { const r = ready(id); if (r.overs) g.drawImage(r.overs[frameOf(d, time || 0)], x, y); },

  def('?', {}, (g) => {

// ---- 22_chars.js
// Tidebound: characters. Overworld sprites (16x20, 4 directions x 3 frames) and battle portraits (64x64).
// Overworld: one pixel-string body per direction (head, shirt, legs) shared by everyone; each character recolours
// it through a palette and adds small row patches for hair, hats and props. Portraits: a bust painted per pixel
// from shape tests at 32x32 and scaled x2. Everything is built lazily and cached.
const Chars = (() => {
  const OUT = '#281c28', EYE = '#181820', SHOE = '#3a2820', BELT = '#4a3020', METAL = '#c8d0d8', BROWN = '#8a5a30';
  const SKIN = { light: '#f8d8b0', tan: '#e0a878', medium: '#c88858', dark: '#8a5030' };

  // hex colour * f (f < 1 darkens)
  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    return '#' + [16, 8, 0].map((s) => Math.round(((n >> s) & 255) * f).toString(16).padStart(2, '0')).join('');
  }

  // ---------- per-character specs ----------
  // hair/skin/shirt/pants colours; hat + band for hatType 'cap' | 'straw' | 'swim' | 'nurse';
  // acc = accent (scarf, cape, backpack); flags: long, spiky, bun, beard, glasses, coat, skirt, apron,
  // scarf, cape, pack, cane, net.
  const SPEC = {
    player:    { hair: '#6a3c20', skin: SKIN.light, shirt: '#f0f0f0', pants: '#3c4c7c', hat: '#e03838', band: '#f8f8f8', acc: '#3868c8', hatType: 'cap', pack: 1 },
    rival:     { hair: '#3a6ad8', skin: SKIN.light, shirt: '#e8e8f0', pants: '#303848', acc: '#e03838', spiky: 1, scarf: 1 },
    prof:      { hair: '#d8d8e0', skin: SKIN.light, shirt: '#f4f4f8', pants: '#4a5878', band: '#f4f4f8', long: 1, coat: 1, glasses: 1 },
    mom:       { hair: '#8a4a28', skin: SKIN.light, shirt: '#e87898', pants: '#e87898', acc: '#e87898', long: 1, skirt: 1 },
    nurse:     { hair: '#6a3c20', skin: SKIN.light, shirt: '#f4f4f4', pants: '#f4f4f4', hat: '#f4f4f4', band: '#f4f4f4', hatType: 'nurse', long: 1 },
    clerk:     { hair: '#3c2818', skin: SKIN.medium, shirt: '#7cb0d8', pants: '#384858', band: '#f4f4f4', apron: 1 },
    sailor:    { hair: '#c05a20', skin: SKIN.tan, shirt: '#e8e8e8', pants: '#2a3a6a', hat: '#f4f4f4', band: '#203870', hatType: 'cap' },
    captain:   { hair: '#404040', skin: SKIN.dark, shirt: '#2c3e6c', pants: '#e0e0e0', hat: '#203870', band: '#e8b020', hatType: 'cap' },
    lass:      { hair: '#c04838', skin: SKIN.light, shirt: '#f8c0d0', pants: '#f8c0d0', acc: '#a060c8', long: 1, skirt: 1 },
    youngster: { hair: '#3c2818', skin: SKIN.light, shirt: '#e0c040', pants: '#3c4870', hat: '#48a048', band: '#f4f4f4', hatType: 'cap' },
    fisher:    { hair: '#5a4028', skin: SKIN.tan, shirt: '#58a0a0', pants: '#6a5030', hat: '#e8c878', band: '#a06030', hatType: 'straw' },
    hiker:     { hair: '#5a3a20', skin: SKIN.medium, shirt: '#58884a', pants: '#806040', acc: '#a05830', beard: 1, pack: 1 },
    swimmer:   { hair: '#2a2a40', skin: SKIN.tan, shirt: '#e0a878', pants: '#2868c8', hat: '#3858c0', hatType: 'swim' },
    bugkid:    { hair: '#302018', skin: SKIN.light, shirt: '#70b848', pants: '#806040', net: 1 },
    oldman:    { hair: '#d8d8e0', skin: SKIN.dark, shirt: '#7878a0', pants: '#506070', cane: 1 },
    oldwoman:  { hair: '#d8d8e0', skin: SKIN.medium, shirt: '#a070b0', pants: '#604870', bun: 1 },
    girl:      { hair: '#e0b040', skin: SKIN.light, shirt: '#f080a0', pants: '#406080', long: 1 },
    boy:       { hair: '#c88030', skin: SKIN.light, shirt: '#e8d030', pants: '#3868a0' },
    man:       { hair: '#3a2818', skin: SKIN.light, shirt: '#4870c0', pants: '#404040' },
    woman:     { hair: '#6a3020', skin: SKIN.medium, shirt: '#58b8a0', pants: '#384858', long: 1 },
    leader:    { hair: '#2888a8', skin: SKIN.light, shirt: '#2870c8', pants: '#203858', acc: '#8040c0', long: 1, cape: 1 },
    gymguide:  { hair: '#5a3a20', skin: SKIN.light, shirt: '#f0f0f0', pants: '#284068', hat: '#3060b0', band: '#f4f4f4', hatType: 'cap' },
    scientist: { hair: '#806040', skin: SKIN.light, shirt: '#e0e8f0', pants: '#404858', band: '#f4f4f8', coat: 1, glasses: 1 },
  };
  const NAMES = ['player', 'rival', 'prof', 'mom', 'nurse', 'clerk', 'sailor', 'captain', 'lass', 'youngster', 'fisher',
    'hiker', 'swimmer', 'bugkid', 'oldman', 'oldwoman', 'girl', 'boy', 'man', 'woman', 'leader', 'gymguide', 'scientist'];
  const specOf = (name) => SPEC[name] || SPEC.man;
  const keyOf = (name) => (SPEC[name] ? name : 'man');

  // ---------- overworld templates (16x20). Rows 0-9 head, 10-14 body, 15-19 legs. Letters are palette roles. ----------
  const HEAD = {
    down: [
      '.....OOOOOO.....',
      '....OHHHHHHO....',
      '...OHHHHHHHHO...',
      '...OHHHHHHHHO...',
      '...OHHSSSSHHO...',
      '...OHSESSESHO...',
      '...OHSSSSSSHO...',
      '...OSSSSSSSSO...',
      '....OsSSSSsO....',
      '.....OOOOOO.....',
    ],
    up: [
      '.....OOOOOO.....',
      '....OHHHHHHO....',
      '...OHHHHHHHHO...',
      '...OHhHHHHhHO...',
      '...OHHHHHHHHO...',
      '...OHHHHHHHHO...',
      '...OHHhHHhHHO...',
      '...OHHHHHHHHO...',
      '....OHHHHHHO....',
      '.....OOOOOO.....',
    ],
    left: [
      '.....OOOOOO.....',
      '....OHHHHHHO....',
      '...OHHHHHHHHO...',
      '...OHHHHHHHHO...',
      '...OHHSSSSHHO...',
      '...OSESSSSHHO...',
      '...OSSSSSSHHO...',
      '...OSSSSSSSHO...',
      '....OsSSSSsO....',
      '.....OOOOOO.....',
    ],
  };
  const BODY = [
    '..OOWWWWWWWWOO..',
    '..OwWWWWWWWWwO..',
    '..OwWWWWWWWWwO..',
    '..OSWWWWWWWWSO..',
    '...OQQQQQQQQO...',
  ];
  // legs per frame (0 stand, 1 step left, 2 step right); 'left' is the profile view
  const LEGS = {
    down: [
      ['...OPPPOOPPPO...', '...OPPPOOPPPO...', '...OPPPOOPPPO...', '...OBBBOOBBBO...', '...OOOOOOOOOO...'],
      ['...OPPPOOPPPO...', '...OPPPOOPPPO...', '...OBBBOOPPPO...', '...OOOOOOBBBO...', '........OOOOO...'],
      ['...OPPPOOPPPO...', '...OPPPOOPPPO...', '...OPPPOOBBBO...', '...OBBBOOOOOO...', '...OOOOOO.......'],
    ],
    left: [
      ['....OPPPPPPO....', '....OPPPPPPO....', '....OPPpPPPO....', '...OBBBBBBBO....', '...OOOOOOOOO....'],
      ['....OPPPPPPO....', '....OPPPPPPO....', '...OBBBPPPPO....', '....OOOOBBBO....', '........OOOO....'],
      ['....OPPPPPPO....', '....OPPPPPPO....', '....OPPPBBBO....', '...OBBBBOOOO....', '...OOOO.........'],
    ],
  };

  // Palette for a character. Roles: O outline, E eyes, H hair, S skin, W shirt, P pants, K hat, L band or
  // coat, X accent, N brown, M metal, R red, B shoes, Q belt; lower-case = shade.
  function palette(sp) {
    const hat = sp.hat || '#f4f4f4', band = sp.band || '#f4f4f4', acc = sp.acc || '#808080';
    return {
      O: OUT, E: EYE, B: SHOE, Q: BELT, M: METAL, N: BROWN, R: '#e03838',
      H: sp.hair, h: shade(sp.hair, 0.7), S: sp.skin, s: shade(sp.skin, 0.82),
      W: sp.shirt, w: shade(sp.shirt, 0.8), P: sp.pants, p: shade(sp.pants, 0.8),
      K: hat, k: shade(hat, 0.75), L: band, l: shade(band, 0.8), X: acc, x: shade(acc, 0.75),
    };
  }

  // Build the 16x20 role grid for a character, direction ('up' | 'down' | 'left') and frame.
  function compose(sp, v, frame) {
    const ld = v === 'up' ? 'down' : v;
    const rows = HEAD[v].concat(BODY, LEGS[ld][frame]).map((r) => r.split(''));
    const put = (y, s) => { for (let x = 0; x < 16; x++) if (s[x] !== '.') rows[y][x] = s[x]; };
    const remap = (y0, y1, map) => { for (let y = y0; y <= y1; y++) rows[y] = rows[y].map((c) => map[c] || c); };
    const col = (c, y0, y1, ch) => { for (let y = y0; y <= y1; y++) rows[y][c] = ch; };

    // body recolour
    if (sp.coat) { remap(10, 14, { W: 'L', w: 'l', Q: 'L' }); remap(15, 16, { P: 'L', p: 'l' }); }
    if (sp.scarf) remap(10, 11, { W: 'X', w: 'x', O: 'X' });
    if (sp.cape) {
      if (v === 'up') remap(10, 14, { W: 'X', w: 'x', O: 'x' });
      else if (v === 'left') col(13, 10, 14, 'X');
      else { col(2, 10, 14, 'X'); col(13, 10, 14, 'X'); }
    }
    if (sp.pack) {
      if (v === 'up') remap(10, 14, { W: 'X', w: 'x', O: 'x' });
      else if (v === 'left') col(13, 10, 13, 'X');
    }
    if (sp.skirt) remap(14, 17, { P: 'X', p: 'x', Q: 'X' });
    if (sp.apron && v !== 'up') for (let y = 12; y <= 16; y++) put(y, '.....LLLLLL.....');

    // hair
    if (sp.long) {
      if (v === 'left') { for (let y = 7; y <= 9; y++) { rows[y][12] = 'H'; rows[y][13] = 'H'; } }
      else { put(8, '..HH........HH..'); put(9, '..HH........HH..'); }
    }
    if (sp.spiky) put(0, '...H.H.H.H.H....');
    if (sp.bun) put(0, '.....OHHHHO.....');

    // hats
    if (sp.hatType === 'cap') {
      put(1, '....OKKKKKKO....');
      put(2, '...OKKKKKKKKO...');
      if (v === 'up') {
        put(3, '...OLLLLLLLLO...');
        for (let y = 4; y <= 7; y++) put(y, '...OKKKKKKKKO...');
        put(8, '....OKKKKKKO....');
      } else {
        put(3, '...OLLLLLLLLO...');
        put(4, '..OkkkkkkkkkkO..');
      }
    } else if (sp.hatType === 'swim') {
      put(1, '....OKKKKKKO....');
      put(2, '...OKKKKKKKKO...');
      put(3, '...OKKKKKKKKO...');
      put(4, '...OKKKKKKKKO...');
    } else if (sp.hatType === 'straw') {
      put(1, '....OKKKKKKO....');
      put(2, '...OKKKKKKKKO...');
      put(3, '.OKKKKKKKKKKKKO.');
    } else if (sp.hatType === 'nurse') {
      put(1, '.....OKKKKO.....');
      put(2, '....OKKRRKKO....');
    }

    // props and face details
    if (sp.beard && v !== 'up') { put(8, '....OHHHHHHO....'); put(9, '.....OHHHHO.....'); }
    if (sp.cane) {
      if (v === 'left') for (let y = 13; y <= 19; y++) put(y, '.N..............');
      else for (let y = 13; y <= 19; y++) put(y, '..............N.');
    }
    if (sp.net) {
      if (v === 'left') {
        put(0, 'MMMM............'); put(1, 'MMMM............'); put(2, 'MMN.............');
        for (let y = 3; y <= 19; y++) put(y, '.N..............');
      } else {
        put(0, '.............MMM'); put(1, '............MMMM'); put(2, '............MMN.');
        for (let y = 3; y <= 19; y++) put(y, '..............N.');
      }
    }
    return rows;
  }

  const spriteCache = {};
  // 16x20 canvas for name, direction 'up' | 'down' | 'left' (right is mirrored by draw) and frame 0..2
  function sprite(name, v, frame) {
    const k = keyOf(name) + '|' + v + '|' + frame;
    if (spriteCache[k]) return spriteCache[k];
    const sp = specOf(name);
    const pal = palette(sp);
    const rows = compose(sp, v, frame);
    return (spriteCache[k] = makeCanvas(16, 20, (c, g) => {
      for (let y = 0; y < 20; y++) for (let x = 0; x < 16; x++) {
        const ch = rows[y][x];
        if (ch !== '.') { g.fillStyle = pal[ch] || '#ff00ff'; g.fillRect(x, y, 1, 1); }
      }
    }));
  }

  // ---------- portraits (64x64 from a 32x32 grid) ----------
  // Shape tests use pixel centres (x + 0.5, y + 0.5). Layers are painted back to front, then an outline is added.
  function bust(sp) {
    const G = [];
    for (let y = 0; y < 32; y++) G.push(new Array(32).fill('.'));
    const put = (ch, pred) => {
      for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) if (pred(x + 0.5, y + 0.5)) G[y][x] = ch;
    };
    const dx = (x) => Math.abs(x - 16);
    const rect = (x0, y0, x1, y1) => (x, y) => x >= x0 && x < x1 && y >= y0 && y < y1;
    const inHead = (x, y) => ((x - 16) / 7.6) ** 2 + ((y - 13.5) / 8.6) ** 2 <= 1;
    const torso = (x, y) => y >= 21 && y < 33 && dx(x) <= Math.min(10.5, 5 + (y - 21) * 1.5);
    const hairTop = (x, y) => inHead(x, y) && y < 9.3 - 0.07 * dx(x) * dx(x);
    const tip = (x) => 1 + 2 * Math.abs(((Math.floor(x) - 8) % 4) - 2);

    // behind the body
    if (sp.cape) put('X', (x, y) => y >= 19 && y < 33 && dx(x) <= 12);
    if (sp.pack) put('X', (x, y) => y >= 21 && y < 33 && dx(x) <= 11);
    if (sp.long) put('H', (x, y) => y >= 9 && y < 27 && dx(x) >= 6.5 && dx(x) <= 9.5);
    if (sp.bun) put('H', (x, y) => (x - 16) ** 2 + (y - 3.5) ** 2 <= 9);

    // body
    put(sp.coat ? 'L' : 'W', torso);
    put(sp.coat ? 'l' : 'w', (x, y) => torso(x, y) && dx(x) >= 8);
    if (sp.coat) put('l', (x, y) => torso(x, y) && y >= 23 && dx(x) < 0.9);
    put('S', (x, y) => y >= 20 && y < 24 && dx(x) <= 3);
    if (sp.scarf) put('X', (x, y) => y >= 21 && y < 24 && dx(x) <= 7.5);
    if (sp.pack && !sp.cape) put('x', (x, y) => y >= 30 && y < 33 && dx(x) <= 11 && dx(x) > 9);

    // head
    put('S', inHead);
    put('s', (x, y) => inHead(x, y) && y >= 17.5 && dx(x) >= 5.5);

    // hair (cap and hat types cover it below)
    put('H', hairTop);
    put('H', (x, y) => inHead(x, y) && dx(x) >= 6.6 && y < 13.5);
    if (sp.spiky) put('H', (x, y) => dx(x) <= 9 && y >= tip(x) && y < 9);
    if (sp.long) put('H', (x, y) => inHead(x, y) && y < 9.3 - 0.07 * dx(x) * dx(x) && dx(x) >= 6);

    // hats
    if (sp.hatType === 'cap') {
      put('K', (x, y) => inHead(x, y) && y < 7.2);
      put('L', (x, y) => inHead(x, y) && y >= 7.2 && y < 8.4);
      put('k', (x, y) => y >= 8.4 && y < 9.4 && dx(x) <= 9);
    } else if (sp.hatType === 'swim') {
      put('K', (x, y) => inHead(x, y) && y < 8.6);
    } else if (sp.hatType === 'straw') {
      put('K', (x, y) => y >= 2.8 && y < 7 && dx(x) <= 7.2);
      put('L', (x, y) => y >= 6 && y < 7 && dx(x) <= 7.2);
      put('K', (x, y) => y >= 7 && y < 8.2 && dx(x) <= 13);
      put('k', (x, y) => y >= 8.2 && y < 8.9 && dx(x) <= 12);
    } else if (sp.hatType === 'nurse') {
      put('K', (x, y) => inHead(x, y) && y < 6.4 && dx(x) <= 6);
      put('R', rect(15, 3, 17, 6));
      put('R', rect(14, 4, 18, 5));
    }

    // face
    if (sp.beard) {
      put('H', (x, y) => (inHead(x, y) && y >= 17.5 && dx(x) <= 5) || (y >= 20 && y < 23 && dx(x) <= 4.5));
    } else {
      put('s', rect(15, 18, 17, 19));
    }
    if (sp.glasses) {
      put('M', (x, y) => rect(10, 12, 14, 16)(x, y) && !rect(11, 13, 13, 15)(x, y));
      put('M', (x, y) => rect(18, 12, 22, 16)(x, y) && !rect(19, 13, 21, 15)(x, y));
    }
    put('E', rect(12, 13, 13, 15));
    put('E', rect(19, 13, 20, 15));

    // props
    if (sp.net) {
      put('N', (x, y) => y >= 9 && y < 31 && Math.abs(x - (25 - (y - 9) * 0.2)) < 0.6);
      put('M', (x, y) => { const d = Math.hypot(x - 27, y - 7); return d <= 3.6 && d >= 2.6; });
    }

    // outline: empty pixels touching the figure
    const out = G.map((r) => r.slice());
    for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
      if (G[y][x] !== '.') continue;
      const n = [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]];
      if (n.some(([a, b]) => a >= 0 && a < 32 && b >= 0 && b < 32 && G[b][a] !== '.')) out[y][x] = 'O';
    }
    return out;
  }

  const pcache = {};
  // 64x64 battle portrait (front facing bust)
  function portrait(name) {
    const k = keyOf(name);
    if (pcache[k]) return pcache[k];
    const sp = specOf(name);
    const pal = palette(sp);
    const G = bust(sp);
    const small = makeCanvas(32, 32, (c, g) => {
      for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
        const ch = G[y][x];
        if (ch !== '.') { g.fillStyle = pal[ch] || '#ff00ff'; g.fillRect(x, y, 1, 1); }
      }
    });
    return (pcache[k] = makeCanvas(64, 64, (c, g) => { g.drawImage(small, 0, 0, 64, 64); }));
  }

  // Overworld sprite. (x, y) is the top-left of the tile; the sprite is drawn 4px up so the feet sit on the tile bottom.
  // dir: up | down | left | right (right is the left sprite mirrored); frame: 0 stand, 1 step left, 2 step right.
  function draw(g, name, x, y, dir = 'down', frame = 0) {
    const f = frame === 1 || frame === 2 ? frame : 0;
    const v = dir === 'up' ? 'up' : dir === 'left' || dir === 'right' ? 'left' : 'down';
    const c = sprite(name, v, f);
    g.imageSmoothingEnabled = false;
    if (dir === 'right') {
      g.save();
      g.translate(x + 16, y - 4);
      g.scale(-1, 1);
      g.drawImage(c, 0, 0);
      g.restore();
    } else {
      g.drawImage(c, x, y - 4);
    }
  }

  // Dark ellipse-ish shadow under the feet of the tile at (x, y), for ledge hops and similar.
  function shadow(g, x, y) {
    g.fillStyle = 'rgba(20,30,40,0.22)';
    g.fillRect(x + 5, y + 13, 6, 1);
    g.fillStyle = 'rgba(20,30,40,0.3)';
    g.fillRect(x + 3, y + 14, 10, 1);
    g.fillStyle = 'rgba(20,30,40,0.22)';
    g.fillRect(x + 5, y + 15, 6, 1);
  }

  // All overworld frames on one canvas: rows down, up, left, right; columns stand, step L, step R.
  function sheet(name) {
    const dirs = ['down', 'up', 'left', 'right'];
    return makeCanvas(48, 80, (c, g) => {
      dirs.forEach((d, r) => {
        for (let f = 0; f < 3; f++) draw(g, name, f * 16, r * 20 + 4, d, f);
      });
    });
  }

  return { draw, shadow, portrait, sheet, names: NAMES.slice() };
})();

// ---- 30_world.js
// Tidebound: maps (tile grids, warps, NPCs, items, triggers) and the overworld: movement, ledges, warps, camera,
// drawing, trainers, encounters and field moves. Only `Maps` and `World` are top-level names in this file.

const Maps = (() => {
  const byId = {};
  const list = [];

  // Maps.def(def): rows + legend → a flat grid of tile names (`tiles[y * w + x]`). Unknown legend chars → 'grass'.
  function def(d) {
    if (!d || !d.id) throw new Error('Maps.def: a map needs an id');
    if (byId[d.id]) console.warn('Maps.def: map "' + d.id + '" is defined twice');
    const rows = d.rows || [];
    const legend = d.legend || {};
    const h = rows.length;
    let w = 0;
    for (const r of rows) w = Math.max(w, r.length);
    const tiles = new Array(w * h);
    const warned = {};
    rows.forEach((row, y) => {
      if (row.length !== w) console.warn('Maps.def: ' + d.id + ' row ' + y + ' has ' + row.length + ' tiles, expected ' + w);
      for (let x = 0; x < w; x++) {
        const ch = row.charAt(x);
        let name = ch ? legend[ch] : undefined;
        if (!name) {
          if (!warned[ch]) { warned[ch] = true; console.warn('Maps.def: ' + d.id + ' has no legend entry for "' + ch + '" (using grass)'); }
          name = 'grass';
        }
        tiles[y * w + x] = name;
      }
    });
    const m = Object.assign({
      music: null, indoor: false, border: 'water', warps: [], npcs: [], items: [], signs: [], triggers: [], encounters: {},
    }, d, { w, h, tiles });
    m.name = d.name || d.id.toUpperCase();
    byId[d.id] = m;
    list.push(m);
    return m;
  }

  return { def, get: (id) => byId[id] || null, list };
})();

const World = (() => {
  const WALK = 0.25, RUN = 0.125, HOP = 0.5, HOLD = 0.1, WANDER = 0.4;
  const LEDGE = { ledge_s: 'down', ledge_w: 'left', ledge_e: 'right' };
  const FALLBACK = {
    water: '#3c6cb4', grass: '#68b850', tallgrass: '#4c9c3c', sand: '#e8d6a0', path: '#d8c08c', floor: '#c49c6c',
    wood_floor: '#b98a5a', cave_floor: '#585866', wall: '#e8e0d0', wall_in: '#e8e0d0', dune: '#e8d6a0',
  };
  const SOLID_RE = /tree|rock|water|wall|bush|fence|boulder|sign|mailbox|counter|table|bed|shelf|plant|lamp|machine|statue|roof|pier_post|flowerbed|^pc$/;
  const DOOR_RE = /door|stairs|cave_entrance|cave_exit|cave_ladder/;
  const ORB = ['..KKKK..', '.KRRRRK.', 'KRWWRRRK', 'KRWRRRRK', 'KRRRRRRK', 'KRRRRRRK', '.KRRRRK.', '..KKKK..'];
  const ORB_COLOR = { K: '#402020', R: '#e03838', W: '#ffffff' };
  const L_LETTER = { up: 'u', down: 'd', left: 'l', right: 'r' };

  let scene = null;          // the opaque world scene
  let map = null;            // runtime map: a copy of the Maps.def object with live tiles/npcs/items
  let busy = 0;              // script locks (World.lock / unlock, tasks, warps)
  let taskBusy = false;      // one async task (script, warp, encounter, trigger) at a time
  let holdDir = null, holdT = 0, holdNeed = HOLD;
  let bumpCd = 0;
  let popup = null;          // location name popup {name, t}
  let lastName = null;
  let rustles = [];          // tall grass rustle marks {x, y, t}
  let orbC = null;
  const tcache = {};
  // The player object is reused for the whole session so World.player stays the same reference.
  const player = { x: 0, y: 0, dir: 'down', frame: 0, moving: null, stepN: 0, scripted: false, emote: null, sprite: 'player' };

  // ---------- small helpers (private: every file shares one scope) ----------
  function sfx(n) { try { if (typeof Sound !== 'undefined' && Sound.play) Sound.play(n); } catch (_) {} }
  function bgm(t) { try { if (typeof Music !== 'undefined' && Music.play) return Music.play(t); } catch (_) {} return null; }
  function safe(fn) { try { return !!fn(); } catch (e) { showError(e); return false; } }

  function fallbackTile(name) {
    return {
      name,
      solid: SOLID_RE.test(name),
      door: DOOR_RE.test(name),
      counter: name === 'counter',
      over: name === 'tallgrass',
      water: /water/.test(name),
      enc: name === 'tallgrass' ? 'grass' : name === 'cave_floor' ? 'cave' : null,
      ledge: LEDGE[name] || null,
      chop: name === 'chop_tree',
      smash: name === 'smash_rock',
      draw(g, x, y) { g.fillStyle = FALLBACK[name] || '#c040c0'; g.fillRect(x, y, TILE, TILE); },
    };
  }
  // Tile info from Tiles.get, with a fallback when Tiles or the tile is missing.
  function tinfo(name) {
    let t = tcache[name];
    if (t) return t;
    try { t = (typeof Tiles !== 'undefined' && Tiles.get) ? Tiles.get(name) : null; } catch (_) { t = null; }
    if (!t) t = fallbackTile(name);
    tcache[name] = t;
    return t;
  }
  function drawTile(g, name, x, y) {
    const ti = tinfo(name);
    if (ti.draw) ti.draw(g, x, y, G.time); else fallbackTile(name).draw(g, x, y);
  }
  function drawChar(g, name, x, y, dir, frame) {
    if (typeof Chars !== 'undefined' && Chars.draw) { Chars.draw(g, name, x, y, dir, frame); return; }
    g.fillStyle = '#e0a060'; g.fillRect(x + 3, y + 2, 10, 14);
    g.fillStyle = '#303030'; g.fillRect(x + 5, y + 6, 2, 2); g.fillRect(x + 9, y + 6, 2, 2);
  }
  function drawShadow(g, x, y) {
    if (typeof Chars !== 'undefined' && Chars.shadow) { Chars.shadow(g, x, y); return; }
    g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(x + 3, y + 12, 10, 3);
  }
  function drawOrb(g, x, y) {
    if (!orbC) {
      orbC = makeCanvas(8, 8, (c, cg) => {
        ORB.forEach((row, yy) => {
          for (let xx = 0; xx < 8; xx++) {
            const col = ORB_COLOR[row[xx]];
            if (col) { cg.fillStyle = col; cg.fillRect(xx, yy, 1, 1); }
          }
        });
      });
    }
    g.drawImage(orbC, x, y);
  }
  function drawBubble(g, x, y, ch) {
    const bx = x + 10, by = y - 12;
    UI.box(g, bx, by, 12, 12, 'white');
    drawText(g, ch, bx + 4, by + 2, '#e04040', '#ffffff');
  }
  function drawPopup(g) {
    const t = popup.t, hold = 1.7;
    const y = Math.round(t < 0.3 ? lerp(-22, 4, t / 0.3) : t > hold ? lerp(4, -22, (t - hold) / 0.3) : 4);
    const tw = typeof textWidth === 'function' ? textWidth(popup.name) : popup.name.length * 6;
    UI.box(g, 4, y, Math.max(72, tw + 16), 20, 'white');
    drawText(g, popup.name, 12, y + 6, '#404040', '#d0d0c8');
  }

  // ---------- map queries ----------
  const inMap = (x, y) => !!map && x >= 0 && y >= 0 && x < map.w && y < map.h;
  const tileName = (x, y) => map.tiles[y * map.w + x];
  const tileAt = (x, y) => tinfo(tileName(x, y));
  const flagKey = (it) => it.key;
  function itemAt(x, y, visibleOnly) {
    return map.items.find((i) => i.x === x && i.y === y && !flag(flagKey(i)) && (!visibleOnly || !i.hidden)) || null;
  }
  function npcAt(x, y, except) {
    return map.npcs.find((n) => n !== except && n.active && !n.hidden && n.x === x && n.y === y) || null;
  }
  function warpAt(x, y) { return map.warps.find((w) => w.x === x && w.y === y) || null; }
  // Edge warps (on the map perimeter) fire when walking off the edge; others fire when stepped onto.
  function stepWarp(x, y) {
    const w = warpAt(x, y);
    if (!w) return null;
    const edge = x === 0 || y === 0 || x === map.w - 1 || y === map.h - 1;
    return (!edge || tileAt(x, y).door) ? w : null;
  }
  function blockedFor(who, x, y) {
    if (!inMap(x, y)) return true;
    const ti = tileAt(x, y);
    if (ti.solid) return true;
    if (itemAt(x, y, true)) return true;
    if (who !== player) {
      if (ti.ledge || ti.door || warpAt(x, y)) return true;
      if (player.x === x && player.y === y) return true;
    }
    return !!npcAt(x, y, who);
  }
  function dirTo(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    if (dx === 0 && dy === 0) return 'down';
    if (Math.abs(dx) > Math.abs(dy)) return dx < 0 ? 'left' : 'right';
    return dy < 0 ? 'up' : 'down';
  }
  function lead() { return G.party.find((m) => m && m.hp > 0) || null; }

  // ---------- loading ----------
  function mkNpc(d) {
    return Object.assign({}, d, {
      x: d.x, y: d.y, homeX: d.x, homeY: d.y, dir: d.dir || 'down', move: d.move || 'still',
      active: true, hidden: false, moving: null, frame: 0, stepN: 0, emote: null,
      timer: 1 + R.float() * 2,
    });
  }
  function refreshNpcs() {
    if (!map) return;
    for (const n of map.npcs) {
      n.active = n.cond ? safe(n.cond) : true;
      if (!n.active) n.moving = null;
    }
  }
  function load(id, x, y, dir) {
    const def = Maps.get(id);
    if (!def) throw new Error('World: no map called "' + id + '"');
    const prev = lastName;
    map = Object.assign({}, def, {
      tiles: def.tiles.slice(),
      cleared: new Set(),
      shake: null,
      npcs: (def.npcs || []).map(mkNpc),
      items: (def.items || []).map((it) => Object.assign({}, it, { key: it.id || (id + ':' + it.x + ',' + it.y) })),
    });
    G.map = id; G.x = x; G.y = y; G.dir = dir;
    Object.assign(player, { x, y, dir, frame: 0, moving: null, stepN: 0, scripted: false, emote: null });
    holdDir = null; holdT = 0;
    rustles = [];
    refreshNpcs();
    if (!map.indoor && map.name !== prev) popup = { name: map.name, t: 0 };
    lastName = map.name;
    if (map.music) bgm(map.music);
  }

  // ---------- movement ----------
  function startMove(o, nx, ny, dur, jump, d) {
    o.moving = { fx: o.x, fy: o.y, tx: nx, ty: ny, t: 0, dur, jump: !!jump };
    o.x = nx; o.y = ny; o.dir = d;
    o.stepN++;
    o.frame = (o.stepN & 1) ? 1 : 2;
    if (o === player) { G.x = nx; G.y = ny; G.dir = d; }
  }
  function advance(o, dt) {
    const m = o.moving;
    if (!m) return;
    m.t += dt;
    if (m.t < m.dur) return;
    o.moving = null;
    o.frame = 0;
    if (o === player && !o.scripted) afterStep();
  }
  // Visual position in pixels: x, y (with the hop arc) and gy (ground y, for sorting and the shadow).
  function visPos(o) {
    const m = o.moving;
    if (!m) return { x: o.x * TILE, y: o.y * TILE, gy: o.y * TILE };
    const e = clamp(m.t / m.dur, 0, 1);
    const x = lerp(m.fx, m.tx, e) * TILE;
    const gy = lerp(m.fy, m.ty, e) * TILE;
    return { x, y: m.jump ? gy - Math.sin(Math.PI * e) * 12 : gy, gy };
  }
  function bump() {
    if (bumpCd > 0) return;
    bumpCd = 0.3;
    sfx('bump');
  }
  function tryMove(d) {
    const [dx, dy] = DIRS[d];
    player.dir = d; G.dir = d;
    const nx = player.x + dx, ny = player.y + dy;
    if (!inMap(nx, ny)) {
      const w = warpAt(player.x, player.y);   // edge warp: walking off the map from a warp tile
      if (w) task(() => doWarp(w, null)); else bump();
      return;
    }
    const ti = tileAt(nx, ny);
    if (ti.ledge) {
      if (ti.ledge === d) {
        const lx = nx + dx, ly = ny + dy;
        if (!blockedFor(player, lx, ly)) { sfx('ledge'); startMove(player, lx, ly, HOP, true, d); return; }
      }
      bump();
      return;
    }
    if (blockedFor(player, nx, ny)) { bump(); return; }
    startMove(player, nx, ny, Input.held('b') ? RUN : WALK, false, d);
  }
  function input(dt) {
    const d = Input.dir();
    if (!d) { holdDir = null; holdT = 0; }
    else if (d !== holdDir) { holdDir = d; holdT = 0; holdNeed = player.dir === d ? 0 : HOLD; }   // already facing: walk at once
    else holdT += dt;
    if (player.moving) return;
    if (Input.pressed('start')) { task(() => Menus.start()); return; }
    if (Input.pressed('a')) { task(interact); return; }
    if (!d) return;
    if (player.dir !== d) { player.dir = d; G.dir = d; }   // a tap only turns
    if (holdT >= holdNeed) tryMove(d);
  }

  // Runs after each completed player step. Decisions are made synchronously; anything that takes time runs as a task.
  function afterStep() {
    const p = player, m0 = map;
    const sw = stepWarp(p.x, p.y);
    if (sw) { task(() => doWarp(sw, tileName(p.x, p.y))); return; }
    G.steps++;
    const ti = tileAt(p.x, p.y);
    if (ti.enc === 'grass') rustles.push({ x: p.x, y: p.y, t: 0 });
    const trig = (map.triggers || []).filter((t) => {
      const w = t.w || 1, h = t.h || 1;
      return p.x >= t.x && p.x < t.x + w && p.y >= t.y && p.y < t.y + h && (!t.cond || safe(t.cond));
    });
    let repelEnd = false;
    if (G.repel > 0) { G.repel--; if (G.repel === 0) repelEnd = true; }
    const spot = findSpotter();
    const enc = spot ? null : rollEncounter(ti);
    if (!trig.length && !spot && !enc && !repelEnd) return;
    task(async () => {
      if (repelEnd) await UI.say("REPEL's effect wore off!");
      for (const t of trig) {
        if (map !== m0) return;
        if (t.run) await t.run();
      }
      if (map !== m0) return;
      if (spot) { await trainerSpotted(spot.npc, spot.k); return; }
      if (enc) await runEncounter(enc, m0);
    });
  }

  // Runs `fn` as the one async task at a time. Holds the world lock until it resolves.
  function task(fn) {
    if (taskBusy) return;
    taskBusy = true;
    busy++;
    Promise.resolve().then(fn).catch(showError).then(() => {
      taskBusy = false;
      busy--;
      refreshNpcs();
    });
  }

  // ---------- warps, entry, blackout ----------
  async function doWarp(w, tn) {
    if (tn) sfx(/stairs/.test(tn) ? 'stairs' : 'door');
    await warp(w.to, w.tx, w.ty, w.dir || 'down');
  }
  async function enterChecks() {
    const m0 = map;
    if (map.onEnter) await map.onEnter();
    if (map !== m0) return;
    const sp = findSpotter();
    if (sp) await trainerSpotted(sp.npc, sp.k);
  }
  async function warp(id, x, y, dir) {
    busy++;
    try {
      await fadeOut(0.25);
      load(id, x, y, dir);
      await fadeIn(0.25);
      await enterChecks();
    } finally {
      busy--;
      refreshNpcs();
    }
  }
  async function blackout() {
    busy++;
    try {
      await UI.say('{P} is out of usable TIDELINGS!\f{P} blacked out!');
      G.money = Math.floor(G.money / 2);
      await fadeOut(0.3, '#fff');
      Mon.healParty();
      const L = G.lastHeal || { map: 'player_house_1f', x: 5, y: 5 };
      await warp(L.map, L.x, L.y, 'down');
    } finally {
      busy--;
    }
  }
  function enter() {
    if (!scene) scene = { name: 'world', opaque: true, update: (dt) => update(dt), draw: (g) => draw(g) };
    if (!Scenes.has(scene)) Scenes.push(scene);
    busy++;
    return (async () => {
      try {
        load(G.map, G.x, G.y, G.dir);
        await fadeIn(0.3);
        await enterChecks();
      } finally {
        busy--;
        refreshNpcs();
      }
    })();
  }

  // ---------- trainers ----------
  // First undefeated trainer that can see the player: { npc, k } where k is the distance in tiles.
  function findSpotter() {
    for (const n of map.npcs) {
      const t = n.trainer;
      if (!t || !n.active || n.hidden || flag('tr_' + t.id)) continue;
      const [dx, dy] = DIRS[n.dir];
      const sight = t.sight || 4;
      for (let k = 1; k <= sight; k++) {
        const x = n.x + dx * k, y = n.y + dy * k;
        if (!inMap(x, y)) break;
        if (player.x === x && player.y === y) return { npc: n, k };
        if (tileAt(x, y).solid || itemAt(x, y, true) || npcAt(x, y, n)) break;
      }
    }
    return null;
  }
  async function trainerSpotted(n, k) {
    const t = n.trainer;
    await Script.emote(n, '!');
    bgm(t.music || 'trainer');
    if (k > 1) await Script.walk(n, L_LETTER[n.dir].repeat(k - 1));
    if (t.intro) await UI.say(t.intro);
    await Script.trainerBattle(n);
  }
  async function talkTo(n) {
    n.dir = dirTo(n, player);
    const t = n.trainer;
    if (t) {
      if (flag('tr_' + t.id)) {
        if (t.after) await UI.say(t.after);
        else if (n.text) await UI.say(n.text);
        return;
      }
      if (t.intro) await UI.say(t.intro);
      bgm(t.music || 'trainer');
      await Script.trainerBattle(n);
      return;
    }
    if (n.talk) { await n.talk(n); return; }
    if (n.text) await UI.say(n.text);
  }

  // ---------- encounters ----------
  function rollEncounter(ti) {
    if (DBG.noEncounters || !ti.enc || !map.encounters) return null;
    const E = map.encounters[ti.enc];
    if (!E || !E.list || !E.list.length) return null;
    const lead0 = lead();
    if (!lead0) return null;
    if (!R.chance(E.rate)) return null;
    const pick = R.weighted(E.list);
    const lv = R.int(pick[1], pick[2]);
    if (G.repel > 0 && lv < lead0.lv) return null;
    return { sp: pick[0], lv };
  }
  async function runEncounter(enc, m0) {
    sfx('encounter');
    const r = await Battle.wild(enc.sp, enc.lv);
    if (r === 'lose') { await blackout(); return; }
    if (map === m0 && m0.music) bgm(m0.music);
  }

  // ---------- A button ----------
  async function interact() {
    const d = player.dir;
    const [dx, dy] = DIRS[d];
    const fx = player.x + dx, fy = player.y + dy;
    let n = npcAt(fx, fy, null);
    if (!n && inMap(fx, fy) && tileAt(fx, fy).counter) n = npcAt(fx + dx, fy + dy, null);
    if (n) return talkTo(n);
    if (!inMap(fx, fy)) return;
    const it = map.items.find((i) => i.x === fx && i.y === fy && !flag(flagKey(i)));
    if (it) return pickup(it);
    const sign = (map.signs || []).find((s) => s.x === fx && s.y === fy);
    if (sign) return sign.run ? sign.run() : UI.say(sign.text);
    const tn = tileName(fx, fy);
    if ((tn === 'chop_tree' || tn === 'smash_rock') && !map.cleared.has(fx + ',' + fy)) return fieldMove(fx, fy, tn);
  }
  async function pickup(it) {
    setFlag(flagKey(it));
    await Script.give(it.item, it.n || 1);
  }
  async function fieldMove(fx, fy, tn) {
    const m = map;
    const chop = tn === 'chop_tree';
    const mv = chop ? 'chop' : 'smash', hm = chop ? 'hm_chop' : 'hm_smash', label = chop ? 'CHOP' : 'SMASH';
    const holder = G.party.find((p) => p && p.hp > 0 && Mon.knows(p, mv));
    if (!holder || !bagCount(hm)) {
      await UI.say(chop ? 'This tree looks like it can be CUT down!' : 'This rock looks like it can be SMASHED!');
      return;
    }
    if (!(await UI.yesno('Use ' + label + '?'))) return;
    await UI.say(Mon.name(holder) + ' used ' + label + '!');
    sfx(chop ? 'chop' : 'smash');
    m.shake = { x: fx, y: fy };
    await tween(0.5, () => {});
    const caveish = m.cave || !!(m.encounters && m.encounters.cave);
    m.tiles[fy * m.w + fx] = caveish ? 'cave_floor' : 'grass';
    m.shake = null;
    m.cleared.add(fx + ',' + fy);
  }

  // ---------- NPC wandering ----------
  function aiNpc(n, dt) {
    if (!n.active || n.hidden || n.moving || n.move === 'still' || !n.move) return;
    n.timer -= dt;
    if (n.timer > 0) return;
    if (n.move === 'look') {
      n.dir = R.pick(DIR_LIST);
      n.timer = 2 + R.float() * 2;
      return;
    }
    if (n.move === 'wander') {
      n.timer = 2 + R.float() * 3;
      const d = R.pick(DIR_LIST);
      const [dx, dy] = DIRS[d];
      const nx = n.x + dx, ny = n.y + dy;
      n.dir = d;
      if (Math.abs(nx - n.homeX) > 2 || Math.abs(ny - n.homeY) > 2) return;
      if (blockedFor(n, nx, ny)) return;
      startMove(n, nx, ny, WANDER, false, d);
    }
  }
  const DIR_LIST = ['up', 'down', 'left', 'right'];

  // ---------- per-frame ----------
  function update(dt) {
    if (!map) return;
    if (bumpCd > 0) bumpCd -= dt;
    if (popup) { popup.t += dt; if (popup.t >= 2) popup = null; }
    for (let i = rustles.length - 1; i >= 0; i--) { rustles[i].t += dt; if (rustles[i].t > 0.3) rustles.splice(i, 1); }
    advance(player, dt);
    for (const n of map.npcs) if (n.moving) advance(n, dt);
    if (busy > 0) return;
    for (const n of map.npcs) aiNpc(n, dt);
    input(dt);
  }

  // ---------- drawing ----------
  function draw(g) {
    if (!map) return;
    const p = player;
    const pv = visPos(p);
    const mw = map.w * TILE, mh = map.h * TILE;
    let cx = Math.round(pv.x + TILE / 2 - W / 2);
    let cy = Math.round(pv.gy + TILE / 2 - H / 2);
    cx = mw >= W ? clamp(cx, 0, mw - W) : -Math.floor((W - mw) / 2);
    cy = mh >= H ? clamp(cy, 0, mh - H) : -Math.floor((H - mh) / 2);

    g.fillStyle = '#000';
    g.fillRect(0, 0, W, H);
    g.save();
    g.translate(-cx, -cy);

    const x0 = Math.floor(cx / TILE) - 1, x1 = Math.ceil((cx + W) / TILE) + 1;
    const y0 = Math.floor(cy / TILE) - 1, y1 = Math.ceil((cy + H) / TILE) + 1;
    const shake = map.shake;
    const sx = shake ? Math.round(Math.sin(G.time * 80) * 1.5) : 0;
    for (let ty = y0; ty <= y1; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        let name;
        if (inMap(tx, ty)) name = tileName(tx, ty);
        else if (map.indoor) continue;
        else name = map.border || 'water';
        if (map.indoor && name === 'wall_in' && ty > 0) continue;   // GBA rooms: only the back wall is drawn
        const ox = shake && tx === shake.x && ty === shake.y ? sx : 0;
        drawTile(g, name, tx * TILE + ox, ty * TILE);
      }
    }

    // items on the ground
    for (const it of map.items) {
      if (it.hidden || flag(flagKey(it))) continue;
      if (it.x < x0 || it.x > x1 || it.y < y0 || it.y > y1) continue;
      drawOrb(g, it.x * TILE + 4, it.y * TILE + 4);
    }

    // hop shadow, then NPCs and the player sorted by y
    if (p.moving && p.moving.jump) {
      const e = clamp(p.moving.t / p.moving.dur, 0, 1);
      drawShadow(g, lerp(p.moving.fx, p.moving.tx, e) * TILE, pv.gy);
    }
    const ents = [];
    for (const n of map.npcs) if (n.active && !n.hidden && n.sprite !== 'none') ents.push(n);
    ents.push(p);
    const sorted = ents.map((o) => ({ o, v: visPos(o) }));
    sorted.sort((a, b) => a.v.gy - b.v.gy);
    for (const { o, v } of sorted) {
      drawChar(g, o === p ? 'player' : (o.sprite || o.id), Math.round(v.x), Math.round(v.y), o.dir, o.frame || 0);
      if (o.emote) drawBubble(g, Math.round(v.x), Math.round(v.y), o.emote);
    }

    // over layer (tall grass blades in front of the feet)
    for (let ty = y0; ty <= y1; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        if (!inMap(tx, ty)) continue;
        const ti = tileAt(tx, ty);
        if (ti.over && ti.drawOver) ti.drawOver(g, tx * TILE, ty * TILE, G.time);
      }
    }
    // rustles
    g.fillStyle = '#f4fff0';
    for (const r of rustles) {
      const rx = r.x * TILE, ry = r.y * TILE - 2 - Math.floor(r.t * 12);
      g.fillRect(rx + 3, ry, 1, 2); g.fillRect(rx + 7, ry - 2, 1, 2); g.fillRect(rx + 11, ry, 1, 2);
    }
    g.restore();

    if (popup) drawPopup(g);
  }

  // ---------- public ----------
  return {
    get player() { return player; },
    get map() { return map; },
    enter,
    warp,
    blackout,
    refresh: refreshNpcs,
    npc(id) { return map ? (map.npcs.find((n) => n.id === id) || null) : null; },
    lock() { busy++; },
    unlock() { busy = Math.max(0, busy - 1); },
    isBusy() { return busy > 0 || !!player.moving; },
    update,
    draw,
    // used by Script.walk: start one scripted step of `o` (player or npc) toward (nx, ny)
    _move: startMove,
    // tests: can the player stand on (x, y)?
    _walkable: (x, y) => inMap(x, y) && !blockedFor(player, x, y) && !tileAt(x, y).ledge,
  };
})();

// ---- 31_script.js
// Tidebound: script helpers for map scripts (items, monsters, walking, emotes, trainers, healing, shops, credits)
// and the debug hooks that drive the overworld (DBG.walk, DBG.step, DBG.where). Only `Script` is a top-level name.

const Script = (() => {
  const WALK = 0.25;
  const LETTER_DIR = { u: 'up', d: 'down', l: 'left', r: 'right' };
  const monC = {};

  function sfx(n) { try { if (typeof Sound !== 'undefined' && Sound.play) Sound.play(n); } catch (_) {} }
  function bgm(t) { try { if (typeof Music !== 'undefined' && Music.play) return Music.play(t); } catch (_) {} return null; }

  // 'player', an npc id, an npc object, or an object with x/y/dir
  function who(w) {
    if (w == null || w === 'player') return World.player;
    if (typeof w === 'string') return World.npc(w);
    return w;
  }
  function dirTo(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    if (dx === 0 && dy === 0) return 'down';
    if (Math.abs(dx) > Math.abs(dy)) return dx < 0 ? 'left' : 'right';
    return dy < 0 ? 'up' : 'down';
  }
  function monCanvas(sp) {
    if (!(sp in monC)) {
      try { monC[sp] = (typeof Sprites !== 'undefined' && Sprites.mon) ? Sprites.mon(sp) : null; } catch (_) { monC[sp] = null; }
    }
    return monC[sp];
  }

  // Bag item, with the "received" and "put in the BAG" messages. Key items skip the bag message.
  async function give(item, n = 1) {
    const it = (typeof ITEMS !== 'undefined' && ITEMS[item]) || { name: String(item).toUpperCase(), kind: 'medicine' };
    bagAdd(item, n);
    const name = it.name;
    if (it.kind === 'key') {
      sfx('keyitem');
      await UI.say('{P} received ' + name + '!');
      return;
    }
    sfx('item');
    const first = n > 1 ? '{P} found ' + n + ' ' + name + 's!' : '{P} received a ' + name + '!';
    const bagName = n > 1 ? name + 's' : name;
    await UI.say([first, '{P} put the ' + bagName + ' in the BAG.']);
  }

  // A new monster for the player. Nicknames are never asked for.
  async function giveMon(sp, lv) {
    const m = Mon.create(sp, lv);
    const where = Mon.addToParty(m);
    Mon.markCaught(sp);
    const nm = Mon.species(m).name;
    sfx('item');
    const msgs = ['{P} received ' + nm + '!'];
    if (where === 'box') msgs.push(nm + " was sent to someone's PC.");
    await UI.say(msgs);
    return m;
  }

  // Heal jingle, full heal, and remember this spot as the place to return to after a blackout.
  async function heal() {
    await Promise.resolve(bgm('heal'));
    Mon.healParty();
    const p = World.player;
    G.lastHeal = { map: G.map, x: p.x, y: p.y };
  }

  // Walk step by step. path: letters u d l r, optionally with a repeat count ('uurrd' or 'u3r2').
  async function walk(w, path) {
    const o = who(w);
    if (!o) return;
    const steps = [];
    const re = /([udlr])(\d*)/gi;
    const s = String(path || '').toLowerCase();
    let m;
    while ((m = re.exec(s))) {
      const n = m[2] ? parseInt(m[2], 10) : 1;
      for (let i = 0; i < n; i++) steps.push(LETTER_DIR[m[1]]);
    }
    const isPlayer = o === World.player;
    if (isPlayer) o.scripted = true;
    try {
      for (const d of steps) {
        const [dx, dy] = DIRS[d];
        World._move(o, o.x + dx, o.y + dy, WALK, false, d);
        await wait(WALK + 1 / 60);
        o.moving = null;
        o.frame = 0;
      }
    } finally {
      if (isPlayer) o.scripted = false;
    }
  }

  function face(w, dir) {
    const o = who(w);
    if (!o) return;
    o.dir = dir;
    if (o === World.player) G.dir = dir;
  }
  function faceEachOther(npc) {
    const n = who(npc), p = World.player;
    if (!n) return;
    n.dir = dirTo(n, p);
    p.dir = dirTo(p, n);
    G.dir = p.dir;
  }

  // Runtime add/remove of an npc. A hidden npc is neither drawn nor solid.
  function show(id) { const n = World.npc(id); if (n) n.hidden = false; }
  function hide(id) { const n = World.npc(id); if (n) { n.hidden = true; n.moving = null; } }

  // Speech bubble above a character for 0.6 s.
  async function emote(w, ch = '!') {
    const o = who(w);
    if (!o) return;
    o.emote = ch;
    await wait(0.6);
    o.emote = null;
  }

  // Battle a trainer npc. A win sets the defeated flag; a loss blacks out.
  async function trainerBattle(npc) {
    const t = npc.trainer;
    const m0 = World.map;
    const T = Object.assign({}, t, {
      party: (t.party || []).map((p) => p.slice()),
      sprite: npc.sprite || t.sprite,
    });
    const r = await Battle.trainer(T);
    if (r === 'win') {
      setFlag('tr_' + t.id);
      World.refresh();
    } else {
      await World.blackout();
      return 'lose';
    }
    if (World.map === m0 && m0 && m0.music) bgm(m0.music);
    return 'win';
  }

  function mart(items) { return Menus.mart(items); }
  function pc() { return Menus.pc(); }

  // Scrolling credits on an opaque scene. Resolves after the player presses A at THE END.
  function credits() {
    return new Promise((resolve) => {
      const LINES = [
        'TIDEBOUND', '', "A Chinny's Arcade game", '', 'Made with Claude', '',
        'Thanks for walking the coast', 'Coral, Maren and the Tidelings',
        'Captain Brine, Marina and the people of Lumen', '', 'Everything here is original.', '',
        'THE END ...for now',
      ];
      const LH = 16;
      const sEnd = H + (LINES.length - 1) * LH - (H / 2 - 4);
      const SPECIES = ['sproutle', 'embit', 'splishel', 'lumarine'];
      const st = { t: 0, scroll: 0, waitA: false, done: false };
      const scene = {
        name: 'credits',
        opaque: true,
        update(dt) {
          st.t += dt;
          if (st.waitA && Input.pressed('a')) finish();
        },
        draw(g) {
          g.fillStyle = '#101838';
          g.fillRect(0, 0, W, H);
          g.fillStyle = '#5870a0';
          for (let i = 0; i < 40; i++) {
            if ((i + Math.floor(st.t * 3)) % 5) g.fillRect((i * 97 + 13) % W, (i * 53 + 7) % H, 1, 1);
          }
          for (let i = 0; i < SPECIES.length; i++) {
            const c = monCanvas(SPECIES[i]);
            if (!c) continue;
            const x = ((i * 90 + st.t * 14) % (W + 64)) - 32;
            const y = 4 + (i % 2) * 130 + Math.sin(st.t * 1.3 + i) * 4;
            g.drawImage(c, Math.round(x), Math.round(y), 40, 40);
          }
          for (let i = 0; i < LINES.length; i++) {
            const s = LINES[i];
            if (!s) continue;
            const y = Math.round(H + i * LH - st.scroll);
            if (y < -LH || y > H) continue;
            drawText(g, s, Math.round((W - textWidth(s)) / 2), y, '#ffffff', '#000814');
          }
          if (st.waitA && Math.floor(st.t * 2) % 2 === 0) {
            drawText(g, 'PRESS A', Math.round((W - textWidth('PRESS A')) / 2), H - 14, '#ffe070', '#000814');
          }
        },
      };
      function finish() {
        if (st.done) return;
        st.done = true;
        Scenes.pop(scene);
        const m = World.map;
        if (m && m.music) bgm(m.music);
        resolve();
      }
      Scenes.push(scene);
      bgm('ending');
      tween(sEnd / 20, (t) => { st.scroll = sEnd * t; }).then(() => { st.waitA = true; });
    });
  }

  return {
    give, giveMon, heal, walk, face, faceEachOther, show, hide, emote, trainerBattle, mart, pc, credits,
    say: (...a) => UI.say(...a),
    choose: (...a) => UI.choose(...a),
  };
})();

// ---------- debug hooks (window.TB under #debug) ----------
DBG.world = World;
DBG.maps = Maps;
DBG.walk = (path) => Script.walk('player', path);
// Holds a direction until the player has started n steps (or something interrupts), then lets the last step finish.
DBG.step = async (dir, n = 1) => {
  const p = World.player, m0 = G.map;
  const s0 = p.stepN;
  Input.hold(dir, true);
  for (let f = 0; f < 60 * (n + 2) && p.stepN - s0 < n; f++) {
    await DBG.sim(1 / 60);
    if (G.map !== m0 || (Scenes.top() && Scenes.top().name !== 'world')) break;
  }
  Input.hold(dir, false);
  for (let f = 0; f < 120 && p.moving; f++) await DBG.sim(1 / 60);
  await DBG.sim(0.05);
};
DBG.where = () => ({ map: G.map, x: G.x, y: G.y, dir: G.dir });
DBG.noEncounters = false;

// ---- 40_battle.js
// Tidebound: battle engine. Turn order, damage, status and stat effects, the trainer AI, switching, running,
// catching, XP and the flow of a battle from transition to result. Drawing and animation are in
// 41_battle_ui.js (Battle.ui.*); the evolution scene is in 42_evolve.js. Only `Battle` and `Evolve` are top-level.

const Battle = {
  current: null,   // the battle in progress (read by the debug hook)
  ui: {},          // drawing and animation, filled in by 41_battle_ui.js
};

(function () {
  const B = Battle;

  const STAT_NAME = { atk: 'Attack', def: 'Defense', spa: 'Sp. Atk', spd: 'Sp. Def', spe: 'Speed', acc: 'accuracy', eva: 'evasion' };
  const STATUS_TEXT = { psn: 'was poisoned!', brn: 'was burned!', par: 'is paralyzed! It may be unable to move!', slp: 'fell asleep!' };
  const CRIT_RATE = [1 / 16, 1 / 8, 1 / 4, 1 / 3, 1 / 2];
  const ABILITY_TYPE = { overgrow: 'grass', blaze: 'fire', torrent: 'water' };
  const STRUGGLE = { id: 'struggle', name: 'STRUGGLE', type: 'normal', cat: 'phys', power: 50, acc: 0, pp: 1, prio: 0,
    contact: true, recoil: 0.25, desc: 'Used when every move is out of PP.' };

  const clampStage = (v) => Math.max(-6, Math.min(6, v));
  const stageMul = (s) => (s >= 0 ? (2 + s) / 2 : 2 / (2 - s));
  const accMul = (s) => (s >= 0 ? (3 + s) / 3 : 3 / (3 - s));
  const abil = (m) => m.ability;
  const typesOf = (m) => SPECIES[m.sp].types;
  const moveOf = (act) => (act.struggle ? STRUGGLE : MOVES[act.id]);
  const other = (k) => (k === 'p' ? 'e' : 'p');
  const pause = (sec) => wait(DBG.fast ? 0 : sec);

  // ---------- sides ----------
  // A side is one combatant on the field: { key: 'p'|'e', mon, wild, stages, flinch, seedBy, down, shown }.
  // `shown` is the HP the bar currently displays; the animation drains it toward mon.hp.
  function makeSide(key, mon, wild) {
    return {
      key, mon, wild, down: false, flinch: false, seedBy: null,
      stages: { atk: 0, def: 0, spa: 0, spd: 0, spe: 0, acc: 0, eva: 0 },
      shown: mon.hp, ox: 0, oy: 0, hide: false, alpha: 1, xpShown: 0,
    };
  }

  // "EMBIT", "The wild DUNEBUN", "Foe GULLIP": the prefix used at the start of a message.
  B.who = (side) => {
    const n = Mon.name(side.mon);
    if (side.key === 'p') return n;
    return side.wild ? 'The wild ' + n : 'Foe ' + n;
  };
  // "FOE GULLIP" for "It doesn't affect FOE GULLIP…"
  B.label = (side) => (side.key === 'p' ? '' : 'FOE ') + Mon.name(side.mon).toUpperCase();
  const say = (text, opts) => UI.say(text, opts);

  // XP progress inside the current level, 0..1 (for the XP bar).
  B.xpFrac = (m) => {
    const g = SPECIES[m.sp].growth;
    const lo = Mon.xpAt(m.lv, g), hi = Mon.xpAt(m.lv + 1, g);
    return Math.max(0, Math.min(1, (m.xp - lo) / Math.max(1, hi - lo)));
  };

  // ---------- stats ----------
  const statOf = (side, key) => Math.max(1, Math.floor(Mon.stats(side.mon)[key] * stageMul(side.stages[key])));

  function speedOf(side) {
    let v = statOf(side, 'spe');
    if (side.mon.status === 'par') v = Math.floor(v * 0.25);
    if (abil(side.mon) === 'swiftswim' && side.mon.hp === Mon.maxhp(side.mon)) v = Math.floor(v * 1.5);
    return v;
  }

  // ---------- damage ----------
  // Gen-3 formula. opts.crit: a critical hit. opts.avg: no random roll, for the trainer AI's estimates.
  function calcDamage(atk, def, mv, opts = {}) {
    const L = atk.mon.lv;
    const phys = mv.cat === 'phys';
    let A = statOf(atk, phys ? 'atk' : 'spa');
    const D = statOf(def, phys ? 'def' : 'spd');
    if (phys && atk.mon.status && abil(atk.mon) === 'guts') A = Math.floor(A * 1.5);
    const x = Math.floor(2 * L / 5 + 2);
    let dmg = Math.floor(Math.floor(x * mv.power * A / D) / 50) + 2;
    const crit = !!opts.crit && !opts.avg;
    if (crit) dmg *= 2;
    const roll = opts.avg ? 92.5 : R.int(85, 100);
    dmg = Math.floor(dmg * roll / 100);
    if (phys && atk.mon.status === 'brn' && abil(atk.mon) !== 'guts') dmg = Math.floor(dmg / 2);
    if (typesOf(atk.mon).includes(mv.type)) dmg = Math.floor(dmg * 1.5);
    const eff = typeEff(mv.type, typesOf(def.mon));
    dmg = Math.floor(dmg * eff);
    const item = atk.mon.item && ITEMS[atk.mon.item];
    if (item && item.typeBoost === mv.type) dmg = Math.floor(dmg * 1.2);
    if (ABILITY_TYPE[abil(atk.mon)] === mv.type && atk.mon.hp * 3 <= Mon.maxhp(atk.mon)) dmg = Math.floor(dmg * 1.5);
    if (mv.type === 'fire' && abil(def.mon) === 'thickfat') dmg = Math.floor(dmg * 0.5);
    if (eff > 0 && dmg < 1) dmg = 1;
    return { dmg: eff === 0 ? 0 : dmg, eff, crit };
  }

  // Trainer AI estimate: expected damage of a move with no crit and an average roll.
  const estDamage = (atk, def, mv) => (mv.cat === 'status' ? 0 : calcDamage(atk, def, mv, { avg: true }).dmg);

  function hitCheck(a, d, mv) {
    if (mv.ohko) {
      const diff = a.mon.lv - d.mon.lv;
      return diff >= 0 && R.float() * 100 < 30 + diff;
    }
    if (!mv.acc) return true;   // acc 0 never misses
    let acc = mv.acc * accMul(a.stages.acc) / accMul(d.stages.eva);
    if (abil(a.mon) === 'compoundeyes') acc *= 1.3;
    return R.float() * 100 < acc;
  }

  const effectText = (eff) => (eff > 1 ? 'It\'s super effective!' : eff < 1 && eff > 0 ? 'It\'s not very effective…' : null);

  // ---------- status and stat stages ----------
  function canInflict(side, s) {
    const m = side.mon;
    if (m.hp <= 0 || m.status) return false;
    const t = typesOf(m);
    if (s === 'psn' && t.includes('poison')) return false;
    if (s === 'brn' && t.includes('fire')) return false;
    return true;
  }

  async function inflict(side, s) {
    side.mon.status = s;
    if (s === 'slp') side.mon.slp = R.int(1, 3);
    await say(B.who(side) + ' ' + STATUS_TEXT[s]);
  }

  async function changeStat(side, stats) {
    for (const k of Object.keys(stats)) {
      const d = stats[k];
      if (k === 'acc' && d < 0 && abil(side.mon) === 'keeneye') {
        await say(B.who(side) + '\'s KEEN EYE prevents accuracy loss!');
        continue;
      }
      const cur = side.stages[k];
      const nv = clampStage(cur + d);
      if (nv === cur) {
        await say(B.who(side) + '\'s ' + STAT_NAME[k] + ' won\'t go ' + (d > 0 ? 'higher' : 'lower') + '!');
        continue;
      }
      side.stages[k] = nv;
      const big = Math.abs(d) >= 2;
      const verb = d > 0 ? (big ? 'sharply rose!' : 'rose!') : (big ? 'harshly fell!' : 'fell!');
      Sound.play(d > 0 ? 'statup' : 'statdown');
      await say(B.who(side) + '\'s ' + STAT_NAME[k] + ' ' + verb);
    }
  }

  // Contact abilities of the defender (static, poisonpoint) on the attacker.
  async function contactEffects(a, d) {
    const ab = abil(d.mon);
    if (ab === 'static' && R.float() < 0.3 && canInflict(a, 'par')) await inflict(a, 'par');
    else if (ab === 'poisonpoint' && R.float() < 0.3 && canInflict(a, 'psn')) await inflict(a, 'psn');
  }

  // ---------- move execution ----------
  // Returns false when the actor could not move this turn (asleep, flinched, paralysed).
  async function canAct(a) {
    const m = a.mon;
    if (m.status === 'slp') {
      if (m.slp > 0) {
        m.slp--;
        await say(B.who(a) + ' is fast asleep.');
        return false;
      }
      m.status = null;
      await say(B.who(a) + ' woke up!');
    }
    if (a.flinch) {
      await say(B.who(a) + ' flinched and couldn\'t move!');
      return false;
    }
    if (m.status === 'par' && R.float() < 0.25) {
      await say(B.who(a) + ' is paralyzed! It can\'t move!');
      return false;
    }
    return true;
  }

  // A status move (no damage). Effects: heal, rest, leech seed, status, stat stages.
  async function statusMove(S, ak, dk, mv) {
    const a = S[ak], d = S[dk];
    const selfSleep = mv.status && mv.status.self;
    const tgt = (mv.stat && mv.stat.target === 'self') || mv.heal || selfSleep ? a : d;
    if (mv.heal) {
      const max = Mon.maxhp(a.mon);
      if (a.mon.hp >= max) { await say('But it failed!'); return; }
      await B.ui.attack(S, ak, dk, mv, { dmg: 0 });
      if (selfSleep) {
        a.mon.status = 'slp';
        a.mon.slp = 2;
        a.mon.hp = max;
        await B.ui.drain(a);
        await say(B.who(a) + ' went to sleep and became healthy!');
        return;
      }
      a.mon.hp = Math.min(max, a.mon.hp + Math.floor(max * mv.heal));
      await B.ui.drain(a);
      await say(B.who(a) + ' regained health!');
      return;
    }
    if (mv.seed) {
      if (d.seedBy) { await say('But it failed!'); return; }
      await B.ui.attack(S, ak, dk, mv, { dmg: 0 });
      d.seedBy = ak;
      await say(B.who(d) + ' was seeded!');
      return;
    }
    if (mv.status && !selfSleep) {
      await B.ui.attack(S, ak, dk, mv, { dmg: 0 });
      if (!canInflict(d, mv.status.s)) { await say('But it failed!'); return; }
      await inflict(d, mv.status.s);
      return;
    }
    if (selfSleep) {   // rest with no heal (never used, but keep it safe)
      a.mon.status = 'slp';
      a.mon.slp = 2;
      await say(B.who(a) + ' went to sleep!');
      return;
    }
    if (mv.stat) {
      await B.ui.attack(S, ak, dk, mv, { dmg: 0 });
      await changeStat(tgt, mv.stat.stats);
      return;
    }
    await say('But it failed!');
  }

  // A damaging move: hits, crits, effectiveness, drain, recoil, secondary effects.
  async function damageMove(S, ak, dk, mv) {
    const a = S[ak], d = S[dk];
    const hits = mv.multi ? R.int(mv.multi[0], mv.multi[1]) : 1;
    let landed = 0, totalDmg = 0;
    for (let h = 0; h < hits; h++) {
      if (a.mon.hp <= 0 || d.mon.hp <= 0) break;
      const crit = R.float() < CRIT_RATE[Math.min(4, mv.crit || 0)];
      let r;
      if (mv.type === 'ground' && abil(d.mon) === 'levitate') r = { dmg: 0, eff: 0, crit: false };
      else if (mv.ohko) r = { dmg: d.mon.hp, eff: 1, crit: false };
      else if (mv.fixed) r = { dmg: mv.fixed, eff: 1, crit: false };
      else r = calcDamage(a, d, mv, { crit });
      if (r.eff === 0) {
        await say('It doesn\'t affect ' + B.label(d) + '…');
        break;
      }
      if (mv.type === 'water' && abil(d.mon) === 'waterabsorb') {
        d.mon.hp = Math.min(Mon.maxhp(d.mon), d.mon.hp + Math.floor(Mon.maxhp(d.mon) / 4));
        await B.ui.drain(d);
        await say(B.who(d) + '\'s WATER ABSORB restored HP!');
        break;
      }
      if (r.crit) await say('A critical hit!');
      let dmg = Math.min(r.dmg, d.mon.hp);
      const sturdy = abil(d.mon) === 'sturdy' && d.mon.hp === Mon.maxhp(d.mon) && dmg >= d.mon.hp;
      if (sturdy) dmg = d.mon.hp - 1;
      d.mon.hp -= dmg;
      landed++;
      totalDmg += dmg;
      await B.ui.attack(S, ak, dk, mv, { dmg, eff: r.eff, crit: r.crit });
      if (sturdy) await say(B.who(d) + ' endured the hit!');
      if (mv.ohko) await say('It\'s a one-hit KO!');
      const et = effectText(r.eff);
      if (et) await say(et);
      if (mv.contact && d.mon.hp > 0 && a.mon.hp > 0) await contactEffects(a, d);
      if (d.mon.hp <= 0) break;
    }
    if (!landed) return;
    if (hits > 1) await say('Hit ' + landed + ' time(s)!');

    if (mv.drain && a.mon.hp > 0) {
      const heal = Math.max(1, Math.floor(totalDmg * mv.drain));
      a.mon.hp = Math.min(Mon.maxhp(a.mon), a.mon.hp + heal);
      await B.ui.drain(a);
      await say('Sucked health from ' + B.label(d) + '!');
    }
    if (mv.recoil && a.mon.hp > 0) {
      const r = Math.max(1, Math.floor(totalDmg * mv.recoil));
      a.mon.hp = Math.max(0, a.mon.hp - r);
      await B.ui.drain(a);
