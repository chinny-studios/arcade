      await say(B.who(a) + ' is damaged by recoil!');
    }
    // secondary effects: they need the target alive
    if (mv.status && !mv.status.self && d.mon.hp > 0 && R.float() * 100 < mv.status.chance && canInflict(d, mv.status.s)) {
      await inflict(d, mv.status.s);
    }
    if (mv.flinch && d.mon.hp > 0 && R.float() * 100 < mv.flinch) d.flinch = true;
    if (mv.stat && mv.stat.chance !== undefined && R.float() * 100 < mv.stat.chance) {
      if (mv.stat.target === 'self' && a.mon.hp > 0) await changeStat(a, mv.stat.stats);
      else if (mv.stat.target !== 'self' && d.mon.hp > 0) await changeStat(d, mv.stat.stats);
    }
  }

  // Runs one move. act = { kind:'move', slot, id, struggle? }.
  async function useMove(S, ak, act) {
    const a = S[ak], dk = other(ak), d = S[dk];
    const mv = moveOf(act);
    if (!(await canAct(a))) return;
    await say(B.who(a) + ' used ' + mv.name + '!');
    if (!act.struggle) a.mon.moves[act.slot].pp--;
    if (!hitCheck(a, d, mv)) {
      await say(B.who(a) + '\'s attack missed!');
      return;
    }
    if (mv.cat === 'status') await statusMove(S, ak, dk, mv);
    else await damageMove(S, ak, dk, mv);
  }

  B._internal = { makeSide, statOf, speedOf, calcDamage, estDamage, canAct, useMove, changeStat, inflict, canInflict,
    moveOf, other, pause, abil, typesOf, say, STRUGGLE, clampStage, accMul, stageMul };

  // ---------- move choice ----------
  const usable = (m) => m.moves.map((mv, slot) => ({ slot, id: mv.id, pp: mv.pp })).filter((x) => x.pp > 0);
  const STRUGGLE_ACT = (mon) => ({ kind: 'move', struggle: true, slot: -1, id: 'struggle', mon, pri: 0 });
  const moveAct = (mon, slot) => ({ kind: 'move', slot, id: mon.moves[slot].id, mon, pri: MOVES[mon.moves[slot].id].prio });

  // Trainer AI: 70% the damaging move with the best expected damage, else random. Potion when low.
  function enemyAction(S) {
    const e = S.e, m = e.mon;
    if (!S.wild && S.potions > 0 && m.hp > 0 && m.hp <= Mon.maxhp(m) / 4) {
      S.potions--;
      return { kind: 'potion', mon: m, pri: 6 };
    }
    const opts = usable(m);
    if (!opts.length) return STRUGGLE_ACT(m);
    let pick;
    if (!S.wild && R.float() < 0.7) {
      let best = -1;
      for (const o of opts) {
        const d = estDamage(e, S.p, MOVES[o.id]);
        if (d > best) { best = d; pick = o; }
      }
    } else {
      pick = R.pick(opts);
    }
    return moveAct(m, pick.slot);
  }

  // Debug autoBattle: the usable move with the most expected damage (first move if none does damage).
  function bestAct(S) {
    const m = S.p.mon;
    const opts = usable(m);
    if (!opts.length) return STRUGGLE_ACT(m);
    let best = opts[0], bestD = -1;
    for (const o of opts) {
      const d = estDamage(S.p, S.e, MOVES[o.id]);
      if (d > bestD) { bestD = d; best = o; }
    }
    return moveAct(m, best.slot);
  }

  // Player's turn choice: FIGHT / BAG / TIDELINGS / RUN. Loops until something takes a turn.
  async function playerChoice(S) {
    if (DBG.autoBattle) return bestAct(S);
    for (;;) {
      const c = await B.ui.menu(S, 'action');
      if (c === 0) {
        const slot = await B.ui.moveMenu(S);
        if (slot < 0) continue;
        if (S.p.mon.moves[slot].pp <= 0) { await say('There\'s no PP left for this move!'); continue; }
        return moveAct(S.p.mon, slot);
      }
      if (c === 1) {
        const r = await Menus.bag({ mode: 'battle' });
        if (!r) continue;
        const it = ITEMS[r.item];
        if (it.kind === 'ball') {
          if (!S.wild) { await say('The trainer blocked the ORB!'); continue; }
          return { kind: 'ball', item: r.item, mon: S.p.mon, pri: 6 };
        }
        if (it.kind === 'medicine' && r.target != null) {
          const mon = G.party[r.target];
          const res = Menus.useMedicine(r.item, mon);
          await say(res.text);
          if (!res.ok) continue;
          bagAdd(r.item, -1);
          if (r.target === S.pi) await B.ui.drain(S.p);
          if (res.events && res.events.length) await Menus.showEvents(mon, res.events);
          return { kind: 'noop', mon: S.p.mon, pri: 6 };
        }
        await say('That can\'t be used here.');
        continue;
      }
      if (c === 2) {
        const idx = await chooseSwitch(S, false);
        if (idx < 0) continue;
        return { kind: 'switch', idx, mon: S.p.mon, pri: 6 };
      }
      if (c === 3) {
        const r = await tryRun(S);
        if (r === 'escaped') return { kind: 'escaped' };
        if (r === 'failed') return { kind: 'noop', mon: S.p.mon, pri: 6 };
      }
    }
  }

  // ---------- running ----------
  // Gen-3 escape: always when faster or with Run Away; otherwise F = speed*128/enemy speed + 30 per attempt.
  // Returns 'escaped', 'failed' (turn lost) or 'denied' (no turn used).
  async function tryRun(S, forced) {
    if (!S.wild) { await say('No! There\'s no running from a trainer battle!'); return 'denied'; }
    if (S.static) { await say('Can\'t escape!'); return 'denied'; }
    S.runs++;
    const p = S.p.mon, e = S.e.mon;
    const ps = Mon.stats(p).spe, es = Mon.stats(e).spe;
    let ok = abil(p) === 'runaway' || ps > es;
    if (!ok) {
      const F = Math.floor(ps * 128 / Math.max(1, es)) + 30 * (S.runs - 1);
      ok = R.int(0, 255) < F;
    }
    if (ok) {
      Sound.play('flee');
      await say('Got away safely!');
      S.result = 'run';
      S.over = true;
      return 'escaped';
    }
    await say('Can\'t escape!');
    return 'failed';
  }

  // ---------- catching ----------
  // Gen-3 catch: a = ((3maxHP - 2HP) × rate × ball) / 3maxHP × status; b from a; four shake checks.
  async function throwBall(S, item) {
    const ball = ITEMS[item];
    bagAdd(item, -1);
    const foe = S.e.mon, sp = SPECIES[foe.sp];
    const max = Mon.maxhp(foe);
    let a = ((3 * max - 2 * foe.hp) * sp.catchRate * ball.ballRate) / (3 * max);
    if (foe.status === 'slp') a *= 2;
    else if (foe.status === 'psn' || foe.status === 'par' || foe.status === 'brn') a *= 1.5;
    a = Math.max(1, Math.floor(a));
    let passes = 0;
    if (a >= 255) passes = 4;
    else {
      const b = Math.floor(1048560 / Math.sqrt(Math.sqrt(16711680 / a)));
      while (passes < 4 && R.int(0, 65535) < b) passes++;
    }
    const caught = passes >= 4;
    await B.ui.throwBall(S, item, caught ? 3 : Math.min(passes, 3), caught);
    if (!caught) {
      await say(passes === 3 ? 'Aww! It appeared to be caught!' : 'Oh no! ' + Mon.name(foe) + ' broke free!');
      return false;
    }
    const isNew = !G.dex.caught[foe.sp];
    Mon.markCaught(foe.sp);
    foe.ot = G.name;
    foe.caughtAt = World.map ? World.map.id : '';
    Music.play('caught');
    await say('Gotcha! ' + sp.name + ' was caught!');
    if (isNew) await say(sp.name + '\'s data was added to the TIDEDEX.');
    const wantNick = DBG.autoBattle ? false : await UI.yesno('Give a nickname to the caught ' + sp.name + '?');
    if (wantNick) {
      const nick = await Menus.name('Nickname for ' + sp.name + '?', sp.name);
      if (nick && nick.trim()) foe.nick = nick.trim();
    }
    if (Mon.addToParty(foe) === 'box') await say(Mon.name(foe) + ' was sent to the PC.');
    S.result = 'caught';
    S.over = true;
    return true;
  }

  // ---------- XP and level events ----------
  // Handles the events of Mon.gainXp for a battle: level messages and stats box, learn messages, forget prompts.
  // Evolutions are not run here: they are returned as { mon, to } and run after the battle.
  async function handleEvents(m, events, oldStats) {
    const name = Mon.name(m);
    const evolves = [];
    const leveled = events.some((ev) => ev.type === 'level');
    for (const ev of events) {
      if (ev.type === 'level') {
        Sound.play('levelup');
        await say(name + ' grew to Lv. ' + ev.lv + '!');
      }
    }
    if (leveled) await B.ui.statsBox(m, oldStats, Mon.stats(m));
    for (const ev of events) {
      if (ev.type === 'learn') {
        await say(name + ' learned ' + MOVES[ev.move].name + '!');
      } else if (ev.type === 'learnFull') {
        await learnFull(m, ev.move);
      } else if (ev.type === 'evolve' && Mon.canEvolve(m)) {
        evolves.push({ mon: m, to: ev.to });
      }
    }
    return evolves;
  }

  async function learnFull(m, move) {
    const name = Mon.name(m), mvName = MOVES[move].name;
    const question = name + ' wants to learn ' + mvName + '. But ' + name + ' can\'t learn more than four moves. '
      + 'Delete a move to make room for ' + mvName + '?';
    const yes = DBG.autoBattle ? false : await UI.yesno(question);
    const slot = yes ? await Menus.forgetMove(m, move) : -1;
    if (slot >= 0) {
      const old = MOVES[m.moves[slot].id].name;
      Mon.teach(m, move, slot);
      await say('1, 2, and... Poof! ' + name + ' forgot ' + old + '. And... ' + name + ' learned ' + mvName + '!');
    } else {
      await say(name + ' did not learn ' + mvName + '.');
    }
  }

  // Shares the XP of a fainted foe among the fighters (and half to each EXP. Share holder).
  async function awardXp(S, foe) {
    const total = Mon.xpYield(foe, !S.wild);
    const fighters = [...S.parts].filter((m) => m && m.hp > 0);
    const shares = new Map();
    if (fighters.length) for (const m of fighters) shares.set(m, Math.max(1, Math.floor(total / fighters.length)));
    for (const m of G.party) {
      if (m.item === 'expshare' && m.hp > 0) shares.set(m, (shares.get(m) || 0) + Math.max(1, Math.floor(total / 2)));
    }
    for (const [m, x] of shares) {
      const oldStats = Mon.stats(m);
      const frac0 = B.xpFrac(m);
      const lvBefore = m.lv;
      await say(Mon.name(m) + ' gained ' + x + ' EXP. Points!');
      const events = Mon.gainXp(m, x);
      if (m === S.p.mon) await B.ui.xpBar(S.p, frac0, B.xpFrac(m), m.lv !== lvBefore);
      const evolves = await handleEvents(m, events, oldStats);
      for (const ev of evolves) S.evolves.push(ev);
    }
  }

  // ---------- switching ----------
  async function enterEnemy(S, mon) {
    S.e = makeSide('e', mon, S.wild);
    Mon.markSeen(mon.sp);
    await B.ui.sendOut(S.e);
  }

  async function enterPlayer(S, idx) {
    const old = S.p && S.p.mon;
    if (old && old.hp > 0) {
      if (old.ability === 'naturalcure') { old.status = null; old.slp = 0; }
      await say(Mon.name(old) + ', come back!');
      await B.ui.recall(S.p);
    }
    S.pi = idx;
    S.p = makeSide('p', G.party[idx], false);
    S.parts.add(G.party[idx]);
    await say('Go! ' + Mon.name(G.party[idx]) + '!');
    await B.ui.sendOut(S.p);
  }

  // Intimidate: the foe's Attack drops when the mon comes in.
  async function intimidate(S, key) {
    const side = S[key], foe = S[other(key)];
    if (abil(side.mon) !== 'intimidate' || foe.mon.hp <= 0) return;
    await say(B.who(side) + '\'s INTIMIDATE!');
    await changeStat(foe, { atk: -1 });
  }

  async function switchIn(S, key, idx) {
    await enterPlayer(S, idx);
    await intimidate(S, 'p');
  }

  // Player picks a mon. forced: after a faint, no cancel. Returns the party index or -1.
  async function chooseSwitch(S, forced) {
    if (DBG.autoBattle) return G.party.findIndex((m, i) => m.hp > 0 && i !== S.pi);
    return Menus.party({
      mode: 'battle', active: S.pi, canCancel: !forced,
      title: forced ? 'Choose a TIDELING.' : undefined,
    });
  }

  // After the player's mon faints: "Use next TIDELING?" in wild battles (NO tries to run), then a switch.
  async function forcedSwitch(S) {
    for (;;) {
      if (S.wild) {
        const yes = DBG.autoBattle ? true : await UI.yesno('Use next TIDELING?');
        if (!yes) {
          const r = await tryRun(S, true);
          if (r === 'escaped') return;
        }
      }
      const idx = await chooseSwitch(S, true);
      if (idx >= 0) { await enterPlayer(S, idx); await intimidate(S, 'p'); return; }
    }
  }

  // ---------- faints ----------
  async function faintFoe(S) {
    const e = S.e;
    await B.ui.faint(e);
    await say(B.who(e) + ' fainted!');
    await awardXp(S, e.mon);
    S.parts = new Set([S.p.mon]);
    const ni = S.foes.findIndex((m) => m.hp > 0);
    if (ni < 0) { S.result = 'win'; S.over = true; return; }
    S.ei = ni;
    await say(S.title + ' is about to use ' + SPECIES[S.foes[ni].sp].name + '.');
    await enterEnemy(S, S.foes[ni]);
    await intimidate(S, 'e');
  }

  async function faintPlayer(S) {
    await B.ui.faint(S.p);
    await say(B.who(S.p) + ' fainted!');
    if (!G.party.some((m) => m.hp > 0)) {
      S.result = 'lose';
      S.over = true;
      await say('{P} is out of usable TIDELINGS!');
      return;
    }
    await forcedSwitch(S);
  }

  // Returns true when the battle is over.
  async function faintCheck(S) {
    if (S.over) return true;
    if (S.e.mon.hp <= 0) {
      await faintFoe(S);
      if (S.over) return true;
    }
    if (S.p.mon.hp <= 0) {
      await faintPlayer(S);
      return S.over;
    }
    return false;
  }

  // ---------- turn ----------
  // Higher priority first (items and switches are 6), then Quick Claw, then speed, ties random.
  function orderActs(S, list) {
    for (const x of list) {
      x.quick = x.act.kind === 'move' && S[x.key].mon.item === 'quickclaw' && R.float() < 0.2;
      x.spe = speedOf(S[x.key]);
      x.tie = R.float();
    }
    list.sort((x, y) => (y.act.pri - x.act.pri) || ((y.quick ? 1 : 0) - (x.quick ? 1 : 0))
      || (y.spe - x.spe) || (x.tie - y.tie));
    return list;
  }

  async function execAct(S, key, act) {
    switch (act.kind) {
      case 'move': return useMove(S, key, act);
      case 'ball': return throwBall(S, act.item);
      case 'switch': return switchIn(S, key, act.idx);
      case 'potion': {
        const e = S.e, max = Mon.maxhp(e.mon);
        e.mon.hp = Math.min(max, e.mon.hp + 20);
        await say(S.title + ' used a POTION!');
        return B.ui.drain(e);
      }
      default: return undefined;   // 'noop': the item was used before the turn
    }
  }

  // End-of-turn effects: poison, burn, leech seed, leftovers, berries, shed skin.
  async function endTurn(S) {
    for (const key of ['p', 'e']) {
      const side = S[key];
      side.flinch = false;
      const m = side.mon;
      if (m.hp <= 0) continue;
      const max = Mon.maxhp(m);
      if (side.seedBy) {
        const src = S[side.seedBy];
        const dmg = Math.max(1, Math.floor(max / 8));
        m.hp = Math.max(0, m.hp - dmg);
        await B.ui.drain(side);
        await say(B.who(side) + '\'s health is sapped by LEECH SEED!');
        if (src.mon.hp > 0) {
          src.mon.hp = Math.min(Mon.maxhp(src.mon), src.mon.hp + dmg);
          await B.ui.drain(src);
        }
      }
      if (m.hp > 0 && (m.status === 'psn' || m.status === 'brn')) {
        m.hp = Math.max(0, m.hp - Math.max(1, Math.floor(max / 8)));
        await B.ui.drain(side);
        await say(B.who(side) + (m.status === 'psn' ? ' is hurt by poison!' : ' is hurt by its burn!'));
      }
      if (m.hp > 0 && m.item === 'leftovers' && m.hp < max) {
        m.hp = Math.min(max, m.hp + Math.max(1, Math.floor(max / 16)));
        await B.ui.drain(side);
        await say(B.who(side) + ' restored a little HP using its LEFTOVERS!');
      }
      const berry = m.item && ITEMS[m.item];
      if (m.hp > 0 && berry && berry.threshold && m.hp <= max * berry.threshold) {
        m.hp = Math.min(max, m.hp + berry.heal);
        m.item = null;
        await B.ui.drain(side);
        await say(B.who(side) + ' ate its ORAN BERRY and regained HP!');
      } else if (m.hp > 0 && berry && berry.consume && berry.cure && m.status === berry.cure) {
        m.status = null; m.slp = 0; m.item = null;
        await say(B.who(side) + ' ate its ' + berry.name + ' and was cured!');
      }
      if (m.hp > 0 && m.status && abil(m) === 'shedskin' && R.float() < 0.3) {
        m.status = null; m.slp = 0;
        await say(B.who(side) + '\'s SHED SKIN cured its status!');
      }
    }
  }

  async function turn(S, pa) {
    S.turn++;
    const list = orderActs(S, [{ key: 'p', act: pa }, { key: 'e', act: enemyAction(S) }]);
    for (const x of list) {
      if (S.over) return;
      const side = S[x.key];
      if (x.act.mon !== side.mon || side.mon.hp <= 0) continue;
      await execAct(S, x.key, x.act);
      if (await faintCheck(S)) return;
    }
    if (S.over) return;
    await endTurn(S);
    await faintCheck(S);
  }

  // ---------- flow ----------
  async function intro(S) {
    if (S.wild) {
      await enterEnemy(S, S.foes[0]);
      await say('A wild ' + SPECIES[S.foes[0].sp].name + ' appeared!');
    } else {
      await B.ui.portrait(S, true);
      await say(S.title + ' would like to battle!');
      await B.ui.portrait(S, false);
      await say(S.title + ' sent out ' + SPECIES[S.foes[0].sp].name + '!');
      await enterEnemy(S, S.foes[0]);
    }
    await enterPlayer(S, S.pi);
    await intimidate(S, 'p');
    await intimidate(S, 'e');
  }

  async function finishMessages(S) {
    if (S.result !== 'win') return;
    Music.play(S.wild ? 'victory' : 'victoryTrainer');
    if (S.wild) return;
    await B.ui.portrait(S, true);
    if (S.t.lose) await say(S.t.lose);
    const last = S.foes[S.foes.length - 1];
    const money = (S.t.money || 0) * last.lv;
    if (money > 0) {
      G.money += money;
      Sound.play('money');
      await say('{P} got $' + money + ' for winning!');
    }
  }

  async function evolveAll(S) {
    const done = new Set();
    for (const ev of S.evolves) {
      if (done.has(ev.mon)) continue;
      done.add(ev.mon);
      const to = Mon.canEvolve(ev.mon);
      if (to) await Evolve.run(ev.mon, to);
    }
  }

  async function run(S) {
    B.current = S;
    S.prev = Music.current;
    S.parts = new Set();
    await B.ui.transition(S);
    Scenes.push(S.scene);
    Music.play(S.music);
    await intro(S);
    while (!S.over) {
      const pa = await playerChoice(S);
      if (pa.kind === 'escaped') break;
      await turn(S, pa);
    }
    await finishMessages(S);
    Scenes.pop(S.scene);
    if (S.result !== 'lose') await evolveAll(S);
    if (S.prev) Music.play(S.prev); else Music.stop();
    B.current = null;
    return S.result;
  }

  const potionCount = (items) => (Array.isArray(items) ? items.length : (items || 0));

  function begin(o) {
    const S = Object.assign({
      wild: false, static: false, music: 'battle', foes: [], title: '', t: null, potions: 0,
      turn: 0, runs: 0, pi: 0, p: null, e: null, ei: 0, parts: new Set(), evolves: [], over: false,
      result: null, prev: null, scene: null,
    }, o);
    S.pi = Math.max(0, G.party.findIndex((m) => m.hp > 0));
    S.scene = B.ui.scene(S);
    return run(S);
  }

  // Wild encounter. opts: { static, music, mon } (mon: a prebuilt monster). Resolves 'win'|'lose'|'run'|'caught'.
  B.wild = (sp, lv, opts = {}) => {
    const mon = opts.mon || Mon.create(sp, lv);
    return begin({ wild: true, static: !!opts.static, music: opts.music || 'battle', foes: [mon] });
  };

  // Trainer battle from a map trainer object. Resolves 'win'|'lose'.
  B.trainer = (t) => {
    const cls = t.cls, name = cls === 'RIVAL' ? G.rival : t.name;
    const foes = t.party.map(([sp, lv]) => Mon.create(sp, lv));
    const music = t.music || (cls === 'RIVAL' ? 'rival' : cls === 'LEADER' ? 'gymbattle' : 'trainer');
    return begin({ wild: false, music, foes, title: cls + ' ' + name, t, potions: potionCount(t.items) });
  };

  // Internal helpers for 41_battle_ui.js and 42_evolve.js.
  Object.assign(B, { handleEvents, learnFull, chooseSwitch, tryRun, abil, moveOf });

  DBG.battle_state = () => {
    const S = B.current;
    if (!S || !S.p || !S.e) return null;
    const p = S.p.mon, e = S.e.mon;
    return {
      player: { sp: p.sp, hp: p.hp, lv: p.lv },
      enemy: { sp: e.sp, hp: e.hp, lv: e.lv },
      turn: S.turn,
    };
  };
})();

// ---- 41_battle_ui.js
// Tidebound: battle scene drawing and menus (Battle.ui). The scene is opaque and owns the action and move menus
// (they are drawn and driven from its update, so the battle keeps its state while a menu is open). Animations are
// in the second half of this file. The logic lives in 40_battle.js.

(function () {
  const B = Battle;
  const ui = B.ui;
  const sprCache = new Map();
  const portraitCache = new Map();

  const monSprite = (sp, back) => {
    const k = sp + (back ? '|b' : '|f');
    if (!sprCache.has(k)) sprCache.set(k, Sprites.mon(sp, back));
    return sprCache.get(k);
  };
  function portraitFor(S) {
    if (!S.t) return null;
    let n = S.t.sprite || (S.t.cls === 'RIVAL' ? 'rival' : String(S.t.cls).toLowerCase());
    if (!Chars.names.includes(n)) n = 'youngster';
    if (!portraitCache.has(n)) portraitCache.set(n, Chars.portrait(n));
    return portraitCache.get(n);
  }

  // Positions (320x180 layout): enemy sprite bottom ~92, player back sprite bottom ~132.
  const E_X = 200, E_Y = 28, P_X = 52, P_Y = 68;
  const ENEMY_PLATE = { x: 232, y: 84, rx: 50, ry: 12 };
  const PLAYER_PLATE = { x: 84, y: 128, rx: 58, ry: 13 };
  const STATUS_COLOR = { psn: '#a040a0', brn: '#f08030', par: '#c8a810', slp: '#7880a0' };
  const MOVE_ROW_Y = [137, 146, 155, 164];
  const ACTION_LABELS = ['FIGHT', 'BAG', 'TIDELINGS', 'RUN'];

  const hpColor = (frac) => (frac > 0.5 ? '#38c060' : frac > 0.2 ? '#f0c020' : '#e04040');
  const cave = () => !!(World.map && World.map.id && String(World.map.id).includes('cave'));

  // ---------- backdrop ----------
  function drawBackdrop(g) {
    const grad = g.createLinearGradient(0, 0, 0, 110);
    if (cave()) {
      grad.addColorStop(0, '#2c2c36'); grad.addColorStop(1, '#5a5a68');
      g.fillStyle = grad; g.fillRect(0, 0, W, 110);
      const ground = g.createLinearGradient(0, 110, 0, H);
      ground.addColorStop(0, '#6e6e7c'); ground.addColorStop(1, '#4a4a56');
      g.fillStyle = ground; g.fillRect(0, 110, W, H - 110);
      g.fillStyle = '#7e7e8c';
      for (let i = 0; i < 14; i++) g.fillRect((i * 37) % W, 112 + ((i * 13) % 50), 6, 2);
    } else {
      grad.addColorStop(0, '#8fd0f0'); grad.addColorStop(1, '#e6f8ff');
      g.fillStyle = grad; g.fillRect(0, 0, W, 110);
      const ground = g.createLinearGradient(0, 100, 0, H);
      ground.addColorStop(0, '#bfe596'); ground.addColorStop(1, '#8cc860');
      g.fillStyle = ground; g.fillRect(0, 100, W, H - 100);
    }
  }

  function ellipse(g, p, fill, edge) {
    g.beginPath();
    g.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, Math.PI * 2);
    g.fillStyle = edge; g.fill();
    g.beginPath();
    g.ellipse(p.x, p.y - 1, p.rx - 2, p.ry - 2, 0, 0, Math.PI * 2);
    g.fillStyle = fill; g.fill();
  }

  function drawPlatforms(g) {
    const c = cave();
    ellipse(g, ENEMY_PLATE, c ? '#8a8a98' : '#a8d880', c ? '#505060' : '#6aa050');
    ellipse(g, PLAYER_PLATE, c ? '#8a8a98' : '#a8d880', c ? '#505060' : '#6aa050');
  }

  // ---------- sprites and boxes ----------
  function drawSide(g, side, x, y, back) {
    if (!side || !side.mon || side.hide) return;
    const sp = side.mon.sp;
    const k = side.shrink == null ? 1 : side.shrink;
    const img = monSprite(sp, back);
    const px = x + side.ox + (side.lx || 0), py = y + side.oy;
    g.save();
    g.globalAlpha = side.alpha == null ? 1 : side.alpha;
    if (k < 1) {
      if (k <= 0) { g.restore(); return; }
      g.drawImage(img, px + 32 * (1 - k), py + 64 * (1 - k), 64 * k, 64 * k);
    } else {
      g.drawImage(img, px, py);
    }
    if (side.flash > 0) {
      g.globalAlpha = side.flash * 0.7;
      g.fillStyle = '#ff3030';
      g.fillRect(px + 16, py + 8, 32, 48);
    }
    g.restore();
  }

  function statusBadge(g, m, x, y) {
    if (!m.status) return;
    const label = Mon.statusName(m.status);
    const w = textWidth(label) + 4;
    g.fillStyle = STATUS_COLOR[m.status] || '#808080';
    g.fillRect(x, y, w, 9);
    drawText(g, label, x + 2, y + 1, '#ffffff', 'rgba(0,0,0,0)');
  }

  function drawBar(g, x, y, w, h, frac, color) {
    g.fillStyle = '#404040'; g.fillRect(x - 1, y - 1, w + 2, h + 2);
    g.fillStyle = '#f8f8f8'; g.fillRect(x, y, w, h);
    g.fillStyle = color; g.fillRect(x, y, Math.round(w * Math.max(0, Math.min(1, frac))), h);
  }

  // Enemy box: top-left, name, level, status, HP bar.
  function drawEnemyBox(g, side) {
    const m = side.mon, max = Mon.maxhp(m);
    UI.box(g, 8, 10, 128, 34, 'white');
    drawText(g, Mon.name(m).toUpperCase(), 14, 15);
    statusBadge(g, m, 14 + textWidth(Mon.name(m).toUpperCase()) + 6, 14);
    drawText(g, 'Lv' + m.lv, 100, 15);
    drawText(g, 'HP', 14, 27);
    drawBar(g, 32, 28, 96, 4, side.shown / max, hpColor(side.shown / max));
  }

  // Player box: bottom-right, numbers and blue XP bar.
  function drawPlayerBox(g, side) {
    const m = side.mon, max = Mon.maxhp(m);
    if (side.xpShown === undefined) { side.xpShown = B.xpFrac(m); }
    UI.box(g, 176, 92, 136, 38, 'white');
    drawText(g, Mon.name(m).toUpperCase(), 182, 97);
    statusBadge(g, m, 182 + textWidth(Mon.name(m).toUpperCase()) + 6, 96);
    drawText(g, 'Lv' + m.lv, 280, 97);
    drawText(g, 'HP', 182, 108);
    drawBar(g, 200, 109, 104, 4, side.shown / max, hpColor(side.shown / max));
    drawText(g, side.shown + '/' + String(max).padStart(3, ' '), 228, 116);
    g.fillStyle = '#404040'; g.fillRect(182, 124, 124, 4);
    g.fillStyle = '#f8f8f8'; g.fillRect(183, 125, 122, 2);
    g.fillStyle = '#3870d8'; g.fillRect(183, 125, Math.round(122 * Math.max(0, Math.min(1, side.xpShown))), 2);
  }

  // Party balls for trainer battles, drawn under the enemy box.
  function drawBalls(g, S) {
    if (S.wild || !S.foes.length) return;
    S.foes.forEach((m, i) => {
      const x = 12 + i * 8, y = 48;
      g.beginPath(); g.arc(x, y, 3, 0, Math.PI * 2);
      if (m.hp <= 0) g.fillStyle = '#606060';
      else if (i <= S.ei) g.fillStyle = '#e04040';
      else g.fillStyle = '#f8f8f8';
      g.fill();
      g.strokeStyle = '#384870'; g.lineWidth = 1; g.stroke();
    });
  }

  function drawTrainer(g, S) {
    const pic = portraitFor(S);
    if (!pic) return;
    const x = E_X + (S.pox || 0);
    g.drawImage(pic, x, E_Y);
  }

  function drawBall(g, S) {
    const b = S.ball;
    if (!b || !b.visible) return;
    const y = b.y + (b.wob || 0);
    const x = b.x;
    g.fillStyle = '#384870'; g.fillRect(x - 4, y - 4, 9, 9);
    g.fillStyle = '#e04040'; g.fillRect(x - 3, y - 3, 7, 3);
    g.fillStyle = '#f8f8f8'; g.fillRect(x - 3, y, 7, 3);
    g.fillStyle = '#ffffff'; g.fillRect(x - 1, y - 1, 2, 2);
  }

  // ---------- particles (move effects, Battle.ui.attack) ----------
  function drawFx(g, S) {
    for (const p of S.fx) {
      if (p.u <= 0 || p.u >= 1) continue;
      const x = p.x0 + (p.x1 - p.x0) * p.u;
      const y = p.y0 + (p.y1 - p.y0) * p.u - Math.sin(p.u * Math.PI) * p.arc;
      g.fillStyle = p.color;
      switch (p.shape) {
        case 'leaf': g.fillRect(x, y, 3, 2); break;
        case 'spark': g.fillRect(x - 1, y, 3, 1); g.fillRect(x, y - 1, 1, 3); break;
        case 'rock': g.fillRect(x, y, 3, 3); g.fillStyle = '#50483a'; g.fillRect(x + 2, y + 2, 1, 1); break;
        case 'bubble': g.strokeStyle = p.color; g.lineWidth = 1; g.strokeRect(x, y, 3, 3); break;
        case 'gust': g.fillRect(x, y, 4, 1); break;
        case 'slash': g.fillRect(x, y, 6, 1); break;
        case 'wave': {
          g.strokeStyle = p.color; g.lineWidth = 1;
          g.beginPath(); g.arc(p.x1, p.y1, 4 + 12 * p.u, -0.8, 0.8); g.stroke();
          break;
        }
        default: g.fillRect(x, y, 2, 2);
      }
    }
  }

  // ---------- menus ----------
  function drawActionMenu(g, S, m) {
    UI.box(g, 4, 132, 156, 44, 'white');
    const who = Mon.name(S.p.mon);
    const lines = wrapText('What will ' + who + ' do?', 140);
    lines.forEach((ln, i) => drawText(g, ln, 12, 141 + i * 12));
    UI.box(g, 164, 132, 152, 44, 'white');
    ACTION_LABELS.forEach((label, i) => {
      const col = i & 1, row = i >> 1;
      drawText(g, label, 180 + col * 68, 141 + row * 16);
    });
    const cx = 170 + (m.cur & 1) * 68, cy = 141 + (m.cur >> 1) * 16;
    UI.cursor(g, cx, cy - 1);
  }

  function drawMoveMenu(g, S, m) {
    const mon = S.p.mon;
    UI.box(g, 4, 132, 196, 44, 'white');
    mon.moves.forEach((mv, i) => {
      const info = MOVES[mv.id];
      drawText(g, info.name, 16, MOVE_ROW_Y[i] - 1);
    });
    if (m.cur >= mon.moves.length) m.cur = Math.max(0, mon.moves.length - 1);
    UI.cursor(g, 6, MOVE_ROW_Y[m.cur] - 1);
    UI.box(g, 204, 132, 112, 44, 'white');
    const mv = mon.moves[m.cur];
    if (mv) {
      const info = MOVES[mv.id];
      drawText(g, 'PP ' + mv.pp + '/' + info.pp, 212, 141);
      drawText(g, 'TYPE/' + info.type.toUpperCase(), 212, 157, TYPE_COLOR[info.type] || '#404040');
    }
  }

  // ---------- the scene ----------
  ui.scene = (S) => {
    S.fx = S.fx || [];
    S.pox = S.pox || 0;
    const scene = {
      name: 'battle',
      opaque: true,
      update(dt) {
        const m = S.menu;
        if (m) {
          if (m.kind === 'action') {
            if (Input.repeat('left') && (m.cur & 1)) m.cur--;
            if (Input.repeat('right') && !(m.cur & 1)) m.cur++;
            if (Input.repeat('up') && m.cur >= 2) m.cur -= 2;
            if (Input.repeat('down') && m.cur < 2) m.cur += 2;
            if (Input.pressed('a')) { S.menu = null; m.res(m.cur); }
          } else if (m.kind === 'move') {
            const n = S.p.mon.moves.length;
            if (Input.repeat('up') && m.cur > 0) m.cur--;
            if (Input.repeat('down') && m.cur < n - 1) m.cur++;
            if (Input.pressed('b')) { S.menu = null; m.res(-1); }
            else if (Input.pressed('a')) { S.menu = null; m.res(m.cur); }
          }
        }
        // low HP warning: a beep every half second while the player's mon is in the red
        const pm = S.p && S.p.mon;
        const low = pm && pm.hp > 0 && S.p.shown / Mon.maxhp(pm) <= 0.2;
        if (low) {
          S.beep = (S.beep || 0) - dt;
          if (S.beep <= 0) { Sound.play('lowhp'); S.beep = 0.5; }
        } else {
          S.beep = 0;
        }
      },
      draw(g) {
        drawBackdrop(g);
        drawPlatforms(g);
        if (S.portraitOn) drawTrainer(g, S);
        else if (S.e && S.e.mon) drawSide(g, S.e, E_X, E_Y, false);
        if ((S.e && S.e.mon) || S.portraitOn) drawBalls(g, S);
        drawBall(g, S);
        if (S.p && S.p.mon) drawSide(g, S.p, P_X, P_Y, true);
        if (S.e && S.e.mon && !S.portraitOn && !S.pox) drawEnemyBox(g, S.e);
        if (S.p && S.p.mon) drawPlayerBox(g, S.p);
        drawFx(g, S);
        if (S.menu && S.menu.kind === 'action') drawActionMenu(g, S, S.menu);
        if (S.menu && S.menu.kind === 'move') drawMoveMenu(g, S, S.menu);
      },
    };
    return scene;
  };

  // Action menu: resolves with 0 FIGHT, 1 BAG, 2 TIDELINGS, 3 RUN.
  ui.menu = (S) => new Promise((res) => { S.menu = { kind: 'action', cur: 0, res }; });

  // Move menu: resolves with the move slot, or -1 for B.
  ui.moveMenu = (S) => new Promise((res) => { S.menu = { kind: 'move', cur: 0, res }; });

  // ---------- transition ----------
  // GBA-style: a few white flashes, then black bars close in from the top and bottom.
  ui.transition = (S) => new Promise((res) => {
    if (DBG.fast) { res(); return; }
    const sc = {
      name: 'transition', opaque: false, t: 0,
      update(dt) {
        this.t += dt;
        if (this.t >= 0.8) { Scenes.pop(this); res(); }
      },
      draw(g) {
        const t = this.t;
        if (t < 0.4) {
          if (Math.floor(t * 12) % 2 === 0) { g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H); }
          else { g.fillStyle = '#000000'; g.fillRect(0, 0, W, H); }
        } else {
          const h = Math.min(90, 90 * (t - 0.4) / 0.4);
          g.fillStyle = '#000000';
          g.fillRect(0, 0, W, h);
          g.fillRect(0, H - h, W, h);
        }
      },
    };
    Scenes.push(sc);
  });

})();

// Battle animations: hit effects, HP drain, faint, send out, portrait slide, catch throw, XP bar, stats box.
(function () {
  const B = Battle;
  const ui = B.ui;
  const fast = () => DBG.fast;

  // Move effects by type: [particle shape, colour]. Status moves send sound waves.
  const FX = {
    fire: ['ember', '#f08030'], water: ['bubble', '#6890f0'], grass: ['leaf', '#78c850'],
    electric: ['spark', '#f8d030'], rock: ['rock', '#b8a038'], ground: ['rock', '#c8a850'],
    flying: ['gust', '#c8d8ff'], bug: ['slash', '#a8b820'], poison: ['bubble', '#a040a0'], normal: ['slash', '#ffffff'],
  };
  const centerOf = (key) => (key === 'p' ? { x: 84, y: 98 } : { x: 232, y: 60 });

  // Particles fly from the attacker to the target over about half a second.
  function particles(S, ak, tk, shape, color, n) {
    const from = centerOf(ak), to = centerOf(tk);
    const list = [];
    for (let i = 0; i < n; i++) {
      const p = { shape, color, d: i * 0.05, u: 0, arc: shape === 'wave' ? 0 : 10 };
      if (shape === 'wave') {
        p.x0 = to.x; p.y0 = to.y; p.x1 = to.x; p.y1 = to.y;
      } else {
        p.x0 = from.x + R.float() * 8 - 4; p.y0 = from.y + R.float() * 8 - 4;
        p.x1 = to.x + R.float() * 12 - 6; p.y1 = to.y + R.float() * 12 - 6;
      }
      list.push(p);
    }
    S.fx = (S.fx || []).concat(list);
    const dur = 0.55;
    return tween(dur, (t) => {
      for (const p of list) p.u = Math.max(0, Math.min(1, (t * dur - p.d) / 0.3));
    }).then(() => { S.fx = S.fx.filter((p) => !list.includes(p)); });
  }

  // A physical contact move lunges the attacker forward and back.
  function lunge(side, dir) {
    return tween(0.2, (t) => { side.lx = dir * 12 * Math.sin(t * Math.PI); }).then(() => { side.lx = 0; });
  }

  // Blink three times (the target flickers).
  function blink(side) {
    if (fast()) return Promise.resolve();
    return tween(0.36, (t) => { side.hide = Math.floor(t * 6) % 2 === 1; }).then(() => { side.hide = false; });
  }

  // HP bar drains smoothly from what it shows to the monster's real HP.
  ui.drain = (side) => {
    const from = side.shown, to = side.mon.hp;
    if (fast() || from === to) { side.shown = to; return Promise.resolve(); }
    return tween(0.6, (t) => { side.shown = Math.round(lerp(from, to, t)); }).then(() => { side.shown = to; });
  };

  // One move's visual and sound. o: { dmg, eff, crit }. The defender's HP bar drains when damage was done.
  ui.attack = async (S, ak, dk, mv, o = {}) => {
    const a = S[ak], d = S[dk];
    const isStatus = mv.cat === 'status';
    const toSelf = isStatus && ((mv.stat && mv.stat.target === 'self') || mv.heal || (mv.status && mv.status.self));
    const tk = toSelf ? ak : dk;
    if (!fast() && !isStatus && mv.contact && o.dmg > 0) await lunge(a, ak === 'p' ? 1 : -1);
    if (!fast()) {
      const [shape, color] = isStatus ? ['wave', TYPE_COLOR[mv.type] || '#ffffff'] : (FX[mv.type] || FX.normal);
      await particles(S, ak, tk, shape, color, isStatus ? 1 : 6);
    }
    if (o.dmg > 0) {
      Sound.play(o.eff > 1 ? 'hitsuper' : (o.eff < 1 ? 'hitweak' : 'hit'));
      await blink(d);
      await ui.drain(d);
    }
  };

  // Faint: the sprite slides down out of view.
  ui.faint = (side) => {
    Sound.play('faint');
    if (fast()) { side.hide = true; return Promise.resolve(); }
    return tween(0.6, (t) => { side.oy = 60 * t; side.alpha = 1 - t; }).then(() => { side.hide = true; });
  };

  // Recall the player's mon (before a switch).
  ui.recall = (side) => {
    if (fast()) { side.hide = true; return Promise.resolve(); }
    return tween(0.4, (t) => { side.oy = 80 * t; side.alpha = 1 - t; }).then(() => { side.hide = true; });
  };

  // Send out: the enemy slides in from the right, the player's mon rises from below.
  ui.sendOut = (side) => {
    side.hide = false;
    side.alpha = 1;
    side.lx = 0;
    if (fast()) { side.ox = 0; side.oy = 0; return Promise.resolve(); }
    const enemy = side.key === 'e';
    if (enemy) side.ox = 120; else side.oy = 80;
    return tween(0.5, (t) => {
      const e = 1 - Math.pow(1 - t, 3);
      if (enemy) side.ox = 120 * (1 - e); else side.oy = 80 * (1 - e);
    }).then(() => { side.ox = 0; side.oy = 0; });
  };

  // Trainer portrait slides in on the enemy platform (on) or out to the right (off).
  ui.portrait = (S, on) => {
    if (on) S.portraitOn = true;
    if (fast()) {
      S.pox = 0;
      if (!on) S.portraitOn = false;
      return Promise.resolve();
    }
    const from = on ? 120 : 0, to = on ? 0 : 120;
    S.pox = from;
    return tween(0.5, (t) => {
      const e = 1 - Math.pow(1 - t, 3);
      S.pox = from + (to - from) * e;
    }).then(() => {
      if (!on) S.portraitOn = false;
      S.pox = 0;
    });
  };

  // Catch: the orb arcs to the foe, the foe shrinks into it with red flashes, the orb drops and shakes.
  // shakes: 0..3 shakes before it breaks, or 3 when caught. The enemy reappears when it breaks free.
  ui.throwBall = (S, item, shakes, caught) => {
    const e = S.e;
    if (fast()) { if (caught && e) e.hide = true; return Promise.resolve(); }
    const ball = { x: 84, y: 110, wob: 0, visible: true };
    S.ball = ball;
    Sound.play('throw');
    let p = tween(0.5, (t) => {
      ball.x = 84 + (232 - 84) * t;
      ball.y = 110 + (60 - 110) * t - Math.sin(Math.PI * t) * 40;
    });
    p = p.then(() => tween(0.4, (t) => {
      if (e) { e.shrink = 1 - t; e.flash = Math.floor(t * 8) % 2 ? 0.6 : 0; }
    })).then(() => {
      if (e) { e.flash = 0; }
      return tween(0.2, (t) => { ball.y = 60 + 26 * t; });
    });
    const n = caught ? 3 : shakes;
    for (let i = 0; i < n; i++) {
      p = p.then(() => {
        Sound.play('shake');
        return tween(0.5, (t) => { ball.wob = Math.sin(t * Math.PI * 4) * 4 * (1 - t); });
      }).then(() => { ball.wob = 0; return wait(0.2); });
    }
    return p.then(() => {
      ball.visible = false;
      if (caught) { if (e) e.hide = true; return null; }
      if (!e) return null;
      return tween(0.3, (t) => { e.shrink = t; }).then(() => { e.shrink = 1; e.flash = 0; });
    });
  };

  // XP bar: fills from `from` to `to`; on a level up it fills to the end, empties and fills again.
  ui.xpBar = (side, from, to, levelUp) => {
    if (fast()) { side.xpShown = to; return Promise.resolve(); }
    side.xpShown = from;
    const end = levelUp ? 1 : to;
    return tween(0.5, (t) => { side.xpShown = lerp(from, end, t); }).then(() => {
      if (!levelUp) return null;
      side.xpShown = 0;
      return tween(0.4, (t) => { side.xpShown = lerp(0, to, t); });
    });
  };

  // Stats box after a level up: page 1 shows the gains, page 2 the new totals. A or B turns the page.
  ui.statsBox = (m, oldS, newS) => {
    if (DBG.autoBattle || DBG.autoText) return wait(0.05);
    const rows = [['HP', 'hp'], ['Attack', 'atk'], ['Defense', 'def'], ['Sp. Atk', 'spa'], ['Sp. Def', 'spd'], ['Speed', 'spe']];
    return new Promise((res) => {
      const sc = {
        name: 'statsbox', opaque: false, page: 0,
        update() {
          if (Input.pressed('a') || Input.pressed('b')) {
            if (this.page === 0) this.page = 1;
            else { Scenes.pop(this); res(); }
          }
        },
        draw(g) {
          UI.box(g, 56, 14, 208, 130, 'white');
          drawText(g, Mon.name(m).toUpperCase() + ' Lv. ' + m.lv, 68, 24);
          rows.forEach(([label, k], i) => {
            const y = 42 + i * 14;
            drawText(g, label, 68, y);
            const val = this.page === 0 ? '+' + (newS[k] - oldS[k]) : String(newS[k]);
            drawText(g, val, 256 - textWidth(val), y);
          });
        },
      };
      Scenes.push(sc);
    });
  };
})();

// ---- 42_evolve.js
// Tidebound: the evolution scene. Evolve.run(mon, to) plays the animation, changes the species and checks the
// moves the new species learns at its level. B cancels before the change. Top-level names: Evolve only.

const Evolve = (() => {
  const SPARKLES = Array.from({ length: 24 }, (_, i) => ({
    x: (i * 53) % W, y: (i * 37) % H, ph: (i * 1.7) % 6.28,
  }));
  const silhouettes = new Map();

  // A white copy of a monster sprite, for the flicker.
  function silhouette(sp) {
    if (!silhouettes.has(sp)) {
      const src = Sprites.mon(sp, false);
      silhouettes.set(sp, makeCanvas(src.width, src.height, (c, g) => {
        g.drawImage(src, 0, 0);
        g.globalCompositeOperation = 'source-in';
        g.fillStyle = '#ffffff';
        g.fillRect(0, 0, c.width, c.height);
      }));
    }
    return silhouettes.get(sp);
  }

  // The scene: a dark background with sparkles. It drives the flicker and the flash itself, from its update.
  function makeScene(from, to) {
    const sc = {
      name: 'evolve', opaque: true, t: 0, acc: 0, period: 0.4, showNew: false, phase: 'idle',
      white: 0, res: null, onFlash: null,
      update(dt) {
        this.t += dt;
        if (this.phase === 'anim') {
          if (Input.pressed('b')) { this.finish(false); return; }
          const k = Math.min(1, this.t / 4);
          this.period = 0.42 - (0.42 - 0.05) * k;
          this.acc += dt;
          while (this.acc >= this.period) { this.acc -= this.period; this.showNew = !this.showNew; }
          if (this.t >= 4) this.finish(true);
        } else if (this.phase === 'flash') {
          this.white = Math.max(0, this.white - dt * 1.2);
          if (this.white <= 0 && this.onFlash) { const f = this.onFlash; this.onFlash = null; this.phase = 'idle'; f(); }
        }
      },
      finish(ok) {
        this.phase = 'idle';
        this.showNew = false;
        const r = this.res; this.res = null;
        if (r) r(ok);
      },
      draw(g) {
        g.fillStyle = '#101828';
        g.fillRect(0, 0, W, H);
        for (const s of SPARKLES) {
          const a = 0.35 + 0.65 * Math.max(0, Math.sin(this.t * 3 + s.ph));
          g.fillStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')';
          g.fillRect(s.x, s.y, 1, 1);
        }
        const img = this.showNew ? silhouette(to) : silhouette(from);
        g.drawImage(img, 128, 36);
        if (this.white > 0) {
          g.globalAlpha = Math.min(1, this.white);
          g.fillStyle = '#ffffff';
          g.fillRect(0, 0, W, H);
          g.globalAlpha = 1;
        }
      },
    };
    // Evolution flicker: resolves true when the timer runs out, false on B.
    sc.animate = () => new Promise((res) => {
      sc.res = res;
      sc.phase = 'anim';
      sc.t = 0;
      sc.acc = 0;
      if (DBG.fast) { sc.finish(true); }
    });
    // Full white flash, then the new sprite is shown.
    sc.flashOut = () => new Promise((res) => {
      if (DBG.fast) { sc.showNew = true; res(); return; }
      sc.white = 1;
      sc.phase = 'flash';
      sc.onFlash = () => { sc.showNew = true; res(); };
    });
    return sc;
  }

  // Learn the moves the new species gets at the current level. A full moveset asks which move to forget.
  async function learnAtLevel(mon) {
    const name = Mon.name(mon);
    for (const id of Mon.learnable(mon, mon.lv)) {
      if (Mon.knows(mon, id)) continue;
      if (mon.moves.length < 4) {
        Mon.teach(mon, id);
        await UI.say(name + ' learned ' + MOVES[id].name + '!');
      } else {
        await Battle.learnFull(mon, id);
      }
    }
  }

  // Runs the evolution of mon into species `to`. Resolves true when it evolved, false when B cancelled.
  async function run(mon, to) {
    const from = mon.sp;
    const oldName = Mon.name(mon);
    const prev = Music.current;
    const sc = makeScene(from, to);
    Scenes.push(sc);
    Music.play('evolve');
    await UI.say('What? ' + oldName + ' is evolving!');
    const ok = await sc.animate();
    if (!ok) {
      await UI.say('Huh? ' + oldName + ' stopped evolving!');
      Scenes.pop(sc);
      if (prev) Music.play(prev); else Music.stop();
      return false;
    }
    Sound.play('evolve');
    await sc.flashOut();
    await UI.say('Congratulations! Your ' + oldName + ' evolved into ' + SPECIES[to].name + '!');
    Mon.evolve(mon, to);
    Mon.markCaught(to);
    await learnAtLevel(mon);
    Scenes.pop(sc);
    if (prev) Music.play(prev); else Music.stop();
    return true;
  }

  return { run };
})();

// ---- 50_menus.js
// Tidebound: menus. The start menu and the screens under it (TIDELINGS, summary, BAG, TIDEDEX, trainer card,
// OPTIONS), plus the PC, the MART, name entry, and the medicine / HM / evolution helpers that menus and battle share.
// Each screen is a scene pushed onto Scenes. Full screens are opaque; the start menu is an overlay. Every public
// function returns a Promise that resolves when its scene pops itself. Only `Menus` is declared at top level.

const Menus = (() => {
  // ---------- palette and text ----------
  const BG = '#dde7f1';
  const INK = '#404040';
  const BLUE = '#3070d0';
  const DIM = '#9aa2aa';
  const NO_EFFECT = "It won't have any effect.";
  const STATUS_NAME = { psn: 'POISON', brn: 'BURN', par: 'PARALYSIS', slp: 'SLEEP' };
  const STATUS_BADGE = {
    psn: ['PSN', '#a040a0'], brn: ['BRN', '#e06030'], par: ['PAR', '#b89010'], slp: ['SLP', '#607890'], fnt: ['FNT', '#505050'],
  };
  const CAT_NAME = { phys: 'PHYSICAL', spec: 'SPECIAL', status: 'STATUS' };
  const HM_MOVE = { hm_chop: 'chop', hm_smash: 'smash' };
  const POCKETS = [
    { name: 'ITEMS', kinds: ['medicine', 'field'] },
    { name: 'ORBS', kinds: ['ball'] },
    { name: 'BERRIES & HELD', kinds: ['held'] },
    { name: 'KEY ITEMS', kinds: ['key'] },
  ];
  const START_DESC = {
    dex: 'Your record of every Tideling you have met.',
    party: 'The Tidelings travelling with you.',
    bag: 'Items you are carrying.',
    card: 'Your trainer card.',
    save: 'Save your progress.',
    options: 'Text speed, music and sound.',
    exit: 'Close this menu.',
  };

  // ---------- small helpers ----------
  function sfx(name) { try { if (typeof Sound !== 'undefined') Sound.play(name); } catch (_) {} }
  function pad3(n) { return String(n).padStart(3, '0'); }
  function fit(s, maxW) {
    if (textWidth(s) <= maxW) return s;
    let t = s;
    while (t.length > 1 && textWidth(t + '.') > maxW) t = t.slice(0, -1);
    return t + '.';
  }
  function right(g, s, xr, y, color) { drawText(g, s, xr - textWidth(s), y, color); }
  function center(g, s, xc, y, color) { drawText(g, s, Math.round(xc - textWidth(s) / 2), y, color); }
  function panel(g, x, y, w, h) { UI.box(g, x, y, w, h, 'white'); }
  function bg(g) { g.fillStyle = BG; g.fillRect(0, 0, W, H); }
  function msgBox(g, text, width = 300, lines = 3) {
    panel(g, 4, 132, 312, 44);
    wrapText(text || '', width).slice(0, lines).forEach((l, i) => drawText(g, l, 10, 137 + i * 12));
  }
  function nameOf(m) { return Mon.name(m); }
  function speciesOf(m) { return SPECIES[m.sp]; }
  function maxHp(m) { return Mon.maxhp(m); }
  function ratioOf(m) { return clamp(m.hp / Math.max(1, maxHp(m)), 0, 1); }
  function statusKey(m) { return m.hp <= 0 ? 'fnt' : (m.status || null); }
  function say(text, opts) { return UI.say(text, opts); }

  // ---------- pixel drawing ----------
  function disc(g, cx, cy, r, color) {
    g.fillStyle = color;
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r) g.fillRect(cx + x, cy + y, 1, 1);
  }
  function hole(g, cx, cy, r) {
    g.save();
    g.globalCompositeOperation = 'destination-out';
    disc(g, cx, cy, r, '#000');
    g.restore();
  }
  function orbMark(g, cx, cy, r, caught) {
    disc(g, cx, cy, r, '#303038');
    disc(g, cx, cy, r - 1, caught ? '#e8e8e8' : '#b8bcc4');
    if (caught) {
      g.fillStyle = '#e04040';
      for (let y = -r + 1; y < 0; y++) for (let x = -r + 1; x < r; x++) if (x * x + y * y <= (r - 1) * (r - 1) + (r - 1)) g.fillRect(cx + x, cy + y, 1, 1);
    }
  }
  const iconCache = {};
  function itemIcon(id) {
    if (!iconCache[id]) iconCache[id] = makeCanvas(16, 16, (c, g) => paintItem(g, id));
    return iconCache[id];
  }
  function paintItem(g, id) {
    const it = ITEMS[id] || {};
    if (it.kind === 'ball') { orbMark(g, 8, 8, 7, true); return; }
    if (it.kind === 'medicine') {
      g.fillStyle = '#303038'; g.fillRect(3, 3, 10, 12); g.fillRect(6, 1, 4, 2);
      g.fillStyle = it.cure ? '#9a84d8' : '#e05868'; g.fillRect(4, 4, 8, 10);
      g.fillStyle = '#ffffff'; g.fillRect(7, 6, 2, 5); g.fillRect(5, 8, 6, 2);
      return;
    }
    if (it.kind === 'held' && /berry$/.test(id)) {
      disc(g, 8, 9, 5, '#303038'); disc(g, 8, 9, 4, '#d04878');
      g.fillStyle = '#48a848'; g.fillRect(9, 2, 4, 2); g.fillRect(11, 1, 2, 1);
      return;
    }
    if (it.kind === 'held') {
      g.fillStyle = '#303038'; g.fillRect(6, 1, 4, 14); g.fillRect(1, 6, 14, 4);
      g.fillStyle = '#6cc0ec'; g.fillRect(7, 2, 2, 12); g.fillRect(2, 7, 12, 2);
      return;
    }
    if (it.kind === 'key') {
      disc(g, 5, 8, 4, '#303038'); disc(g, 5, 8, 3, '#f0c040'); hole(g, 5, 8, 1);
      g.fillStyle = '#303038'; g.fillRect(8, 7, 7, 3);
      g.fillStyle = '#f0c040'; g.fillRect(8, 8, 7, 1); g.fillRect(12, 10, 2, 2);
      return;
    }
    if (id === 'repel') {
      g.fillStyle = '#303040'; g.fillRect(6, 1, 4, 3);
      g.fillStyle = '#303038'; g.fillRect(4, 4, 8, 11);
      g.fillStyle = '#8898a8'; g.fillRect(5, 5, 6, 9);
      return;
    }
    disc(g, 8, 8, 6, '#303038'); disc(g, 8, 8, 5, '#b07838'); hole(g, 8, 8, 2);
  }

  // Pill with the type name in its colour. Returns its width.
  function typePill(g, type, x, y) {
    const label = String(type).toUpperCase();
    const w = textWidth(label) + 6;
    g.fillStyle = TYPE_COLOR[type] || '#888888';
    g.fillRect(x, y, w, 9);
    if (type === 'electric' || type === 'ground') drawText(g, label, x + 3, y + 1, '#303030', '#f8f8e8');
    else drawText(g, label, x + 3, y + 1, '#ffffff', '#303030');
    return w;
  }
  function typeRow(g, types, xc, y) {
    const widths = types.map((t) => textWidth(String(t).toUpperCase()) + 6);
    const total = widths.reduce((a, b) => a + b, 0) + Math.max(0, types.length - 1) * 3;
    let x = Math.round(xc - total / 2);
    types.forEach((t) => { x += typePill(g, t, x, y) + 3; });
  }
  function statusBadge(g, key, x, y) {
    const b = STATUS_BADGE[key];
    if (!b) return 0;
    const w = textWidth(b[0]) + 6;
    g.fillStyle = b[1];
    g.fillRect(x, y, w, 9);
    drawText(g, b[0], x + 3, y + 1, '#ffffff', '#202020');
    return w;
  }
  function bar(g, x, y, w, h, frac, color) {
    g.fillStyle = '#505868'; g.fillRect(x - 1, y - 1, w + 2, h + 2);
    g.fillStyle = '#f4f4ec'; g.fillRect(x, y, w, h);
    const fw = Math.round(w * clamp(frac, 0, 1));
    if (fw > 0) { g.fillStyle = color; g.fillRect(x, y, fw, h); }
  }
  function hpBar(g, x, y, w, h, frac) {
    bar(g, x, y, w, h, frac, frac > 0.5 ? '#38c060' : frac > 0.2 ? '#f8c830' : '#e04040');
  }
  const silCache = {};
  function silhouette(sp) {
    if (!silCache[sp]) {
      silCache[sp] = makeCanvas(64, 64, (c, g) => {
        g.drawImage(Sprites.mon(sp), 0, 0);
        g.globalCompositeOperation = 'source-in';
        g.fillStyle = '#2c3440';
        g.fillRect(0, 0, 64, 64);
      });
    }
    return silCache[sp];
  }

  // ---------- scene plumbing ----------
  // Pushes a scene and returns a Promise that resolves with the value passed to scene.close(v).
  function run(scene) {
    return new Promise((resolve) => {
      let open = true;
      scene.busy = false;
      scene.close = (v) => {
        if (!open) return;
        open = false;
        Scenes.pop(scene);
        resolve(v);
      };
      Scenes.push(scene);
    });
  }
  // Runs an async handler for a scene; the scene ignores input until it finishes.
  function runAction(scene, fn) {
    scene.busy = true;
    Promise.resolve().then(fn).finally(() => { scene.busy = false; });
  }
  // Up/down for a list of n entries (no wrap).
  function nav(cur, n) {
    if (n <= 0) return 0;
    if (Input.repeat('up')) return Math.max(0, cur - 1);
    if (Input.repeat('down')) return Math.min(n - 1, cur + 1);
    return clamp(cur, 0, n - 1);
  }
  // Scroll offset that keeps cur visible in a window of `rows` lines.
  function scrollFor(cur, top, rows, n) {
    let t = top;
    if (cur < t) t = cur;
    if (cur >= t + rows) t = cur - rows + 1;
    return clamp(t, 0, Math.max(0, n - rows));
  }
  function inCave() {
    const mp = typeof World !== 'undefined' && World.map;
    return !!mp && String(mp.id || '').includes('cave');
  }

  // ---------- medicine, HMs and post-battle events (shared helpers) ----------
  // Normalised effects of a medicine item.
  function effectsOf(id) {
    const it = ITEMS[id] || {};
    return {
      heal: it.heal || 0,
      cure: it.cure || null,
      revive: it.revive ? (typeof it.revive === 'number' ? it.revive : 0.5) : (id === 'revive' ? 0.5 : 0),
      pp: it.pp || (id === 'ether' ? 10 : 0),
      levels: it.level || (id === 'rarecandy' ? 1 : 0),
    };
  }
  // Whether a medicine item would do something to this Tideling right now.
  function canUse(id, m) {
    const it = ITEMS[id];
    if (!it || !m || it.kind !== 'medicine') return false;
    const e = effectsOf(id);
    if (e.levels) return m.lv < 100;
    if (e.revive) return m.hp <= 0;
    if (m.hp <= 0) return false;
    if (e.heal) return m.hp < maxHp(m);
    if (e.cure) return e.cure === 'all' ? !!m.status : m.status === e.cure;
    if (e.pp) return m.moves.some((mv) => mv.pp < ((MOVES[mv.id] || { pp: 0 }).pp));
    return false;
  }
  // Applies a medicine item to a Tideling. Does not consume the item (the caller does).
  // Rare candy gains XP and returns the events; show them with Menus.showEvents.
  function useMedicine(id, m) {
    if (!canUse(id, m)) return { ok: false, text: NO_EFFECT };
    const nm = nameOf(m);
    const e = effectsOf(id);
    if (e.levels) {
      const growth = speciesOf(m).growth;
      const target = Mon.xpAt(Math.min(100, m.lv + e.levels), growth);
      const events = Mon.gainXp(m, Math.max(1, target - m.xp));
      return { ok: true, text: `${nm} ate the ${ITEMS[id].name}!`, events };
    }
    if (e.revive) {
      m.hp = Math.max(1, Math.floor(maxHp(m) * e.revive));
      m.status = null; m.slp = 0;
      return { ok: true, text: `${nm} was revived!` };
    }
    if (e.heal) {
      const before = m.hp;
      m.hp = Math.min(maxHp(m), m.hp + e.heal);
      return { ok: true, text: `${nm} regained ${m.hp - before} HP!` };
    }
    if (e.cure) {
      const st = m.status;
      m.status = null; m.slp = 0;
      return { ok: true, text: `${nm} was cured of ${STATUS_NAME[st] || 'its condition'}!` };
    }
    if (e.pp) {
      m.moves.forEach((mv) => { mv.pp = Math.min((MOVES[mv.id] || { pp: mv.pp }).pp, mv.pp + e.pp); });
      return { ok: true, text: `${nm}'s moves regained PP!` };
    }
    return { ok: false, text: NO_EFFECT };
  }
  function canLearnHm(m, mv) {
    const sp = SPECIES[m.sp];
    return !!sp && (sp.hm || []).includes(mv) && !Mon.knows(m, mv);
  }
  // Announces the results of Mon.gainXp, asking for forget-choices and running evolutions.
  async function showEvents(m, events) {
    for (const ev of events || []) {
      if (ev.type === 'level') {
        sfx('levelup');
        await say(`${nameOf(m)} grew to LV ${ev.lv}!`);
      } else if (ev.type === 'learn') {
        await say(`${nameOf(m)} learned ${MOVES[ev.move].name}!`);
      } else if (ev.type === 'learnFull') {
        const mvName = MOVES[ev.move].name;
        const slot = await forgetMove(m, ev.move);
        if (slot >= 0) {
          const old = MOVES[m.moves[slot].id].name;
          Mon.teach(m, ev.move, slot);
          await say(`1, 2 and... Poof! ${nameOf(m)} forgot ${old}. And... ${nameOf(m)} learned ${mvName}!`);
        } else {
          await say(`${nameOf(m)} did not learn ${mvName}.`);
        }
      } else if (ev.type === 'evolve' && typeof Evolve !== 'undefined') {
        await Evolve.run(m, ev.to);
      }
    }
  }
  // "X wants to forget a move": resolves with the slot (0-3) to overwrite, or -1 to give up. Does not teach.
  function forgetMove(m, move) {
    const rowsOf = () => {
      const rows = m.moves.map((mv) => ({ id: mv.id, pp: mv.pp, isNew: false }));
      rows.push({ id: move, isNew: true });
      return rows;
    };
    const s = { name: 'forget', opaque: true, cur: 0 };
    s.update = () => {
      if (s.busy) return;
      const rows = rowsOf();
      s.cur = nav(s.cur, rows.length);
      if (Input.pressed('b')) return s.close(-1);
      if (!Input.pressed('a')) return;
      if (s.cur === rows.length - 1) {
        runAction(s, async () => {
          if (await UI.yesno(`Give up on learning ${MOVES[move].name}?`)) s.close(-1);
        });
      } else {
        s.close(s.cur);
      }
    };
    s.draw = (g) => {
      bg(g);
      panel(g, 4, 4, 312, 18);
      drawText(g, `${fit(nameOf(m), 150)}  MOVES`, 10, 9);
      const rows = rowsOf();
      panel(g, 4, 26, 212, 102);
      drawMoveRows(g, rows, 4, 30, s.cur, true);
      drawMoveDetail(g, rows[s.cur].id, 222, 26, 94, 102);
      panel(g, 4, 132, 312, 44);
      drawText(g, 'Which move should be forgotten?', 10, 137);
      wrapText(MOVES[rows[s.cur].id].desc, 300).slice(0, 2).forEach((l, i) => drawText(g, l, 10, 149 + i * 12));
    };
    return run(s);
  }

  // Move rows: name, type pill and PP. rows entries are {id, pp, isNew} or null.
  function drawMoveRows(g, rows, x, y0, sel, showCursor) {
    rows.forEach((r, i) => {
      const y = y0 + i * 24;
      if (!r) { drawText(g, '-', x + 12, y + 3, DIM); return; }
      const mv = MOVES[r.id];
      if (!mv) return;
      drawText(g, fit(mv.name, 88), x + 12, y + 3, r.isNew ? BLUE : INK);
      typePill(g, mv.type, x + 104, y + 3);
      drawText(g, r.isNew ? 'NEW' : `PP ${r.pp}/${mv.pp}`, x + 162, y + 3, INK);
    });
    if (showCursor && rows[sel]) UI.cursor(g, x + 2, y0 + sel * 24 + 4);
  }
  function drawMoveDetail(g, id, x, y, w, h) {
    panel(g, x, y, w, h);
    const mv = id && MOVES[id];
    if (!mv) return;
    drawText(g, 'POWER', x + 8, y + 8, DIM);
    right(g, mv.power ? String(mv.power) : '--', x + w - 8, y + 18, INK);
    drawText(g, 'ACC', x + 8, y + 34, DIM);
    right(g, mv.acc ? String(mv.acc) : '--', x + w - 8, y + 44, INK);
    drawText(g, 'CLASS', x + 8, y + 60, DIM);
    drawText(g, CAT_NAME[mv.cat] || '-', x + 8, y + 70, INK);
  }

  // ---------- start menu ----------
  let startCursor = 0;
  function startEntries() {
    const list = [];
    if (flag('got_dex')) list.push({ k: 'dex', label: 'TIDEDEX' });
    if (G.party.length) list.push({ k: 'party', label: 'TIDELINGS' });
    list.push({ k: 'bag', label: 'BAG' }, { k: 'card', label: G.name }, { k: 'save', label: 'SAVE' },
      { k: 'options', label: 'OPTIONS' }, { k: 'exit', label: 'EXIT' });
    return list;
  }
  async function saveGame() {
    if (!(await UI.yesno('Would you like to save the game?'))) return;
    const ok = Save.write();
    sfx('save');
    await say(ok ? '{P} saved the game.' : 'The game could not be saved.');
  }
  // Start menu: an overlay on the world. Resolves when closed.
  function start() {
    const s = { name: 'start', opaque: false };
    s.update = () => {
      if (s.busy) return;
      const list = startEntries();
      startCursor = nav(Math.min(startCursor, list.length - 1), list.length);
      if (Input.pressed('b') || Input.pressed('start')) return s.close();
      if (!Input.pressed('a')) return;
      const k = list[startCursor].k;
      if (k === 'exit') return s.close();
      runAction(s, async () => {
        if (k === 'dex') await dex();
        else if (k === 'party') await party({ mode: 'view' });
        else if (k === 'bag') {
          const r = await bag({ mode: 'field' });
          if (r && r.warp) {
            s.close();
            const h = G.lastHeal;
            await World.warp(h.map, h.x, h.y, 'down');
          }
        } else if (k === 'card') await trainerCard();
        else if (k === 'save') await saveGame();
        else if (k === 'options') await options();
      });
    };
    s.draw = (g) => {
      const list = startEntries();
      const idx = Math.min(startCursor, list.length - 1);
      const lines = wrapText(START_DESC[list[idx].k] || '', 146);
      panel(g, 4, 4, 156, lines.length * 12 + 8);
      lines.forEach((l, i) => drawText(g, l, 11, 9 + i * 12));
      panel(g, 228, 4, 88, list.length * 12 + 8);
      list.forEach((e, i) => {
        const y = 9 + i * 12;
        drawText(g, e.label, 240, y, i === idx ? BLUE : INK);
        if (i === idx) UI.cursor(g, 231, y);
      });
    };
    return run(s);
  }

  // ---------- TIDELINGS (party) ----------
  function rowY(i) { return i === 0 ? 4 : 4 + (i - 1) * 25; }
  function leadPanel(g, m, x, y, w, h, dimmed) {
    panel(g, x, y, w, h);
    g.drawImage(Sprites.mon(m.sp), x + 24, y + 6);
    drawText(g, fit(nameOf(m), w - 40), x + 6, y + 74, dimmed ? DIM : INK);
    right(g, 'LV ' + m.lv, x + w - 6, y + 74, INK);
    drawText(g, 'HP', x + 6, y + 86);
    hpBar(g, x + 24, y + 88, w - 36, 4, ratioOf(m));
    drawText(g, `${m.hp}/${maxHp(m)}`, x + 6, y + 96);
    let bx = x + 6;
    const sk = statusKey(m);
    if (sk) bx += statusBadge(g, sk, bx, y + 108) + 4;
    if (m.item) { g.fillStyle = '#e8b020'; g.fillRect(x + w - 12, y + 108, 6, 6); }
  }
  function rowPanel(g, m, x, y, w, h, dimmed, frame) {
    panel(g, x, y, w, h);
    g.drawImage(Sprites.monIcon(m.sp, frame), x + 2, y);
    const c = dimmed ? DIM : INK;
    drawText(g, fit(nameOf(m), 74), x + 30, y + 3, c);
    drawText(g, 'LV ' + m.lv, x + 108, y + 3, c);
    const sk = statusKey(m);
    if (sk) statusBadge(g, sk, x + 138, y + 3);
    hpBar(g, x + 30, y + 15, 70, 4, ratioOf(m));
    drawText(g, `${m.hp}/${maxHp(m)}`, x + 104, y + 13, c);
    if (m.item) { g.fillStyle = '#e8b020'; g.fillRect(x + w - 9, y + 4, 5, 5); }
  }

  // Party screen. opts: mode 'view' | 'battle' | 'item' | 'teach' | 'pick'; title; canCancel; active (battle index
  // of the mon in the fight); filter(m) → bool; badMsg string or fn(m); item / move ids for context.
  // Resolves with the chosen index (or -1 when cancelled).
  function party(opts = {}) {
    const mode = opts.mode || 'view';
    const canCancel = opts.canCancel !== false;
    const s = { name: 'party', opaque: true, cur: 0, moving: -1 };
    const prompt = () => (s.moving >= 0 ? 'Move to where?' : (opts.title || 'Choose a TIDELING.'));
    const dimmed = (i) => {
      const m = G.party[i];
      if (mode === 'battle') return m.hp <= 0 || i === opts.active;
      return !!opts.filter && !opts.filter(m);
    };
    s.update = () => {
      if (s.busy) return;
      const n = G.party.length;
      s.cur = nav(s.cur, n + 1);
      if (Input.pressed('left')) s.cur = 0;
      else if (Input.pressed('right') && s.cur === 0 && n > 1) s.cur = 1;
      if (Input.pressed('b')) {
        if (s.moving >= 0) s.moving = -1;
        else if (canCancel) s.close(-1);
      } else if (Input.pressed('a')) {
        if (s.cur >= n) {
          if (s.moving >= 0) s.moving = -1;
          else if (canCancel) s.close(-1);
        } else {
          const i = s.cur;
          runAction(s, () => partyPick(s, i, opts, mode));
        }
      }
    };
    s.draw = (g) => {
      bg(g);
      const n = G.party.length;
      const frame = Math.floor(Timers.time * 2) & 1;
      if (n) leadPanel(g, G.party[0], 4, 4, 112, 124, dimmed(0));
      for (let i = 1; i < n; i++) rowPanel(g, G.party[i], 126, rowY(i), 190, 25, dimmed(i), frame);
      if (s.moving >= 0) {
        g.fillStyle = BLUE;
        if (s.moving === 0) g.fillRect(118, 4, 3, 124);
        else g.fillRect(120, rowY(s.moving), 3, 25);
      }
      msgBox(g, prompt(), 226, 2);
      panel(g, 246, 150, 66, 20);
      center(g, 'CANCEL', 279, 156, INK);
      if (s.cur === 0 && n) UI.cursor(g, 117, 56);
      else if (s.cur < n) UI.cursor(g, 117, rowY(s.cur) + 8);
      else UI.cursor(g, 237, 156);
    };
    return run(s);
  }
  async function partyPick(s, i, opts, mode) {
    const m = G.party[i];
    if (s.moving >= 0) {
      if (i !== s.moving) {
        const a = s.moving;
        [G.party[a], G.party[i]] = [G.party[i], G.party[a]];
      }
      s.moving = -1;
      return;
    }
    const at = { x: 150, y: Math.min(90, rowY(i)) };
    if (mode === 'view') {
      const field = ['chop', 'smash'].filter((mv) => Mon.knows(m, mv)).map((mv) => mv.toUpperCase());
      const labels = ['SUMMARY', 'SWITCH', 'ITEM', ...field, 'CANCEL'];
      const pick = labels[await UI.choose(labels, at)];
      if (pick === 'SUMMARY') s.cur = await summary(m, G.party, i);
      else if (pick === 'SWITCH') s.moving = i;
      else if (pick === 'ITEM') await itemMenu(m);
      else if (pick === 'CHOP' || pick === 'SMASH') {
        await say(`Use ${pick} by facing a ${pick === 'CHOP' ? 'small tree' : 'large rock'} and pressing A.`);
      }
      return;
    }
    if (mode === 'battle') {
      const fainted = m.hp <= 0;
      const active = i === opts.active;
      if (fainted) await say(`${nameOf(m)} has no energy left to fight!`);
      else if (active) await say(`${nameOf(m)} is already in battle!`);
      const labels = !fainted && !active ? ['SHIFT', 'SUMMARY', 'CANCEL'] : ['SUMMARY', 'CANCEL'];
      const pick = labels[await UI.choose(labels, at)];
      if (pick === 'SHIFT') return s.close(i);
      if (pick === 'SUMMARY') s.cur = await summary(m, G.party, i);
      return;
    }
    // item, teach and pick: the caller chooses a target
    if (opts.filter && !opts.filter(m)) {
      const msg = typeof opts.badMsg === 'function' ? opts.badMsg(m) : (opts.badMsg || NO_EFFECT);
      await say(msg);
    } else {
      s.close(i);
    }
  }
  async function itemMenu(m) {
    const labels = ['GIVE', 'TAKE', 'CANCEL'];
    const pick = labels[await UI.choose(labels, { x: 150, y: 40 })];
    if (pick === 'GIVE') {
      const r = await bag({ mode: 'give' });
      if (r && r.item) await giveItem(m, r.item);
    } else if (pick === 'TAKE') {
      if (!m.item) return say(`${nameOf(m)} is not holding anything.`);
      const old = m.item;
      m.item = null;
      bagAdd(old, 1);
      await say(`Took the ${ITEMS[old].name} from ${nameOf(m)}.`);
    }
  }
  // Hands a held item to a Tideling (consumes it from the bag) and returns any item it was holding.
  async function giveItem(m, id) {
    const old = m.item;
    if (old === id) return say(`${nameOf(m)} is already holding the ${ITEMS[id].name}.`);
    bagAdd(id, -1);
    m.item = id;
    if (old) {
      bagAdd(old, 1);
      await say(`Took the ${ITEMS[old].name} from ${nameOf(m)} and gave it the ${ITEMS[id].name}.`);
    } else {
      await say(`${nameOf(m)} is now holding the ${ITEMS[id].name}.`);
    }
  }

  // ---------- summary (three pages) ----------
  function placeName(id) {
    if (!id) return '-';
    try {
      if (typeof Maps !== 'undefined' && Maps.get) {
        const mp = Maps.get(id);
        if (mp && mp.name) return fit(mp.name, 150);
      }
    } catch (_) {}
    return fit(String(id).toUpperCase(), 150);
  }
  // Summary pages. list/index let up and down switch Tidelings. Resolves with the final index.
  function summary(mon, list, index) {
    const roster = list && list.length ? list : [mon];
    const s = {
      name: 'summary', opaque: true, page: 0, mi: 0,
      idx: index != null ? index : Math.max(0, roster.indexOf(mon)),
    };
    s.update = () => {
      if (Input.pressed('b')) return s.close(s.idx);
      if (Input.pressed('left')) s.page = Math.max(0, s.page - 1);
      if (Input.pressed('right')) s.page = Math.min(2, s.page + 1);
      let ni = s.idx;
      if (Input.repeat('up')) ni = Math.max(0, ni - 1);
      if (Input.repeat('down')) ni = Math.min(roster.length - 1, ni + 1);
      if (ni !== s.idx) { s.idx = ni; s.mi = 0; }
      if (s.page === 2 && Input.pressed('a')) s.mi = (s.mi + 1) % Math.max(1, roster[s.idx].moves.length);
    };
    s.draw = (g) => {
      const m = roster[s.idx];
      bg(g);
      panel(g, 4, 4, 312, 18);
      drawText(g, `${fit(nameOf(m), 150)}  LV ${m.lv}`, 10, 9);
      right(g, `${['INFO', 'STATS', 'MOVES'][s.page]} ${s.page + 1}/3`, 310, 9, INK);
      if (s.page === 0) summaryInfo(g, m);
      else if (s.page === 1) summaryStats(g, m);
      else summaryMoves(g, m, s.mi);
    };
    return run(s);
  }
  function summaryInfo(g, m) {
    const sp = speciesOf(m);
    panel(g, 4, 26, 104, 102);
    g.drawImage(Sprites.mon(m.sp), 24, 30);
    center(g, 'NO.' + pad3(sp.num), 56, 104, INK);
    drawText(g, 'TYPE', 116, 28);
    let tx = 156;
    sp.types.forEach((t) => { tx += typePill(g, t, tx, 27) + 3; });
    drawText(g, 'OT', 116, 42);
    drawText(g, fit(m.ot || G.name, 150), 156, 42, INK);
    const ab = ABILITIES[m.ability];
    drawText(g, 'ABILITY', 116, 56);
    drawText(g, ab ? ab.name : '-', 156, 56, BLUE);
    wrapText(ab ? ab.desc : '', 196).slice(0, 3).forEach((l, i) => drawText(g, l, 116, 68 + i * 11));
    drawText(g, 'HELD', 116, 106);
    drawText(g, m.item ? ITEMS[m.item].name : 'NONE', 156, 106, m.item ? INK : DIM);
    drawText(g, 'CAUGHT', 116, 118);
    drawText(g, placeName(m.caughtAt), 156, 118, INK);
    msgBox(g, sp.dex || '');
  }
  function summaryStats(g, m) {
    const st = Mon.stats(m);
    const sp = speciesOf(m);
    panel(g, 4, 26, 156, 102);
    const rows = [['HP', maxHp(m)], ['ATTACK', st.atk], ['DEFENSE', st.def], ['SP.ATK', st.spa], ['SP.DEF', st.spd], ['SPEED', st.spe]];
    rows.forEach(([k, v], i) => {
      const y = 34 + i * 16;
      drawText(g, k, 12, y);
      right(g, String(v), 150, y, INK);
    });
    panel(g, 168, 26, 148, 102);
    drawText(g, 'HP', 178, 34);
    right(g, `${m.hp}/${maxHp(m)}`, 308, 34, INK);
    hpBar(g, 178, 46, 128, 5, ratioOf(m));
    drawText(g, 'EXP POINTS', 178, 62);
    right(g, String(m.xp), 308, 72, INK);
    if (m.lv >= 100) {
      drawText(g, 'MAX LEVEL', 178, 86);
    } else {
      const base = Mon.xpAt(m.lv, sp.growth);
      const next = Mon.xpAt(m.lv + 1, sp.growth);
      drawText(g, `TO LV ${m.lv + 1}`, 178, 86);
      right(g, String(Math.max(0, next - m.xp)), 308, 96, INK);
      bar(g, 178, 110, 128, 4, (m.xp - base) / Math.max(1, next - base), BLUE);
    }
    msgBox(g, 'LEFT and RIGHT: page.   UP and DOWN: Tideling.', 300, 1);
  }
  function summaryMoves(g, m, mi) {
    panel(g, 4, 26, 212, 102);
    const rows = [0, 1, 2, 3].map((i) => (m.moves[i] ? { id: m.moves[i].id, pp: m.moves[i].pp } : null));
    drawMoveRows(g, rows, 4, 30, mi, true);
    const cur = rows[mi];
    drawMoveDetail(g, cur ? cur.id : null, 222, 26, 94, 102);
    msgBox(g, cur && MOVES[cur.id] ? MOVES[cur.id].desc : '');
  }

  // ---------- BAG ----------
  function pocketsFor(mode) {
    if (mode === 'battle') return [{ name: 'ITEMS', kinds: ['medicine'] }, { name: 'ORBS', kinds: ['ball'] }];
    if (mode === 'give') return [{ name: 'BERRIES & HELD', kinds: ['held'] }];
    if (mode === 'sell') return POCKETS.filter((p) => !p.kinds.includes('key'));
    return POCKETS;
  }
  function bagList(pocket, mode) {
    return Object.keys(ITEMS).filter((id) => bagCount(id) > 0 && pocket.kinds.includes(ITEMS[id].kind)
      && (mode !== 'sell' || ITEMS[id].price > 0));
  }
  function fieldActions(id) {
    const kind = ITEMS[id].kind;
    const a = [];
    if (kind === 'medicine' || kind === 'field' || kind === 'key') a.push('USE');
    if (kind === 'held') a.push('GIVE');
    if (kind !== 'key') a.push('TOSS');
    a.push('CANCEL');
    return a;
  }
  // Bag. mode: 'field' (USE / GIVE / TOSS; resolves {warp: true} after an escape rope), 'battle' (resolves
  // {item, target}, target null for orbs; nothing is consumed), 'give' (resolves {item}), 'sell' (shop).
  function bag(opts = {}) {
    const mode = opts.mode || 'field';
    const pockets = pocketsFor(mode);
    const s = { name: 'bag', opaque: true, p: 0, cur: 0, top: 0 };
    s.update = () => {
      if (s.busy) return;
      const list = bagList(pockets[s.p], mode);
      if (pockets.length > 1 && (Input.pressed('left') || Input.pressed('right'))) {
        s.p = (s.p + (Input.pressed('right') ? 1 : pockets.length - 1)) % pockets.length;
        s.cur = 0; s.top = 0;
        return;
      }
      s.cur = nav(Math.min(s.cur, list.length - 1), list.length);
      s.top = scrollFor(s.cur, s.top, 8, list.length);
      if (Input.pressed('b')) return s.close(null);
      if (Input.pressed('a') && list.length) {
        const id = list[s.cur];
        runAction(s, () => bagPick(s, id, mode));
      }
    };
    s.draw = (g) => {
      bg(g);
      const pocket = pockets[s.p];
      const list = bagList(pocket, mode);
      panel(g, 4, 4, 312, 18);
      if (pockets.length > 1) {
        drawText(g, '<', 9, 9, DIM);
        drawText(g, '>', 306, 9, DIM);
      }
      center(g, pocket.name, 160, 9, INK);
      if (mode === 'sell') right(g, '$' + G.money, 296, 9, INK);
      // left: the selected item's icon, kind and count
      panel(g, 4, 26, 102, 102);
      const cur = list[s.cur];
      if (cur) {
        const it = ITEMS[cur];
        g.drawImage(itemIcon(cur), 27, 40, 32, 32);
        center(g, it.kind.toUpperCase(), 55, 84, DIM);
        center(g, 'x' + bagCount(cur), 55, 98, INK);
        if (mode === 'sell') center(g, '$' + Math.floor(it.price / 2), 55, 110, INK);
      }
      // right: the list
      panel(g, 110, 26, 206, 102);
      if (!list.length) drawText(g, 'There are no items here.', 122, 56, DIM);
      for (let i = 0; i < 8; i++) {
        const k = s.top + i;
        if (k >= list.length) break;
        const id = list[k];
        const y = 30 + i * 12;
        drawText(g, ITEMS[id].name, 124, y, INK);
        right(g, 'x' + bagCount(id), 306, y, INK);
      }
      if (list.length) UI.cursor(g, 112, 30 + (s.cur - s.top) * 12);
      msgBox(g, cur ? ITEMS[cur].desc : '');
    };
    return run(s);
  }
  async function bagPick(s, id, mode) {
    if (mode === 'give') return s.close({ item: id });
    if (mode === 'sell') return sellItem(id);
    if (mode === 'battle') {
      if (ITEMS[id].kind === 'ball') return s.close({ item: id, target: null });
      const idx = await party({
        mode: 'item', title: `Use ${ITEMS[id].name} on which TIDELING?`, filter: (m) => canUse(id, m),
      });
      if (idx >= 0) s.close({ item: id, target: idx });
      return;
    }
    const acts = fieldActions(id);
    const act = acts[await UI.choose(acts)];
    if (act === 'USE') {
      const r = await fieldUse(id);
      if (r && r.warp) s.close(r);
    } else if (act === 'GIVE') {
      const idx = await party({ mode: 'pick', title: `Give ${ITEMS[id].name} to which TIDELING?` });
      if (idx >= 0) await giveItem(G.party[idx], id);
    } else if (act === 'TOSS') {
      await tossItem(id);
    }
  }
  // Field use of an item. Returns {warp: true} for an escape rope used in a cave, otherwise null.
  async function fieldUse(id) {
    const it = ITEMS[id];
    if (it.kind === 'medicine') {
      const idx = await party({
        mode: 'item', title: `Use ${it.name} on which TIDELING?`, filter: (m) => canUse(id, m),
      });
      if (idx < 0) return null;
      const m = G.party[idx];
      const r = useMedicine(id, m);
      if (!r.ok) { await say(r.text); return null; }
      bagAdd(id, -1);
      await say(r.text);
      if (r.events && r.events.length) await showEvents(m, r.events);
      return null;
    }
    if (it.kind === 'key') return teachHm(id);
    if (id === 'repel') {
      G.repel = 100;
      bagAdd(id, -1);
      await say('{P} used the REPEL.');
      return null;
    }
    if (id === 'escaperope') {
      if (!inCave()) { await say("You can't use that here."); return null; }
      bagAdd(id, -1);
      return { warp: true };
    }
    await say('Nothing happens.');
    return null;
  }
  // Teaches an HM from the bag. Resolves null (HMs are not consumed).
  async function teachHm(id) {
    const mv = HM_MOVE[id];
    if (!mv) { await say('Nothing happens.'); return null; }
    const mvName = MOVES[mv].name;
    const idx = await party({
      mode: 'teach', title: `Teach ${mvName} to which TIDELING?`,
      filter: (m) => canLearnHm(m, mv),
      badMsg: (m) => (Mon.knows(m, mv) ? `${nameOf(m)} already knows ${mvName}.` : `${nameOf(m)} can't learn ${mvName}.`),
    });
    if (idx < 0) return null;
    const m = G.party[idx];
    const slot = m.moves.length < 4 ? m.moves.length : await forgetMove(m, mv);
    if (slot < 0) { await say(`${nameOf(m)} did not learn ${mvName}.`); return null; }
    Mon.teach(m, mv, slot);
    await say(`${nameOf(m)} learned ${mvName}!`);
    return null;
  }
  async function tossItem(id) {
    const n = await UI.number(bagCount(id), { min: 1 });
    if (!n) return;
    if (!(await UI.yesno(`Throw away ${n} ${ITEMS[id].name}?`))) return;
    bagAdd(id, -n);
    await say(`Threw away ${n} ${ITEMS[id].name}.`);
  }
  async function sellItem(id) {
    const it = ITEMS[id];
    const each = Math.floor(it.price / 2);
    if (!each) { await say("I can't buy that."); return; }
    const n = await UI.number(bagCount(id), { min: 1 });
    if (!n) return;
    const total = each * n;
    if (!(await UI.yesno(`I can pay $${total}. Sell ${n} ${it.name}?`))) return;
    bagAdd(id, -n);
    G.money += total;
    sfx('money');
    await say(`Turned over ${n} ${it.name} and received $${total}.`);
  }

  // ---------- TIDEDEX ----------
  function dex() {
    const list = DEX_ORDER;
    const seen = (sp) => !!G.dex.seen[sp];
    const caught = (sp) => !!G.dex.caught[sp];
    const s = { name: 'dex', opaque: true, cur: 0, top: 0 };
    s.update = () => {
      if (s.busy) return;
      s.cur = nav(s.cur, list.length);
      s.top = scrollFor(s.cur, s.top, 8, list.length);
      if (Input.pressed('b')) return s.close();
      if (Input.pressed('a') && seen(list[s.cur])) {
        const sp = list[s.cur];
        runAction(s, () => dexDetail(sp));
      }
    };
    s.draw = (g) => {
      bg(g);
      const seenN = list.filter(seen).length;
      const caughtN = list.filter(caught).length;
      panel(g, 4, 4, 312, 18);
      drawText(g, 'TIDEDEX', 10, 9, INK);
      right(g, `SEEN ${seenN}   CAUGHT ${caughtN}`, 308, 9, INK);
      panel(g, 4, 26, 164, 102);
      for (let i = 0; i < 8; i++) {
        const k = s.top + i;
        if (k >= list.length) break;
        const sp = list[k];
        const sn = SPECIES[sp];
        const y = 30 + i * 12;
        const c = seen(sp) ? INK : DIM;
        drawText(g, pad3(sn.num), 14, y, c);
        drawText(g, seen(sp) ? sn.name : '-----', 40, y, c);
        if (seen(sp)) orbMark(g, 156, y + 4, 3, caught(sp));
      }
      if (list.length) UI.cursor(g, 6, 30 + (s.cur - s.top) * 12);
      panel(g, 176, 26, 140, 102);
      const cur = list[s.cur];
      if (seen(cur)) {
        g.drawImage(caught(cur) ? Sprites.mon(cur) : silhouette(cur), 214, 30);
        center(g, SPECIES[cur].name, 246, 98, INK);
        typeRow(g, SPECIES[cur].types, 246, 110);
      } else {
        center(g, '?', 246, 60, DIM);
      }
      msgBox(g, seen(cur) ? 'A: DETAILS    B: BACK' : 'No data yet.', 300, 1);
    };
    return run(s);
  }
  function dexDetail(sp) {
    const sn = SPECIES[sp];
    const isCaught = !!G.dex.caught[sp];
    const s = { name: 'dexdetail', opaque: true };
    s.update = () => { if (Input.pressed('a') || Input.pressed('b')) s.close(); };
    s.draw = (g) => {
      bg(g);
      panel(g, 4, 4, 312, 18);
      drawText(g, `NO.${pad3(sn.num)}  ${sn.name}`, 10, 9, INK);
      panel(g, 4, 26, 112, 102);
      g.drawImage(isCaught ? Sprites.mon(sp) : silhouette(sp), 28, 30);
      typeRow(g, sn.types, 60, 104);
      panel(g, 124, 26, 192, 102);
      drawText(g, 'HEIGHT', 136, 40, DIM);
      right(g, sn.height || '?', 304, 40, INK);
      drawText(g, 'WEIGHT', 136, 56, DIM);
      right(g, sn.weight || '?', 304, 56, INK);
      drawText(g, 'STATUS', 136, 72, DIM);
      right(g, isCaught ? 'CAUGHT' : 'SEEN', 304, 72, isCaught ? BLUE : INK);
