  // ---------- TRAINER CARD ----------
  function waveBadge(g, x, y) {
    disc(g, x + 8, y + 8, 7, '#2a5ca8');
    g.fillStyle = '#e8f4ff';
    for (let i = 0; i < 12; i++) {
      const yy = y + 7 + Math.round(Math.sin(i * 0.9) * 2);
      g.fillRect(x + 2 + i, yy, 1, 2);
    }
  }
  function trainerCard() {
    const s = { name: 'card', opaque: true, portrait: null };
    try {
      if (typeof Chars !== 'undefined' && Chars.portrait) s.portrait = Chars.portrait('player');
    } catch (_) {}
    s.update = () => { if (Input.pressed('a') || Input.pressed('b')) s.close(); };
    s.draw = (g) => {
      bg(g);
      panel(g, 4, 4, 312, 172);
      drawText(g, 'TRAINER CARD', 14, 12, BLUE);
      panel(g, 14, 26, 80, 80);
      if (s.portrait) {
        g.drawImage(s.portrait, 22, 34);
      } else {
        disc(g, 54, 46, 10, '#8090a0');
        g.fillStyle = '#8090a0';
        g.fillRect(38, 58, 32, 40);
      }
      const caughtN = Object.keys(G.dex.caught).filter((k) => G.dex.caught[k]).length;
      const sec = Math.floor(G.time || 0);
      const time = `${Math.floor(sec / 3600)}:${String(Math.floor(sec / 60) % 60).padStart(2, '0')}`;
      const rows = [['NAME', G.name], ['MONEY', '$' + G.money], ['TIDEDEX', `${caughtN}/${DEX_ORDER.length}`], ['TIME', time]];
      rows.forEach(([k, v], i) => {
        const y = 30 + i * 16;
        drawText(g, k, 112, y, DIM);
        right(g, v, 308, y, INK);
      });
      drawText(g, 'BADGES', 112, 98, DIM);
      for (let i = 0; i < 8; i++) {
        const x = 112 + i * 24, y = 110;
        if (i === 0 && G.badges.includes('wave')) {
          waveBadge(g, x, y);
        } else {
          g.fillStyle = '#c4ccd6'; g.fillRect(x, y, 16, 16);
          g.fillStyle = '#e8ecf0'; g.fillRect(x + 2, y + 2, 12, 12);
        }
      }
      drawText(g, 'PRESS A OR B TO CLOSE', 14, 160, DIM);
    };
    return run(s);
  }

  // ---------- OPTIONS ----------
  function options() {
    const TEXT = [['slow', 'SLOW'], ['mid', 'MID'], ['fast', 'FAST']];
    const ROWS = ['TEXT SPEED', 'MUSIC', 'SOUND'];
    const TIPS = ['How quickly the text is written out.', 'Background music on or off.', 'Sound effects on or off.'];
    const s = { name: 'options', opaque: true, cur: 0 };
    const value = (i) => {
      if (i === 0) {
        const t = TEXT.find((v) => v[0] === G.options.text) || TEXT[1];
        return t[1];
      }
      return (i === 1 ? G.options.music : G.options.sfx) ? 'ON' : 'OFF';
    };
    const change = (i, d) => {
      if (i === 0) {
        const k = Math.max(0, TEXT.findIndex((v) => v[0] === G.options.text));
        G.options.text = TEXT[(k + d + 3) % 3][0];
      } else if (i === 1) {
        G.options.music = !G.options.music;
        try { if (typeof Music !== 'undefined' && Music.refresh) Music.refresh(); } catch (_) {}
      } else {
        G.options.sfx = !G.options.sfx;
      }
      sfx('select');
    };
    s.update = () => {
      s.cur = nav(s.cur, ROWS.length);
      if (Input.pressed('b')) return s.close();
      if (Input.pressed('left')) change(s.cur, -1);
      else if (Input.pressed('right') || Input.pressed('a')) change(s.cur, 1);
    };
    s.draw = (g) => {
      bg(g);
      panel(g, 4, 4, 312, 18);
      drawText(g, 'OPTIONS', 10, 9, INK);
      panel(g, 4, 26, 312, 98);
      ROWS.forEach((label, i) => {
        const y = 36 + i * 24;
        drawText(g, label, 22, y, s.cur === i ? BLUE : INK);
        drawText(g, '<', 196, y, DIM);
        center(g, value(i), 250, y, INK);
        drawText(g, '>', 300, y, DIM);
      });
      UI.cursor(g, 8, 36 + s.cur * 24);
      msgBox(g, TIPS[s.cur], 300, 1);
    };
    return run(s);
  }

  // ---------- PC ----------
  // A list of Tidelings with icons and a preview. Resolves with the index, or -1.
  function monList(title, list, prompt) {
    const s = { name: 'monlist', opaque: true, cur: 0, top: 0 };
    s.update = () => {
      s.cur = nav(Math.min(s.cur, list.length - 1), list.length);
      s.top = scrollFor(s.cur, s.top, 4, list.length);
      if (Input.pressed('b')) return s.close(-1);
      if (Input.pressed('a') && list.length) return s.close(s.cur);
    };
    s.draw = (g) => {
      bg(g);
      const frame = Math.floor(Timers.time * 2) & 1;
      panel(g, 4, 4, 312, 18);
      drawText(g, title, 10, 9, INK);
      right(g, `${list.length}/${G.party.length + G.box.length}`, 308, 9, INK);
      panel(g, 4, 22, 196, 106);
      for (let i = 0; i < 4; i++) {
        const k = s.top + i;

        drawText(g, fit(nameOf(m), 150), 38, y + 3, INK);
        drawText(g, `LV ${m.lv}    HP ${m.hp}/${maxHp(m)}`, 38, y + 13, INK);
      }
      if (list.length && s.cur >= s.top && s.cur < s.top + 4) UI.cursor(g, 6, 26 + (s.cur - s.top) * 25 + 6);
      panel(g, 206, 22, 110, 106);
      const m = list[s.cur];
      if (m) {
        g.drawImage(Sprites.mon(m.sp), 229, 26);
        center(g, fit(nameOf(m), 100), 261, 94, INK);
        center(g, `LV ${m.lv}`, 261, 104, INK);
        hpBar(g, 216, 114, 90, 4, ratioOf(m));
      }
      msgBox(g, list.length ? prompt : 'There is nothing here.', 300, 2);

    return run(s);
  }
  async function pcWithdraw() {
    if (!G.box.length) return say('There are no TIDELINGS in the PC.');
    const i = await monList('WITHDRAW', G.box, 'Withdraw which TIDELING?');
    if (i < 0) return;
    if (G.party.length >= 6) return say('Your party is full!');
    const [m] = G.box.splice(i, 1);
    G.party.push(m);
    await say(`${nameOf(m)} was withdrawn from the PC.`);
  }
  async function pcDeposit() {
    if (!G.party.length) return;
    const i = await monList('DEPOSIT', G.party, 'Deposit which TIDELING?');
    if (i < 0) return;
    const m = G.party[i];
    const healthyOthers = G.party.filter((x, j) => j !== i && x.hp > 0).length;
    if (healthyOthers === 0) return say("You can't deposit your last healthy TIDELING!");
    G.party.splice(i, 1);
    G.box.push(m);
    await say(`${nameOf(m)} was deposited in the PC.`);
  }
  async function pc() {
    await say('{P} booted up the PC.');
    for (;;) {
      const labels = ['WITHDRAW', 'DEPOSIT', 'LOG OFF'];
      const pick = await UI.choose(labels, { cancel: true });
      if (pick === 0) await pcWithdraw();
      else if (pick === 1) await pcDeposit();
      else return;
    }
  }

  // ---------- MART ----------
  async function buyOne(id) {
    const it = ITEMS[id];
    const max = Math.min(99, Math.floor(G.money / it.price));
    if (max < 1) return say("You don't have enough money.");
    const n = await UI.number(max, { min: 1 });
    if (!n) return;
    const total = n * it.price;
    const label = it.name + (n > 1 ? 's' : '');
    if (!(await UI.yesno(`Certainly. You want ${n} ${label}? That will be $${total}. OK?`))) return;
    G.money -= total;
    bagAdd(id, n);
    sfx('money');
    await say('Here you are! Thank you!');
  }
  function buyList(stock) {
    const s = { name: 'buy', opaque: true, cur: 0, top: 0 };
    s.update = () => {
      if (s.busy) return;
      s.cur = nav(Math.min(s.cur, stock.length - 1), stock.length);
      s.top = scrollFor(s.cur, s.top, 7, stock.length);
      if (Input.pressed('b')) return s.close();
      if (Input.pressed('a') && stock.length) runAction(s, () => buyOne(stock[s.cur]));
    };
    s.draw = (g) => {
      bg(g);
      panel(g, 4, 4, 120, 22);
      drawText(g, 'MONEY', 10, 11, INK);
      right(g, '$' + G.money, 118, 11, INK);
      panel(g, 4, 30, 312, 98);
      for (let i = 0; i < 7; i++) {
        const k = s.top + i;
        if (k >= stock.length) break;
        const it = ITEMS[stock[k]];
        const y = 36 + i * 13;
        const can = G.money >= it.price;
        drawText(g, it.name, 18, y, can ? INK : DIM);
        right(g, '$' + it.price, 306, y, can ? INK : DIM);
      }
      if (stock.length) UI.cursor(g, 6, 36 + (s.cur - s.top) * 13);
      msgBox(g, stock.length ? ITEMS[stock[s.cur]].desc : 'Nothing for sale.');
    };
    return run(s);
  }
  // The shop: a welcome, then BUY / SELL / QUIT. Resolves when the shopkeeper says goodbye.
  async function mart(items) {
    const stock = (items || []).filter((id) => ITEMS[id]);
    await say('Welcome! How may I serve you?');
    for (;;) {
      const pick = await UI.choose(['BUY', 'SELL', 'QUIT'], { cancel: true });
      if (pick === 0) await buyList(stock);
      else if (pick === 1) await bag({ mode: 'sell' });
      else break;
      if (!(await UI.yesno('Is there anything else I can do?'))) break;
    }
    await say('Thank you! Come again!');
  }

  // ---------- name entry ----------
  // Letter grid: upper, lower, digits. SELECT changes the set, START jumps to OK, B deletes, max 8 characters.
  function enterName(prompt, def) {
    const PAGE_ROWS = [['ABCDEFGHIJKLM', 'NOPQRSTUVWXYZ'], ['abcdefghijklm', 'nopqrstuvwxyz'], ['0123456789']];
    const PAGE_LABEL = ['A-Z', 'a-z', '0-9'];
    const s = { name: 'naming', opaque: true, page: 0, r: 0, c: 0, text: '' };
    const finish = () => s.close(s.text.trim() || def || '');
    s.update = () => {
      const R = PAGE_ROWS[s.page];
      if (Input.pressed('select')) { s.page = (s.page + 1) % 3; s.r = 0; s.c = 0; return; }
      if (Input.pressed('start')) { s.r = R.length; s.c = 1; return; }
      if (Input.pressed('b')) { s.text = s.text.slice(0, -1); return; }
      if (Input.repeat('up')) s.r = Math.max(0, s.r - 1);
      if (Input.repeat('down')) s.r = Math.min(R.length, s.r + 1);
      const rowLen = s.r === R.length ? 2 : R[s.r].length;
      if (Input.repeat('left')) s.c = (s.c + rowLen - 1) % rowLen;
      if (Input.repeat('right')) s.c = (s.c + 1) % rowLen;
      s.c = Math.min(s.c, rowLen - 1);
      if (!Input.pressed('a')) return;
      if (s.r === R.length) {
        if (s.c === 0) s.text = s.text.slice(0, -1);
        else finish();
      } else if (s.text.length < 8) {
        s.text += R[s.r][s.c];
      }
    };
    s.draw = (g) => {
      const R = PAGE_ROWS[s.page];
      bg(g);
      panel(g, 4, 4, 312, 18);
      drawText(g, prompt || 'Your name?', 10, 9, INK);
      right(g, PAGE_LABEL[s.page], 308, 9, DIM);
      panel(g, 96, 26, 128, 18);
      const blink = Math.floor(Timers.time * 2) & 1 ? '_' : '';
      drawText(g, s.text + blink, 104, 31, INK);
      R.forEach((row, r) => {
        const y = 52 + r * 16;
        const x0 = 160 - (row.length * 20) / 2;
        row.split('').forEach((ch, c) => {
          const x = x0 + c * 20;
          drawText(g, ch, x + 6, y, INK);
          if (s.r === r && s.c === c) UI.cursor(g, x - 1, y);
        });
      });
      panel(g, 56, 96, 64, 16);
      panel(g, 200, 96, 64, 16);
      center(g, 'BACK', 88, 100, INK);
      center(g, 'OK', 232, 100, INK);
      if (s.r === R.length) UI.cursor(g, s.c === 0 ? 46 : 190, 100);
      msgBox(g, 'A: PICK    B: DELETE    START: OK    SELECT: SET', 300, 2);
    };
    return run(s);
  }

  return {
    start, party, summary, bag, dex, pc, mart, options, showEvents, useMedicine, canUse, forgetMove, giveItem,
    name: enterName,
  };
})();
DBG.menus = Menus;

// ---- 51_title.js
// Tidebound: the title screen. An animated dusk sea with a lighthouse and its rotating beam, the TIDEBOUND logo,
// a Lumarine swimming past now and then, and the CONTINUE / NEW GAME / OPTIONS menu.
// Title.show() resolves with 'new' or 'continue'. Only `Title` is declared at top level.

const Title = (() => {
  const INK = '#404040';
  let logo = null;
  let wave = null;
  let lumarine = null;
  let stars = null;

  function sfx(name) { try { if (typeof Sound !== 'undefined') Sound.play(name); } catch (_) {} }
  function center(g, s, xc, y, color, shadow) { drawText(g, s, Math.round(xc - textWidth(s) / 2), y, color, shadow); }
  function panel(g, x, y, w, h) { UI.box(g, x, y, w, h, 'white'); }

  // A copy of src filled with one colour (only where src is opaque).
  function tinted(src, color, w, h) {
    return makeCanvas(w, h, (c, g) => {
      g.drawImage(src, 0, 0, w, h);
      g.globalCompositeOperation = 'source-in';
      g.fillStyle = color;
      g.fillRect(0, 0, w, h);
    });
  }

  // The logo: 'TIDEBOUND' at 3x with a gold-to-orange gradient, a dark-blue outline and a drop shadow.
  function buildLogo() {
    const text = 'TIDEBOUND';
    const S = 3, OW = 2, pad = OW + 2;
    // letters spaced 2px wider than the font so the outlines don't merge at 3x
    const adv = [...text].map((ch) => textWidth(ch) + 3);
    const mask = makeCanvas(adv.reduce((a, b) => a + b, 0) + 4, 12, (c, g) => {
      let x = 2;
      [...text].forEach((ch, i) => { drawText(g, ch, x, 2, '#ffffff', null); x += adv[i]; });
    });
    const bw = mask.width * S, bh = mask.height * S;
    const fill = makeCanvas(bw, bh, (c, g) => {
      const grd = g.createLinearGradient(0, 0, 0, bh);
      grd.addColorStop(0, '#fff8c0');
      grd.addColorStop(0.5, '#ffc83c');
      grd.addColorStop(1, '#e8601c');
      g.fillStyle = grd;
      g.fillRect(0, 0, bw, bh);
      g.globalCompositeOperation = 'destination-in';
      g.drawImage(mask, 0, 0, bw, bh);
    });
    const ink = tinted(mask, '#16224e', bw, bh);
    const shadow = tinted(mask, 'rgba(8,12,30,0.55)', bw, bh);
    const offsets = [[-OW, 0], [OW, 0], [0, -OW], [0, OW], [-OW, -OW], [OW, -OW], [-OW, OW], [OW, OW]];
    return makeCanvas(bw + pad * 2 + 2, bh + pad * 2 + 2, (c, g) => {
      g.drawImage(shadow, pad + 2, pad + 3);
      for (const [dx, dy] of offsets) g.drawImage(ink, pad + dx, pad + dy);
      g.drawImage(fill, pad, pad);
    });
  }

  // Summary of the saved game for the CONTINUE box, or null when there is no readable save.
  function saveSummary() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const d = JSON.parse(raw);
      const caught = d.dex && d.dex.caught ? Object.keys(d.dex.caught).filter((k) => d.dex.caught[k]).length : 0;
      return { name: d.name || 'KAI', dex: caught, time: d.time || 0, badges: (d.badges || []).length };
    } catch (_) {
      return null;
    }
  }

  function drawSky(g) {
    const grd = g.createLinearGradient(0, 0, 0, 112);
    grd.addColorStop(0, '#0e1a40');
    grd.addColorStop(0.55, '#3c3a78');
    grd.addColorStop(1, '#e8845a');
    g.fillStyle = grd;
    g.fillRect(0, 0, W, 112);
  }
  function drawStars(g, t) {
    if (!stars) {
      stars = [];
      let seed = 7;
      const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
      for (let i = 0; i < 36; i++) stars.push([Math.floor(rnd() * W), Math.floor(rnd() * 60), rnd() * 6]);
    }
    for (const [x, y, ph] of stars) {
      const a = 0.35 + 0.35 * Math.sin(t * 1.5 + ph);
      g.fillStyle = `rgba(255,255,240,${a.toFixed(2)})`;
      g.fillRect(x, y, 1, 1);
    }
  }
  function drawLighthouse(g, t) {
    const x = 44;
    g.fillStyle = '#161a30';
    for (let y = 68; y <= 112; y++) {
      const hw = Math.round(4 + ((y - 68) / 44) * 4);
      g.fillRect(x - hw, y, hw * 2, 1);
    }
    g.fillRect(x - 6, 64, 12, 4);   // gallery
    g.fillRect(x - 4, 56, 8, 8);    // lamp room
    g.fillRect(x - 3, 52, 6, 4);    // roof
    g.fillStyle = '#ffe79a';
    g.fillRect(x - 3, 58, 6, 4);    // lit windows
    // the rotating beam: two opposite wedges
    const ang = t * 0.8;
    g.save();
    g.globalAlpha = 0.22;
    g.fillStyle = '#fff2b0';
    for (const a of [ang, ang + Math.PI]) {
      const spread = 0.13, len = 240;
      g.beginPath();
      g.moveTo(x, 60);
      g.lineTo(x + Math.cos(a - spread) * len, 60 + Math.sin(a - spread) * len);
      g.lineTo(x + Math.cos(a + spread) * len, 60 + Math.sin(a + spread) * len);
      g.closePath();
      g.fill();
    }
    g.restore();
  }
  function drawSea(g, t) {
    const grd = g.createLinearGradient(0, 112, 0, H);
    grd.addColorStop(0, '#3a6aa8');
    grd.addColorStop(1, '#0c1e40');
    g.fillStyle = grd;
    g.fillRect(0, 112, W, H - 112);
    if (!wave) {
      wave = makeCanvas(16, 4, (c, gw) => {
        gw.fillStyle = '#9cc8ec';
        gw.fillRect(1, 1, 5, 1);
        gw.fillRect(9, 2, 5, 1);
        gw.fillStyle = '#6aa0d8';
        gw.fillRect(4, 2, 2, 1);
      });
    }
    const pat = g.createPattern(wave, 'repeat');
    [116, 124, 133, 143, 155, 168].forEach((y, i) => {
      g.save();
      const dir = i % 2 ? 1 : -1;
      g.translate(dir * ((t * (6 + i * 2)) % 16), 0);
      g.fillStyle = pat;
      g.fillRect(-16, y, W + 32, 4);
      g.restore();
    });
  }
  // Lumarine swims right to left, every 20 seconds, for 11 of them.
  function drawSwimmer(g, t) {
    const period = 20, on = 11;
    const k = t % period;
    if (k > on) return;
    if (!lumarine) lumarine = Sprites.mon('lumarine');
    const p = k / on;
    const x = W + 6 - p * (W + 90);
    const y = 114 + Math.sin(t * 2) * 3;
    g.drawImage(lumarine, Math.round(x), Math.round(y));
  }
  function drawLogo(g, t) {
    if (!logo) logo = buildLogo();
    g.drawImage(logo, Math.round((W - logo.width) / 2), 8 + Math.round(Math.sin(t * 1.6)));
  }
  function drawSaveBox(g, sum) {
    panel(g, 4, 112, 128, 58);
    const hours = Math.floor(sum.time / 3600);
    const mins = String(Math.floor(sum.time / 60) % 60).padStart(2, '0');
    drawText(g, sum.name, 12, 118, INK);
    drawText(g, `DEX ${sum.dex}/${DEX_ORDER.length}`, 12, 131, INK);
    drawText(g, `TIME ${hours}:${mins}`, 12, 144, INK);
    drawText(g, `BADGES ${sum.badges}`, 12, 157, INK);
  }
  function drawScreen(g, s) {
    const t = Timers.time;
    drawSky(g);
    drawStars(g, t);
    g.fillStyle = '#f4ecd0';
    g.beginPath();
    g.arc(282, 26, 9, 0, Math.PI * 2);
    g.fill();
    drawLighthouse(g, t);
    drawSea(g, t);
    drawSwimmer(g, t);
    drawLogo(g, t);
    if (s.phase === 'idle') {
      if (Math.floor(t * 2) % 2 === 0) center(g, 'PRESS START', 160, 96, '#fff8e0', '#101828');
      g.fillStyle = 'rgba(8,14,32,0.6)';
      g.fillRect(0, 160, W, 20);
      center(g, "(C) Chinny's Arcade - fan-style original", 160, 162, '#e8e8f0', '#101020');
      center(g, 'Z/Space: A  X/Shift: B  Esc/Tab: START  arrows/WASD', 160, 171, '#c8d0e0', '#101020');
    } else if (s.summary) {
      drawSaveBox(g, s.summary);
    }
  }

  // The CONTINUE / NEW GAME / OPTIONS menu. Resolves with 'continue' or 'new'.
  async function menu(s) {
    for (;;) {
      s.phase = 'menu';
      s.summary = saveSummary();
      const labels = s.summary ? ['CONTINUE', 'NEW GAME', 'OPTIONS'] : ['NEW GAME', 'OPTIONS'];
      const label = labels[await UI.choose(labels, { x: 206, y: 112, w: 100 })];
      if (label === 'CONTINUE') return 'continue';
      if (label === 'NEW GAME') {
        if (!s.summary || (await UI.yesno('Start a new game? Your saved game will be overwritten.'))) return 'new';
      } else if (label === 'OPTIONS') {
        await Menus.options();
      }
    }
  }

  // Shows the title screen. Resolves with 'new' or 'continue'; the caller loads the save for 'continue'.
  function show() {
    return new Promise((resolve) => {
      const s = { name: 'title', opaque: true, phase: 'idle', busy: false, summary: null };
      let done = false;
      const finish = (v) => {
        if (done) return;
        done = true;
        Scenes.pop(s);
        resolve(v);
      };
      s.update = () => {
        if (s.busy || s.phase !== 'idle') return;
        if (Input.pressed('a') || Input.pressed('start')) {
          s.busy = true;
          sfx('select');
          menu(s).then(finish);
        }
      };
      s.draw = (g) => drawScreen(g, s);
      Scenes.push(s);
      try { if (typeof Music !== 'undefined') Music.play('title'); } catch (_) {}
    });
  }

  return { show };
})();

// ---- 69_story.js
// Tidebound: story scenes and scripted events. The intro, Coral's starter and rival sequence, the Shellport blocker,
// Mom, the Care Center, Captain Brine, the Lumen gym, the lighthouse rival, and the static Tideling encounters.
// Only `Story` is a top-level name in this file. Map files call these functions from their talk/run hooks.

const Story = (() => {
  const TYPE = { sproutle: 'GRASS', embit: 'FIRE', splishel: 'WATER' };
  const COUNTER = { sproutle: 'embit', embit: 'splishel', splishel: 'sproutle' };
  const EVOLVED = { sproutle: 'brambull', embit: 'cindrake', splishel: 'tidalon' };
  const PLAYER_NAMES = ['KAI', 'ALEX', 'JUNO', 'RIO'];
  const RIVAL_NAMES = ['MAREN', 'TAO', 'SKYE'];

  function bgm(t) { try { Music.play(t); } catch (_) {} }
  function spName(sp) { return SPECIES[sp].name; }

  // ---------- intro ----------
  function introScene() {
    const port = Chars.portrait('prof');
    const mon = Sprites.mon('splishel');
    return {
      name: 'intro', opaque: true,
      update() {},
      draw(g) {
        g.fillStyle = '#9fd8ea'; g.fillRect(0, 0, W, H);
        g.fillStyle = '#e8f6f0'; g.fillRect(0, 124, W, 56);
        g.fillStyle = '#c9e7d6'; g.fillRect(0, 120, W, 4);
        g.drawImage(port, 112, 14);
        g.drawImage(mon, 196, 58);
      },
    };
  }

  async function intro() {
    const scene = Scenes.push(introScene());
    await UI.say(['Hello there! Welcome to the', 'world of TIDELINGS!']);
    await UI.say(['People and TIDELINGS live side', 'by side on our little islands.']);
    await UI.say(['I am Professor CORAL. Now,', 'what is your name?']);
    const i = await UI.choose(['NEW NAME', 'KAI', 'ALEX', 'JUNO', 'RIO']);
    if (i === 0) {
      const n = await Menus.name('Your name?', 'KAI');
      G.name = (n || 'KAI').toUpperCase().slice(0, 8) || 'KAI';
    } else {
      G.name = PLAYER_NAMES[i > 0 ? i - 1 : 0];
    }
    await UI.say(['{P}! What a fine name!', 'And my grandchild, what is theirs?']);
    const j = await UI.choose(['NEW NAME', 'MAREN', 'TAO', 'SKYE']);
    if (j === 0) {
      const n = await Menus.name("Rival's name?", 'MAREN');
      G.rival = (n || 'MAREN').toUpperCase().slice(0, 8) || 'MAREN';
    } else {
      G.rival = RIVAL_NAMES[j > 0 ? j - 1 : 0];
    }
    await UI.say(['{R} is my grandchild. We', 'study TIDELINGS together.']);
    await UI.say('Your very own TIDELING legend is about to unfold!');
    await fadeOut(0.5);
    Scenes.pop(scene);
    G.map = 'player_house_2f'; G.x = 4; G.y = 4; G.dir = 'down';
    setFlag('intro_done');
  }

  // ---------- Shellport ----------
  // Stepping on the north exit before the starter is picked: Coral's warning, then you are turned back.
  async function northBlock() {
    await Script.emote('player', '!');
    await UI.say(['Wait! Wild TIDELINGS live in', 'the tall grass out there!']);
    await UI.say(['Come see Prof. CORAL in the lab', 'first. Go on, shoo!']);
    await Script.walk('player', 'dd');
  }

  async function mom() {
    if (!flag('got_starter')) {
      return UI.say(['Oh, {P}! Professor CORAL was', 'looking for you! Hurry along!']);
    }
    await UI.say(['You look tired, sweetheart.', 'Have a rest.']);
    await Script.heal();
    await UI.say(['Your TIDELINGS are fighting fit!', 'Now off you go, and be careful.']);
  }

  // ---------- lab: Coral, the starter and the first rival battle ----------
  async function coralLab() {
    if (flag('got_dex')) {
      return UI.say(['Prof. CORAL: How is your TIDEDEX', 'coming along? Keep catching!']);
    }
    if (!flag('got_starter')) {
      await UI.say(['Ah, {P}! Right on time.', 'Pick a TIDELING to be your partner.']);
      await UI.say(['SPROUTLE is GRASS-type. EMBIT is', 'FIRE-type. SPLISHEL is WATER-type.']);
      let sp = null;
      while (!sp) {
        const i = await UI.choose(['SPROUTLE', 'EMBIT', 'SPLISHEL']);
        const cand = ['sproutle', 'embit', 'splishel'][i < 0 ? 0 : i];
        const ok = await UI.yesno('So you want ' + spName(cand) + ', the ' + TYPE[cand] + ' TIDELING?');
        if (ok) sp = cand;
      }
      setFlag('got_starter');
      G.starter = sp;
      await Script.giveMon(sp, 5);
      await UI.say(['Take good care of your new friend!', 'Oh? Someone is coming in...']);
      setFlag('rival_here');
      World.refresh();
      await Script.emote('rival_lab', '!');
      await Script.walk('rival_lab', 'l');
    } else {
      // Came back after a lost rival battle: finish the sequence.
      setFlag('rival_here');
      World.refresh();
    }
    if (!flag('rival1')) {
      const rv = COUNTER[G.starter];
      await UI.say([G.rival + ': Hah! I get the one', 'that beats yours. Let\'s go!']);
      const T = {
        id: 'rival1', cls: 'RIVAL', name: G.rival, sprite: 'rival', music: 'rival', money: 30,
        party: [[rv, 5]],
        intro: G.rival + ': Ready when you are!',
        lose: G.rival + ': Hmph. A lucky break.',
        after: G.rival + ': Next time I win!',
      };
      const r = await Battle.trainer(T);
      if (r === 'lose') Mon.healParty();
      setFlag('rival1');
      World.refresh();
      bgm('town');
      await UI.say([G.rival + ': Grr! Gramps, I am off', 'to the sea. See you around!']);
    }
    if (!flag('got_dex')) {
      await UI.say(['Prof. CORAL: Splendid! Take this.', 'It is your TIDEDEX.']);
      setFlag('got_dex');
      await UI.say(['It records every TIDELING you', 'meet. Catch them all!']);
      await Script.give('orb', 5);
      await UI.say(['Go on, explore the islands!', 'The tall grass is waiting.']);
    }
  }

  // Blank sign at the heal machine: the Care Center machine sends TIDELINGS back to full health.
  async function healMachine() {
    await UI.say(['The machine hums softly and', 'the TIDELINGS in it glow.']);
    await Script.heal();
    await UI.say(['Your TIDELINGS are fighting fit!', 'We hope to see you again!']);
  }

  async function nurse() {
    const ok = await UI.yesno('Welcome to the CARE CENTER! Shall we restore your TIDELINGS to full health?');
    if (!ok) return UI.say('Come back any time. We are here!');
    await Script.heal();
    await UI.say(['Your TIDELINGS are fighting fit!', 'We hope to see you again!']);
  }

  // ---------- Route 1 / Route 2 / cave ----------
  async function brine() {
    if (flag('got_chop')) {
      return UI.say(['Ahoy! Mind the tides on the', 'way north, matey!']);
    }
    await UI.say(['Ahoy, traveler! You made it', 'out of that dark cave!']);
    await UI.say(['Here, take this. HM01 CHOP!', 'It cuts down the stubborn trees.']);
    setFlag('got_chop');
    await Script.give('hm_chop');
  }

  // ---------- Lumen gym ----------
  const MARINA = {
    id: 'gym_marina', cls: 'LEADER', name: 'MARINA', sprite: 'leader', music: 'gymbattle', money: 100,
    party: [['gullip', 12], ['jellink', 12], ['pelicant', 14]],
    items: ['superpotion', 'superpotion'],
    intro: 'Marina: Oh! A challenger! Let\'s see if your TIDELINGS can ride the waves.',
    lose: 'Marina: The tide was not with you today!',
    after: 'Marina: Come back when the wind is high!',
  };

  async function gymLeader() {
    if (flag('badge1')) {
      return UI.say('MARINA: The tide and wind favor you now. Fly well!');
    }
    await UI.say(MARINA.intro);
    bgm(MARINA.music);
    const r = await Script.trainerBattle({ trainer: MARINA, sprite: 'leader' });
    if (r !== 'win') return;
    G.badges.push('wave');
    setFlag('badge1');
    G.money += 500;
    await UI.say(['{P} received the WAVE BADGE!', 'MARINA: The sea trusts you now.']);
    setFlag('got_smash');
    await Script.give('hm_smash');
    await UI.say(['HM02 SMASH lets you break rocks.', 'Now the Tidewater Cave opens up!']);
    World.refresh();
  }

  // ---------- Lumen lighthouse rival (final battle) ----------
  async function rival2() {
    if (flag('rival2') || !flag('badge1')) return;
    const n = World.npc('rival_lumen');
    const p = World.player;
    if (n && n.y + 1 < p.y) await Script.walk('rival_lumen', 'd');
    await Script.emote('rival_lumen', '!');
    await UI.say([G.rival + ': Heh, you beat Marina?', 'Then prove you are the best!']);
    const T = {
      id: 'rival2', cls: 'RIVAL', name: G.rival, sprite: 'rival', music: 'rival', money: 60,
      party: [['gullip', 13], [EVOLVED[COUNTER[G.starter]] || 'brambull', 16], ['kelpup', 13]],
      intro: G.rival + ': Ready! Let\'s end this!',
      lose: G.rival + ': Ugh, you really are good.',
      after: G.rival + ': Still too strong for me!',
    };
    const r = await Battle.trainer(T);
    if (r === 'lose') Mon.healParty();
    setFlag('rival2');
    World.refresh();
    await UI.say([G.rival + ': Fine, the lighthouse is', 'yours. Take care of the sea!']);
    await UI.say(['Prof. CORAL would be proud.', 'Thank you for playing Tidebound.']);
    await Script.credits();
    await World.warp('lumen_center', 6, 5, 'up');
  }

  // ---------- static Tidelings ----------
  async function statics(sp, lv, flagName, lines) {
    await UI.say(lines);
    bgm('battle');
    const r = await Battle.wild(sp, lv, { static: true });
    if (r === 'lose') return World.blackout();
    setFlag(flagName);
    World.refresh();
  }

  function corallo() {
    return statics('corallo', 15, 'corallo', ['Something pink and branching', 'uncoils from the rubble...']);
  }

  function lumarine() {
    return statics('lumarine', 25, 'lumarine', ['A massive shape coils around', 'the great lamp. It is LUMARINE!']);
  }

  return {
    intro, northBlock, mom, coralLab, healMachine, nurse, brine, gymLeader, rival2, corallo, lumarine,
    spName, bgm,
  };
})();

// ---- 90_main.js
// Boot: title → intro or continue → world. Plus the TB debug helpers that span modules.

async function boot() {
  requestAnimationFrame((t) => Loop.tick(t));
  if (DEBUG) return;   // tests call TB.start()
  const choice = await Title.show();
  if (choice === 'continue' && Save.read()) {
    World.enter();
  } else {
    newGame();
    await Story.intro();
    World.enter();
  }
}

DBG.start = async (o = {}) => {
  Scenes.stack.length = 0;
  Fade.a = 0;
  R.seed(o.seed == null ? 1 : o.seed);
  newGame();
  DBG.fast = o.fast !== false;
  DBG.autoText = o.autoText !== false;
  G.options.music = false; G.options.sfx = false;
  if (o.starter) {
    G.party.push(Mon.create(o.starter, o.lv || 5)); Mon.markCaught(o.starter);
    G.starter = o.starter;
    setFlag('got_starter'); setFlag('rival1'); setFlag('got_dex'); setFlag('intro_done');
    bagAdd('orb', 5); bagAdd('potion', 2);
  }
  if (o.map) { G.map = o.map; G.x = o.x; G.y = o.y; }
  World.enter();
  await DBG.sim(0.2);
  return DBG.scenes();
};
DBG.auto = (on = true) => { DBG.fast = on; DBG.autoText = on; };
DBG.G = () => G;
DBG.flags = () => G.flags;
DBG.give = (item, n = 1) => bagAdd(item, n);
DBG.giveMon = (sp, lv = 5) => { const m = Mon.create(sp, lv); Mon.addToParty(m); Mon.markCaught(sp); return m; };
// boost(lv): level every party member up to lv the normal way (learning moves, replacing the weakest when full,
// evolving), then heal. boost(0) just heals.
DBG.boost = (lv) => {
  for (const m of G.party) {
    if (m.lv < lv) {
      const evs = Mon.gainXp(m, Mon.xpAt(lv, SPECIES[m.sp].growth) - m.xp);
      for (const ev of evs) {
        if (ev.type === 'learnFull') {
          let k = 0;
          m.moves.forEach((mv, i) => { if ((MOVES[mv.id].power || 0) < (MOVES[m.moves[k].id].power || 0)) k = i; });
          Mon.teach(m, ev.move, k);
        } else if (ev.type === 'evolve') Mon.evolve(m, ev.to);
      }
    }
    Mon.heal(m);
  }
};
DBG.tp = (map, x, y, dir = 'down') => World.warp(map, x, y, dir);
DBG.battle = (sp, lv = 5) => Battle.wild(sp, lv);
DBG.trainer = (t) => Battle.trainer(t);

boot();

})();
