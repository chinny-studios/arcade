name: Offline image

# Builds the container image that serves the whole arcade with no network access (see Dockerfile and
# tools/offline/). Every run builds it and checks it. Pushes to main and manual runs on main also publish it to
# ghcr.io for amd64 and arm64, with provenance and an SBOM, signed keyless with cosign.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write  # push to ghcr.io
      id-token: write  # keyless cosign signature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No QEMU: the vendoring stage runs on the runner's own platform and the final stage only copies files,
      # so the arm64 image builds without emulation. Add docker/setup-qemu-action if a RUN goes in that stage.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.title=Chinny's Arcade (offline)
            org.opencontainers.image.description=Every Chinny's Arcade game with its fonts and libraries, served by nginx on port 8080 with no network access needed.
          annotations: |
            org.opencontainers.image.title=Chinny's Arcade (offline)
            org.opencontainers.image.description=Every Chinny's Arcade game with its fonts and libraries, served by nginx on port 8080 with no network access needed.

      - name: Build for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: arcade:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test the image
        run: |
          set -euo pipefail
          # Run it the strictest way the README suggests: read-only, no capabilities, non-root.
          docker run -d --name arcade --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -p 8080:8080 arcade:test
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 1; done

          fail=0
          check() {  # url expected-status
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/$1")
            if [ "$code" = "$2" ]; then echo "ok   $code /$1"; else echo "FAIL $code /$1 (want $2)"; fail=1; fi
          }
          check '' 200
          for page in */index.html; do
            check "${page%index.html}" 200
          done
          check tokoyo 301                 # directory redirect
          check tokoyo/source/build.py 404 # sources stay out of the image
          check _vendor/MANIFEST.txt 200

          location=$(curl -sI http://localhost:8080/tokoyo | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
          [ "$location" = /tokoyo/ ] || { echo "FAIL redirect is '$location', want a relative /tokoyo/"; fail=1; }
          [ "$(docker exec arcade id -u)" != 0 ] || { echo "FAIL nginx runs as root"; fail=1; }

          # Scan what actually shipped, not just the build stage.
          docker cp arcade:/usr/share/nginx/html "$RUNNER_TEMP/site"
          python3 -I tools/offline/vendor.py --check "$RUNNER_TEMP/site" || fail=1
          echo "Image size: $(docker image inspect arcade:test -f '{{.Size}}' | numfmt --to=si)B"
          docker logs arcade 2>&1 | tail -5
          exit $fail

      - name: Log in to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        name: Build and push amd64 + arm64
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'

      - name: Sign the image
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"

      - name: Summary
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "### Published ${image}"
            echo
            echo "Digest \`${DIGEST}\`, tags:"
            for t in $TAGS; do echo "- \`$t\`"; done
            echo
            echo '```sh'
            echo "docker run -d --name arcade -p 8080:8080 --restart unless-stopped ${image}:latest"
            echo "cosign verify ${image}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
