<title>Nullwake</title>
<meta name="description" content="A star collapsed and a swarm poured out of its wake. Your ship is gone; your suit's auto-weapons are not. Survive fifteen minutes, evolve your arsenal and bring down what waits at the end.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #eef3ff; --dim: #9aa6c0; --faint: #5d6886; --acc: #5ef0ff; --acc2: #ff5ec8; --gold: #ffd25e; --good: #7dffa8; --bad: #ff5e6c;
    --panel: rgba(8,12,28,.92); --panel2: rgba(18,26,52,.95); --line: rgba(140,180,255,.22); --font: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: #03050c; color: var(--ink); font-family: var(--font); overflow: hidden;
    -webkit-user-select: none; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  #app { position: fixed; inset: 0; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  b { color: var(--acc); font-weight: 600; } .gold { color: var(--gold) !important; } .good { color: var(--good) !important; } .bad { color: var(--bad) !important; } .dim { color: var(--dim); }
  kbd { font-family: var(--font); font-weight: 700; font-size: .85em; padding: 0 .4em; border: 1px solid rgba(255,255,255,.4); border-radius: 4px; background: rgba(255,255,255,.08); }

  /* HUD */
  .hud { position: absolute; inset: 0; pointer-events: none; display: none; }
  body[data-state="play"] .hud, body[data-state="levelup"] .hud, body[data-state="chest"] .hud, body[data-state="pause"] .hud { display: block; }
  #xp { position: absolute; left: 0; right: 0; top: 0; height: 16px; background: rgba(0,0,0,.6); border-bottom: 1px solid rgba(94,240,255,.35); }
  #xp i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #1f7cff, #5ef0ff); box-shadow: 0 0 10px rgba(94,240,255,.6); }
  #lv { position: absolute; right: 10px; top: 0; line-height: 16px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-shadow: 0 1px 2px #000; }
  #clock { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); font-size: 30px; font-weight: 700; letter-spacing: .06em; text-shadow: 0 2px 6px #000, 0 0 12px rgba(0,0,0,.6); }
  #clock.final { color: var(--bad); }
  #tally { position: absolute; right: 12px; top: 24px; text-align: right; font-size: 15px; font-weight: 600; text-shadow: 0 1px 3px #000; line-height: 1.45; }
  #tally b { color: var(--ink); min-width: 3ch; display: inline-block; }
  #tally .ic { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; }
  #slots { position: absolute; left: 8px; top: 22px; display: flex; flex-direction: column; gap: 4px; }
  #slots .row { display: flex; gap: 3px; }
  .slot { position: relative; width: 30px; height: 30px; border: 1px solid rgba(140,180,255,.3); background: rgba(6,10,24,.7); border-radius: 5px; }
  .slot img { width: 100%; height: 100%; display: block; }
  .slot span { position: absolute; right: 1px; bottom: -1px; font-size: 10px; font-weight: 700; text-shadow: 0 0 2px #000, 0 0 3px #000; }
  .slot.evo { border-color: var(--gold); box-shadow: 0 0 8px rgba(255,210,94,.45); }
  .slot.empty { opacity: .3; }
  #boss { position: absolute; left: 50%; top: 66px; transform: translateX(-50%); width: min(520px, 70vw); text-align: center; }
  #boss .n { font-size: 13px; font-weight: 700; letter-spacing: .25em; text-transform: uppercase; color: var(--bad); text-shadow: 0 1px 3px #000; }
  #boss .g { height: 8px; margin-top: 3px; background: rgba(0,0,0,.6); border: 1px solid rgba(255,94,108,.5); }
  #boss .g i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff2f4f, #ff8a5e); }
  #pausebtn { pointer-events: auto; position: absolute; right: 10px; top: 80px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: rgba(6,10,24,.6);
    color: var(--ink); font: 700 14px var(--font); letter-spacing: -.05em; cursor: pointer; display: none; }
  body[data-input="touch"] #pausebtn { display: block; }
  #banner { position: absolute; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none; opacity: 0; transition: opacity .4s; }
  #banner.on { opacity: 1; }
  #banner .t { font-size: clamp(30px, 6vw, 56px); font-weight: 700; letter-spacing: .3em; text-shadow: 0 0 20px currentColor, 0 2px 8px #000; }
  #banner .s { margin-top: 6px; font-size: 16px; letter-spacing: .15em; color: var(--ink); text-shadow: 0 1px 4px #000; }
  #banner.warn .t { color: var(--bad); animation: blink .5s steps(2) infinite; }
  #banner.info .t { color: var(--acc); }
  @keyframes blink { 50% { opacity: .35; } }
  #hurt { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(255,30,60,.55)); }
  #stick { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(140,200,255,.35); background: rgba(20,40,80,.18);
    pointer-events: none; display: none; }
  #stick i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(94,240,255,.35); border: 2px solid rgba(160,250,255,.7); }
  #stick.on { display: block; }

  /* menus */
  #menu { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow-y: auto; padding: 16px; box-sizing: border-box; }
  #menu:empty { display: none; }
  body[data-state="levelup"] #menu, body[data-state="chest"] #menu, body[data-state="pause"] #menu, body[data-state="over"] #menu { background: rgba(2,4,12,.62); }
  .screen { width: min(980px, 100%); margin: auto; text-align: center; }
  .screen h1 { margin: 0; font-size: clamp(46px, 11vw, 104px); font-weight: 700; letter-spacing: .14em; line-height: 1; padding-left: .14em;
    background: linear-gradient(180deg, #ffffff 10%, #8ef6ff 55%, #ff5ec8 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 18px rgba(94,240,255,.35)); }
  .screen h2 { margin: 0 0 4px; font-size: clamp(24px, 5vw, 38px); letter-spacing: .18em; text-transform: uppercase; }
  .screen h2.lvl { color: var(--acc); text-shadow: 0 0 16px rgba(94,240,255,.6); }
  .screen h2.evo { color: var(--gold); text-shadow: 0 0 16px rgba(255,210,94,.6); }
  .screen .sub { color: var(--dim); font-size: 15px; margin-bottom: 18px; letter-spacing: .04em; }
  .tag { color: var(--dim); font-size: clamp(14px, 2.4vw, 17px); margin: 14px auto 28px; max-width: 560px; line-height: 1.5; }
  .stack { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .btn { font: 600 17px var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
    padding: 11px 26px; min-width: 220px; cursor: pointer; transition: border-color .12s, background .12s, transform .12s; outline: none; }
  .btn.sm { min-width: 0; font-size: 14px; padding: 8px 16px; }
  .btn:hover, .btn:focus-visible, .btn.focus { border-color: var(--acc); background: rgba(30,60,110,.95); box-shadow: 0 0 14px rgba(94,240,255,.3); }
  .btn.primary { border-color: rgba(94,240,255,.6); }
  .btn[disabled] { opacity: .4; cursor: default; }
  .row-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  .card { position: relative; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; color: var(--ink); font: 15px/1.4 var(--font);
    cursor: pointer; outline: none; transition: border-color .12s, transform .12s, box-shadow .12s; }
  .card:hover, .card:focus-visible, .card.focus { border-color: var(--acc); box-shadow: 0 0 18px rgba(94,240,255,.28); transform: translateY(-2px); }
  .card.locked { opacity: .6; }
  .card.sel { border-color: var(--good); box-shadow: 0 0 16px rgba(125,255,168,.3); }
  .card .top { display: flex; gap: 12px; align-items: center; }
  .card img.ic { width: 52px; height: 52px; flex: none; border-radius: 6px; background: rgba(0,0,0,.35); }
  .card img.portrait { width: 72px; height: 72px; flex: none; border-radius: 8px; background: rgba(0,0,0,.35); }
  .card .nm { font-size: 18px; font-weight: 700; letter-spacing: .04em; }
  .card .lv { font-size: 13px; color: var(--dim); letter-spacing: .06em; }
  .card .lv .new { color: var(--gold); font-weight: 700; }
  .card .d { margin-top: 8px; color: #c9d3ea; font-size: 14px; }
  .card .x { margin-top: 6px; font-size: 12.5px; color: var(--dim); }
  .card .k { position: absolute; right: 10px; top: 8px; font-size: 12px; color: var(--faint); }
  .card .cost { margin-top: 8px; font-weight: 700; color: var(--gold); }
  .card .pips { margin-top: 8px; display: flex; gap: 4px; }
  .card .pips i { width: 14px; height: 6px; background: rgba(255,255,255,.12); border-radius: 2px; } .card .pips i.on { background: var(--acc); }
  .levelup .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 900px; margin: 0 auto; }
  .levelup .card { padding: 16px; }
  @media (max-width: 600px) { .slot { width: 24px; height: 24px; } #clock { top: 80px; font-size: 22px; } #boss { top: 112px; } #tally { font-size: 13px; } #pausebtn { top: 70px; } }
  @media (max-width: 700px) { .levelup .cards { grid-template-columns: 1fr; } .levelup .card .d { margin-top: 4px; } .levelup .card { padding: 10px 12px; } }
  .stagecard canvas { width: 100%; aspect-ratio: 16/8; display: block; border-radius: 5px; margin-bottom: 10px; background: #000; }
  .goldline { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--gold); font-size: 18px; margin-bottom: 14px; }
  .goldline img { width: 18px; height: 18px; }
  .loot { display: flex; flex-direction: column; gap: 10px; max-width: 460px; margin: 0 auto; }
  .loot .card { cursor: default; animation: pop .35s backwards; }
  .loot .card.evo { border-color: var(--gold); box-shadow: 0 0 24px rgba(255,210,94,.35); }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } }
  table.res { margin: 0 auto; border-collapse: collapse; font-size: 14px; min-width: min(420px, 100%); }
  table.res td, table.res th { padding: 4px 10px; text-align: right; border-bottom: 1px solid rgba(255,255,255,.06); }
  table.res th { color: var(--dim); font-weight: 500; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  table.res td:first-child, table.res th:first-child { text-align: left; }
  table.res img { width: 22px; height: 22px; vertical-align: middle; margin-right: 6px; }
  .stats { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; margin: 6px 0 16px; }
  .stats div { font-size: 13px; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; } .stats div b { display: block; font-size: 24px; color: var(--ink); letter-spacing: .02em; }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 420px; margin: 0 auto 10px; font-size: 16px; }
  .opt .btn { min-width: 120px; }
  .hint { margin-top: 18px; font-size: 13px; color: var(--faint); line-height: 1.6; }
  .codex { text-align: left; max-width: 760px; margin: 0 auto; }
  .codex .evo-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 14px; }
  .codex .evo-row img { width: 34px; height: 34px; border-radius: 5px; background: rgba(0,0,0,.35); }
  .codex .evo-row .plus { color: var(--faint); }
  .codex .evo-row .nm { margin-left: 4px; }
  .codex .evo-row .unk { color: var(--faint); }
  .scroll { max-height: calc(100vh - 220px); overflow-y: auto; padding: 4px; }
  .quick { font-size: 13px; color: var(--dim); margin-top: 8px; }
</style>
<div id="app">
  <canvas id="c"></canvas>
  <div id="hurt"></div>
  <div class="hud" id="hud">
    <div id="xp"><i></i><span id="lv">LV 1</span></div>
    <div id="slots"><div class="row" id="wslots"></div><div class="row" id="pslots"></div></div>
    <div id="clock">00:00</div>
    <div id="tally"><div><span class="ic" id="icKill"></span><b id="kills">0</b></div><div><span class="ic" id="icGold"></span><b id="gold">0</b></div></div>
    <div id="boss" hidden><div class="n"></div><div class="g"><i></i></div></div>
    <button id="pausebtn" aria-label="Pause">II</button>
  </div>
  <div id="stick"><i></i></div>
  <div id="banner"><div class="t"></div><div class="s"></div></div>
  <div id="menu"></div>
</div>
