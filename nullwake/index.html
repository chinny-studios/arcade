<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Nullwake</title>
<meta name="description" content="A star collapsed and a swarm poured out of its wake. Your ship is gone; your suit's auto-weapons are not. Survive fifteen minutes, evolve your arsenal and bring down what waits at the end.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #eef3ff; --dim: #9aa6c0; --faint: #5d6886; --acc: #5ef0ff; --acc2: #ff5ec8; --gold: #ffd25e; --good: #7dffa8; --bad: #ff5e6c;
    --panel: rgba(8,12,28,.92); --panel2: rgba(18,26,52,.95); --line: rgba(140,180,255,.22); --font: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: #03050c; color: var(--ink); font-family: var(--font); overflow: hidden;
    -webkit-user-select: none; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  #app { position: fixed; inset: 0; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  b { color: var(--acc); font-weight: 600; } .gold { color: var(--gold) !important; } .good { color: var(--good) !important; } .bad { color: var(--bad) !important; } .dim { color: var(--dim); }
  kbd { font-family: var(--font); font-weight: 700; font-size: .85em; padding: 0 .4em; border: 1px solid rgba(255,255,255,.4); border-radius: 4px; background: rgba(255,255,255,.08); }

  /* HUD */
  .hud { position: absolute; inset: 0; pointer-events: none; display: none; }
  body[data-state="play"] .hud, body[data-state="levelup"] .hud, body[data-state="chest"] .hud, body[data-state="pause"] .hud { display: block; }
  #xp { position: absolute; left: 0; right: 0; top: 0; height: 16px; background: rgba(0,0,0,.6); border-bottom: 1px solid rgba(94,240,255,.35); }
  #xp i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #1f7cff, #5ef0ff); box-shadow: 0 0 10px rgba(94,240,255,.6); }
  #lv { position: absolute; right: 10px; top: 0; line-height: 16px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-shadow: 0 1px 2px #000; }
  #clock { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); font-size: 30px; font-weight: 700; letter-spacing: .06em; text-shadow: 0 2px 6px #000, 0 0 12px rgba(0,0,0,.6); }
  #clock.final { color: var(--bad); }
  #tally { position: absolute; right: 12px; top: 24px; text-align: right; font-size: 15px; font-weight: 600; text-shadow: 0 1px 3px #000; line-height: 1.45; }
  #tally b { color: var(--ink); min-width: 3ch; display: inline-block; }
  #tally .ic { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; }
  #slots { position: absolute; left: 8px; top: 22px; display: flex; flex-direction: column; gap: 4px; }
  #slots .row { display: flex; gap: 3px; }
  .slot { position: relative; width: 30px; height: 30px; border: 1px solid rgba(140,180,255,.3); background: rgba(6,10,24,.7); border-radius: 5px; }
  .slot img { width: 100%; height: 100%; display: block; }
  .slot span { position: absolute; right: 1px; bottom: -1px; font-size: 10px; font-weight: 700; text-shadow: 0 0 2px #000, 0 0 3px #000; }
  .slot.evo { border-color: var(--gold); box-shadow: 0 0 8px rgba(255,210,94,.45); }
  .slot.empty { opacity: .3; }
  #boss { position: absolute; left: 50%; top: 66px; transform: translateX(-50%); width: min(520px, 70vw); text-align: center; }
  #boss .n { font-size: 13px; font-weight: 700; letter-spacing: .25em; text-transform: uppercase; color: var(--bad); text-shadow: 0 1px 3px #000; }
  #boss .g { height: 8px; margin-top: 3px; background: rgba(0,0,0,.6); border: 1px solid rgba(255,94,108,.5); }
  #boss .g i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff2f4f, #ff8a5e); }
  #pausebtn { pointer-events: auto; position: absolute; right: 10px; top: 80px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: rgba(6,10,24,.6);
    color: var(--ink); font: 700 14px var(--font); letter-spacing: -.05em; cursor: pointer; display: none; }
  body[data-input="touch"] #pausebtn { display: block; }
  #banner { position: absolute; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none; opacity: 0; transition: opacity .4s; }
  #banner.on { opacity: 1; }
  #banner .t { font-size: clamp(30px, 6vw, 56px); font-weight: 700; letter-spacing: .3em; text-shadow: 0 0 20px currentColor, 0 2px 8px #000; }
  #banner .s { margin-top: 6px; font-size: 16px; letter-spacing: .15em; color: var(--ink); text-shadow: 0 1px 4px #000; }
  #banner.warn .t { color: var(--bad); animation: blink .5s steps(2) infinite; }
  #banner.info .t { color: var(--acc); }
  @keyframes blink { 50% { opacity: .35; } }
  #hurt { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(255,30,60,.55)); }
  #stick { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(140,200,255,.35); background: rgba(20,40,80,.18);
    pointer-events: none; display: none; }
  #stick i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(94,240,255,.35); border: 2px solid rgba(160,250,255,.7); }
  #stick.on { display: block; }

  /* menus */
  #menu { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow-y: auto; padding: 16px; box-sizing: border-box; }
  #menu:empty { display: none; }
  body[data-state="levelup"] #menu, body[data-state="chest"] #menu, body[data-state="pause"] #menu, body[data-state="over"] #menu { background: rgba(2,4,12,.62); }
  .screen { width: min(980px, 100%); margin: auto; text-align: center; }
  .screen h1 { margin: 0; font-size: clamp(46px, 11vw, 104px); font-weight: 700; letter-spacing: .14em; line-height: 1; padding-left: .14em;
    background: linear-gradient(180deg, #ffffff 10%, #8ef6ff 55%, #ff5ec8 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 18px rgba(94,240,255,.35)); }
  .screen h2 { margin: 0 0 4px; font-size: clamp(24px, 5vw, 38px); letter-spacing: .18em; text-transform: uppercase; }
  .screen h2.lvl { color: var(--acc); text-shadow: 0 0 16px rgba(94,240,255,.6); }
  .screen h2.evo { color: var(--gold); text-shadow: 0 0 16px rgba(255,210,94,.6); }
  .screen .sub { color: var(--dim); font-size: 15px; margin-bottom: 18px; letter-spacing: .04em; }
  .tag { color: var(--dim); font-size: clamp(14px, 2.4vw, 17px); margin: 14px auto 28px; max-width: 560px; line-height: 1.5; }
  .stack { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .btn { font: 600 17px var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
    padding: 11px 26px; min-width: 220px; cursor: pointer; transition: border-color .12s, background .12s, transform .12s; outline: none; }
  .btn.sm { min-width: 0; font-size: 14px; padding: 8px 16px; }
  .btn:hover, .btn:focus-visible, .btn.focus { border-color: var(--acc); background: rgba(30,60,110,.95); box-shadow: 0 0 14px rgba(94,240,255,.3); }
  .btn.primary { border-color: rgba(94,240,255,.6); }
  .btn[disabled] { opacity: .4; cursor: default; }
  .row-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  .card { position: relative; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; color: var(--ink); font: 15px/1.4 var(--font);
    cursor: pointer; outline: none; transition: border-color .12s, transform .12s, box-shadow .12s; }
  .card:hover, .card:focus-visible, .card.focus { border-color: var(--acc); box-shadow: 0 0 18px rgba(94,240,255,.28); transform: translateY(-2px); }
  .card.locked { opacity: .6; }
  .card.sel { border-color: var(--good); box-shadow: 0 0 16px rgba(125,255,168,.3); }
  .card .top { display: flex; gap: 12px; align-items: center; }
  .card img.ic { width: 52px; height: 52px; flex: none; border-radius: 6px; background: rgba(0,0,0,.35); }
  .card img.portrait { width: 72px; height: 72px; flex: none; border-radius: 8px; background: rgba(0,0,0,.35); }
  .card .nm { font-size: 18px; font-weight: 700; letter-spacing: .04em; }
  .card .lv { font-size: 13px; color: var(--dim); letter-spacing: .06em; }
  .card .lv .new { color: var(--gold); font-weight: 700; }
  .card .d { margin-top: 8px; color: #c9d3ea; font-size: 14px; }
  .card .x { margin-top: 6px; font-size: 12.5px; color: var(--dim); }
  .card .k { position: absolute; right: 10px; top: 8px; font-size: 12px; color: var(--faint); }
  .card .cost { margin-top: 8px; font-weight: 700; color: var(--gold); }
  .card .pips { margin-top: 8px; display: flex; gap: 4px; }
  .card .pips i { width: 14px; height: 6px; background: rgba(255,255,255,.12); border-radius: 2px; } .card .pips i.on { background: var(--acc); }
  .levelup .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 900px; margin: 0 auto; }
  .levelup .card { padding: 16px; }
  @media (max-width: 600px) { .slot { width: 24px; height: 24px; } #clock { top: 80px; font-size: 22px; } #boss { top: 112px; } #tally { font-size: 13px; } #pausebtn { top: 70px; } }
  @media (max-width: 700px) { .levelup .cards { grid-template-columns: 1fr; } .levelup .card .d { margin-top: 4px; } .levelup .card { padding: 10px 12px; } }
  .stagecard canvas { width: 100%; aspect-ratio: 16/8; display: block; border-radius: 5px; margin-bottom: 10px; background: #000; }
  .goldline { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--gold); font-size: 18px; margin-bottom: 14px; }
  .goldline img { width: 18px; height: 18px; }
  .loot { display: flex; flex-direction: column; gap: 10px; max-width: 460px; margin: 0 auto; }
  .loot .card { cursor: default; animation: pop .35s backwards; }
  .loot .card.evo { border-color: var(--gold); box-shadow: 0 0 24px rgba(255,210,94,.35); }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } }
  table.res { margin: 0 auto; border-collapse: collapse; font-size: 14px; min-width: min(420px, 100%); }
  table.res td, table.res th { padding: 4px 10px; text-align: right; border-bottom: 1px solid rgba(255,255,255,.06); }
  table.res th { color: var(--dim); font-weight: 500; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  table.res td:first-child, table.res th:first-child { text-align: left; }
  table.res img { width: 22px; height: 22px; vertical-align: middle; margin-right: 6px; }
  .stats { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; margin: 6px 0 16px; }
  .stats div { font-size: 13px; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; } .stats div b { display: block; font-size: 24px; color: var(--ink); letter-spacing: .02em; }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 420px; margin: 0 auto 10px; font-size: 16px; }
  .opt .btn { min-width: 120px; }
  .hint { margin-top: 18px; font-size: 13px; color: var(--faint); line-height: 1.6; }
  .codex { text-align: left; max-width: 760px; margin: 0 auto; }
  .codex .evo-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 14px; }
  .codex .evo-row img { width: 34px; height: 34px; border-radius: 5px; background: rgba(0,0,0,.35); }
  .codex .evo-row .plus { color: var(--faint); }
  .codex .evo-row .nm { margin-left: 4px; }
  .codex .evo-row .unk { color: var(--faint); }
  .scroll { max-height: calc(100vh - 220px); overflow-y: auto; padding: 4px; }
  .quick { font-size: 13px; color: var(--dim); margin-top: 8px; }
</style>
</head>
<body data-state="boot">
<div id="app">
  <canvas id="c"></canvas>
  <div id="hurt"></div>
  <div class="hud" id="hud">
    <div id="xp"><i></i><span id="lv">LV 1</span></div>
    <div id="slots"><div class="row" id="wslots"></div><div class="row" id="pslots"></div></div>
    <div id="clock">00:00</div>
    <div id="tally"><div><span class="ic" id="icKill"></span><b id="kills">0</b></div><div><span class="ic" id="icGold"></span><b id="gold">0</b></div></div>
    <div id="boss" hidden><div class="n"></div><div class="g"><i></i></div></div>
    <button id="pausebtn" aria-label="Pause">II</button>
  </div>
  <div id="stick"><i></i></div>
  <div id="banner"><div class="t"></div><div class="s"></div></div>
  <div id="menu"></div>
</div>

<script>
(function(){'use strict';
// Nullwake — shared helpers, the run state G and the save file. All src files share one scope.
const DEBUG = /^#debug/.test(location.hash);
const TAU = Math.PI * 2;
const STEP = 1 / 60;
const RUN_LEN = 900; // the final boss arrives at 15:00
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const fmtTime = (t) => { t = Math.max(0, Math.floor(t)); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
const fmtNum = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'k' : String(Math.round(n)));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

// Seeded RNG for the simulation, so #debug runs repeat. Visual-only effects use Math.random.
let rngA = 1;
function seedRng(s) {
  let h = 2166136261 >>> 0; s = String(s);
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  rngA = h >>> 0 || 1;
}
function R() {
  rngA = (rngA + 0x6D2B79F5) | 0;
  let t = Math.imul(rngA ^ (rngA >>> 15), 1 | rngA);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rr = (a, b) => a + R() * (b - a);
const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
const pick = (a) => a[Math.floor(R() * a.length)];
function hash2(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul((s | 0) + 1, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
// Small deterministic generator for sprite and tile art (independent of the sim RNG).
function artRng(seed) { let a = seed >>> 0 || 1; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// The run. startRun() in 10_director.js resets the per-run fields.
const G = {
  state: 'boot', // boot | title | play | levelup | chest | pause | over
  t: 0, stageId: 's1', stage: null, pilotId: 'ryn', seed: '',
  kills: 0, gold: 0, shake: 0, hurtFlash: 0,
  cam: { x: 0, y: 0 }, view: { w: 1140, h: 640, k: 1, W: 1140, H: 640 },
  spawnT: 0, evIdx: 0, boss: null, finalBoss: null, won: false, over: false,
  pendingLv: 0, invDirty: true, god: false, bot: false, frame: 0, nextId: 1,
};

// Save data: gold, hangar levels, unlocked pilots and stages, best times and options.
const SAVE_KEY = 'nullwake.save.v1';
function defaultSave() {
  return { gold: 0, meta: {}, pilots: { ryn: 1, sable: 1 }, cleared: {}, best: {}, seen: {},
    opts: { sfx: 0.8, music: 0.55, shake: 1, nums: 1 }, totals: { runs: 0, kills: 0, wins: 0, gold: 0 } };
}
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && typeof s === 'object') { const d = defaultSave(); return Object.assign(d, s, { opts: Object.assign(d.opts, s.opts), totals: Object.assign(d.totals, s.totals) }); }
  } catch (e) { /* private mode or corrupt save: start fresh */ }
  return defaultSave();
}
let SAVE = loadSave();
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) { /* storage blocked */ } }

// Nullwake — data: weapons, passives, pilots, enemies, bosses, stages and hangar upgrades.

// Weapon stats: dmg, cd (seconds), amount, area (multiplier), speed (projectile px/s or multiplier), dur, pierce, chain, kb.
// up[i] is added at level i + 2. An evolved weapon is its own entry with `from`; it has one level.
const MAX_WLV = 8;
const WEAPONS = {
  blaster: { name: 'Pulse Blaster', color: '#5ef0ff', d: 'Fires bolts at the nearest enemies.',
    base: { dmg: 10, cd: 1.1, amount: 1, area: 1, speed: 440, dur: 1.4, pierce: 1, kb: 30 },
    up: [{ amount: 1, t: 'Fires 1 more bolt.' }, { cd: -0.15, t: 'Cooldown −0.15 s.' }, { amount: 1, t: 'Fires 1 more bolt.' }, { dmg: 6, t: 'Damage +6.' },
      { amount: 1, t: 'Fires 1 more bolt.' }, { pierce: 1, t: 'Bolts pass through 1 more enemy.' }, { dmg: 10, t: 'Damage +10.' }],
    evo: 'storm', needs: 'capacitor' },
  storm: { name: 'Storm Repeater', from: 'blaster', color: '#9ffcff', d: 'A torrent of piercing bolts that never stops.',
    base: { dmg: 18, cd: 0.11, amount: 1, area: 1.25, speed: 620, dur: 1.2, pierce: 3, kb: 20 } },

  lash: { name: 'Arc Lash', color: '#ff5ec8', d: 'Cracks a plasma whip to your side.',
    base: { dmg: 14, cd: 1.3, amount: 1, area: 1, pierce: 99, kb: 60 },
    up: [{ amount: 1, t: 'Also strikes behind you.' }, { dmg: 5, t: 'Damage +5.' }, { dmg: 5, area: 0.1, t: 'Damage +5, area +10%.' }, { dmg: 5, t: 'Damage +5.' },
      { area: 0.15, t: 'Area +15%.' }, { dmg: 5, cd: -0.15, t: 'Damage +5, cooldown −0.15 s.' }, { dmg: 8, t: 'Damage +8.' }],
    evo: 'siphon', needs: 'nanite' },
  siphon: { name: 'Siphon Lash', from: 'lash', color: '#ff2f8a', d: 'A crimson whip that mends your hull with every hit.',
    base: { dmg: 34, cd: 1.0, amount: 2, area: 1.4, pierce: 99, kb: 80 } },

  drones: { name: 'Orbit Drones', color: '#7dffa8', d: 'Drones circle you, cutting through anything they touch.',
    base: { dmg: 10, cd: 3, amount: 1, area: 1, speed: 1, dur: 3, kb: 50 },
    up: [{ amount: 1, t: '1 more drone.' }, { speed: 0.3, area: 0.25, t: 'Orbit +25% wider and 30% faster.' }, { dur: 0.5, dmg: 5, t: 'Lasts 0.5 s longer, damage +5.' },
      { amount: 1, t: '1 more drone.' }, { speed: 0.3, area: 0.25, t: 'Orbit +25% wider and 30% faster.' }, { dur: 0.5, dmg: 5, t: 'Lasts 0.5 s longer, damage +5.' }, { amount: 1, t: '1 more drone.' }],
    evo: 'halo', needs: 'emitter' },
  halo: { name: 'Halo Array', from: 'drones', color: '#b9ffd0', d: 'A permanent ring of drones that never powers down.',
    base: { dmg: 24, cd: 0, amount: 5, area: 1.6, speed: 1.7, dur: 1, kb: 70 } },

  rail: { name: 'Rail Lance', color: '#ffd25e', d: 'An instant piercing beam in the direction you move.',
    base: { dmg: 20, cd: 1.8, amount: 1, area: 1, pierce: 99, kb: 40 },
    up: [{ amount: 1, t: '1 more beam.' }, { dmg: 8, t: 'Damage +8.' }, { cd: -0.25, t: 'Cooldown −0.25 s.' }, { amount: 1, t: '1 more beam.' },
      { dmg: 8, t: 'Damage +8.' }, { area: 0.25, t: 'Beams 25% longer and wider.' }, { dmg: 12, t: 'Damage +12.' }],
    evo: 'sunspear', needs: 'amp' },
  sunspear: { name: 'Sunspear', from: 'rail', color: '#fff1a8', d: 'Screen-splitting beams that fire ahead and behind.',
    base: { dmg: 55, cd: 1.15, amount: 2, area: 1.5, pierce: 99, kb: 60 } },

  mines: { name: 'Plasma Mines', color: '#ff8a3d', d: 'Lobs mines that leave burning plasma pools.',
    base: { dmg: 9, cd: 3.2, amount: 1, area: 1, dur: 2.2, kb: 0 },
    up: [{ amount: 1, t: '1 more mine.' }, { area: 0.2, dmg: 3, t: 'Pools 20% wider, damage +3.' }, { cd: -0.4, t: 'Cooldown −0.4 s.' }, { amount: 1, dur: 0.4, t: '1 more mine, pools last 0.4 s longer.' },
      { dmg: 4, area: 0.2, t: 'Damage +4, pools 20% wider.' }, { amount: 1, t: '1 more mine.' }, { dmg: 6, dur: 0.6, t: 'Damage +6, pools last 0.6 s longer.' }],
    evo: 'nullwake', needs: 'thrusters' },
  nullwake: { name: 'Nullwake', from: 'mines', color: '#ffb36b', d: 'Your wake burns: plasma trails behind you as you move.',
    base: { dmg: 16, cd: 2.2, amount: 3, area: 1.4, dur: 3, kb: 0 } },

function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) { const A = hexRgb(a), B = hexRgb(b); return `rgb(${Math.round(A[0] + (B[0] - A[0]) * t)},${Math.round(A[1] + (B[1] - A[1]) * t)},${Math.round(A[2] + (B[2] - A[2]) * t)})`; }
const light = (h, t = 0.45) => mix(h, '#ffffff', t), dark = (h, t = 0.45) => mix(h, '#000000', t);
function rgba(h, a) { const A = hexRgb(h); return `rgba(${A[0]},${A[1]},${A[2]},${a})`; }
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0.01, r), 0, TAU); }
function ell(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot, 0, TAU); }
function poly(c, pts) { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); }
function ball(c, x, y, r, col) { // shaded sphere fill for the current path
  const g = c.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r * 1.05);
  g.addColorStop(0, light(col, 0.4)); g.addColorStop(0.55, col); g.addColorStop(1, dark(col, 0.5)); return g;
}
function eye(c, x, y, r, col) { c.fillStyle = rgba(col, 0.35); circ(c, x, y, r * 1.9); c.fill(); c.fillStyle = col; circ(c, x, y, r); c.fill(); c.fillStyle = '#fff'; circ(c, x - r * 0.3, y - r * 0.3, r * 0.35); c.fill(); }
function mirror(src) { const c = makeCanvas(src.width, src.height), x = c.getContext('2d'); x.translate(src.width, 0); x.scale(-1, 1); x.drawImage(src, 0, 0); return c; }

function updateProjectiles(dt) {

      queryCircle(p.x, p.y, p.r, (e) => {

        p.hits.push(e); hurt(e, p.dmg, p.x - p.vx * 0.05, p.y - p.vy * 0.05, p.w.st.kb, p.w);

// ---- autopilot for tests and balance runs: flee crowds, collect nearby gems, pick upgrades greedily ----
const _bm = { x: 0, y: 0 }, _bn = [];
function botMove() {

  // the chosen pickup, and a little momentum. Take the best.
  _bn.length = 0;
  for (const e of E) if (!e.dead && !e.prop && Math.abs(e.x - P.x) < 320 && Math.abs(e.y - P.y) < 320) _bn.push(e);
  let goal = null, gd = 560 * 560;
  if (P.hp < P.st.maxHp * 0.7) for (const e of E) if (e.prop && !e.dead) { const d = (e.x - P.x) ** 2 + (e.y - P.y) ** 2; if (d < 900 * 900 && d * 0.3 < gd) { gd = d * 0.3; goal = e; } }

}

  FX.explode(e.x, e.y, e.r * 2, e.def.c3); FX.burst(e.x, e.y, e.def.c1, 40, 300, 1, 4);
  if (G.boss === e) G.boss = null;
  if (e === G.finalBoss) {
    G.won = true; G.winT = 3.2;
    for (const o of E) if (!o.dead && o !== e && !o.prop) { o.dead = true; FX.burst(o.x, o.y, o.def.c1 || '#fff', 4, 90, 0.4, 2); }
    EB.length = 0; HZ.length = 0;
    banner('STAGE CLEAR', G.stage.name + ' is quiet again', 'info', 3); sfx('win');
  } else {
    dropItem(e.x, e.y, 'chest', 'boss'); dropItem(e.x + 18, e.y + 10, 'bag'); dropItem(e.x - 18, e.y + 10, 'bag');
  }
}

function stepGame(dt) {
  G.t += dt; G.frame++;
  playerUpdate(dt);
  if (!G.won) directorStep(dt);
  updateEnemies(dt);
  buildGrid(); separate();
  if (!P.dead) updateWeapons(dt);
  updateProjectiles(dt); updatePools(dt); updateEnemyBullets(dt); updateHazards(dt);
  updatePickups(dt); updatePods(dt); FX.update(dt);
  cleanup();
  G.shake = Math.max(0, G.shake - dt * 30); G.hurtFlash = Math.max(0, G.hurtFlash - dt * 2.2); G.empFlash = Math.max(0, G.empFlash - dt * 2);
  if (P.dead) { G.overT -= dt; if (G.overT <= 0) endRun(false); }
  else if (G.won) { G.winT -= dt; for (const g of GEMS) g.mag = true; if (G.winT <= 0) endRun(true); }
  else if (G.chestQ.length) UI.chest(G.chestQ.shift());
  else if (G.pendingLv > 0) UI.levelUp();
}

function endRun(won) {
  if (G.ended) return;
  G.ended = true;
  const st = G.stage, bonus = won ? Math.round(300 * st.goldMul) : 0;
  G.bonus = bonus;
  SAVE.gold += G.gold + bonus; SAVE.totals.gold += G.gold + bonus; SAVE.totals.kills += G.kills;
  const b = SAVE.best[st.id] || { t: 0, kills: 0, lvl: 0 };
  SAVE.best[st.id] = { t: Math.max(b.t, G.t), kills: Math.max(b.kills, G.kills), lvl: Math.max(b.lvl, P.lvl) };
  if (won) { SAVE.cleared[st.id] = (SAVE.cleared[st.id] || 0) + 1; SAVE.totals.wins++; }
  writeSave();
  UI.results(won);
}

let bannerT = 0;
function banner(t, s, cls, dur) {
  const b = $('#banner'); b.className = 'on ' + (cls || 'info');
  b.firstElementChild.textContent = t; b.lastElementChild.textContent = s || '';
  clearTimeout(bannerT); bannerT = setTimeout(() => b.classList.remove('on'), (dur || 2) * 1000);

// Nullwake — boss behaviour. A boss walks at you and runs the attacks listed in its ENEMIES entry, each on its own
// timer; below half health every timer runs 30% faster. Returns [moveX, moveY, speed].
const _bossOut = [0, 0, 0];
function bossUpdate(e, dt, dx, dy, dist) {
  const d = e.def;
  if (!e.atk) e.atk = d.attacks.map((a) => ({ a, t: a.cd * (0.4 + R() * 0.5) }));
  let mx = dx / dist, my = dy / dist, sp = e.spd;
  let want = Math.atan2(dy, dx), da = want - e.a; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU; e.a += clamp(da, -2 * dt, 2 * dt);
  if (dist > spawnRing(0) * 1.6) { // keep up with a fleeing player
    const r = spawnRing() + e.r, a = Math.atan2(-dy, -dx) + rr(-0.5, 0.5); e.x = P.x + Math.cos(a) * r; e.y = P.y + Math.sin(a) * r;
  }
  if (e.busy) {
    e.busyT -= dt;
    if (e.busy === 'wind') { mx = my = 0; if (e.busyT <= 0) { e.busy = 'dash'; e.busyT = 0.75; } }
    else if (e.busy === 'dash') { mx = e.dx; my = e.dy; sp = e.spd * 5.5; if (e.busyT <= 0) e.busy = null; }
    else if (e.busy === 'spiral') {
      sp *= 0.25; e.spT -= dt;
      while (e.spT <= 0) { const s = e.sp; e.spT += 0.07; for (let k = 0; k < 2; k++) enemyShot(e.x, e.y, e.spA + k * Math.PI, s.spd, s.dmg, d.c3); e.spA += 0.33; }
      if (e.busyT <= 0) e.busy = null;
    }
    _bossOut[0] = mx; _bossOut[1] = my; _bossOut[2] = sp; return _bossOut;
  }
  const rage = e.hp < e.maxHp * 0.5 ? 0.7 : 1;
  for (const s of e.atk) { s.t -= dt; if (s.t <= 0) { s.t = s.a.cd * rage * (0.85 + R() * 0.3); bossAttack(e, s.a, dx, dy, dist); break; } }
  _bossOut[0] = mx; _bossOut[1] = my; _bossOut[2] = sp; return _bossOut;
}
function bossAttack(e, a, dx, dy, dist) {
  const d = e.def, aim = Math.atan2(dy, dx), col = d.c3;
  if (a.k === 'ring') { const o = R() * TAU; for (let i = 0; i < a.n; i++) enemyShot(e.x, e.y, o + i * TAU / a.n, a.spd, a.dmg, col); sfx('zap', 0, 0.1); }
  else if (a.k === 'fan') { for (let i = 0; i < a.n; i++) enemyShot(e.x, e.y, aim + (i - (a.n - 1) / 2) * 0.17, a.spd, a.dmg, col); sfx('shoot'); }
  else if (a.k === 'spiral') { e.busy = 'spiral'; e.busyT = a.n * 0.07 / 2; e.spT = 0; e.spA = R() * TAU; e.sp = a; }
  else if (a.k === 'summon') {
    for (let i = 0; i < a.n; i++) { const k = i / a.n * TAU, r = e.r + 20; spawnEnemy(a.type, e.x + Math.cos(k) * r, e.y + Math.sin(k) * r, { force: true }); }
    FX.ring(e.x, e.y, e.r + 30, col, 0.5, 4);
  }
  else if (a.k === 'dash') { if (dist < 600) { e.busy = 'wind'; e.busyT = 0.85; e.dx = dx / dist; e.dy = dy / dist; } }
  else if (a.k === 'lob') {
    for (let i = 0; i < a.n; i++) {
      const tx = P.x + (i ? rr(-110, 110) : P.mvx * 60), ty = P.y + (i ? rr(-110, 110) : P.mvy * 60);
      HZ.push({ kind: 'blast', x: tx, y: ty, r: a.r, delay: 1.15 + i * 0.12, max: 1.15 + i * 0.12, life: 0, dmg: a.dmg, col, acid: G.stage.look === 'brood' });
    }
  }
  else if (a.k === 'beam') {
    for (let i = 0; i < a.n; i++) HZ.push({ kind: 'beam', x: e.x, y: e.y, a: aim + (i - (a.n - 1) / 2) * 0.55, len: 1500, w: 30, delay: 1.0, max: 1.0, life: 0.01, dmg: a.dmg, col });
  }
}

// Nullwake — visual effects: particles, rings, explosions, beams, lightning, slashes, damage numbers and floating
// text. Visual only, so they use Math.random and never touch the simulation.
const FX = (() => {
  const parts = [], nums = [], beams = [], bolts = [], slashes = [], rings = [], texts = [];
  const MAXP = 1400, rnd = Math.random;
  function clear() { for (const a of [parts, nums, beams, bolts, slashes, rings, texts]) a.length = 0; }
  function burst(x, y, col, n, spd, life = 0.4, size = 2.5) {
    for (let i = 0; i < n && parts.length < MAXP; i++) {
      const a = rnd() * TAU, s = spd * (0.3 + rnd() * 0.7), l = life * (0.6 + rnd() * 0.6);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: l, max: l, size: size * (0.6 + rnd() * 0.8), col, drag: 3, smoke: false });
    }
  }
  function puff(x, y) { if (parts.length < MAXP) parts.push({ x, y, vx: (rnd() - 0.5) * 20, vy: (rnd() - 0.5) * 20, life: 0.4, max: 0.4, size: 2.5, col: '#c8c0b8', drag: 2, smoke: true }); }
  function ring(x, y, r, col, life = 0.35, w = 3) { if (rings.length < 160) rings.push({ x, y, r, col, life, max: life, w }); }
  let flashes = 0;
  function explode(x, y, r, col) {
    ring(x, y, r, col, 0.35, 4);
    burst(x, y, '#ffd25e', 6, r * 4, 0.3, 2.5); burst(x, y, col, 5, r * 3, 0.45, 2.2);
    if (flashes < 6) { flashes++; rings.push({ x, y, r: r * 0.7, col: '#ffb070', life: 0.12, max: 0.12, w: 0, flash: true }); }
  }
  function num(x, y, v) {
    if (nums.length > 110) nums.splice(0, 10);
    nums.push({ x: x + (rnd() - 0.5) * 10, y, v: v >= 10 ? Math.round(v) : Math.round(v * 10) / 10, life: 0.6 });
  }
  function text(x, y, s, col) { texts.push({ x, y, s, col, life: 1 }); }
  function slash(x, y, side, w, h, col) { slashes.push({ x, y, side, w, h, col, life: 0.2, max: 0.2 }); }
  function beam(x1, y1, x2, y2, w, col, life) { beams.push({ x1, y1, x2, y2, w, col, life, max: life }); }
  function bolt(x1, y1, x2, y2, col) {
    const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy), n = Math.max(3, Math.round(d / 18)), nx = -dy / (d || 1), ny = dx / (d || 1), pts = [x1, y1];
    for (let i = 1; i < n; i++) { const t = i / n, o = (rnd() - 0.5) * 22; pts.push(x1 + dx * t + nx * o, y1 + dy * t + ny * o); }
    pts.push(x2, y2);
    bolts.push({ pts, col, life: 0.22, max: 0.22 });
    burst(x2, y2, col, 4, 90, 0.25, 2);
  }
  function update(dt) {
    for (const p of parts) { p.life -= dt; const k = Math.max(0, 1 - p.drag * dt); p.vx *= k; p.vy *= k; p.x += p.vx * dt; p.y += p.vy * dt; if (p.smoke) p.size += dt * 10; }
    compact(parts, (p) => p.life > 0);
    for (const n of nums) { n.life -= dt; n.y -= dt * 30; } compact(nums, (n) => n.life > 0);
    for (const t of texts) { t.life -= dt; t.y -= dt * 24; } compact(texts, (t) => t.life > 0);
    flashes = 0;
    for (const a of [beams, bolts, slashes, rings]) { for (const b of a) b.life -= dt; compact(a, (b) => b.life > 0); }
  }
  return { clear, burst, puff, ring, explode, num, text, slash, beam, bolt, update, parts, nums, beams, bolts, slashes, rings, texts };
})();

// Nullwake — drawing. One 2D canvas; world units are scaled so the shorter screen side shows about 540 units
// (400 in portrait), whatever the resolution.
const CV = $('#c'), CTX = CV.getContext('2d');
function resize() {
  const w = innerWidth, h = innerHeight; let dpr = Math.min(devicePixelRatio || 1, 2);
  if (w * h * dpr * dpr > 3.6e6) dpr = Math.sqrt(3.6e6 / (w * h));
  CV.width = Math.round(w * dpr); CV.height = Math.round(h * dpr);
  const s = Math.min(w, h) / (w < h ? 400 : 540);
  Object.assign(G.view, { s, dpr, k: s * dpr, w: w / s, h: h / s, W: CV.width, H: CV.height });
}

function drawFar(c, cx, cy) {
  const img = WORLD.far; if (!img) return;
  const S = img.width * G.view.dpr * 0.9, ox = -((cx * 0.25 * G.view.k) % S + S) % S, oy = -((cy * 0.25 * G.view.k) % S + S) % S;
  for (let y = oy; y < G.view.H; y += S) for (let x = ox; x < G.view.W; x += S) c.drawImage(img, x, y, S + 1, S + 1);
}

const attract = { x: 0, y: 0 };
function renderAttract(dt) {
  const c = CTX, v = G.view;
  attract.x += dt * 14; attract.y += dt * 6;
  c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = LOOKS.drift.bg; c.fillRect(0, 0, v.W, v.H);
  buildTiles('drift'); drawFar(c, attract.x, attract.y);
  c.setTransform(v.k, 0, 0, v.k, v.W / 2 - attract.x * v.k, v.H / 2 - attract.y * v.k);
  const tiles = WORLD.tiles.drift, x0 = attract.x - v.w / 2, y0 = attract.y - v.h / 2;
  for (let cy = Math.floor(y0 / CH); cy * CH < y0 + v.h; cy++) for (let cx = Math.floor(x0 / CH); cx * CH < x0 + v.w; cx++) c.drawImage(tiles[Math.floor(hash2(cx, cy, 1) * 4)], cx * CH, cy * CH, CH + 0.6, CH + 0.6);
  c.setTransform(1, 0, 0, 1, 0, 0);
  const g = c.createRadialGradient(v.W / 2, v.H / 2, Math.min(v.W, v.H) * 0.2, v.W / 2, v.H / 2, Math.max(v.W, v.H) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.7)'); c.fillStyle = g; c.fillRect(0, 0, v.W, v.H);
}

function render() {
  const c = CTX, v = G.view, k = v.k;
  if (!G.stage) return;
  let cx = P.x, cy = P.y;
  if (G.shake > 0.3 && SAVE.opts.shake) { cx += (Math.random() - 0.5) * G.shake; cy += (Math.random() - 0.5) * G.shake; }
  G.cam.x = cx; G.cam.y = cy;
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  c.fillStyle = LOOKS[G.stage.look].bg; c.fillRect(0, 0, v.W, v.H);
  if (G.stage.look === 'drift') drawFar(c, cx, cy);
  c.setTransform(k, 0, 0, k, v.W / 2 - cx * k, v.H / 2 - cy * k);
  const x0 = cx - v.w / 2 - 70, x1 = cx + v.w / 2 + 70, y0 = cy - v.h / 2 - 70, y1 = cy + v.h / 2 + 70;
  const vis = (x, y, r) => x + r > x0 && x - r < x1 && y + r > y0 && y - r < y1;
  drawWorld(c, x0, y0, x1, y1);

  // ground layer: pools, auras, hazards
  for (const p of POOLS) { if (!vis(p.x, p.y, p.r)) continue; c.globalAlpha = Math.min(1, p.life / 0.4, (p.max - p.life) / 0.15 + 0.3) * (0.75 + 0.15 * Math.sin(G.t * 9 + p.x)); c.drawImage(softDisc(p.col, 0.32), p.x - p.r, p.y - p.r, p.r * 2, p.r * 2); }
  c.globalCompositeOperation = 'lighter';
  for (const w of P.weapons) if ((w.id === 'gravity' || w.id === 'horizon') && !P.dead) {
    const R0 = 58 * w.st.area, col = WEAPONS[w.id].color;
    c.globalAlpha = 0.55; c.drawImage(softDisc(col, 0.28), P.x - R0, P.y - R0, R0 * 2, R0 * 2);
    c.globalAlpha = 0.5; c.strokeStyle = col; c.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) { const a = G.t * (w.id === 'horizon' ? -1.4 : 1) + i * TAU / 3; c.beginPath(); c.arc(P.x, P.y, R0 * 0.92, a, a + 1.2); c.stroke(); }
  }
  c.globalCompositeOperation = 'source-over';
  for (const h of HZ) {
    if (h.kind === 'blast' && h.delay > 0) {
      const p = 1 - h.delay / h.max; c.globalAlpha = 0.18 + 0.12 * Math.sin(G.t * 20);
      c.fillStyle = h.col; circ(c, h.x, h.y, h.r * p); c.fill();
      c.globalAlpha = 0.85; c.strokeStyle = h.col; c.lineWidth = 2; circ(c, h.x, h.y, h.r); c.stroke();
    } else if (h.kind === 'pool') {
      c.globalAlpha = Math.min(1, h.life) * 0.8; c.drawImage(softDisc(h.col, 0.5), h.x - h.r, h.y - h.r, h.r * 2, h.r * 2);
    } else if (h.kind === 'beam' && h.delay > 0) {
      const p = 1 - h.delay / h.max; c.globalAlpha = 0.35 + 0.4 * (Math.sin(G.t * 30) > 0 ? 1 : 0) * p;
      c.strokeStyle = h.col; c.lineWidth = 2 + h.w * p * 0.5; c.beginPath(); c.moveTo(h.x, h.y); c.lineTo(h.x + Math.cos(h.a) * h.len, h.y + Math.sin(h.a) * h.len); c.stroke();

  for (const g of GEMS) { if (!vis(g.x, g.y, 10)) continue; const s = PICK['gem' + g.tier]; c.drawImage(s.img, g.x - s.half, g.y - s.half, s.half * 2, s.half * 2); }
  for (const it of ITEMS) {
    if (!vis(it.x, it.y, 20)) continue;

    c.drawImage(s.img, it.x - s.half, it.y - s.half + bob, s.half * 2, s.half * 2);
  }

  // enemies
  for (const e of E) {

    if (e.prop) { const s = PICK.pod; c.drawImage(s.img, e.x - s.half, e.y - s.half, s.half * 2, s.half * 2); continue; }
    if (e.boss) { drawBoss(c, e); continue; }
    if (e.elite) { c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.45; c.drawImage(glow('#ffd25e'), e.x - e.r * 2, e.y - e.r * 2, e.r * 4, e.r * 4); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; }
    if (e.ai === 'dash' && e.st === 1) { c.globalAlpha = 0.5; c.strokeStyle = '#ff3d3d'; c.lineWidth = 3; c.beginPath(); c.moveTo(e.x, e.y); c.lineTo(e.x + e.dx * 150, e.y + e.dy * 150); c.stroke(); c.globalAlpha = 1; }
    const spr = enemySprite(e.type, e.elite), fr = spr.frames[(e.anim | 0) & 1];
    c.drawImage(e.face < 0 ? fr.f : fr.n, e.x - spr.half, e.y - spr.half, spr.half * 2, spr.half * 2);
    if (e.flash > 0) { c.globalAlpha = 0.6; c.drawImage(e.face < 0 ? fr.wf : fr.w, e.x - spr.half, e.y - spr.half, spr.half * 2, spr.half * 2); c.globalAlpha = 1; }
    if (e.elite) { const w = e.r * 2; c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(e.x - w / 2, e.y - e.r - 10, w, 4); c.fillStyle = '#ffd25e'; c.fillRect(e.x - w / 2, e.y - e.r - 10, w * Math.max(0, e.hp / e.maxHp), 4); }
  }

    const fr = PLAYER_SPR.frames[P.moving ? (P.anim | 0) & 1 : 0], red = P.hurtT > 0;
    const img = P.side < 0 ? (red ? fr.wf : fr.f) : (red ? fr.w : fr.n), h = PLAYER_SPR.half;
    c.drawImage(img, P.x - h, P.y - h - 2, h * 2, h * 2);
    const hw = 16; c.fillStyle = 'rgba(0,0,0,.65)'; c.fillRect(P.x - hw - 1, P.y + 17, hw * 2 + 2, 5);
    c.fillStyle = P.hp / P.st.maxHp < 0.3 ? '#ff5e6c' : '#ff3d5a'; c.fillRect(P.x - hw, P.y + 18, hw * 2 * Math.max(0, P.hp / P.st.maxHp), 3);
  }

  for (const w of P.weapons) if ((w.id === 'drones' && w.on > 0) || w.id === 'halo') {
    const s = w.st, n = Math.max(1, s.amount), R0 = 70 * s.area, dr = 11 * Math.sqrt(s.area), col = WEAPONS[w.id].color;
    for (let i = 0; i < n; i++) {
      const a = w.ang + i * TAU / n, x = P.x + Math.cos(a) * R0, y = P.y + Math.sin(a) * R0;
      c.globalAlpha = 0.7; c.drawImage(glow(col), x - dr * 2.2, y - dr * 2.2, dr * 4.4, dr * 4.4);
      c.globalAlpha = 1; c.fillStyle = '#e8fff0'; circ(c, x, y, dr * 0.45); c.fill();
      c.strokeStyle = col; c.lineWidth = 2; circ(c, x, y, dr * 0.8); c.stroke();
    }
  }
  for (const p of PR) {
    if (!vis(p.x, p.y, 20)) continue;
    if (p.kind === 'bolt') {
      c.globalAlpha = 0.9; c.drawImage(glow(p.col), p.x - 12, p.y - 12, 24, 24);
      c.strokeStyle = '#ffffff'; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); c.moveTo(p.x - p.vx * 0.025, p.y - p.vy * 0.025); c.lineTo(p.x, p.y); c.stroke();
    } else {
      c.globalAlpha = 0.8; c.drawImage(glow('#ff9a5e'), p.x - Math.cos(p.a) * 8 - 9, p.y - Math.sin(p.a) * 8 - 9, 18, 18);
      c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
      const s = PICK.missile; c.save(); c.translate(p.x, p.y); c.rotate(p.a); c.drawImage(s.img, -s.half, -s.half, s.half * 2, s.half * 2); c.restore();
      c.globalCompositeOperation = 'lighter';
    }
  }
  c.globalAlpha = 1;
  for (const m of LOBS) { const t = m.t / m.T, x = lerp(m.x0, m.x1, t), y = lerp(m.y0, m.y1, t) - Math.sin(t * Math.PI) * 40, s = PICK.mine; c.drawImage(s.img, x - s.half, y - s.half, s.half * 2, s.half * 2); }
  for (const s of FX.slashes) {
    const p = 1 - s.life / s.max; c.save(); c.translate(s.x, s.y); c.scale(s.side, 1); c.globalAlpha = (1 - p) * 0.95;
    c.beginPath(); c.ellipse(0, 0, s.w / 2, s.h / 2, 0, Math.PI, 0); c.ellipse(0, s.h * 0.22, s.w / 2 * 0.92, s.h * 0.3, 0, 0, Math.PI, true); c.closePath();
    const g = c.createLinearGradient(-s.w / 2, 0, s.w / 2, 0); g.addColorStop(0, rgba(s.col, 0)); g.addColorStop(Math.min(0.95, 0.3 + p * 0.6), s.col); g.addColorStop(1, '#ffffff');
    c.fillStyle = g; c.fill(); c.restore();
  }
  c.lineCap = 'round';
  for (const b of FX.beams) {
    const a = b.life / b.max; c.globalAlpha = a * 0.6; c.strokeStyle = b.col; c.lineWidth = b.w * (0.6 + 0.4 * a);
    c.beginPath(); c.moveTo(b.x1, b.y1); c.lineTo(b.x2, b.y2); c.stroke();
    c.globalAlpha = a; c.strokeStyle = '#ffffff'; c.lineWidth = b.w * 0.3 * a + 1; c.stroke();
  }
  for (const b of FX.bolts) {
    const a = b.life / b.max; c.beginPath(); c.moveTo(b.pts[0], b.pts[1]); for (let i = 2; i < b.pts.length; i += 2) c.lineTo(b.pts[i], b.pts[i + 1]);
    c.globalAlpha = a * 0.6; c.strokeStyle = b.col; c.lineWidth = 6; c.stroke(); c.globalAlpha = a; c.strokeStyle = '#ffffff'; c.lineWidth = 1.8; c.stroke();
  }
  for (const b of EB) { if (!vis(b.x, b.y, 10)) continue; c.globalAlpha = 0.9; c.drawImage(glow(b.col), b.x - 13, b.y - 13, 26, 26); c.globalAlpha = 1; c.fillStyle = '#ffffff'; circ(c, b.x, b.y, 3); c.fill(); }
  for (const r of FX.rings) {
    const p = 1 - r.life / r.max;
    if (r.flash) { c.globalAlpha = (1 - p) * 0.45; c.drawImage(glow(r.col), r.x - r.r * 1.6, r.y - r.r * 1.6, r.r * 3.2, r.r * 3.2); continue; }
    c.globalAlpha = (1 - p) * 0.9; c.strokeStyle = r.col; c.lineWidth = r.w * (1 - p) + 0.5; circ(c, r.x, r.y, r.r * (0.35 + 0.65 * p)); c.stroke();
  }
  for (const p of FX.parts) {
    if (!vis(p.x, p.y, 4)) continue;
    c.globalAlpha = p.smoke ? p.life / p.max * 0.25 : p.life / p.max; c.fillStyle = p.col; c.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;

  // numbers and text
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = '700 10px "Chakra Petch", sans-serif';
  for (const n of FX.nums) { c.globalAlpha = Math.min(1, n.life * 3); c.fillStyle = '#000'; c.fillText(n.v, n.x + 0.8, n.y + 0.8); c.fillStyle = '#fff'; c.fillText(n.v, n.x, n.y); }
  c.font = '700 13px "Chakra Petch", sans-serif';
  for (const t of FX.texts) { c.globalAlpha = Math.min(1, t.life * 2); c.fillStyle = '#000'; c.fillText(t.s, t.x + 1, t.y + 1); c.fillStyle = t.col; c.fillText(t.s, t.x, t.y); }
  c.globalAlpha = 1;

  // screen space: arrows to off-screen chests and bosses, EMP flash
  c.setTransform(v.dpr, 0, 0, v.dpr, 0, 0);
  const sw = v.W / v.dpr, sh = v.H / v.dpr;
  const arrow = (x, y, col, size) => {
    const sx = (x - cx) * v.s + sw / 2, sy = (y - cy) * v.s + sh / 2;
    if (sx > 0 && sx < sw && sy > 0 && sy < sh) return;
    const m = 26, ax = clamp(sx, m, sw - m), ay = clamp(sy, m + 40, sh - m), a = Math.atan2(sy - sh / 2, sx - sw / 2);
    c.save(); c.translate(ax, ay); c.rotate(a); c.fillStyle = col; c.globalAlpha = 0.6 + 0.4 * Math.sin(G.t * 6);
    poly(c, [size, 0, -size * 0.7, -size * 0.7, -size * 0.3, 0, -size * 0.7, size * 0.7]); c.fill(); c.restore();
  };
  for (const it of ITEMS) if (it.kind === 'chest') arrow(it.x, it.y, '#ffd25e', 12);
  for (const e of E) if (e.boss && !e.dead) arrow(e.x, e.y, '#ff5e6c', 16);
  c.globalAlpha = 1;
  if (G.empFlash > 0) { c.fillStyle = `rgba(190,230,255,${G.empFlash * 0.5})`; c.fillRect(0, 0, sw, sh); }
}

function drawBoss(c, e) {
  c.fillStyle = 'rgba(0,0,0,.35)'; ell(c, e.x, e.y + e.r * 0.85, e.r * 0.9, e.r * 0.3); c.fill();
  if (e.busy === 'wind') { c.globalAlpha = 0.25 + 0.2 * Math.sin(G.t * 30); c.strokeStyle = '#ff3d3d'; c.lineWidth = e.r * 1.4; c.lineCap = 'butt'; c.beginPath(); c.moveTo(e.x, e.y); c.lineTo(e.x + e.dx * 420, e.y + e.dy * 420); c.stroke(); c.globalAlpha = 1; }
  const draw = BOSS_DRAW[e.def.shape];
  if (draw) {
    c.save(); c.translate(e.x, e.y); draw(c, e.r, G.t, e.def, e.a); c.restore();
    if (e.flash > 0) { c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.5; c.drawImage(glow('#ffffff'), e.x - e.r, e.y - e.r, e.r * 2, e.r * 2); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; }
  } else {
    c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.4; c.drawImage(glow(e.def.c3), e.x - e.r * 2.2, e.y - e.r * 2.2, e.r * 4.4, e.r * 4.4); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    const spr = enemySprite(e.type), fr = spr.frames[(e.anim | 0) & 1];
    c.drawImage(e.face < 0 ? fr.f : fr.n, e.x - spr.half, e.y - spr.half, spr.half * 2, spr.half * 2);
    if (e.flash > 0) { c.globalAlpha = 0.5; c.drawImage(e.face < 0 ? fr.wf : fr.w, e.x - spr.half, e.y - spr.half, spr.half * 2, spr.half * 2); c.globalAlpha = 1; }
  }
}

// Nullwake — the in-run HUD (DOM): experience bar, clock, kills, gold, weapon and passive slots, boss bar.
const HUD = (() => {
  const el = {}, last = {};
  function init() {
    for (const id of ['xp', 'lv', 'clock', 'kills', 'gold', 'wslots', 'pslots', 'boss', 'hurt']) el[id] = $('#' + id);
    el.xpFill = el.xp.firstElementChild; el.bossName = el.boss.querySelector('.n'); el.bossFill = el.boss.querySelector('i');
    $('#icKill').innerHTML = `<img src="${icon('kill')}" style="width:100%;height:100%">`;
    $('#icGold').innerHTML = `<img src="${icon('gold')}" style="width:100%;height:100%">`;
  }
  const set = (k, v, fn) => { if (last[k] !== v) { last[k] = v; fn(v); } };
  function slots() {
    const w = P.weapons.map((x) => { const d = WEAPONS[x.id]; return `<div class="slot${d.from ? ' evo' : ''}" title="${esc(d.name)}"><img src="${icon(x.id)}" alt=""><span>${d.from ? '★' : x.lvl >= MAX_WLV ? 'M' : x.lvl}</span></div>`; });
    const p = P.passives.map((x) => `<div class="slot" title="${esc(PASSIVES[x.id].name)}"><img src="${icon(x.id)}" alt=""><span>${x.lvl >= PASSIVES[x.id].max ? 'M' : x.lvl}</span></div>`);
    while (w.length < MAX_SLOTS) w.push('<div class="slot empty"></div>');
    while (p.length < MAX_SLOTS) p.push('<div class="slot empty"></div>');
    el.wslots.innerHTML = w.join(''); el.pslots.innerHTML = p.join('');
  }
  function update() {
    if (!G.stage || G.state === 'title' || G.state === 'boot') return;
    el.xpFill.style.width = (P.xp / P.next * 100).toFixed(1) + '%';
    set('lv', P.lvl, (v) => { el.lv.textContent = 'LV ' + v; });
    set('clock', Math.floor(G.t), (v) => { el.clock.textContent = fmtTime(v); });
    set('final', !!G.finalBoss, (v) => el.clock.classList.toggle('final', v));
    set('kills', G.kills, (v) => { el.kills.textContent = fmtNum(v); });
    set('gold', G.gold, (v) => { el.gold.textContent = fmtNum(v); });
    if (G.invDirty) { G.invDirty = false; slots(); }
    const b = G.boss && !G.boss.dead ? G.boss : null;
    set('boss', b ? b.id : 0, () => { el.boss.hidden = !b; if (b) el.bossName.textContent = b.def.name; });
    if (b) el.bossFill.style.width = Math.max(0, b.hp / b.maxHp * 100).toFixed(1) + '%';
    const low = P.st && P.hp / P.st.maxHp < 0.3 && !P.dead ? 0.25 + 0.15 * Math.sin(G.t * 6) : 0;
    el.hurt.style.opacity = Math.max(G.hurtFlash, low).toFixed(2);
  }
  return { init, update, reset() { for (const k in last) delete last[k]; G.invDirty = true; } };
})();

// Nullwake — menus: title, pilot and stage select, hangar, codex, options, level-up, chests, pause and results.
// Every screen is HTML in #menu; [data-nav] elements take keyboard/gamepad focus, [data-back] answers Esc / B.
const UI = (() => {
  const menu = $('#menu');
  let keyFn = null, lvChoices = null, optFrom = 'title';
  const sel = { pilot: 'ryn', stage: 's1' };
  const IMG = {};
  const portraitURL = (id) => IMG['p' + id] || (IMG['p' + id] = portrait(id, 96).toDataURL());
  const goldLine = () => `<div class="goldline"><img src="${icon('gold')}" alt="">${fmtNum(SAVE.gold)}</div>`;
  const backBtn = (act, label = 'Back') => `<button class="btn sm" data-nav data-back data-act="${act}">${label}</button>`;

  function show(html, o = {}) {
    menu.innerHTML = html; keyFn = o.key || null; $('#banner').classList.remove('on');
    for (const b of menu.querySelectorAll('[data-act]')) b.addEventListener('click', () => { AUDIO.init(); const f = ACT[b.dataset.act]; if (f) f(b.dataset.arg, b); });
    const first = (o.focus && menu.querySelector(o.focus)) || INPUT.navItems()[0];
    if (first) INPUT.focusEl(first);
    menu.scrollTop = 0;
  }
  function close() { menu.innerHTML = ''; keyFn = null; }
  function key(code) { return keyFn ? !!keyFn(code) : false; }

  // ---- title flow ----
  function title() {
    setState('title'); G.stage = null; AUDIO.title(); HUD.reset();
    show(`<div class="screen">
      <h1>NULLWAKE</h1>
      <div class="tag">A star collapsed and the swarm poured out of its wake. Your ship is gone; your suit's auto-weapons are not.
        <b>Survive fifteen minutes</b>, then face what comes for you.</div>
      ${goldLine()}
      <div class="stack">
        <button class="btn primary" data-nav data-act="launch">Launch</button>
        <button class="btn" data-nav data-act="hangar">Hangar</button>
        <button class="btn" data-nav data-act="codex">Codex</button>
        <button class="btn" data-nav data-act="options" data-arg="title">Options</button>
      </div>
      <div class="hint">Move with <kbd>WASD</kbd> or the arrow keys, a gamepad stick, or drag anywhere on a touch screen.<br>
        Your weapons fire by themselves. Collect crystals to level up; max a weapon and own its partner to evolve it from a chest.</div>
    </div>`);
  }
  function pilots() {
    if (!SAVE.pilots[sel.pilot]) sel.pilot = 'ryn';
    const cards = Object.entries(PILOTS).map(([id, p]) => {
      const owned = SAVE.pilots[id], w = WEAPONS[p.weapon];
      return `<button class="card${owned ? '' : ' locked'}${sel.pilot === id ? ' sel' : ''}" data-nav data-act="pilot" data-arg="${id}">
        <div class="top"><img class="portrait" src="${portraitURL(id)}" alt=""><div><div class="nm">${esc(p.name)}</div><div class="lv">${esc(p.role)}</div></div></div>
        <div class="d"><img src="${icon(p.weapon)}" alt="" style="width:24px;height:24px;vertical-align:middle;margin-right:4px">${esc(w.name)}</div>
        <div class="x">${esc(p.bt)}</div><div class="x"><i>${esc(p.story)}</i></div>
        ${owned ? '' : `<div class="cost">${SAVE.gold >= p.cost ? 'Unlock for' : 'Locked:'} ${p.cost} gold</div>`}
      </button>`;
    }).join('');
    show(`<div class="screen"><h2>Choose a pilot</h2>${goldLine()}<div class="cards">${cards}</div><div class="row-btns">${backBtn('title')}</div></div>`, { focus: `[data-arg="${sel.pilot}"]` });
  }
  function stagePreview(st) {
    if (IMG['s' + st.id]) return IMG['s' + st.id];
    const c = makeCanvas(320, 160), x = c.getContext('2d'), tiles = buildTiles(st.look);
    x.fillStyle = LOOKS[st.look].bg; x.fillRect(0, 0, 320, 160);
    if (st.look === 'drift') x.drawImage(WORLD.far, 0, 0, 400, 400);
    x.drawImage(tiles[0], 0, 0, 400, 400);
    const roster = [...new Set(st.waves.flatMap((w) => w[3].split(' ')))], rnd = artRng(st.id.charCodeAt(1) * 13);
    roster.forEach((id, i) => { const s = enemySprite(id), fr = s.frames[i & 1], sz = s.half * 2 * 1.3; x.drawImage(rnd() > 0.5 ? fr.n : fr.f, 20 + i * 290 / roster.length + rnd() * 10, 40 + rnd() * 70, sz, sz); });
    const g = x.createLinearGradient(0, 100, 0, 160); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.6)'); x.fillStyle = g; x.fillRect(0, 0, 320, 160);
    return (IMG['s' + st.id] = c.toDataURL());
  }
  function stages() {
    const cards = STAGES.map((st) => {
      const open = !st.needs || SAVE.cleared[st.needs], best = SAVE.best[st.id], won = SAVE.cleared[st.id];
      const status = !open ? `Clear ${STAGE[st.needs].name} to unlock` : won ? `Cleared ×${won} · most kills ${fmtNum(best.kills)}` : best ? `Best ${fmtTime(best.t)} · level ${best.lvl}` : 'Not yet attempted';
      return `<button class="card stagecard${open ? '' : ' locked'}" data-nav data-act="stage" data-arg="${st.id}">
        <img src="${stagePreview(st)}" alt="" style="width:100%;aspect-ratio:2/1;display:block;border-radius:5px;margin-bottom:10px;${open ? '' : 'filter:grayscale(1) brightness(.5)'}">
        <div class="nm">${esc(st.name)}</div><div class="lv">${esc(st.sub)}</div><div class="d">${esc(st.d)}</div>
        <div class="x">${status}${st.goldMul > 1 ? ` · gold ×${st.goldMul}` : ''}</div></button>`;
    }).join('');
    show(`<div class="screen"><h2>Choose a stage</h2><div class="sub">Pilot: ${esc(PILOTS[sel.pilot].name)}</div><div class="cards">${cards}</div>
      <div class="row-btns">${backBtn('launch')}</div></div>`, { focus: `[data-arg="${sel.stage}"]` });
  }
  function hangar(focusId) {
    const cards = META.map((m) => {
      const r = SAVE.meta[m.id] || 0, maxed = r >= m.max, cost = metaCost(m, r);
      return `<button class="card" data-nav data-act="buy" data-arg="${m.id}">
        <div class="top"><img class="ic" src="${icon(m.icon)}" alt=""><div><div class="nm">${esc(m.name)}</div><div class="lv">Rank ${r} / ${m.max}</div></div></div>
        <div class="d">${esc(m.d)}</div><div class="pips">${Array.from({ length: m.max }, (_, i) => `<i class="${i < r ? 'on' : ''}"></i>`).join('')}</div>
        <div class="cost${!maxed && cost > SAVE.gold ? ' bad' : ''}">${maxed ? 'Maxed' : cost + ' gold'}</div></button>`;
    }).join('');
    show(`<div class="screen"><h2>Hangar</h2><div class="sub">Permanent upgrades, paid for with the gold you carry home.</div>${goldLine()}
      <div class="cards scroll">${cards}</div><div class="row-btns">${backBtn('title')}<button class="btn sm" data-nav data-act="refund">Refund all</button></div></div>`,
    { focus: focusId ? `[data-arg="${focusId}"]` : null });
  }
  function codex() {
    const rows = BASE_WEAPONS.map((id) => {
      const d = WEAPONS[id], ev = WEAPONS[d.evo], p = PASSIVES[d.needs], seen = SAVE.seen[d.evo];
      return `<div class="evo-row"><img src="${icon(id)}" alt=""><span class="plus">+</span><img src="${icon(d.needs)}" alt=""><span class="plus">=</span>
        <img src="${seen ? icon(d.evo) : icon('kill')}" alt="" style="${seen ? '' : 'opacity:.25'}">
        <span class="nm"><b>${esc(d.name)}</b> (max level) with <b>${esc(p.name)}</b> → ${seen ? `<span class="gold">${esc(ev.name)}</span>: ${esc(ev.d)}` : '<span class="unk">??? Open a chest to find out.</span>'}</span></div>`;
    }).join('');
    const ws = BASE_WEAPONS.map((id) => `<div class="evo-row"><img src="${icon(id)}" alt=""><span class="nm"><b>${esc(WEAPONS[id].name)}</b>: ${esc(WEAPONS[id].d)}</span></div>`).join('');
    const ps = Object.keys(PASSIVES).map((id) => `<div class="evo-row"><img src="${icon(id)}" alt=""><span class="nm"><b>${esc(PASSIVES[id].name)}</b>: ${esc(PASSIVES[id].d)} Max level ${PASSIVES[id].max}.</span></div>`).join('');
    show(`<div class="screen"><h2>Codex</h2><div class="sub">Max a weapon, hold its partner passive, then open a chest dropped by an elite or boss.</div>
      <div class="codex scroll" tabindex="-1"><h3>Evolutions</h3>${rows}<h3>Weapons</h3>${ws}<h3>Systems</h3>${ps}</div>
      <div class="row-btns">${backBtn('title')}</div></div>`);
  }
  function options(from, focusArg) {
    if (from) optFrom = from;
    const o = SAVE.opts, pct = (v) => Math.round(v * 100) + '%';
    show(`<div class="screen"><h2>Options</h2><div style="height:12px"></div>
      <div class="opt"><span>Sound effects</span><span><button class="btn sm" data-nav data-act="opt" data-arg="sfx-">−</button> <b style="display:inline-block;width:4ch">${pct(o.sfx)}</b> <button class="btn sm" data-nav data-act="opt" data-arg="sfx+">+</button></span></div>
      <div class="opt"><span>Music</span><span><button class="btn sm" data-nav data-act="opt" data-arg="mus-">−</button> <b style="display:inline-block;width:4ch">${pct(o.music)}</b> <button class="btn sm" data-nav data-act="opt" data-arg="mus+">+</button></span></div>
      <div class="opt"><span>Screen shake</span><button class="btn sm" data-nav data-act="opt" data-arg="shake">${o.shake ? 'On' : 'Off'}</button></div>
      <div class="opt"><span>Damage numbers</span><button class="btn sm" data-nav data-act="opt" data-arg="nums">${o.nums ? 'On' : 'Off'}</button></div>
      <div class="opt"><span>Full screen</span><button class="btn sm" data-nav data-act="opt" data-arg="full">${document.fullscreenElement ? 'Exit' : 'Enter'}</button></div>
      ${optFrom === 'title' ? '<div class="opt"><span>Progress</span><button class="btn sm" data-nav data-act="opt" data-arg="reset">Reset save</button></div>' : ''}
      <div class="row-btns">${backBtn('optback')}</div></div>`, { focus: focusArg ? `[data-arg="${focusArg}"]` : null });
  }

  // ---- in-run screens ----
  function levelUp() {
    setState('levelup'); INPUT.endStick();
    lvChoices = rollChoices();
    if (G.bot) { pick(botPick(lvChoices)); return; }
    sfx('level'); renderLevelUp();
  }
  function renderLevelUp() {
    const cards = lvChoices.map((c, i) => {
      const f = choiceInfo(c);
      return `<button class="card" data-nav data-act="pick" data-arg="${i}"><span class="k">${i + 1}</span>
        <div class="top"><img class="ic" src="${f.icon}" alt=""><div><div class="nm">${esc(f.name)}</div><div class="lv">${f.lv === 'NEW' ? '<span class="new">NEW</span>' : esc(f.lv)}</div></div></div>
        <div class="d">${esc(f.d)}</div>${f.x ? `<div class="x">${esc(f.x)}</div>` : ''}</button>`;
    }).join('');
    const extra = (P.rerolls ? `<button class="btn sm" data-nav data-act="reroll">Reroll (${P.rerolls}) <span class="dim">R</span></button>` : '')
      + (P.skips ? `<button class="btn sm" data-nav data-act="skip">Skip (${P.skips}) <span class="dim">K</span></button>` : '');
    show(`<div class="screen levelup"><h2 class="lvl">Level ${P.lvl - G.pendingLv + 1}</h2><div class="sub">Choose an upgrade</div>
      <div class="cards">${cards}</div>${extra ? `<div class="row-btns">${extra}</div>` : ''}</div>`, {
      key: (code) => {
        const n = { Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3, Numpad1: 0, Numpad2: 1, Numpad3: 2 }[code];
        if (n !== undefined && lvChoices[n]) { pick(n); return true; }
        if (code === 'KeyR' && P.rerolls) { ACT.reroll(); return true; }
        if (code === 'KeyK' && P.skips) { ACT.skip(); return true; }
        return false;
      },
    });
  }
  function pick(i) {
    const c = lvChoices[i]; if (!c) return;
    applyChoice(c); G.pendingLv--;
    if (!G.bot) { sfx('pickup'); FX.ring(P.x, P.y, 50, '#5ef0ff', 0.4, 4); }
    if (G.pendingLv > 0) levelUp(); else resume();
  }
  function chest(kind) {
    setState('chest'); INPUT.endStick();
    const res = openChest(kind);
    if (G.bot) { G.botLog && G.botLog.push(res); resume(); return; }
    sfx(res.evo ? 'evolve' : 'chest');
    const items = res.items.map((o, i) => {
      if (o.kind === 'gold') return `<div class="card" style="animation-delay:${i * 0.25}s"><div class="top"><img class="ic" src="${icon('gold')}" alt=""><div><div class="nm">${o.n} gold</div><div class="lv">Nothing left to upgrade</div></div></div></div>`;
      const d = WEAPONS[o.id] || PASSIVES[o.id];
      if (o.kind === 'evo') return `<div class="card evo" style="animation-delay:${i * 0.25}s"><div class="top"><img class="ic" src="${icon(o.id)}" alt=""><div><div class="nm gold">${esc(d.name)}</div><div class="lv">${esc(WEAPONS[o.from].name)} evolved</div></div></div><div class="d">${esc(d.d)}</div></div>`;
      return `<div class="card" style="animation-delay:${i * 0.25}s"><div class="top"><img class="ic" src="${icon(o.id)}" alt=""><div><div class="nm">${esc(d.name)}</div><div class="lv">Level ${o.lvl}</div></div></div></div>`;
    }).join('');
    show(`<div class="screen"><h2 class="${res.evo ? 'evo' : 'lvl'}">${res.evo ? 'Evolution!' : 'Supply cache'}</h2>
      <div class="goldline"><img src="${icon('gold')}" alt="">+${res.gold}</div><div class="loot">${items}</div>
      <div class="row-btns"><button class="btn primary" data-nav data-back data-act="resume">Continue</button></div></div>`);
  }
  function pause() {
    if (G.state !== 'play') return;
    setState('pause'); INPUT.endStick();
    const build = P.weapons.map((w) => { const d = WEAPONS[w.id]; return `<tr><td><img src="${icon(w.id)}" alt="">${esc(d.name)}</td><td>${d.from ? '★' : 'Lv ' + w.lvl}</td><td>${d.evo && !d.from ? `<span class="dim">+ ${esc(PASSIVES[d.needs].name)}${passiveOf(d.needs) ? ' ✓' : ''}</span>` : ''}</td></tr>`; }).join('')
      + P.passives.map((p) => `<tr><td><img src="${icon(p.id)}" alt="">${esc(PASSIVES[p.id].name)}</td><td>Lv ${p.lvl}</td><td></td></tr>`).join('');
    show(`<div class="screen"><h2>Paused</h2><div class="sub">${esc(G.stage.name)} · ${esc(PILOTS[G.pilotId].name)}</div>
      <div class="stats"><div>Time<b>${fmtTime(G.t)}</b></div><div>Level<b>${P.lvl}</b></div><div>Kills<b>${fmtNum(G.kills)}</b></div><div>Gold<b>${fmtNum(G.gold)}</b></div></div>
      <table class="res"><tr><th>Loadout</th><th></th><th>Evolves with</th></tr>${build}</table>
      <div class="row-btns"><button class="btn primary" data-nav data-back data-act="resume">Resume</button><button class="btn" data-nav data-act="options" data-arg="pause">Options</button><button class="btn" data-nav data-act="quit">Quit run</button></div></div>`,
    { key: (code) => { if (code === 'KeyP') { resume(); return true; } return false; } });
  }
  function resume() { close(); setState('play'); }
  function results(won) {
    setState('over'); INPUT.endStick(); AUDIO.title();
    const rows = P.weapons.slice().sort((a, b) => b.dealt - a.dealt).map((w) => { const d = WEAPONS[w.id]; return `<tr><td><img src="${icon(w.id)}" alt="">${esc(d.name)}</td><td>${d.from ? '★' : w.lvl}</td><td>${fmtNum(w.dealt)}</td><td>${fmtNum(w.kills)}</td></tr>`; }).join('');
    const next = won && STAGES.find((s) => s.needs === G.stageId && SAVE.cleared[G.stageId] === 1);
    const head = won ? 'Stage clear' : G.quit ? 'Run abandoned' : 'Signal lost';
    show(`<div class="screen"><h2 class="${won ? 'evo' : ''}" style="${won ? '' : 'color:var(--bad)'}">${head}</h2>
      <div class="sub">${esc(G.stage.name)} · ${esc(PILOTS[G.pilotId].name)}</div>
      <div class="stats"><div>Survived<b>${fmtTime(G.t)}</b></div><div>Level<b>${P.lvl}</b></div><div>Kills<b>${fmtNum(G.kills)}</b></div><div>Gold<b class="gold">+${fmtNum(G.gold + G.bonus)}</b></div></div>
      ${G.bonus ? `<div class="sub">Includes a clear bonus of ${G.bonus} gold.</div>` : ''}
      ${next ? `<div class="sub good">New stage unlocked: ${esc(next.name)}</div>` : ''}
      <table class="res"><tr><th>Weapon</th><th>Lv</th><th>Damage</th><th>Kills</th></tr>${rows}</table>
      <div class="row-btns"><button class="btn primary" data-nav data-act="retry">Again</button><button class="btn" data-nav data-act="launch">Change pilot</button><button class="btn" data-nav data-act="hangar">Hangar</button><button class="btn" data-nav data-back data-act="title">Title</button></div></div>`);
  }

  // ---- actions ----
  const ACT = {
    title() { sfx('back'); title(); },
    launch() { sfx('ui'); pilots(); },
    hangar() { sfx('ui'); hangar(); },
    codex() { sfx('ui'); codex(); },
    options(arg) { sfx('ui'); options(arg); },
    optback() { sfx('back'); if (optFrom === 'pause') { setState('play'); pause(); } else title(); },
    pilot(id) {
      if (SAVE.pilots[id]) { sfx('ui'); sel.pilot = id; SAVE.lastPilot = id; stages(); return; }
      const p = PILOTS[id];
      if (SAVE.gold >= p.cost) { SAVE.gold -= p.cost; SAVE.pilots[id] = 1; sel.pilot = id; writeSave(); sfx('buy'); pilots(); } else sfx('deny');
    },
    stage(id) {
      const st = STAGE[id]; if (st.needs && !SAVE.cleared[st.needs]) { sfx('deny'); return; }
      sel.stage = id; sfx('ui'); startRun({ stage: id, pilot: sel.pilot });
    },
    buy(id) {
      const m = META.find((x) => x.id === id), r = SAVE.meta[id] || 0, cost = metaCost(m, r);
      if (r >= m.max || SAVE.gold < cost) { sfx('deny'); return; }
      SAVE.gold -= cost; SAVE.meta[id] = r + 1; writeSave(); sfx('buy'); hangar(id);
    },
    refund() {
      let back = 0; for (const m of META) { const r = SAVE.meta[m.id] || 0; for (let i = 0; i < r; i++) back += metaCost(m, i); }
      if (!back) { sfx('deny'); return; }
      SAVE.gold += back; SAVE.meta = {}; writeSave(); sfx('back'); hangar();
    },
    opt(a, b) {
      const o = SAVE.opts;
      if (a === 'sfx-') o.sfx = Math.max(0, Math.round((o.sfx - 0.1) * 10) / 10); else if (a === 'sfx+') o.sfx = Math.min(1, Math.round((o.sfx + 0.1) * 10) / 10);
      else if (a === 'mus-') o.music = Math.max(0, Math.round((o.music - 0.1) * 10) / 10); else if (a === 'mus+') o.music = Math.min(1, Math.round((o.music + 0.1) * 10) / 10);
      else if (a === 'shake') o.shake = o.shake ? 0 : 1; else if (a === 'nums') o.nums = o.nums ? 0 : 1;
      else if (a === 'full') { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); } catch (e) { /* not allowed */ } setTimeout(() => options(null, 'full'), 200); return; }
      else if (a === 'reset') {
        if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Really erase?'; sfx('deny'); return; }
        SAVE = defaultSave(); writeSave(); sfx('back'); title(); return;
      }
      writeSave(); AUDIO.setVol(); sfx('ui'); options(null, a);
    },
    pick(i) { pick(+i); },
    reroll() { if (!P.rerolls) return; P.rerolls--; lvChoices = rollChoices(); sfx('ui'); renderLevelUp(); },
    skip() { if (!P.skips) return; P.skips--; G.pendingLv--; sfx('back'); if (G.pendingLv > 0) levelUp(); else resume(); },
    resume() { sfx('ui'); resume(); },
    quit(a, b) {
      if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Really quit?'; return; }
      G.quit = true; endRun(false);
    },
    retry() { sfx('ui'); startRun({ stage: G.stageId, pilot: G.pilotId }); },
  };
  return { title, pilots, stages, hangar, codex, options, levelUp, chest, pause, resume, results, close, key, pick, sel, get choices() { return lvChoices; } };
})();

// Nullwake — boot, the frame loop and the #debug test hook (window.NW).
let lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0, (ts - lastTs) / 1000)); lastTs = ts;
  INPUT.poll(dt);
  if (G.state === 'play') { let rem = dt; while (rem > 1e-4 && G.state === 'play') { const h = Math.min(rem, 1 / 30); stepGame(h); rem -= h; } }
  if (G.state === 'title' || G.state === 'boot') renderAttract(dt); else render();
  HUD.update();
}

function boot() {
  resize(); addEventListener('resize', resize);
  buildPickups(); HUD.init(); INPUT.init();
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play' && !DEBUG) UI.pause(); });
  if (SAVE.lastPilot && SAVE.pilots[SAVE.lastPilot]) UI.sel.pilot = SAVE.lastPilot;
  UI.title();
  requestAnimationFrame(frame);
}

if (DEBUG) {
  // Test hook. NW.start({ stage, pilot, seed }), NW.sim(seconds, { still }) steps the game without rendering, driven by
  // the autopilot unless `still`; level-ups and chests are resolved with the bot's picks. NW.bot(true) drives live play.
  window.NW = {
    G, P, E, GEMS, ITEMS, EB, HZ, PR, POOLS, SAVE: () => SAVE, WEAPONS, PASSIVES, ENEMIES, STAGES, PILOTS, META, UI, FX,
    start(o = {}) { startRun(o); return { stage: G.stageId, pilot: G.pilotId, hp: P.hp }; },
    sim(sec, o = {}) {
      const was = G.bot, n = Math.round(sec / STEP); G.bot = !o.still;
      for (let i = 0; i < n && !G.ended; i++) {
        if (G.state !== 'play') { if (G.state === 'levelup') UI.pick(botPick(UI.choices)); else if (G.state === 'chest' || G.state === 'pause') UI.resume(); else break; }
        stepGame(STEP);
      }
      G.bot = was;
      return this.stats();
    },
    bot(on = true) { G.bot = on; return on; },
    god(on = true) { G.god = on; return on; },
    render() { render(); HUD.update(); },
    time(sec) { G.t = sec; while (G.evIdx < EVENTS.length && EVENTS[G.evIdx][0] < sec) G.evIdx++; return G.t; },
    give(id, lvl = 1) {
      if (WEAPONS[id]) { let w = P.weapons.find((x) => x.id === id); if (!w) w = addWeapon(id); w.lvl = Math.min(lvl, WEAPONS[id].from ? 1 : MAX_WLV); calcWeapon(w); }
      else if (PASSIVES[id]) { let p = passiveOf(id); if (!p) P.passives.push(p = { id, lvl: 1 }); p.lvl = Math.min(lvl, PASSIVES[id].max); recomputeStats(); }
      G.invDirty = true; return P.weapons.map((w) => w.id + ':' + w.lvl).concat(P.passives.map((p) => p.id + ':' + p.lvl));
    },
    spawn(type, n = 1, o = {}) { const out = []; for (let i = 0; i < n; i++) { const e = o.at ? spawnEnemy(type, P.x + o.at[0] + i * 4, P.y + o.at[1], Object.assign({ force: true }, o)) : spawnAtEdge(type, Object.assign({ force: true }, o)); out.push(e); } return out.length; },
    item(kind, dx = 30, dy = 0, arg) { dropItem(P.x + dx, P.y + dy, kind, arg); },
    event(kind, arg) { runEvent([G.t, kind, arg]); },
    killAll() { for (const e of E) if (!e.dead && !e.prop) killEnemy(e, null); cleanup(); },
    levelUp() { G.pendingLv++; UI.levelUp(); return UI.choices.map((c) => c.kind + ':' + c.id); },
    chest(kind = 'elite') { UI.chest(kind); return $('#menu').innerText; },
    pause() { UI.pause(); }, resume() { UI.resume(); },
    end(won) { endRun(won); },
    mute() { SAVE.opts.sfx = 0; SAVE.opts.music = 0; AUDIO.setVol(); },
    stats() {
      return { t: Math.round(G.t), state: G.state, hp: Math.round(P.hp), maxHp: P.st && P.st.maxHp, lvl: P.lvl, kills: G.kills, gold: G.gold, enemies: E.filter((e) => !e.dead && !e.prop).length,
        gems: GEMS.length, dead: P.dead, won: G.won, ended: G.ended, boss: G.boss ? G.boss.def.name + ' ' + Math.round(G.boss.hp) : null,
        weapons: P.weapons.map((w) => w.id + ':' + w.lvl), passives: P.passives.map((p) => p.id + ':' + p.lvl) };
    },
  };
}
boot();

})();
</script>
