# Server block for the offline arcade image (replaces the base image's default.conf).

# Vendored fonts and npm files live under versioned paths, so they never change. Everything else revalidates.
map $uri $arcade_cache_control {
    ~^/_vendor/(fonts\.gstatic\.com|npm)/  "public, max-age=31536000, immutable";
    default                                "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirects like /tokoyo -> /tokoyo/ stay relative, so they work behind any port mapping or proxy.
    absolute_redirect off;
    # LICENSE and the .md files have no entry in mime.types.
    default_type text/plain;
    charset utf-8;
    charset_types text/plain text/css application/javascript;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $arcade_cache_control;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ =404;
    }
}
